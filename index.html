            </div>
          </div>` : ''}`;
        }).join('');
      }

      const actSection = document.createElement('div');
      actSection.className = 'section fade-in';
      actSection.innerHTML = `<div class="section-label">Activities (${activities.length})</div>`;

      // Category filter chips
      const filterWrap = document.createElement('div');
      filterWrap.className = 'act-cat-filters';
      const allBtn = document.createElement('button');
      allBtn.className = 'act-cat-btn active';
      allBtn.dataset.cat = 'all';
      allBtn.style.background = city.color;
      allBtn.style.color = '#fff';
      allBtn.style.borderColor = 'transparent';
      allBtn.innerHTML = `All <span class="act-cat-count">${activities.length}</span>`;
      filterWrap.appendChild(allBtn);

      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'act-cat-btn';
        btn.dataset.cat = cat;
        const label = (typeof TRIP_DATA !== 'undefined' && TRIP_DATA.categories && TRIP_DATA.categories[cat])
          ? TRIP_DATA.categories[cat].label : cat.charAt(0).toUpperCase() + cat.slice(1);
        btn.innerHTML = `${CAT_EMOJI[cat] || '📍'} ${label} <span class="act-cat-count">${catCounts[cat]}</span>`;
        filterWrap.appendChild(btn);
      });
      actSection.appendChild(filterWrap);

      const rowsWrap = document.createElement('div');
      rowsWrap.className = 'activity-rows';
      const sorted = [...activities].sort((a, b) => (order[a.priority] ?? 9) - (order[b.priority] ?? 9));
      rowsWrap.innerHTML = renderRows(sorted);
      actSection.appendChild(rowsWrap);

      // Filter click handler
      filterWrap.addEventListener('click', e => {
        const btn = e.target.closest('.act-cat-btn');
        if (!btn) return;
        const cat = btn.dataset.cat;
        filterWrap.querySelectorAll('.act-cat-btn').forEach(b => {
          b.classList.remove('active');
          b.style.background = '';
          b.style.color = '';
          b.style.borderColor = '';
        });
        btn.classList.add('active');
        btn.style.background = city.color;
        btn.style.color = '#fff';
        btn.style.borderColor = 'transparent';
        const filtered = cat === 'all' ? sorted : sorted.filter(a => a.category === cat);
        rowsWrap.innerHTML = filtered.length
          ? renderRows(filtered)
          : '<div style="padding:16px;font-size:13px;color:var(--muted)">No activities in this category.</div>';
        wireActDayLinks(rowsWrap);
      });
      wireActDayLinks(rowsWrap);
      rowsWrap.addEventListener('click', e => {
        const row = e.target.closest('.activity-row');
        if (!row || e.target.closest('a') || e.target.closest('.act-day-link')) return;
        row.classList.toggle('expanded');
      });
      // Practical Info (before activities)
    const practSection = document.createElement('div');
    practSection.className = 'section fade-in';
    practSection.innerHTML = `<div class="section-label">Practical Info</div>
      <div class="practical-table">${extra.practical.map(r => `
        <div class="practical-row">
          <div class="practical-key">${r.key}</div>
          <div class="practical-val">${r.val}</div>
        </div>`).join('')}
      </div>`;
    content.appendChild(practSection);

      content.appendChild(actSection);
    }

    panel.appendChild(content);
    return panel;
  }

  function switchCity(cityId) {
    document.querySelectorAll('.city-sel-btn').forEach(b => b.classList.toggle('active', b.dataset.city === cityId));
    document.querySelectorAll('.city-panel').forEach(p => p.classList.toggle('active', p.dataset.city === cityId));
    const panel = document.querySelector(`.city-panel[data-city="${cityId}"]`);
    if (panel) panel.querySelectorAll('.fade-in:not(.visible)').forEach(el => el.classList.add('visible'));
    window.scrollTo(0, 0);
  }

  function initScrollFadeInEl(root) {
    const els = root.querySelectorAll('.fade-in');
    if (!('IntersectionObserver' in window)) { els.forEach(el => el.classList.add('visible')); return; }
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
    }, { threshold: 0.05, rootMargin: '0px 0px -30px 0px' });
    els.forEach(el => obs.observe(el));
  }

  function buildCities() {
    const selectorEl = document.getElementById('cities-selector');
    const detailEl   = document.getElementById('cities-detail');
    if (!selectorEl || !detailEl) return;

    C.cities.forEach((city, i) => {
      const extra = CITY_EXTRA[city.id];
      const btn = document.createElement('button');
      btn.className = 'city-sel-btn' + (i === 0 ? ' active' : '');
      btn.dataset.city = city.id;
      btn.style.setProperty('--city-color', city.color);
      btn.innerHTML = `
        <div class="city-sel-emoji">${city.emoji}</div>
        <div class="city-sel-name">${city.name}</div>
        <div class="city-sel-kanji">${city.kanji}</div>`;
      btn.addEventListener('click', () => switchCity(city.id));
      selectorEl.appendChild(btn);

      const panel = buildCityPanel(city, extra);
      if (i === 0) panel.classList.add('active');
      detailEl.appendChild(panel);
    });

    // Wire day-mini clicks → itinerary tab
    detailEl.addEventListener('click', e => {
      const mini = e.target.closest('[data-goto-day]');
      if (!mini || mini.classList.contains('act-day-link')) return;
      const dayNum = mini.dataset.gotoDay;
      document.querySelector('.nav-tab[data-tab="itinerary"]')?.click();
      setTimeout(() => {
        const card = document.querySelector(`.day-card[data-day="${dayNum}"]`);
        if (card) {
          if (!card.classList.contains('open')) card.querySelector('.day-card-header')?.click();
          card.scrollIntoView({ behavior:'smooth', block:'start' });
        }
      }, 120);
    });

    initScrollFadeInEl(detailEl);
    // Trigger fade-ins for the initially visible panel
    const firstPanel = detailEl.querySelector('.city-panel.active');
    if (firstPanel) firstPanel.querySelectorAll('.fade-in').forEach(el => el.classList.add('visible'));
  }

  document.addEventListener('DOMContentLoaded', () => {
    let citiesBuilt = false;
    document.addEventListener('click', e => {
      const btn = e.target.closest('.nav-tab');
      if (btn && btn.dataset.tab === 'cities' && !citiesBuilt) {
        citiesBuilt = true;
        setTimeout(buildCities, 0);
      }
    });
  });
})();
</script>

<!-- ACTIVITIES RENDER SCRIPT -->
<script>
(function () {
  'use strict';
  const C = SITE_CONFIG;

  const CAT_EMOJI_A = { temple:'⛩️', food:'🍜', cafe:'☕', bar:'🍺', shopping:'🛍️', entertainment:'🎮', nature:'🏔️', museum:'🏛️', landmark:'🗼', arcade:'🕹️', themepark:'🎡' };
  const CREW_INITIALS = { patrick:'P', jake:'J', steve:'S', conner:'C', boros:'B' };
  const PRIORITY_ORDER = { 'must-do':0, 'high':1, 'want-to-do':2, 'maybe':3 };

  const state = { city:'all', person:'all', category:'all', priority:'all', booking:'all', search:'' };
  let allActivities = [];
  let built = false;

  function getFiltered() {
    return allActivities.filter(a => {
      if (state.city     !== 'all' && a.city     !== state.city)     return false;
      if (state.person   !== 'all' && a.person   !== state.person)   return false;
      if (state.category !== 'all' && a.category !== state.category) return false;
      if (state.priority !== 'all' && a.priority !== state.priority) return false;
      if (state.booking  !== 'all') {
        if (state.booking === 'true'        && a.bookingRequired !== true)          return false;
        if (state.booking === 'recommended' && a.bookingRequired !== 'recommended') return false;
        if (state.booking === 'false'       && a.bookingRequired !== false)         return false;
      }
      if (state.search) {
        const q = state.search.toLowerCase();
        const hay = [a.name, a.type, a.address, a.notes, a.category, a.person].filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function updateSummary(filtered) {
    const bar = document.getElementById('acts-summary-bar');
    if (!bar) return;
    const totalCost = filtered.reduce((s, a) => s + (a.estimatedCost || 0), 0);
    const freeCount = filtered.filter(a => a.estimatedCost === 0).length;
    const bookCount = filtered.filter(a => a.bookingRequired === true).length;
    bar.innerHTML = '';
    [
      { num: filtered.length,                              label: 'Showing' },
      { num: `¥${(totalCost / 1000).toFixed(0)}k`,        label: 'Est. Total' },
      { num: freeCount,                                    label: 'Free' },
      { num: bookCount,                                    label: 'Book Ahead' },
    ].forEach(item => {
      const el = document.createElement('div');
      el.className = 'acts-sum-item';
      el.innerHTML = `<div class="acts-sum-num">${item.num}</div><div class="acts-sum-label">${item.label}</div>`;
      bar.appendChild(el);
    });
  }

  function renderCard(act) {
    const city      = C.getCityById(act.city);
    const member    = C.getCrewById(act.person);
    const cityColor = city   ? city.color   : '#8a8278';
    const crewColor = act.person === 'ai' ? '#a0a09a' : (member ? member.color : '#8a8278');
    const catEmoji  = CAT_EMOJI_A[act.category] || '📍';

    const badges = [];
    if (act.priority === 'pending') {
      badges.push('<span class="acts-badge" style="background:rgba(138,130,120,0.1);color:var(--muted)">⏳ Pending</span>');
    } else if (act.priority && act.priority !== 'maybe') {
      const label = { 'must-do':'Must Do', 'high':'High', 'want-to-do':'Want' }[act.priority];
      if (label) badges.push(`<span class="acts-badge ${act.priority}">${label}</span>`);
    }
    if (act.bookingRequired === true)          badges.push('<span class="acts-badge book-true">Book Ahead</span>');
    if (act.bookingRequired === 'recommended') badges.push('<span class="acts-badge book-rec">Rec. Book</span>');
    if (act.status === 'confirmed')            badges.push('<span class="acts-badge confirmed">Confirmed</span>');
    if (act.estimatedCost === 0)               badges.push('<span class="acts-badge free">Free</span>');

    const costStr = act.estimatedCost > 0 ? `¥${act.estimatedCost.toLocaleString()}` : 'Free';

    let dayChip = '';
    if (act.dayAssigned && act.dayAssigned !== 'flex' && act.dayAssigned !== null) {
      dayChip = `<span class="acts-card-day" data-goto-day="${act.dayAssigned}">→ Day ${act.dayAssigned}</span>`;
    } else if (act.dayAssigned === 'flex') {
      dayChip = `<span class="acts-badge flex-day">Flex day</span>`;
    }

    const crewDot = act.person === 'ai'
      ? `<span class="who-dot" style="background:#a0a09a;width:18px;height:18px;font-size:9px" title="AI Suggestion">✨</span>`
      : member
      ? `<span class="who-dot" style="background:${crewColor};width:18px;height:18px;font-size:9px" title="${member.name}">${CREW_INITIALS[act.person] || act.person[0].toUpperCase()}</span>`
      : '';

    const cityPip = city
      ? `<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--muted)"><span style="width:6px;height:6px;border-radius:50%;background:${cityColor};display:inline-block"></span>${city.name}</span>`
      : '';

    const noteHTML = act.notes ? `<div class="acts-card-note">${act.notes}</div>` : '';

    const card = document.createElement('div');
    card.className = 'acts-card' + (act.person === 'ai' ? ' acts-card-ai' : '');
    card.dataset.id = act.id;
    card.innerHTML = `
      <div class="acts-card-accent" style="background:${cityColor}"></div>
      <div class="acts-card-body">
        <div class="acts-card-top">
          <div class="acts-card-left">
            <div class="acts-card-title-row">
              <span class="acts-card-emoji">${catEmoji}</span>
              <span class="acts-card-name">${act.name}</span>
            </div>
            <div class="acts-card-type">${act.type}${act.address ? ' · ' + act.address.split(',')[0] : ''}</div>
          </div>
          <div style="flex-shrink:0">${crewDot}</div>
        </div>
        ${badges.length ? `<div class="acts-card-badges">${badges.join('')}</div>` : ''}
        ${noteHTML}
        <div class="acts-card-footer">
          <div class="acts-card-footer-left">
            ${cityPip}
            <span class="acts-card-dur">${act.estimatedDuration || ''}</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            ${dayChip}
            <span class="acts-card-cost">${costStr}</span>
          </div>
        </div>
      </div>`;

    // Expand hint
    const cardBody = card.querySelector('.acts-card-body');
    const hintEl = document.createElement('div');
    hintEl.className = 'acts-card-expand-hint';
    hintEl.textContent = 'Tap for details';
    cardBody.appendChild(hintEl);

    // Detail section
    const detail = document.createElement('div');
    detail.className = 'acts-card-detail';
    if (act.description) {
      const desc = document.createElement('div');
      desc.className = 'acts-card-desc';
      desc.textContent = act.description;
      detail.appendChild(desc);
    }
    const links = document.createElement('div');
    links.className = 'acts-card-links';
    if (act.mapsQuery) {
      const ml = document.createElement('a');
      ml.className = 'acts-card-link maps';
      ml.href = 'https://www.google.com/maps/search/' + encodeURIComponent(act.mapsQuery);
      ml.target = '_blank'; ml.rel = 'noopener noreferrer';
      ml.textContent = '📍 Google Maps';
      links.appendChild(ml);
    }
    if (act.url) {
      const sl = document.createElement('a');
      sl.className = 'acts-card-link official';
      sl.href = act.url;
      sl.target = '_blank'; sl.rel = 'noopener noreferrer';
      sl.textContent = '🔗 Official Site';
      links.appendChild(sl);
    }
    if (links.children.length) detail.appendChild(links);
    cardBody.appendChild(detail);

    // Toggle expand on body click (not on links or day chip)
    cardBody.addEventListener('click', e => {
      if (e.target.closest('.acts-card-day') || e.target.closest('a')) return;
      card.classList.toggle('expanded');
    });

    const dayBtn = card.querySelector('.acts-card-day');
    if (dayBtn) {
      dayBtn.addEventListener('click', e => {
        e.stopPropagation();
        document.querySelector('.nav-tab[data-tab="itinerary"]')?.click();
        setTimeout(() => {
          const dayCard = document.querySelector('.day-card[data-day="' + dayBtn.dataset.gotoDay + '"]');
          if (dayCard) {
            if (!dayCard.classList.contains('open')) dayCard.querySelector('.day-card-header')?.click();
            dayCard.scrollIntoView({ behavior:'smooth', block:'start' });
          }
        }, 120);
      });
    }
    return card;
  }

  function renderCards() {
    const container = document.getElementById('acts-content');
    if (!container) return;
    container.innerHTML = '';

    const filtered = getFiltered();
    updateSummary(filtered);

    if (!filtered.length) {
      container.innerHTML = `<div class="acts-no-results"><div class="acts-no-results-emoji">🔍</div><div class="acts-no-results-title">No activities found</div><div style="font-size:13px">Try adjusting your filters or search term</div></div>`;
      return;
    }

    if (state.city === 'all' && !state.search) {
      ['tokyo','kyoto','osaka'].forEach(cityId => {
        const cityActs = filtered.filter(a => a.city === cityId)
          .sort((a, b) => (PRIORITY_ORDER[a.priority] ?? 9) - (PRIORITY_ORDER[b.priority] ?? 9));
        if (!cityActs.length) return;
        const city = C.getCityById(cityId);
        const header = document.createElement('div');
        header.className = 'acts-group-header';
        header.innerHTML = `<span class="acts-group-name" style="color:${city.color}">${city.emoji} ${city.name}</span><span class="acts-group-count">${cityActs.length} activit${cityActs.length === 1 ? 'y' : 'ies'}</span>`;
        container.appendChild(header);
        cityActs.forEach(act => container.appendChild(renderCard(act)));
      });
    } else {
      [...filtered]
        .sort((a, b) => (PRIORITY_ORDER[a.priority] ?? 9) - (PRIORITY_ORDER[b.priority] ?? 9))
        .forEach(act => container.appendChild(renderCard(act)));
    }
  }

  function buildFilters() {
    const wrap = document.getElementById('acts-filters-wrap');
    if (!wrap) return;
    wrap.innerHTML = '';

    const rows = [
      { key:'city', label:'City', options:[
          { value:'all', label:'All Cities' },
          ...C.cities.map(c => ({ value:c.id, label:c.name, dot:c.color, count:allActivities.filter(a=>a.city===c.id).length }))
        ]
      },
      { key:'person', label:'Who', options:[
          { value:'all', label:'Everyone' },
          ...C.crew.filter(m => allActivities.some(a => a.person === m.id))
            .map(m => ({ value:m.id, label:m.name, dot:m.color, count:allActivities.filter(a=>a.person===m.id).length })),
          { value:'ai', label:'✨ AI Picks', dot:'#8b5cf6', count:allActivities.filter(a=>a.person==='ai').length },
        ]
      },
      { key:'category', label:'Type', options:[
          { value:'all', label:'All Types' },
          ...Object.entries(allActivities.reduce((acc,a) => { acc[a.category]=(acc[a.category]||0)+1; return acc; }, {}))
            .sort((a,b) => b[1]-a[1])
            .map(([cat, count]) => {
              const meta = (typeof TRIP_DATA !== 'undefined' && TRIP_DATA.categories && TRIP_DATA.categories[cat]) ? TRIP_DATA.categories[cat] : { label: cat };
              return { value:cat, label:`${CAT_EMOJI_A[cat]||'📍'} ${meta.label}`, count };
            })
        ]
      },
      { key:'priority', label:'Priority', options:[
          { value:'all',     label:'All' },
          { value:'pending', label:'⏳ Pending', count:allActivities.filter(a=>a.priority==='pending').length },
        ]
      },
      { key:'booking', label:'Booking', options:[
          { value:'all',         label:'All' },
          { value:'true',        label:'📋 Book Ahead', count:allActivities.filter(a=>a.bookingRequired===true).length },
          { value:'recommended', label:'⚠️ Rec. Book',  count:allActivities.filter(a=>a.bookingRequired==='recommended').length },
          { value:'false',       label:'🚶 Walk-in OK', count:allActivities.filter(a=>a.bookingRequired===false).length },
        ]
      },
    ];

    rows.forEach(row => {
      const rowEl = document.createElement('div');
      rowEl.className = 'acts-filter-row';
      const lbl = document.createElement('span');
      lbl.className = 'acts-filter-label';
      lbl.textContent = row.label;
      rowEl.appendChild(lbl);

      row.options.forEach(opt => {
        const isDefault = opt.value === 'all';
        const btn = document.createElement('button');
        btn.className = 'acts-filter-btn' + (isDefault ? ' active' : '');
        btn.dataset.key   = row.key;
        btn.dataset.value = opt.value;
        let inner = opt.dot ? `<span class="afb-dot" style="background:${opt.dot}"></span>` : '';
        inner += opt.label;
        if (opt.count !== undefined) inner += ` <span class="acts-filter-count">${opt.count}</span>`;
        btn.innerHTML = inner;
        // Set inline styles for initial active state so it's visible before any click
        if (isDefault) {
          btn.style.background = '#0a0a0a';
          btn.style.color = '#fff';
          btn.style.borderColor = 'transparent';
        }
        btn.addEventListener('click', () => {
          rowEl.querySelectorAll('.acts-filter-btn').forEach(b => {
            b.classList.remove('active');
            b.style.background = '';
            b.style.color = '';
            b.style.borderColor = '';
          });
          btn.classList.add('active');
          const activeColor = opt.dot || '#0a0a0a';
          btn.style.background = activeColor;
          btn.style.color = '#fff';
          btn.style.borderColor = 'transparent';
          state[row.key] = opt.value;
          renderCards();
        });
        rowEl.appendChild(btn);
      });
      wrap.appendChild(rowEl);
    });
  }

  function initSearch() {
    const input    = document.getElementById('acts-search-input');
    const clearBtn = document.getElementById('acts-search-clear');
    if (!input) return;
    input.addEventListener('input', () => {
      state.search = input.value.trim();
      clearBtn.classList.toggle('visible', state.search.length > 0);
      renderCards();
    });
    clearBtn.addEventListener('click', () => {
      input.value = '';
      state.search = '';
      clearBtn.classList.remove('visible');
      renderCards();
    });
  }

  function initActivities() {
    if (built) return;
    built = true;
    if (typeof TRIP_DATA === 'undefined' || !TRIP_DATA.activities) {
      document.getElementById('acts-content').innerHTML = '<div class="acts-no-results"><div class="acts-no-results-emoji">⚠️</div><div class="acts-no-results-title">Activity data not loaded</div></div>';
      return;
    }
    allActivities = TRIP_DATA.activities;
    buildFilters();
    initSearch();
    updateSummary(allActivities);
    renderCards();
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.addEventListener('click', e => {
      const btn = e.target.closest('.nav-tab');
      if (btn && btn.dataset.tab === 'activities') setTimeout(initActivities, 0);
    });
  });
})();
</script>

<!-- ITINERARY RENDER SCRIPT -->
<script>
(function () {
  'use strict';
  const C = SITE_CONFIG;
  const CREW_INITIALS = { patrick:'P', jake:'J', steve:'S', conner:'C', boros:'B' };

  const CITY_META = {
    tokyo:     { id:'tokyo',     name:'Tokyo',     color:'#c41e3a', emoji:'🗼', kanji:'東京',  nights:7, dates:'Jan 9–15'  },
    kyoto:     { id:'kyoto',     name:'Kyoto',     color:'#d4af37', emoji:'⛩️',  kanji:'京都',  nights:5, dates:'Jan 16–20' },
    osaka:     { id:'osaka',     name:'Osaka',     color:'#ea8b37', emoji:'🏮', kanji:'大阪',  nights:3, dates:'Jan 21–23' },
    departure: { id:'departure', name:'Departure', color:'#8a8278', emoji:'✈️',  kanji:'帰国',  nights:0, dates:'Jan 24'    },
  };

  let activeFilter = 'all';
  let itinBuilt = false;

  function buildItinSummary() {
    const container = document.getElementById('itin-summary-inner');
    if (!container || typeof ITINERARY_DATA === 'undefined') return;
    const totalYen   = ITINERARY_DATA.days.reduce((s, d) => s + (d.estimatedCostPerPerson?.yen || 0), 0);
    const totalMiles = ITINERARY_DATA.days.reduce((s, d) => s + (d.walking?.miles || 0), 0);
    const splitDays  = ITINERARY_DATA.days.filter(d => d.groupSplits).length;
    [
      { num:'16',                                    label:'Days'       },
      { num:`¥${(totalYen/1000).toFixed(0)}k`,       label:'Est. Cost'  },
      { num:`${Math.round(totalMiles)}mi`,            label:'Walking'    },
      { num:splitDays,                               label:'Split Days' },
    ].forEach(item => {
      const el = document.createElement('div');
      el.className = 'itin-sum-item';
      el.innerHTML = `<div class="itin-sum-num">${item.num}</div><div class="itin-sum-label">${item.label}</div>`;
      container.appendChild(el);
    });
  }

  function buildFilters() {
    const container = document.getElementById('itin-filters');
    if (!container) return;
    const filters = [
      { id:'all',   label:'All Days', dot:'#0a0a0a'  },
      { id:'tokyo', label:'Tokyo',    dot:'#c41e3a'   },
      { id:'kyoto', label:'Kyoto',    dot:'#d4af37'   },
      { id:'osaka', label:'Osaka',    dot:'#ea8b37'   },
    ];
    filters.forEach(f => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (f.id === 'all' ? ' active' : '');
      btn.dataset.filter = f.id;
      btn.innerHTML = `<span class="filter-dot" style="background:${f.dot}"></span>${f.label}`;
      // Set initial active style inline
      if (f.id === 'all') { btn.style.background = '#0a0a0a'; btn.style.color = '#fff'; btn.style.borderColor = 'transparent'; }
      btn.addEventListener('click', () => setFilter(f.id));
      container.appendChild(btn);
    });
  }

  function setFilter(filterId) {
    activeFilter = filterId;
    document.querySelectorAll('.filter-btn').forEach(btn => {
      const isActive = btn.dataset.filter === filterId;
      btn.classList.toggle('active', isActive);
      if (isActive) {
        const color = filterId === 'all' ? '#0a0a0a' : C.getCityColor(filterId);
        btn.style.background = color;
        btn.style.color = '#fff';
        btn.style.borderColor = 'transparent';
      } else {
        btn.style.background = '';
        btn.style.color = '';
        btn.style.borderColor = '';
      }
    });
    document.querySelectorAll('.city-section').forEach(section => {
      const show = filterId === 'all' || filterId === section.dataset.city;
      section.style.display = show ? '' : 'none';
    });
  }

  function renderWhoDots(who) {
    if (!who) return '';
    const members = who === 'all' ? ['patrick','jake','steve','conner','boros'] : who;
    return members.map(id => {
      const color = C.getCrewColor(id);
      const init  = CREW_INITIALS[id] || id[0].toUpperCase();
      return `<span class="who-dot" style="background:${color}" title="${id}">${init}</span>`;
    }).join('');
  }

  function renderDayCard(day) {
    const city      = CITY_META[day.city] || CITY_META.departure;
    const cityColor = city.color;

    const badges = [];
    if (day.groupSplits)                                   badges.push('<span class="day-badge split">Split Day</span>');
    if (day.transitNotes)                                  badges.push('<span class="day-badge transit">Transit</span>');
    if (day.theme.includes('Flex') || day.theme.includes('Rest')) badges.push('<span class="day-badge flex">Flex</span>');
    if (day.notes && day.notes.startsWith('⚠️'))           badges.push('<span class="day-badge warn">Note</span>');

    const walkPct = Math.min(100, Math.round((day.walking.miles / 9) * 100));

    const schedRows = day.schedule.map(item => `
      <div class="schedule-item">
        <div class="sched-time">${item.time}</div>
        <div class="sched-emoji">${item.emoji}</div>
        <div>
          <div class="sched-text">${item.activity}</div>
          <div class="sched-who">${renderWhoDots(item.who)}</div>
        </div>
      </div>`).join('');

    const optionalHTML = day.optional && day.optional.length ? `
      <div class="optional-section">
        <div class="optional-label">Optional</div>
        ${day.optional.map(o => `<div class="optional-item"><span>${o.activity}${o.details ? ` <span style="color:var(--subtle)">— ${o.details}</span>` : ''}</span></div>`).join('')}
      </div>` : '';

    const notesHTML = day.notes ? `<div class="day-notes ${day.notes.startsWith('⚠️') ? 'has-warn' : ''}">${day.notes}</div>` : '';

    const transitHTML = day.transitNotes ? `
      <div class="transit-note">
        <span class="transit-note-icon">🚅</span>
        <span>${day.transitNotes}</span>
      </div>` : '';

    let splitHTML = '';
    if (day.groupSplits) {
      const s = day.groupSplits;
      if (s.splitA && s.splitB) {
        splitHTML = `<div class="split-section">
          <div class="split-label">Group Split</div>
          <div class="split-row">
            <div class="split-chip"><div class="split-chip-who">${renderWhoDots(s.splitA.who)}</div>${s.splitA.plan}</div>
            <div class="split-chip"><div class="split-chip-who">${renderWhoDots(s.splitB.who)}</div>${s.splitB.plan}</div>
          </div>
        </div>`;
      } else {
        const text = s.splitOption || s.note || '';
        splitHTML = `<div class="split-section"><div class="split-label">Group Split</div><div style="font-size:12px;color:var(--ink);line-height:1.5">${text}</div></div>`;
      }
    }

    const card = document.createElement('div');
    card.className = 'day-card';
    card.dataset.day = day.dayNumber;
    card.innerHTML = `
      <div class="day-card-header">
        <div class="day-num-block" style="background:${cityColor}">
          <div class="day-num-label">Day</div>
          <div class="day-num-value">${day.dayNumber}</div>
        </div>
        <div>
          <div class="day-theme">${day.theme}</div>
          <div class="day-meta-row">
            <span class="day-meta-item">💴 $${day.estimatedCostPerPerson.usd}/person</span>
            <span class="day-meta-item">🚶 ${day.walking.miles}mi</span>
          </div>
          ${badges.length ? `<div class="day-badges">${badges.join('')}</div>` : ''}
        </div>
        <div class="day-chevron">▾</div>
      </div>
      <div class="day-card-body">
        <div class="day-date-strip">${day.date}</div>
        <div class="schedule-list">${schedRows}</div>
        ${optionalHTML}
        ${notesHTML}
        ${transitHTML}
        ${splitHTML}
        <div class="cost-row">
          <div class="walk-row">
            <span>🚶 ${day.walking.miles} mi · ${day.walking.steps.toLocaleString()} steps</span>
            <div class="walk-bar-track"><div class="walk-bar-fill" style="width:${walkPct}%;background:${cityColor}"></div></div>
          </div>
          <div class="cost-value">¥${day.estimatedCostPerPerson.yen.toLocaleString()}</div>
        </div>
      </div>`;

    card.querySelector('.day-card-header').addEventListener('click', () => card.classList.toggle('open'));
    return card;
  }

  function buildItinerary() {
    const container = document.getElementById('itin-content');
    if (!container || typeof ITINERARY_DATA === 'undefined') return;

    const cityOrder = ['tokyo','kyoto','osaka','departure'];
    const grouped = {};
    ITINERARY_DATA.days.forEach(d => {
      if (!grouped[d.city]) grouped[d.city] = [];
      grouped[d.city].push(d);
    });

    cityOrder.forEach(cityId => {
      const days = grouped[cityId];
      if (!days || !days.length) return;
      const city = CITY_META[cityId];

      const section = document.createElement('div');
      section.className = 'city-section';
      section.dataset.city = cityId;

      const header = document.createElement('div');
      header.className = 'city-section-header';
      header.style.borderColor = city.color;
      header.innerHTML = `
        <span class="city-section-name" style="color:${city.color}">${city.emoji} ${city.name}</span>
        <span class="city-section-kanji">${city.kanji}</span>
        <div class="city-section-meta">${city.nights ? city.nights + ' nights<br>' : ''}${city.dates}</div>`;
      section.appendChild(header);

      days.forEach(day => section.appendChild(renderDayCard(day)));
      container.appendChild(section);
    });
  }

  function initItinerary() {
    if (itinBuilt) return;
    itinBuilt = true;
    buildItinSummary();
    buildFilters();
    buildItinerary();
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.addEventListener('click', e => {
      const btn = e.target.closest('.nav-tab');
      if (btn && btn.dataset.tab === 'itinerary' && !itinBuilt) {
        setTimeout(initItinerary, 0);
      }
    });
    // Build immediately if itinerary is the active tab on load
    if (document.getElementById('tab-itinerary')?.classList.contains('active') && !itinBuilt) {
      initItinerary();
    }
  });
})();
</script>

<!-- BUDGET RENDER SCRIPT -->
<script>
(function () {
  'use strict';
  const C = SITE_CONFIG;
  let budgetBuilt = false;
  let showYen = false; // false = USD, true = JPY

  // ── Estimated budget breakdown per person (USD) ──
  // These are realistic estimates for the full trip including all categories.
  // Users can adjust with sliders.
  const BUDGET_CATEGORIES = [
    { id:'flights',       label:'Flights',          emoji:'✈️',  color:'#6366f1' },
    { id:'accommodation', label:'Accommodation',    emoji:'🏠',  color:'#3b82f6' },
    { id:'food',          label:'Food & Drink',     emoji:'🍜',  color:'#f59e0b' },
    { id:'transport',     label:'Transport',        emoji:'🚅',  color:'#14b8a6' },
    { id:'activities',    label:'Activities',       emoji:'🎯',  color:'#ec4899' },
    { id:'shopping',      label:'Shopping',         emoji:'🛍️', color:'#8b5cf6' },
    { id:'nightlife',     label:'Bars & Nightlife', emoji:'🍺',  color:'#ef4444' },
    { id:'misc',          label:'Misc & Buffer',    emoji:'🎒',  color:'#94a3b8' },
  ];

  // Default spend allocations per person (USD)
  // Derived from actual planned activities + realistic estimates
  const DEFAULT_ALLOCATIONS = {
    patrick: { flights:1500, accommodation:600, food:900, transport:200, activities:700, shopping:600, nightlife:400, misc:100 },
    jake:    { flights:1500, accommodation:600, food:1200, transport:200, activities:300, shopping:500, nightlife:200, misc:500 },
    steve:   { flights:1500, accommodation:600, food:600, transport:150, activities:100, shopping:150, nightlife:800, misc:100 },
    conner:  { flights:1500, accommodation:600, food:800, transport:150, activities:100, shopping:200, nightlife:500, misc:150 },
    boros:   { flights:1500, accommodation:600, food:700, transport:150, activities:50, shopping:200, nightlife:900, misc:900 },
  };

  // Live allocations (mutable by sliders)
  const allocations = JSON.parse(JSON.stringify(DEFAULT_ALLOCATIONS));

  function fmt(usd) {
    if (showYen) return `¥${C.toYen(usd).toLocaleString()}`;
    return `$${Math.round(usd).toLocaleString()}`;
  }

  function personTotal(personId) {
    return Object.values(allocations[personId]).reduce((s, v) => s + v, 0);
  }

  // ── Hero ──
  function buildHero() {
    const hero = document.getElementById('budget-hero');
    if (!hero) return;
    const groupTotal = C.budget.personBudgets.groupTotal;

    hero.innerHTML = `
      <div class="budget-hero-inner">
        <div class="budget-hero-label">Total Group Budget</div>
        <div class="budget-hero-total" id="hero-total">${fmt(groupTotal)}</div>
        <div class="budget-hero-sub">5 crew · 16 days · 3 cities</div>
        <div class="budget-fx-row">
          <span class="budget-fx-label">Display in:</span>
          <div class="budget-fx-toggle">
            <button class="budget-fx-btn active" id="fx-usd">USD $</button>
            <button class="budget-fx-btn" id="fx-jpy">JPY ¥</button>
          </div>
          <span class="budget-fx-label" style="font-size:10px">¥${C.budget.fxRate} = $1</span>
        </div>
      </div>`;

    document.getElementById('fx-usd').addEventListener('click', () => setCurrency(false));
    document.getElementById('fx-jpy').addEventListener('click', () => setCurrency(true));
  }

  function setCurrency(useYen) {
    showYen = useYen;
    document.getElementById('fx-usd').classList.toggle('active', !useYen);
    document.getElementById('fx-jpy').classList.toggle('active', useYen);
    refreshAll();
  }

  // ── Group stats ──
  function buildStats() {
    const content = document.getElementById('budget-content');
    const section = document.createElement('div');
    section.className = 'section fade-in';
    section.id = 'budget-stats-section';
    section.innerHTML = `<div class="section-label">Group Overview</div>
      <div class="budget-stats" id="budget-stats-bar"></div>`;
    content.appendChild(section);
    refreshStats();
  }

  function refreshStats() {
    const bar = document.getElementById('budget-stats-bar');
    if (!bar) return;
    const groupTotal  = C.budget.personBudgets.groupTotal;
    const perPerson   = groupTotal / C.crew.length;
    const itinTotal   = typeof ITINERARY_DATA !== 'undefined'
      ? ITINERARY_DATA.days.reduce((s, d) => s + (d.estimatedCostPerPerson?.usd || 0), 0)
      : 958;
    const flightEst   = 1000; // avg estimate
    bar.innerHTML = '';
    [
      { num: fmt(groupTotal),       label: 'Group Total'    },
      { num: fmt(perPerson),        label: 'Avg Per Person' },
      { num: fmt(itinTotal),        label: 'Daily Costs'    },
      { num: fmt(flightEst),        label: 'Flights Est.'   },
    ].forEach(item => {
      const el = document.createElement('div');
      el.className = 'budget-stat';
      el.innerHTML = `<div class="budget-stat-num">${item.num}</div><div class="budget-stat-label">${item.label}</div>`;
      bar.appendChild(el);
    });
  }

  // ── Per-person cards with sliders ──
  function buildPersonCards() {
    const content = document.getElementById('budget-content');
    const section = document.createElement('div');
    section.className = 'section fade-in';
    section.innerHTML = `<div class="section-label">Per Person</div>`;
    const cardsWrap = document.createElement('div');
    cardsWrap.className = 'person-cards';
    cardsWrap.id = 'person-cards-wrap';
    section.appendChild(cardsWrap);
    content.appendChild(section);

    C.crew.forEach(member => {
      const card = buildPersonCard(member);
      cardsWrap.appendChild(card);
    });
  }

  function buildPersonCard(member) {
    const budget = C.budget.personBudgets[member.id];
    const alloc  = allocations[member.id];
    const card   = document.createElement('div');
    card.className = 'person-card';
    card.id = `pcard-${member.id}`;

    // Header
    const header = document.createElement('div');
    header.className = 'person-card-header';
    header.innerHTML = `
      <div class="person-avatar" style="background:${member.color}20">${member.emoji}</div>
      <div class="person-card-info">
        <div class="person-card-name">${member.name}</div>
        <div class="person-card-role">${member.role}</div>
      </div>
      <div class="person-card-right">
        <div class="person-budget-total" id="ptotal-${member.id}">${fmt(personTotal(member.id))}</div>
        <div class="person-budget-sub">of ${fmt(budget)} budget</div>
      </div>
      <div class="person-card-chevron">▾</div>`;
    card.appendChild(header);

    // Progress bar
    const progBar = document.createElement('div');
    progBar.className = 'person-progress-bar';
    const progFill = document.createElement('div');
    progFill.className = 'person-progress-fill';
    progFill.id = `pprog-${member.id}`;
    progFill.style.background = member.color;
    progFill.style.width = '0%';
    progBar.appendChild(progFill);
    card.appendChild(progBar);

    // Body (sliders)
    const body = document.createElement('div');
    body.className = 'person-card-body';
    const sliderSection = document.createElement('div');
    sliderSection.className = 'budget-slider-section';

    BUDGET_CATEGORIES.forEach(cat => {
      const catMax = cat.id === 'flights' ? 2000
                   : cat.id === 'accommodation' ? 1200
                   : cat.id === 'shopping' ? 2000
                   : cat.id === 'nightlife' ? 1500
                   : 1500;

      const row = document.createElement('div');
      row.innerHTML = `
        <div class="slider-row">
          <div class="slider-category">
            <span class="slider-cat-emoji">${cat.emoji}</span>
            ${cat.label}
          </div>
          <div class="slider-amount" id="sval-${member.id}-${cat.id}">${fmt(alloc[cat.id])}</div>
        </div>
        <input type="range" class="budget-slider" id="sldr-${member.id}-${cat.id}"
          min="0" max="${catMax}" step="50"
          value="${alloc[cat.id]}"
          style="accent-color:${member.color}">`;
      sliderSection.appendChild(row);

      // Wire slider
      setTimeout(() => {
        const slider = document.getElementById(`sldr-${member.id}-${cat.id}`);
        if (slider) {
          slider.addEventListener('input', () => {
            alloc[cat.id] = parseInt(slider.value);
            refreshPersonCard(member);
          });
        }
      }, 0);
    });

    body.appendChild(sliderSection);

    // Remaining
    const remaining = document.createElement('div');
    remaining.className = 'person-remaining';
    remaining.innerHTML = `
      <span class="person-remaining-label">Remaining budget</span>
      <span class="person-remaining-val" id="premain-${member.id}">—</span>`;
    body.appendChild(remaining);
    card.appendChild(body);

    // Toggle
    header.addEventListener('click', () => {
      card.classList.toggle('open');
      // Animate progress bar on open
      refreshPersonCard(member);
    });

    // Initial progress
    setTimeout(() => refreshPersonCard(member), 100);

    return card;
  }

  function refreshPersonCard(member) {
    const budget  = C.budget.personBudgets[member.id];
    const total   = personTotal(member.id);
    const remain  = budget - total;
    const pct     = Math.min(100, Math.round((total / budget) * 100));

    // Update total
    const totalEl = document.getElementById(`ptotal-${member.id}`);
    if (totalEl) totalEl.textContent = fmt(total);

    // Update progress bar
    const progEl = document.getElementById(`pprog-${member.id}`);
    if (progEl) progEl.style.width = pct + '%';

    // Update remaining
    const remainEl = document.getElementById(`premain-${member.id}`);
    if (remainEl) {
      remainEl.textContent = remain >= 0 ? fmt(remain) : `-${fmt(Math.abs(remain))}`;
      remainEl.classList.toggle('over', remain < 0);
    }

    // Update all slider value labels
    const alloc = allocations[member.id];
    BUDGET_CATEGORIES.forEach(cat => {
      const valEl = document.getElementById(`sval-${member.id}-${cat.id}`);
      if (valEl) valEl.textContent = fmt(alloc[cat.id]);
    });
  }

  // ── Cost by city ──
  function buildCityCosts() {
    const content = document.getElementById('budget-content');
    const section = document.createElement('div');
    section.className = 'section fade-in';
    section.innerHTML = `<div class="section-label">Cost by City</div>`;

    // Per-person daily cost totals from itinerary
    const cityCosts = { tokyo:0, kyoto:0, osaka:0 };
    if (typeof ITINERARY_DATA !== 'undefined') {
      ITINERARY_DATA.days.forEach(d => {
        if (cityCosts[d.city] !== undefined) cityCosts[d.city] += d.estimatedCostPerPerson.usd;
      });
    } else {
      cityCosts.tokyo = 529; cityCosts.kyoto = 319; cityCosts.osaka = 180;
    }

    const maxCost = Math.max(...Object.values(cityCosts));
    const rowsWrap = document.createElement('div');
    rowsWrap.className = 'city-cost-rows';
    rowsWrap.id = 'city-cost-rows';

    C.cities.forEach(city => {
      const cost = cityCosts[city.id] || 0;
      const pct  = Math.round((cost / maxCost) * 100);
      const perDay = city.days > 0 ? Math.round(cost / city.days) : 0;

      const row = document.createElement('div');
      row.className = 'city-cost-row';
      row.innerHTML = `
        <div class="city-cost-accent" style="background:${city.color}"></div>
        <div class="city-cost-body">
          <div class="city-cost-top">
            <span class="city-cost-name">${city.emoji} ${city.name}</span>
            <span class="city-cost-total" id="ccost-${city.id}">${fmt(cost)}</span>
          </div>
          <div class="city-cost-bar-track">
            <div class="city-cost-bar-fill" id="cbar-${city.id}" style="width:0%;background:${city.color}"></div>
          </div>
          <div class="city-cost-meta">${city.nights} nights · ${city.days} days · <span id="cday-${city.id}">${fmt(perDay)}</span>/day avg</div>
        </div>`;
      rowsWrap.appendChild(row);

      // Animate bar
      setTimeout(() => {
        const bar = document.getElementById(`cbar-${city.id}`);
        if (bar) bar.style.width = pct + '%';
      }, 200);
    });

    section.appendChild(rowsWrap);
    content.appendChild(section);
  }

  // ── Daily cost chart ──
  function buildDailyChart() {
    const content = document.getElementById('budget-content');
    const section = document.createElement('div');
    section.className = 'section fade-in';
    section.innerHTML = `<div class="section-label">Daily Spend (per person)</div>`;

    if (typeof ITINERARY_DATA === 'undefined') { content.appendChild(section); return; }

    const days = ITINERARY_DATA.days;
    const maxUsd = Math.max(...days.map(d => d.estimatedCostPerPerson.usd));

    const chart = document.createElement('div');
    chart.className = 'daily-chart';

    const barsWrap = document.createElement('div');
    barsWrap.className = 'daily-chart-bars';
    barsWrap.id = 'daily-bars';

    const tooltip = document.createElement('div');
    tooltip.className = 'daily-chart-tooltip';
    tooltip.id = 'daily-tooltip';
    tooltip.textContent = 'Tap a bar for details';

    days.forEach(day => {
      const city     = C.getCityById(day.city);
      const color    = city ? city.color : '#8a8278';
      const CHART_H = 76; // px — slightly less than container to leave room for labels
      const heightPx = Math.max(2, Math.round((day.estimatedCostPerPerson.usd / maxUsd) * CHART_H));

      const wrap = document.createElement('div');
      wrap.className = 'daily-bar-wrap';
      wrap.title = `Day ${day.dayNumber}: ${fmt(day.estimatedCostPerPerson.usd)}`;

      const bar = document.createElement('div');
      bar.className = 'daily-bar';
      bar.style.cssText = `height:0px;background:${color}`;
      bar.dataset.day = day.dayNumber;
      bar.dataset.usd = day.estimatedCostPerPerson.usd;
      bar.dataset.theme = day.theme;
      bar.dataset.color = color;

      const lbl = document.createElement('div');
      lbl.className = 'daily-bar-label';
      lbl.textContent = day.dayNumber;

      wrap.appendChild(bar);
      wrap.appendChild(lbl);
      barsWrap.appendChild(wrap);

      // Animate in
      setTimeout(() => { bar.style.height = heightPx + 'px'; }, 200 + day.dayNumber * 30);

      bar.addEventListener('mouseenter', () => {
        tooltip.textContent = `Day ${day.dayNumber} — ${day.theme.substring(0, 40)} · ${fmt(day.estimatedCostPerPerson.usd)}/person`;
      });
      bar.addEventListener('click', () => {
        tooltip.textContent = `Day ${day.dayNumber} — ${day.theme} · ${fmt(day.estimatedCostPerPerson.usd)}/person`;
      });
    });

    barsWrap.addEventListener('mouseleave', () => { tooltip.textContent = 'Tap a bar for details'; });

    chart.appendChild(barsWrap);
    chart.appendChild(tooltip);
    section.appendChild(chart);
    content.appendChild(section);
  }

  // ── Category breakdown ──
  function buildCategoryBreakdown() {
    const content = document.getElementById('budget-content');
    const section = document.createElement('div');
    section.className = 'section fade-in';
    section.innerHTML = `<div class="section-label">Spend by Category (estimated, group)</div>`;

    // Sum default allocations across all crew per category
    const catTotals = {};
    BUDGET_CATEGORIES.forEach(cat => {
      catTotals[cat.id] = C.crew.reduce((s, m) => s + (DEFAULT_ALLOCATIONS[m.id]?.[cat.id] || 0), 0);
    });
    const maxCat = Math.max(...Object.values(catTotals));

    const rowsWrap = document.createElement('div');
    rowsWrap.className = 'cat-breakdown';
    rowsWrap.id = 'cat-breakdown';

    BUDGET_CATEGORIES.forEach(cat => {
      const total = catTotals[cat.id];
      const pct   = Math.round((total / maxCat) * 100);

      const row = document.createElement('div');
      row.className = 'cat-row';
      row.innerHTML = `
        <div class="cat-emoji">${cat.emoji}</div>
        <div class="cat-bar-wrap">
          <div class="cat-name">${cat.label}</div>
          <div class="cat-bar-track">
            <div class="cat-bar-fill" id="catbar-${cat.id}" style="width:0%;background:${cat.color}"></div>
          </div>
        </div>
        <div class="cat-amount" id="catamt-${cat.id}">${fmt(total)}</div>`;
      rowsWrap.appendChild(row);

      setTimeout(() => {
        const bar = document.getElementById(`catbar-${cat.id}`);
        if (bar) bar.style.width = pct + '%';
      }, 300);
    });

    section.appendChild(rowsWrap);
    content.appendChild(section);
  }

  // ── Advance booking costs ──
  function buildBookingCosts() {
    const content = document.getElementById('budget-content');
    const section = document.createElement('div');
    section.className = 'section fade-in';
    section.innerHTML = `<div class="section-label">Must-Book Ahead</div>`;

    const bookings = [
      { name:'Ghibli Museum', who:'Patrick books', price:'¥1,000/person', usd:7,  note:'Dec 10 10AM JST via Lawson', urgent:true },
      { name:'Kirby Cafe',    who:'Patrick books', price:'~¥3,000/person', usd:20, note:'Dec 10 6PM JST — separate site', urgent:true },
      { name:'Eorzea Cafe Akihabara', who:'Patrick', price:'~¥2,000/person', usd:13, note:'~1 month ahead', urgent:false },
      { name:'Eorzea Cafe Dotonbori', who:'Patrick', price:'~¥2,000/person', usd:13, note:'~1 month ahead', urgent:false },
      { name:'Sumo Tournament',  who:'Patrick', price:'¥3,800–14,000', usd:25,  note:'Oct–Nov 2026 via JSA site', urgent:false },
      { name:'Tokyo Matrix',     who:'Patrick', price:'~¥3,500/person', usd:23, note:'2–4 weeks ahead online', urgent:false },
      { name:'TeamLab Borderless', who:'Patrick', price:'¥4,800/person', usd:32, note:'Book ASAP once Jan slots open', urgent:false },
      { name:'Dragon Quest Island', who:'Group vote', price:'~¥5,000/person', usd:33, note:'Only if Day 15 Option A chosen', urgent:false },
      { name:'Snoopy Museum',    who:'Steve',   price:'¥1,200/person', usd:8,  note:'Several months ahead', urgent:false },
    ];

    const wrap = document.createElement('div');
    wrap.className = 'booking-costs';
    bookings.forEach(b => {
      const row = document.createElement('div');
      row.className = 'booking-cost-row';
      row.innerHTML = `
        <div>
          <div class="booking-cost-name">${b.name} ${b.urgent ? '<span class="booking-cost-badge">⭐ Critical</span>' : ''}</div>
          <div class="booking-cost-meta">${b.who} · ${b.note}</div>
        </div>
        <div class="booking-cost-price">${b.price}<br><span style="font-size:10px;font-weight:400;color:var(--muted)">~${fmt(b.usd)}/pp</span></div>`;
      wrap.appendChild(row);
    });
    section.appendChild(wrap);
    content.appendChild(section);
  }

  // ── Refresh all currency-sensitive displays ──
  function refreshAll() {
    // Hero total
    const heroTotal = document.getElementById('hero-total');
    if (heroTotal) heroTotal.textContent = fmt(C.budget.personBudgets.groupTotal);

    // Stats
    refreshStats();

    // Person cards
    C.crew.forEach(m => refreshPersonCard(m));

    // City costs
    if (typeof ITINERARY_DATA !== 'undefined') {
      const cityCosts = { tokyo:0, kyoto:0, osaka:0 };
      ITINERARY_DATA.days.forEach(d => {
        if (cityCosts[d.city] !== undefined) cityCosts[d.city] += d.estimatedCostPerPerson.usd;
      });
      C.cities.forEach(city => {
        const cost = cityCosts[city.id] || 0;
        const perDay = city.days > 0 ? Math.round(cost / city.days) : 0;
        const costEl = document.getElementById(`ccost-${city.id}`);
        const dayEl  = document.getElementById(`cday-${city.id}`);
        if (costEl) costEl.textContent = fmt(cost);
        if (dayEl)  dayEl.textContent  = fmt(perDay);
      });
    }

    // Categories
    const catTotals = {};
    BUDGET_CATEGORIES.forEach(cat => {
      catTotals[cat.id] = C.crew.reduce((s, m) => s + (DEFAULT_ALLOCATIONS[m.id]?.[cat.id] || 0), 0);
    });
    BUDGET_CATEGORIES.forEach(cat => {
      const el = document.getElementById(`catamt-${cat.id}`);
      if (el) el.textContent = fmt(catTotals[cat.id]);
    });
  }

  // ── Init ──
  function initBudget() {
    if (budgetBuilt) return;
    budgetBuilt = true;
    buildHero();
    const content = document.getElementById('budget-content');
    if (!content) return;
    buildStats();
    buildPersonCards();
    buildCityCosts();
    buildDailyChart();
    buildCategoryBreakdown();
    buildBookingCosts();

    // Trigger fade-ins
    setTimeout(() => {
      content.querySelectorAll('.fade-in').forEach(el => el.classList.add('visible'));
    }, 50);
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.addEventListener('click', e => {
      const btn = e.target.closest('.nav-tab');
      if (btn && btn.dataset.tab === 'budget') setTimeout(initBudget, 0);
    });
  });
})();
</script>

  function buildTimeline() {
    const sec = makeSection('timeline');

    const wrap = document.createElement('div');
    wrap.appendChild(sectionHeader('Booking Checklist'));
    wrap.style.marginTop = '20px';

    const phases = document.createElement('div');
    phases.className = 'timeline-phases';

    L.bookingTimeline.forEach(phase => {
      const card = document.createElement('div');
      card.className = 'phase-card';

      const header = document.createElement('div');
      header.className = 'phase-header';
      header.innerHTML = `
        <div class="phase-num priority-${phase.priority}">${phase.phase}</div>
        <div>
          <div class="phase-label">${phase.label}</div>
          <div class="phase-window">${phase.window}</div>
        </div>
        <div class="phase-chevron">▾</div>`;
      card.appendChild(header);

      const body = document.createElement('div');
      body.className = 'phase-body';
      phase.tasks.forEach(t => {
        const task = document.createElement('div');
        task.className = 'phase-task';
        task.innerHTML = `
          <div class="phase-task-check"></div>
          <div class="phase-task-body">
            <div class="phase-task-name">${t.task}</div>
            <div class="phase-task-meta">
              <span>👤 ${t.responsible}</span>
              ${t.notes ? `<span>${t.notes}</span>` : ''}
            </div>
          </div>`;
        body.appendChild(task);
      });
      card.appendChild(body);

      header.addEventListener('click', () => card.classList.toggle('open'));
      // Auto-open first two phases
      if (phase.phase <= 2) card.classList.add('open');

      phases.appendChild(card);
    });

    wrap.appendChild(phases);
    sec.appendChild(wrap);
    return sec;
  }

  // ── CRITICAL DATES ──
  function buildDates() {
    const sec = makeSection('dates');

    const wrap = document.createElement('div');
    wrap.appendChild(sectionHeader('Critical Dates'));
    wrap.style.marginTop = '20px';

    const list = document.createElement('div');
    list.className = 'critical-list';

    L.criticalDates.forEach(d => {
      const item = document.createElement('div');
      item.className = 'critical-item' + (d.urgency === 'critical' ? ' is-critical' : '');
      item.innerHTML = `
        <div class="critical-date-block ${d.urgency === 'critical' ? 'is-critical' : ''}">
          <div class="critical-date-day">${d.day}</div>
          <div class="critical-date-month">${d.month}</div>
        </div>
        <div>
          <div class="critical-label">${d.label}</div>
          <div class="critical-desc">${d.description}</div>
          <div class="critical-who">→ ${d.responsible}</div>
          ${d.alarm ? '<div class="critical-alarm">⏰ Set alarm</div>' : ''}
          ${d.url ? `<a href="${d.url}" target="_blank" rel="noopener noreferrer" class="acts-card-link maps" style="margin-top:6px;display:inline-flex">${d.url}</a>` : ''}
        </div>`;
      list.appendChild(item);
    });

    wrap.appendChild(list);
    sec.appendChild(wrap);
    return sec;
  }

  // ── MONEY ──
  function buildMoney() {
    const sec = makeSection('money');
    const m = L.money;

    const wrap = document.createElement('div');
    wrap.appendChild(sectionHeader('Money Tips'));
    wrap.style.marginTop = '20px';

    const tips = [
      { icon:'💴', title:'Cash First',       body:m.primaryMethod, warn:false },
      { icon:'🏧', title:'Best ATM',         body:`${m.atmBest}\n${m.atmAlt}\nDay 1: ${m.day1}`, warn:false },
      { icon:'💸', title:'Daily Cash',       body:m.daily, warn:false },
      { icon:'🚫', title:'No Tipping',       body:m.tipping, warn:true },
      { icon:'💳', title:'Cards',            body:m.cards, warn:false },
      { icon:'🤝', title:'Splitting Costs',  body:m.splitting, warn:false },
    ];

    const tipCards = document.createElement('div');
    tipCards.className = 'tip-cards';
    tips.forEach(t => {
      const card = document.createElement('div');
      card.className = 'tip-card' + (t.warn ? ' tip-warn' : '');
      card.innerHTML = `
        <div class="tip-icon">${t.icon}</div>
        <div>
          <div class="tip-title">${t.title}</div>
          <div class="tip-body">${t.body}</div>
        </div>`;
      tipCards.appendChild(card);
    });
    wrap.appendChild(tipCards);
    sec.appendChild(wrap);
    return sec;
  }

  // ── PRACTICAL (connectivity + docs) ──
  function buildPractical() {
    const sec = makeSection('practical');
    const conn = L.connectivity;

    // eSIM
    const esimWrap = document.createElement('div');
    esimWrap.appendChild(sectionHeader('Connectivity'));
    esimWrap.style.marginTop = '20px';
    const esimTable = document.createElement('div');
    esimTable.className = 'logi-table';
    [
      { key:'Method',    val:'Individual eSIM — one per person' },
      { key:'Buy by',    val:conn.purchaseWindow },
      { key:'Activate',  val:conn.activationNote },
      { key:'Providers', val:conn.providers.join(', ') + ' — compare rates at booking time' },
      { key:'WiFi',      val:conn.coverage },
    ].forEach(r => {
      const row = document.createElement('div');
      row.className = 'logi-row';
      row.innerHTML = `<div class="logi-key">${r.key}</div><div class="logi-val">${r.val}</div>`;
      esimTable.appendChild(row);
    });
    esimWrap.appendChild(esimTable);

    const appsLabel = document.createElement('div');
    appsLabel.className = 'section-label';
    appsLabel.style.marginTop = '16px';
    appsLabel.textContent = 'Navigation Apps';
    esimWrap.appendChild(appsLabel);
    const appsTable = document.createElement('div');
    appsTable.className = 'logi-table';
    conn.apps.forEach(a => {
      const row = document.createElement('div');
      row.className = 'logi-row';
      row.innerHTML = `<div class="logi-key">${a.name}</div><div class="logi-val">${a.note}</div>`;
      appsTable.appendChild(row);
    });
    esimWrap.appendChild(appsTable);
    sec.appendChild(esimWrap);

    // Documents
    const docWrap = document.createElement('div');
    docWrap.appendChild(sectionHeader('Documents & Health'));
    docWrap.style.marginTop = '20px';
    const docTable = document.createElement('div');
    docTable.className = 'logi-table';
    [
      { key:'Passports',    val:'All 5 members confirmed valid — no concerns' },
      { key:'Visa',         val:'Not required for US citizens visiting Japan (up to 90 days)' },
      { key:'Insurance',    val:'Recommended — research and book alongside flights' },
      { key:'Allergies',    val:'None — no dietary restrictions for any member' },
      { key:'Walking note', val:'Some days involve 5–6+ miles. Use rail or bus to break up longer days and build in rest time.' },
      { key:'Tax refund',   val:'Keep all receipts and original packaging. Tax refund counter at KIX before departure.' },
    ].forEach(r => {
      const row = document.createElement('div');
      row.className = 'logi-row';
      row.innerHTML = `<div class="logi-key">${r.key}</div><div class="logi-val">${r.val}</div>`;
      docTable.appendChild(row);
    });
    docWrap.appendChild(docTable);
    sec.appendChild(docWrap);

    // Emergency numbers
    const emWrap = document.createElement('div');
    emWrap.appendChild(sectionHeader('Emergency Numbers'));
    emWrap.style.marginTop = '20px';
    const emGrid = document.createElement('div');
    emGrid.className = 'emergency-grid';
    const nums = L.emergencyNumbers;
    [nums.police, nums.fire, nums.tourism, nums.usEmbassy].forEach(n => {
      const card = document.createElement('div');
      card.className = 'emergency-card';
      card.innerHTML = `<div class="emergency-label">${n.label}</div><div class="emergency-num">${n.number}</div>`;
      emGrid.appendChild(card);
    });
    emWrap.appendChild(emGrid);
    sec.appendChild(emWrap);

    return sec;
  }

  // ── PACKING LIST ──
  function buildPacking() {
    const sec = makeSection('packing');

    const PACKING = [
      { cat:'📋 Documents',   items:['Passport (valid)', 'Flight confirmations (screenshot offline)', 'Travel insurance card', 'Emergency numbers (screenshotted)', 'Credit/debit cards', 'Small amount of USD to exchange on arrival'] },
      { cat:'👕 Clothing',    items:['Thermal base layers (Jan is cold)', 'Warm mid-layer (fleece or down jacket)', 'Waterproof outer layer', '7–8 days of clothes (laundromat mid-trip)', 'Comfortable walking shoes — broken in', 'Dress shoes / smart-casual for bars + cafes', 'Warm hat and gloves'] },
      { cat:'💊 Health',      items:['Any personal medications (full trip supply)', 'Ibuprofen / pain relief', 'Motion sickness tablets (for Shinkansen if needed)', 'Blister plasters (high-walking days)', 'Hand sanitiser', 'Lip balm (winter air is dry)'] },
      { cat:'🔌 Tech',        items:['Phone + charger', 'Portable battery pack', 'Universal adapter (Japan uses Type A — same as US)', 'Earbuds / headphones', 'Camera (optional)', 'eSIM activated before departure', 'Modded 3DS + charger (flight entertainment)'] },
      { cat:'🎒 Day Bag',     items:['Small backpack or tote for daily use', 'Reusable water bottle (vending machines everywhere if you forget)', 'Umbrella or packable rain layer', 'Coin purse (Japan uses a lot of coins)', 'Tote bag for shopping haul overflow'] },
      { cat:'💴 Money',       items:['Suica IC card (get at HND on arrival)', '¥10,000–20,000 yen cash on hand at all times', 'ATM card confirmed to work abroad (test before leaving)', 'Splitwise or Venmo set up for group expenses'] },
    ];

    const wrap = document.createElement('div');
    wrap.appendChild(sectionHeader('Packing List'));
    wrap.style.marginTop = '20px';

    const cards = document.createElement('div');
    cards.className = 'tip-cards';
    PACKING.forEach(section => {
      const card = document.createElement('div');
      card.className = 'tip-card';
      card.innerHTML = `
        <div>
          <div class="tip-title" style="margin-bottom:8px">${section.cat}</div>
          <ul style="margin:0;padding-left:16px;display:flex;flex-direction:column;gap:4px">
            ${section.items.map(i => `<li style="font-size:12px;color:var(--muted);line-height:1.4">${i}</li>`).join('')}
          </ul>
        </div>`;
      cards.appendChild(card);
    });
    wrap.appendChild(cards);
    sec.appendChild(wrap);
    return sec;
  }

  // ── GROUP RULES ──
  function buildRules() {
    const sec = makeSection('rules');

    const wrap = document.createElement('div');
    wrap.appendChild(sectionHeader('Group Rules'));
    wrap.style.marginTop = '20px';

    const tipCards = document.createElement('div');
    tipCards.className = 'tip-cards';
    L.groupRules.forEach(r => {
      const card = document.createElement('div');
      card.className = 'tip-card';
      card.innerHTML = `
        <div class="tip-icon">${r.icon}</div>
        <div>
          <div class="tip-title">${r.rule}</div>
          <div class="tip-body">${r.detail}</div>
        </div>`;
      tipCards.appendChild(card);
    });
    wrap.appendChild(tipCards);
    sec.appendChild(wrap);
    return sec;
  }

  // ── INIT ──
  function initLogistics() {
    if (logiBuilt) return;
    logiBuilt = true;

    const contentEl = document.getElementById('logi-content');
    if (!contentEl) return;

    buildNav();
    contentEl.appendChild(buildFlights());
    contentEl.appendChild(buildAccom());
    contentEl.appendChild(buildTransport());
    contentEl.appendChild(buildTimeline());
    contentEl.appendChild(buildDates());
    contentEl.appendChild(buildMoney());
    contentEl.appendChild(buildPractical());
    contentEl.appendChild(buildPacking());
    contentEl.appendChild(buildRules());

    // Trigger fade-ins
    setTimeout(() => {
      contentEl.querySelectorAll('.fade-in').forEach(el => el.classList.add('visible'));
    }, 50);
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.addEventListener('click', e => {
      const btn = e.target.closest('.nav-tab');
      if (btn && btn.dataset.tab === 'logistics') setTimeout(initLogistics, 0);
    });
  });

})();
</script>

    const svg = `

      className: '',
      iconSize: [32, 38],
      iconAnchor: [16, 38],
      popupAnchor: [0, -40],
    });

  // ── Build popup HTML ──

    const member = C.getCrewById(act.person);

    const mapsUrl = `https://www.google.com/maps/search/${encodeURIComponent(act.mapsQuery || act.name + ' ' + act.address)}`;
    const bookBadge = act.bookingRequired === true
      ? '<span class="map-popup-badge" style="background:rgba(196,30,58,0.1);color:#c41e3a">Book ahead</span>' : '';

      <div class="map-popup-badges">

      const catMatch  = activeCat  === 'all' || act.category === activeCat;

      else leafletMap.removeLayer(marker);

      (activeCity === 'all' || a.city === activeCity) &&
      (activeCat  === 'all' || a.category === activeCat) &&
      (activeCrew === 'all' || a.person === activeCrew) &&
      COORDS[a.id]

    crewAllBtn.dataset.filter = 'crew';
    crewAllBtn.dataset.value  = 'all';
    crewAllBtn.textContent = 'Everyone';
    crewAllBtn.style.cssText = 'background:#0a0a0a;color:#fff;border-color:transparent';
    crewAllBtn.addEventListener('click', () => {
      activeCrew = 'all';
      ctrl.querySelectorAll('[data-filter="crew"]').forEach(x => { x.classList.remove('active'); x.style.background=''; x.style.color=''; x.style.borderColor=''; });
      crewAllBtn.classList.add('active'); crewAllBtn.style.cssText='background:#0a0a0a;color:#fff;border-color:transparent';
      applyFilters();
    });
    ctrl.appendChild(crewAllBtn);

    C.crew.filter(m => (typeof TRIP_DATA !== 'undefined') && TRIP_DATA.activities.some(a => a.person === m.id && COORDS[a.id])).forEach(member => {
      const btn = document.createElement('button');
      btn.className = 'map-ctrl-btn';
      btn.dataset.filter = 'crew';
      btn.dataset.value  = member.id;
      btn.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:${member.color};display:inline-block;flex-shrink:0"></span>${member.name}`;
      btn.addEventListener('click', () => {
        activeCrew = member.id;
        ctrl.querySelectorAll('[data-filter="crew"]').forEach(x => { x.classList.remove('active'); x.style.background=''; x.style.color=''; x.style.borderColor=''; });
        btn.classList.add('active'); btn.style.background=member.color; btn.style.color='#fff'; btn.style.borderColor='transparent';
        applyFilters();
      });
      ctrl.appendChild(btn);
    });

    // Expose activeCrew so applyFilters can read it
    ctrl._getActiveCrew = () => activeCrew;

    // Separator
    const sep2 = document.createElement('div');
    sep2.className = 'map-ctrl-sep';
    ctrl.appendChild(sep2);

    // Category buttons
    CAT_BTNS.forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'map-ctrl-btn' + (b.id === 'all' ? ' active' : '');
      btn.dataset.filter = 'cat';
      btn.dataset.value  = b.id;
      btn.textContent = b.label;
      if (b.id === 'all') { btn.style.background = '#0a0a0a'; btn.style.color = '#fff'; btn.style.borderColor = 'transparent'; }
      btn.addEventListener('click', () => {
        activeCat = b.id;
        ctrl.querySelectorAll('[data-filter="cat"]').forEach(x => {
          x.classList.remove('active');
          x.style.background = ''; x.style.color = ''; x.style.borderColor = '';
        });
        btn.classList.add('active');
        btn.style.background = '#0a0a0a'; btn.style.color = '#fff'; btn.style.borderColor = 'transparent';
        applyFilters();
      });
      ctrl.appendChild(btn);
    });
  }

  // ── List below map ──
  function buildList(acts) {
    const list = document.getElementById('map-list');
    if (!list) return;
    list.innerHTML = '';
    if (!acts.length) {
      list.innerHTML = '<div style="padding:16px;font-size:13px;color:var(--muted);text-align:center">No activities match current filters</div>';
      return;
    }
    const header = document.createElement('div');
    header.className = 'map-list-header';
    header.innerHTML = `<span>${acts.length} location${acts.length !== 1 ? 's' : ''}</span><span>Tap to focus</span>`;
    list.appendChild(header);

    // Group by city
    const cityOrder = ['tokyo', 'kyoto', 'osaka'];
    const grouped = {};
    acts.forEach(a => { if (!grouped[a.city]) grouped[a.city] = []; grouped[a.city].push(a); });

    cityOrder.forEach(cityId => {
      const group = grouped[cityId];
      if (!group || !group.length) return;
      const city = C.getCityById(cityId);
      if (!city) return;

      // City sub-header (only in 'all' view)
      if (activeCity === 'all') {
        const ch = document.createElement('div');
        ch.style.cssText = `font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:${city.color};padding:10px 0 4px;margin-top:4px`;
        ch.textContent = `${city.emoji} ${city.name}`;
        list.appendChild(ch);
      }

      group.forEach(act => {
        const item = document.createElement('div');
        item.className = 'map-list-item';
        const dotColor = C.getCrewColor(act.person);
        item.innerHTML = `
          <div class="map-list-dot" style="background:${dotColor}"></div>
          <div class="map-list-name">${act.name}</div>
          <div class="map-list-cat">${CAT_EMOJI[act.category] || '📍'}</div>`;
        item.addEventListener('click', () => {
          const coords = COORDS[act.id];
          if (!coords) return;
          leafletMap.setView(coords, 16, { animate: true });
          // Find and open the marker popup
          const found = allMarkers.find(m => m.act.id === act.id);
          if (found) found.marker.openPopup();
          // Scroll to map
          document.getElementById('map-container').scrollIntoView({ behavior:'smooth', block:'start' });
        });
        list.appendChild(item);
      });
    });
  }

  // ── Init map ──
  function initMap() {
    if (mapBuilt) return;
    mapBuilt = true;

    buildControls();

    // Small delay to ensure container has dimensions
    setTimeout(() => {
      leafletMap = L.map('map-container', {
        center: [35.6762, 139.6503],
        zoom: 12,
        zoomControl: true,
      });

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 19,
      }).addTo(leafletMap);

      // Add markers for all activities with known coords
      const acts = (typeof TRIP_DATA !== 'undefined') ? TRIP_DATA.activities : [];
      acts.forEach(act => {
        const coords = COORDS[act.id];
        if (!coords) return;
        const color = C.getCrewColor(act.person);
        const emoji = CAT_EMOJI[act.category] || '📍';
        const marker = L.marker(coords, { icon: makeIcon(color, emoji) });
        marker.bindPopup(makePopup(act), { maxWidth: 260 });
        marker.addTo(leafletMap);
        allMarkers.push({ marker, act });
      });

      // Build initial list
      buildList(acts.filter(a => COORDS[a.id]));

      // Fix Leaflet tile rendering when tab becomes visible
      leafletMap.invalidateSize();
    }, 50);
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.addEventListener('click', e => {
      const btn = e.target.closest('.nav-tab');
      if (btn && btn.dataset.tab === 'map') {
        if (!mapBuilt) {
          setTimeout(initMap, 0);
        } else {
          // Re-invalidate size in case container was hidden
          setTimeout(() => leafletMap && leafletMap.invalidateSize(), 50);
        }
      }
    });
  });

})();
</script>
</body>
</html>
