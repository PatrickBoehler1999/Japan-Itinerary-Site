  function initLogistics() {
    if (logiBuilt) return;
    logiBuilt = true;

    const contentEl = document.getElementById('logi-content');
    if (!contentEl) return;

    buildNav();
    contentEl.appendChild(buildFlights());
    contentEl.appendChild(buildAccom());
    contentEl.appendChild(buildCityGuidesSection());
    contentEl.appendChild(buildTransport());
    contentEl.appendChild(buildTimeline());
    contentEl.appendChild(buildDates());
    contentEl.appendChild(buildMoney());
    contentEl.appendChild(buildPractical());
    contentEl.appendChild(buildPacking());
    contentEl.appendChild(buildRules());

    // Trigger fade-ins
    setTimeout(() => {
      contentEl.querySelectorAll('.fade-in').forEach(el => el.classList.add('visible'));
    }, 50);
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.addEventListener('click', e => {
      const btn = e.target.closest('.nav-tab');
      if (btn && btn.dataset.tab === 'logistics') setTimeout(initLogistics, 0);
    });
  });

})();
</script>

  let homeMarkers = [];
  function homeIcon(color) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="38" height="44" viewBox="0 0 38 44">
        <rect x="3" y="3" width="32" height="32" rx="8" fill="#0a0a0a" stroke="${color}" stroke-width="3"/>

  }
  function addHomes() {
    const addr = {};
    if (typeof LOGISTICS !== 'undefined') LOGISTICS.accommodation.cities.forEach(x => { addr[x.city.toLowerCase()] = x.address; });

      const city = C.getCityById(h.city);

        <div class="map-popup-type">${addr[h.city] || ''}</div>

      m.addTo(leafletMap);
      homeMarkers.push({ marker: m, city: h.city });
    });
  }

  // Pins that share exact coordinates (same building, or a neighbourhood placeholder)
  // are fanned out slightly so none hide behind another.
  function spreadCoords(acts) {
    const seen = {};
    const out = {};
    acts.forEach(a => {
      const c0 = COORDS[a.id]; if (!c0) return;
      const key = c0.join(',');
      const n = seen[key] = (seen[key] || 0) + 1;
      if (n === 1) { out[a.id] = c0; return; }
      const ang = (n - 1) * 2.4, r = 0.00035 * Math.sqrt(n - 1);
      out[a.id] = [c0[0] + r * Math.sin(ang), c0[1] + r * Math.cos(ang)];
    });
    return out;
  }

  // ── Places: show exactly what the list shows ──
  function showOnly(list) {
    if (!leafletMap) return;
    const onlyOther = list.length && list.every(a => a.city === 'other');
    const ids = new Set(list.filter(a => onlyOther || a.city !== 'other').map(a => a.id));
    const pts = [];
    allMarkers.forEach(({ marker, act }) => {
      if (ids.has(act.id)) { marker.addTo(leafletMap); pts.push(marker.getLatLng()); }
      else leafletMap.removeLayer(marker);
    });
    const cities = new Set(list.map(a => a.city));
    homeMarkers.forEach(h => {
      if (!onlyOther && cities.has(h.city)) { h.marker.addTo(leafletMap); pts.push(h.marker.getLatLng()); }
      else leafletMap.removeLayer(h.marker);
    });
    if (pts.length === 1) leafletMap.setView(pts[0], 15);
    else if (pts.length > 1) leafletMap.fitBounds(L.latLngBounds(pts), { padding: [30, 30], maxZoom: 16 });
  }
  window.addEventListener('places-filter', e => showOnly(e.detail));

  // ── Build popup HTML ──
  function makePopup(act) {
    const ids = Array.isArray(act.person) ? act.person : [act.person];
    const crewBadges = ids.map(id => {
      if (id === 'ai') return `<span class="map-popup-badge">✨ AI Pick</span>`;
      const m = C.getCrewById(id);
      return m
        ? `<span class="map-popup-badge"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${m.color};margin-right:4px"></span>${m.name}</span>`
        : `<span class="map-popup-badge">${id}</span>`;
    }).join('');
    const costStr = act.estimatedCost > 0 ? `¥${act.estimatedCost.toLocaleString()}` : 'Free';
    const mapsUrl = `https://www.google.com/maps/search/${encodeURIComponent(act.mapsQuery || act.name + ' ' + act.address)}`;
    const bookBadge = act.status === 'booked'
      ? '<span class="map-popup-badge" style="background:rgba(45,106,79,0.12);color:#2d6a4f">✅ Booked</span>'
      : act.status === 'lottery'
      ? '<span class="map-popup-badge" style="background:rgba(234,139,55,0.12);color:#b45309">⏳ Lottery</span>'
      : act.bookingRequired === true
      ? '<span class="map-popup-badge" style="background:rgba(196,30,58,0.1);color:#c41e3a">Book ahead</span>' : '';
    const dayBadge = typeof act.dayAssigned === 'number'
      ? `<span class="map-popup-badge">📅 Day ${act.dayAssigned}</span>`
      : act.dayAssigned === 'flex' ? '<span class="map-popup-badge">Flex</span>' : '<span class="map-popup-badge" style="color:var(--muted)">Not scheduled</span>';

    return `<div class="map-popup">
      <div class="map-popup-name">${act.name}</div>
      <div class="map-popup-type">${act.type} · ${costStr}</div>
      <div class="map-popup-badges">
        ${dayBadge}
        ${crewBadges}
        ${bookBadge}
      </div>
      <div class="map-popup-links">
        <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" class="map-popup-link maps-link">📍 Maps</a>
        ${act.url ? `<a href="${act.url}" target="_blank" rel="noopener noreferrer" class="map-popup-link">🔗 Site</a>` : ''}
      </div>
    </div>`;
  }

  // ── Filter and re-render markers ──
  function personIdsM(act) { return Array.isArray(act.person) ? act.person : [act.person]; }

  function applyFilters() {
    const acts = (typeof TRIP_DATA !== 'undefined') ? TRIP_DATA.activities : [];
    const ctrl = document.getElementById('map-controls');
    const activeCrew = ctrl && ctrl._getActiveCrew ? ctrl._getActiveCrew() : 'all';
    const showOther  = ctrl && ctrl._getShowOther  ? ctrl._getShowOther()  : false;
    const schedOnly  = ctrl && ctrl._getSchedOnly  ? ctrl._getSchedOnly()  : false;
    if (ctrl && ctrl._updateFilterCount) ctrl._updateFilterCount();

    allMarkers.forEach(({ marker, act }) => {
      const otherMatch = showOther || act.city !== 'other';
      const cityMatch = activeCity === 'all' || act.city === activeCity;
      const catMatch  = activeCat  === 'all' || act.category === activeCat;
      const crewMatch = activeCrew === 'all' || personIdsM(act).includes(activeCrew);
      const schedMatch = !schedOnly || typeof act.dayAssigned === 'number';
      const show = otherMatch && cityMatch && catMatch && crewMatch && schedMatch && COORDS[act.id];
      if (show) marker.addTo(leafletMap);
      else leafletMap.removeLayer(marker);
    });

    homeMarkers.forEach(h => {
      if (activeCity === 'all' || activeCity === h.city) h.marker.addTo(leafletMap);
      else leafletMap.removeLayer(h.marker);
    });

    // Update list
    const visibleActs = acts.filter(a =>
      (showOther || a.city !== 'other') &&
      (activeCity === 'all' || a.city === activeCity) &&
      (activeCat  === 'all' || a.category === activeCat) &&
      (activeCrew === 'all' || personIdsM(a).includes(activeCrew)) &&
      (!schedOnly || typeof a.dayAssigned === 'number') &&
      COORDS[a.id]
    );
    buildList(visibleActs);

    // If "Other Regions" is on and no specific city filter is active,
    // widen the view to fit everything currently visible (Tokyo pins + far-flung ones)
    if (showOther && activeCity === 'all') {
      const visibleCoords = visibleActs.map(a => COORDS[a.id]).filter(Boolean);
      if (visibleCoords.length > 1) {
        leafletMap.fitBounds(L.latLngBounds(visibleCoords), { padding: [30, 30] });
      }
      return;
    }

    // Pan to city if filtered
    if (activeCity !== 'all') {
      const city = C.getCityById(activeCity);
      if (city) leafletMap.setView([city.coordinates.lat, city.coordinates.lng], 13, { animate: true });
    } else {
      const pts = visibleActs.filter(a => a.city !== 'other').map(a => COORDS[a.id]).concat(HOMES.map(h => h.coords));
      if (pts.length > 1) leafletMap.fitBounds(L.latLngBounds(pts), { padding: [30, 30] });
    }
  }

  // ── Controls ──
  function buildControls() {
    const ctrl = document.getElementById('map-controls');
    if (!ctrl) return;

    const CITY_BTNS = [
      { id:'all',   label:'All',   color:'#0a0a0a', dot:null },
      { id:'tokyo', label:'Tokyo', color:'#c41e3a', dot:'#c41e3a' },
      { id:'kyoto', label:'Kyoto', color:'#d4af37', dot:'#d4af37' },
      { id:'osaka', label:'Osaka', color:'#ea8b37', dot:'#ea8b37' },
    ];

    const CAT_BTNS = [
      { id:'all',           label:'All Types' },
      { id:'temple',        label:'⛩️ Temples'  },
      { id:'food',          label:'🍜 Food'      },
      { id:'cafe',          label:'☕ Cafes'     },
      { id:'bar',           label:'🍺 Bars'      },
      { id:'shopping',      label:'🛍️ Shopping' },
      { id:'entertainment', label:'🎮 Entertainment' },
      { id:'nature',        label:'🏔️ Nature'   },
      { id:'arcade',        label:'🕹️ Arcades'  },
      { id:'museum',        label:'🏛️ Museums'  },
      { id:'landmark',      label:'🗼 Landmarks' },
      { id:'themepark',     label:'🎡 Theme Parks' },
    ];

    // City buttons
    CITY_BTNS.forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'map-ctrl-btn' + (b.id === 'all' ? ' active' : '');
      btn.dataset.filter = 'city';
      btn.dataset.value  = b.id;
      btn.innerHTML = b.dot
        ? `<span style="width:7px;height:7px;border-radius:50%;background:${b.dot};display:inline-block;flex-shrink:0"></span>${b.label}`
        : b.label;
      if (b.id === 'all') { btn.style.background = '#0a0a0a'; btn.style.color = '#fff'; btn.style.borderColor = 'transparent'; }
      btn.addEventListener('click', () => {
        activeCity = b.id;
        ctrl.querySelectorAll('[data-filter="city"]').forEach(x => {
          x.classList.remove('active');
          x.style.background = ''; x.style.color = ''; x.style.borderColor = '';
        });
        btn.classList.add('active');
        btn.style.background = b.color; btn.style.color = '#fff'; btn.style.borderColor = 'transparent';
        applyFilters();
      });
      ctrl.appendChild(btn);
    });

    // Itinerary-only toggle (default ON) and the Filters fold-out
    let schedOnly = true;
    let showOther = false;
    const schedBtn = document.createElement('button');
    schedBtn.className = 'map-ctrl-btn map-ctrl-toggle on';
    schedBtn.dataset.filter = 'sched';
    schedBtn.innerHTML = `<span class="map-ctrl-toggle-track"><span class="map-ctrl-toggle-thumb"></span></span>📅 On itinerary`;
    schedBtn.addEventListener('click', () => {
      schedOnly = !schedOnly;
      schedBtn.classList.toggle('on', schedOnly);
      applyFilters();
    });
    ctrl.appendChild(schedBtn);
    ctrl._getSchedOnly = () => schedOnly;

    const moreBtn = document.createElement('button');
    moreBtn.className = 'map-ctrl-btn map-more-btn';
    moreBtn.innerHTML = '⚙️ Filters';
    ctrl.appendChild(moreBtn);
    const more = document.createElement('div');
    more.className = 'map-more';
    ctrl.parentNode.insertBefore(more, ctrl.nextSibling);
    moreBtn.addEventListener('click', () => {
      const open = more.classList.toggle('open');
      moreBtn.classList.toggle('active', open);
      setTimeout(() => leafletMap && leafletMap.invalidateSize(), 50);
    });
    ctrl._updateFilterCount = () => {
      const n = (activeCrew !== 'all') + (activeCat !== 'all') + (showOther ? 1 : 0);
      moreBtn.innerHTML = n ? `⚙️ Filters · ${n}` : '⚙️ Filters';
    };
    const rowCrew = document.createElement('div'); rowCrew.className = 'map-more-row';
    rowCrew.innerHTML = '<span class="map-more-label">Who</span>';
    const rowCat = document.createElement('div'); rowCat.className = 'map-more-row';
    rowCat.innerHTML = '<span class="map-more-label">Type</span>';
    const rowOther = document.createElement('div'); rowOther.className = 'map-more-row';
    more.append(rowCrew, rowCat, rowOther);

    // Crew buttons
    let activeCrew = 'all';
    const crewAllBtn = document.createElement('button');
    crewAllBtn.className = 'map-ctrl-btn active';
    crewAllBtn.dataset.filter = 'crew';
    crewAllBtn.dataset.value  = 'all';
    crewAllBtn.textContent = 'Everyone';
    crewAllBtn.style.cssText = 'background:#0a0a0a;color:#fff;border-color:transparent';
    crewAllBtn.addEventListener('click', () => {
      activeCrew = 'all';
      more.querySelectorAll('[data-filter="crew"]').forEach(x => { x.classList.remove('active'); x.style.background=''; x.style.color=''; x.style.borderColor=''; });
      crewAllBtn.classList.add('active'); crewAllBtn.style.cssText='background:#0a0a0a;color:#fff;border-color:transparent';
      applyFilters();
    });
    rowCrew.appendChild(crewAllBtn);

    C.crew.filter(m => (typeof TRIP_DATA !== 'undefined') && TRIP_DATA.activities.some(a => personIdsM(a).includes(m.id) && COORDS[a.id])).forEach(member => {
      const btn = document.createElement('button');
      btn.className = 'map-ctrl-btn';
      btn.dataset.filter = 'crew';
      btn.dataset.value  = member.id;
      btn.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:${member.color};display:inline-block;flex-shrink:0"></span>${member.name}`;
      btn.addEventListener('click', () => {
        activeCrew = member.id;
        more.querySelectorAll('[data-filter="crew"]').forEach(x => { x.classList.remove('active'); x.style.background=''; x.style.color=''; x.style.borderColor=''; });
        btn.classList.add('active'); btn.style.background=member.color; btn.style.color='#fff'; btn.style.borderColor='transparent';
        applyFilters();
      });
      rowCrew.appendChild(btn);
    });

    // Expose activeCrew so applyFilters can read it
    ctrl._getActiveCrew = () => activeCrew;

    // Category buttons
    CAT_BTNS.forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'map-ctrl-btn' + (b.id === 'all' ? ' active' : '');
      btn.dataset.filter = 'cat';
      btn.dataset.value  = b.id;
      btn.textContent = b.label;
      if (b.id === 'all') { btn.style.background = '#0a0a0a'; btn.style.color = '#fff'; btn.style.borderColor = 'transparent'; }
      btn.addEventListener('click', () => {
        activeCat = b.id;
        more.querySelectorAll('[data-filter="cat"]').forEach(x => {
          x.classList.remove('active');
          x.style.background = ''; x.style.color = ''; x.style.borderColor = '';
        });
        btn.classList.add('active');
        btn.style.background = '#0a0a0a'; btn.style.color = '#fff'; btn.style.borderColor = 'transparent';
        applyFilters();
      });
      rowCat.appendChild(btn);
    });

    // ── Other Regions toggle (default OFF) ──

    const otherBtn = document.createElement('button');
    otherBtn.className = 'map-ctrl-btn map-ctrl-toggle';
    otherBtn.dataset.filter = 'other';
    otherBtn.innerHTML = `<span class="map-ctrl-toggle-track"><span class="map-ctrl-toggle-thumb"></span></span>🗺️ Other Regions`;
    otherBtn.addEventListener('click', () => {
      showOther = !showOther;
      otherBtn.classList.toggle('on', showOther);
      applyFilters();
    });
    rowOther.appendChild(otherBtn);
    ctrl._getShowOther = () => showOther;
  }

  // ── List below map ──
  function buildList(acts) {
    const list = document.getElementById('map-list');
    if (!list) return;
    list.innerHTML = '';
    if (!acts.length) {
      list.innerHTML = '<div style="padding:16px;font-size:13px;color:var(--muted);text-align:center">No activities match current filters</div>';
      return;
    }
    const header = document.createElement('button');
    header.className = 'map-list-toggle';
    const isOpen = list.classList.contains('open');
    header.innerHTML = `<span>📋 ${isOpen ? 'Hide' : 'Show'} list · ${acts.length} place${acts.length !== 1 ? 's' : ''}</span><span class="map-list-chev">▾</span>`;
    header.addEventListener('click', () => {
      const open = list.classList.toggle('open');
      header.firstElementChild.textContent = `📋 ${open ? 'Hide' : 'Show'} list · ${acts.length} place${acts.length !== 1 ? 's' : ''}`;
    });
    list.appendChild(header);

    // Group by city
    const cityOrder = ['tokyo', 'kyoto', 'osaka', 'other'];
    const grouped = {};
    acts.forEach(a => { if (!grouped[a.city]) grouped[a.city] = []; grouped[a.city].push(a); });

    cityOrder.forEach(cityId => {
      const group = grouped[cityId];
      if (!group || !group.length) return;
      const city = C.getCityById(cityId);
      const isOther = cityId === 'other';
      if (!city && !isOther) return;

      // City sub-header (only in 'all' view)
      if (activeCity === 'all') {
        const ch = document.createElement('div');
        if (isOther) {
          ch.style.cssText = `font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#8a8278;padding:10px 0 4px;margin-top:4px`;
          ch.textContent = `🗺️ Other Regions`;
        } else {
          ch.style.cssText = `font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:${city.color};padding:10px 0 4px;margin-top:4px`;
          ch.textContent = `${city.emoji} ${city.name}`;
        }
        list.appendChild(ch);
      }

      group.forEach(act => {
        const item = document.createElement('div');
        item.className = 'map-list-item';
        const dotColor = C.getCrewColor(personIdsM(act)[0]);
        item.innerHTML = `
          <div class="map-list-dot" style="background:${dotColor}"></div>
          <div class="map-list-name">${act.name}</div>
          <div class="map-list-cat">${CAT_EMOJI[act.category] || '📍'}</div>`;
        item.addEventListener('click', () => {
          const found = allMarkers.find(m => m.act.id === act.id);
          if (!found) return;
          leafletMap.setView(found.marker.getLatLng(), 16, { animate: true });
          // Open the marker popup
          if (found) found.marker.openPopup();
          // Scroll to map
          document.getElementById('map-container').scrollIntoView({ behavior:'smooth', block:'start' });
        });
        list.appendChild(item);
      });
    });
  }

  // ── Init map ──
  function initMap() {
    if (mapBuilt) return;
    mapBuilt = true;

    buildControls();

    // Use requestAnimationFrame to guarantee the tab panel is fully painted
    // and has real dimensions before Leaflet initialises
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        leafletMap = L.map('map-container', {
          center: [35.6762, 139.6503],
          zoom: 12,
          zoomControl: true,
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
          maxZoom: 19,
        }).addTo(leafletMap);

        // Add markers for all activities with known coords
        const acts = (typeof TRIP_DATA !== 'undefined') ? TRIP_DATA.activities : [];
        const placed = spreadCoords(acts);
        acts.forEach(act => {
          const coords = placed[act.id];
          if (!coords) return;
          const color = C.getCrewColor(personIdsM(act)[0]);
          const emoji = CAT_EMOJI[act.category] || '📍';
          const marker = L.marker(coords, { icon: makeIcon(color, emoji) });
          marker.bindPopup(makePopup(act), { maxWidth: 260 });
          if (act.city !== 'other') marker.addTo(leafletMap);   // Other Regions toggle starts OFF
          allMarkers.push({ marker, act });
        });
        addHomes();

        buildList(acts.filter(a => COORDS[a.id] && a.city !== 'other'));
        const startPts = acts.filter(a => COORDS[a.id] && a.city !== 'other').map(a => COORDS[a.id]).concat(HOMES.map(h => h.coords));
        leafletMap.fitBounds(L.latLngBounds(startPts), { padding: [30, 30] });
        if (window.__placesFiltered) showOnly(window.__placesFiltered); else applyFilters();

        leafletMap.invalidateSize();
        setTimeout(() => leafletMap.invalidateSize(), 200);
      });
    });
  }

  // Called by the Places tab when the Map view is shown (the container must be visible to measure)
  window.initPlacesMap = () => {
    if (!mapBuilt) requestAnimationFrame(() => requestAnimationFrame(initMap));
    else requestAnimationFrame(() => requestAnimationFrame(() => leafletMap && leafletMap.invalidateSize()));
  };

})();
</script>
</body>
</html>
