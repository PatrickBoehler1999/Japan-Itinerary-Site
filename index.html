<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Japan 2027</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       RESET & BASE
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:        #0a0a0a;
      --white:      #ffffff;
      --paper:      #f5f2ee;
      --light:      #e8e3dc;
      --muted:      #8a8278;
      --subtle:     #c4bfb8;
      --red:        #c41e3a;
      --gold:       #d4af37;
      --amber:      #ea8b37;
      --indigo:     #3730a3;
      --forest:     #2d6a4f;
      --teal:       #0e7490;
      --brown:      #b45309;

      --serif:      'Shippori Mincho', serif;
      --sans:       'DM Sans', sans-serif;

      --nav-h:      56px;
      --max-w:      680px;
      --radius:     12px;
      --radius-sm:  6px;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      overflow-y: scroll;
    }

    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ============================================================
       NAVIGATION
    ============================================================ */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: rgba(10,10,10,0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .nav-inner::-webkit-scrollbar { display: none; }

    .nav-wordmark {
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: 0.02em;
      white-space: nowrap;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .nav-wordmark span { color: var(--gold); }

    .nav-sep {
      width: 1px;
      height: 18px;
      background: rgba(255,255,255,0.15);
      margin: 0 8px;
      flex-shrink: 0;
    }

    .nav-tab {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s, background 0.2s;
      border: none;
      background: none;
      flex-shrink: 0;
      text-decoration: none;
      display: block;
    }
    .nav-tab:hover { color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.06); }
    .nav-tab.active {
      color: var(--white);
      background: rgba(255,255,255,0.1);
    }
    .nav-tab.disabled {
      opacity: 0.3;
      cursor: default;
      pointer-events: none;
    }

    /* ============================================================
       PAGE LAYOUT
    ============================================================ */
    .page {
      padding-top: var(--nav-h);
      min-height: 100dvh;
    }

    .tab-panel {
      display: none;
    }
    .tab-panel.active {
      display: block;
    }

    /* ============================================================
       HERO
    ============================================================ */
    .hero {
      position: relative;
      background: var(--ink);
      overflow: hidden;
      padding: 56px 20px 48px;
      text-align: center;
    }

    /* Diagonal stripe texture */
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          -45deg,
          transparent,
          transparent 28px,
          rgba(255,255,255,0.018) 28px,
          rgba(255,255,255,0.018) 29px
        );
      pointer-events: none;
    }

    /* Radial glow behind title */
    .hero::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 320px; height: 200px;
      background: radial-gradient(ellipse, rgba(196,30,58,0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      max-width: var(--max-w);
      margin: 0 auto;
    }

    .hero-eyebrow {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeUp 0.6s 0.1s ease forwards;
    }

    .hero-title {
      font-family: var(--serif);
      font-size: clamp(52px, 14vw, 88px);
      font-weight: 800;
      color: var(--white);
      line-height: 0.95;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      opacity: 0;
      animation: fadeUp 0.6s 0.2s ease forwards;
    }

    .hero-kanji {
      font-family: var(--serif);
      font-size: clamp(14px, 3.5vw, 22px);
      font-weight: 400;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.22em;
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 0.6s 0.3s ease forwards;
    }

    .hero-tagline {
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 300;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.05em;
      margin-bottom: 36px;
      opacity: 0;
      animation: fadeUp 0.6s 0.35s ease forwards;
    }

    /* Countdown */
    .countdown {
      display: inline-flex;
      gap: 2px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 16px 20px;
      opacity: 0;
      animation: fadeUp 0.6s 0.45s ease forwards;
    }

    .cd-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 52px;
      padding: 0 8px;
    }
    .cd-unit + .cd-unit {
      border-left: 1px solid rgba(255,255,255,0.1);
    }

    .cd-num {
      font-family: var(--serif);
      font-size: clamp(24px, 6vw, 36px);
      font-weight: 700;
      color: var(--white);
      line-height: 1;
      margin-bottom: 4px;
      font-variant-numeric: tabular-nums;
    }

    .cd-label {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
    }

    .cd-sep {
      font-family: var(--serif);
      font-size: 28px;
      color: rgba(255,255,255,0.2);
      align-self: center;
      line-height: 1;
      padding-bottom: 16px;
    }

    /* ============================================================
       CITY STRIP
    ============================================================ */
    .city-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .city-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 8px 12px;
      background: var(--ink);
      transition: background 0.2s;
      cursor: default;
      gap: 4px;
    }

    .city-chip:not(:last-child) {
      border-right: 1px solid rgba(255,255,255,0.08);
    }

    .city-chip-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      margin-bottom: 2px;
    }

    .city-chip-name {
      font-family: var(--serif);
      font-size: 13px;
      font-weight: 600;
      color: var(--white);
      letter-spacing: 0.02em;
    }

    .city-chip-meta {
      font-size: 10px;
      font-weight: 400;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.04em;
    }

    /* ============================================================
       CONTENT SECTIONS
    ============================================================ */
    .content {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 16px 80px;
    }

    .section {
      margin-top: 36px;
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--light);
    }

    /* ============================================================
       TRIP STATS BAR
    ============================================================ */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid var(--light);
      overflow: hidden;
    }

    .stat {
      padding: 16px 10px;
      text-align: center;
      border-right: 1px solid var(--light);
    }
    .stat:last-child { border-right: none; }

    .stat-num {
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1;
      margin-bottom: 3px;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ============================================================
       CITY CARDS
    ============================================================ */
    .city-cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .city-card {
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid var(--light);
      overflow: hidden;
      display: grid;
      grid-template-columns: 5px 1fr;
    }

    .city-card-accent {
      /* color set inline */
    }

    .city-card-body {
      padding: 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .city-card-emoji {
      font-size: 28px;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .city-card-info { flex: 1; min-width: 0; }

    .city-card-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .city-card-name {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1;
    }

    .city-card-kanji {
      font-family: var(--serif);
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
    }

    .city-card-dates {
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .city-card-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .pill {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 20px;
      background: var(--paper);
      color: var(--muted);
      border: 1px solid var(--light);
      white-space: nowrap;
    }

    .city-card-transport {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--muted);
      margin-top: 10px;
    }

    .city-card-nights {
      font-family: var(--serif);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      flex-shrink: 0;
      text-align: right;
      padding-top: 2px;
    }

    .city-card-nights span {
      display: block;
      font-family: var(--sans);
      font-size: 10px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ============================================================
       CREW CARDS
    ============================================================ */
    .crew-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (min-width: 480px) {
      .crew-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .crew-card {
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid var(--light);
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .crew-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      /* color set inline */
    }

    .crew-card-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .crew-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .crew-name {
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.1;
    }

    .crew-kanji {
      font-family: var(--serif);
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
    }

    .crew-role {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      line-height: 1.3;
    }

    .crew-exp-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 3px 7px;
      border-radius: 4px;
      margin-top: 2px;
    }

    .crew-activity-bar {
      margin-top: 4px;
    }

    .crew-activity-label {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .crew-bar-track {
      height: 4px;
      background: var(--light);
      border-radius: 2px;
      overflow: hidden;
    }

    .crew-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 1s 0.5s ease;
    }

    /* ============================================================
       TIMELINE / DATE OVERVIEW
    ============================================================ */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .timeline-row {
      display: grid;
      grid-template-columns: 60px 1fr;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--light);
      align-items: center;
    }
    .timeline-row:last-child { border-bottom: none; }

    .timeline-date {
      text-align: right;
    }
    .timeline-date-day {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1;
    }
    .timeline-date-month {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .timeline-body {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .timeline-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .timeline-info {}
    .timeline-city {
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
    }
    .timeline-detail {
      font-size: 12px;
      color: var(--muted);
    }

    /* ============================================================
       TRIP NOTES / QUICK FACTS
    ============================================================ */
    .facts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .fact-card {
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid var(--light);
      padding: 14px;
    }

    .fact-icon {
      font-size: 20px;
      margin-bottom: 6px;
    }

    .fact-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .fact-value {
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.3;
    }

    .fact-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ============================================================
       BOOKING ALERT
    ============================================================ */
    .alert {
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid var(--light);
      border-left: 4px solid var(--red);
      padding: 16px;
      display: flex;
      gap: 12px;
    }

    .alert-icon { font-size: 20px; flex-shrink: 0; }

    .alert-title {
      font-family: var(--serif);
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .alert-body {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .alert-date {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      color: var(--red);
      background: rgba(196,30,58,0.08);
      padding: 2px 7px;
      border-radius: 4px;
      margin-top: 6px;
    }

    /* ============================================================
       COMING SOON PANELS
    ============================================================ */
    .soon-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      text-align: center;
    }
    .soon-panel .soon-emoji { font-size: 48px; margin-bottom: 16px; }
    .soon-panel .soon-title {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .soon-panel .soon-sub {
      font-size: 14px;
      color: var(--muted);
    }

    /* ============================================================
       FOOTER
    ============================================================ */
    .footer {
      text-align: center;
      padding: 24px 16px 32px;
      border-top: 1px solid var(--light);
      font-size: 11px;
      color: var(--subtle);
      font-family: var(--sans);
      letter-spacing: 0.04em;
    }

    /* ============================================================
       ANIMATIONS
    ============================================================ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ============================================================
       PC / WIDER LAYOUT
    ============================================================ */
    @media (min-width: 768px) {
      :root { --max-w: 740px; }

      .hero { padding: 72px 24px 60px; }
      .hero-title { letter-spacing: -0.03em; }

      .content { padding: 0 24px 100px; }

      .facts-grid { grid-template-columns: repeat(4, 1fr); }

      .city-strip { grid-template-columns: repeat(3, 1fr); }

      .nav-wordmark { font-size: 16px; }
      .nav-tab { font-size: 11.5px; padding: 6px 12px; }

      .stat-num { font-size: 30px; }
    }

    @media (min-width: 1024px) {
      :root { --max-w: 800px; --nav-h: 60px; }

      .nav-wordmark { margin-right: 16px; }
      .nav-tab { font-size: 12px; padding: 7px 14px; }

      .city-cards { display: grid; grid-template-columns: 1fr; }

      .content { padding: 0 32px 100px; }
    }

    /* ============================================================
       ACTIVITIES TAB
    ============================================================ */
    .acts-search-bar {
      position: sticky; top: var(--nav-h); z-index: 50;
      background: var(--paper); padding: 10px 16px;
      border-bottom: 1px solid var(--light);
    }
    .acts-search-inner {
      display: flex; align-items: center; gap: 8px;
      background: var(--white); border: 1.5px solid var(--light);
      border-radius: 10px; padding: 0 12px;
      max-width: var(--max-w); margin: 0 auto;
      transition: border-color 0.15s;
    }
    .acts-search-inner:focus-within { border-color: var(--muted); }
    .acts-search-icon { font-size: 14px; flex-shrink: 0; }
    .acts-search-input {
      flex: 1; border: none; background: transparent;
      font-family: var(--sans); font-size: 14px; color: var(--ink);
      padding: 10px 0; outline: none; min-width: 0;
    }
    .acts-search-input::placeholder { color: var(--subtle); }
    .acts-search-clear {
      background: none; border: none; color: var(--subtle);
      font-size: 13px; cursor: pointer; padding: 4px;
      line-height: 1; display: none;
    }
    .acts-search-clear.visible { display: block; }

    .acts-filters-wrap {
      background: var(--paper); border-bottom: 1px solid var(--light);
      padding: 8px 16px 10px; display: flex; flex-direction: column; gap: 6px;
    }
    .acts-filter-row {
      display: flex; gap: 5px; overflow-x: auto;
      scrollbar-width: none; padding-bottom: 2px; align-items: center;
    }
    .acts-filter-row::-webkit-scrollbar { display: none; }
    .acts-filter-label {
      font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted);
      flex-shrink: 0; min-width: 52px; padding-top: 1px;
    }
    .acts-filter-btn {
      font-size: 11px; font-weight: 500; padding: 4px 10px;
      border-radius: 20px; border: 1.5px solid var(--light);
      background: var(--white); color: var(--muted); cursor: pointer;
      white-space: nowrap; transition: all 0.15s; flex-shrink: 0;
      display: flex; align-items: center; gap: 4px;
    }
    .acts-filter-btn:hover { border-color: var(--subtle); color: var(--ink); }
    .acts-filter-btn.active { color: var(--white); border-color: transparent; }

    .acts-card-type { font-size: 11px; color: var(--muted); margin-bottom: 6px; }

    /* ============================================================
       CITIES TAB
    ============================================================ */

    }

      display: flex; flex-direction: column; align-items: center;

      font-family: var(--serif); font-size: clamp(38px, 10vw, 64px); font-weight: 800;

    .city-hero-kanji {
      font-family: var(--serif); font-size: 18px; font-weight: 400;

    .city-hero-stats { display: flex; gap: 16px; flex-wrap: wrap; }

      font-size: 12px; color: rgba(255,255,255,0.5);

    .city-content { max-width: var(--max-w); margin: 0 auto; padding: 0 16px 80px; }

    .glance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    @media (min-width: 768px) { .glance-grid { grid-template-columns: repeat(4, 1fr); } }
    .glance-card {
      background: var(--white); border: 1px solid var(--light);
      border-radius: var(--radius); padding: 14px 12px;
    }
    .glance-icon { font-size: 18px; margin-bottom: 5px; }
    .glance-label {
      font-size: 9px; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 2px;
    }

      font-family: var(--serif); font-size: 13px;
      font-weight: 700; color: var(--ink); line-height: 1.3;
    }
    .glance-sub { font-size: 10px; color: var(--muted); margin-top: 2px; }

    .area-pills { display: flex; flex-wrap: wrap; gap: 6px; }

      font-size: 12px; font-weight: 500; padding: 5px 12px;
      border-radius: 20px; background: var(--white);
      border: 1.5px solid var(--light); color: var(--ink); white-space: nowrap;
    }

    .day-mini-list { display: flex; flex-direction: column; gap: 6px; }

      background: var(--white); border: 1px solid var(--light);

      font-size: 8px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: rgba(255,255,255,0.65); line-height: 1;

      font-family: var(--serif); font-size: 18px;
      font-weight: 800; color: var(--white); line-height: 1;
    }
    .day-mini-theme {
      font-family: var(--serif); font-size: 13px; font-weight: 700;
      color: var(--ink); line-height: 1.2; margin-bottom: 3px;
    }
    .day-mini-meta { font-size: 11px; color: var(--muted); display: flex; gap: 10px; }

    .activity-rows {
      display: flex; flex-direction: column; gap: 0;
      background: var(--white); border: 1px solid var(--light);
      border-radius: var(--radius); overflow: hidden;
    }
    .activity-row {
      display: grid; grid-template-columns: 32px 1fr;
      gap: 10px; align-items: start; padding: 11px 14px;
      border-bottom: 1px solid var(--light); transition: background 0.1s;
    }
    .activity-row:last-child { border-bottom: none; }
    .activity-row:hover { background: var(--paper); }
    .activity-row-ai { background: #eeecea; }
    .activity-row-ai:hover { background: #e6e3e0; }
    .act-row-body { min-width: 0; }
    .act-row-top {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 8px; margin-bottom: 3px;
    }
    .act-row-name { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.3; flex: 1; min-width: 0; }
    .act-row-sub { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .act-row-meta {
      font-size: 11px; color: var(--muted); flex: 1; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .act-row-cost {
      font-family: var(--serif); font-size: 11px;
      font-weight: 600; color: var(--muted); white-space: nowrap; flex-shrink: 0;
    }
    .act-row-note {
      font-size: 11px; color: var(--muted); font-style: italic;
      margin-bottom: 5px; line-height: 1.4;
    }
    .act-row-footer { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .act-day-link {
      font-size: 10px; font-weight: 600; letter-spacing: 0.05em;
      padding: 2px 7px; border-radius: 4px; background: var(--paper);
      border: 1px solid var(--light); color: var(--muted); cursor: pointer;
      transition: all 0.15s; text-decoration: none; display: inline-block;
    }
    .act-day-link:hover { background: var(--light); color: var(--ink); }

    .act-cat-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .act-cat-btn {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 500; padding: 5px 10px;
      border-radius: 20px; border: 1.5px solid var(--light);
      background: var(--white); color: var(--muted); cursor: pointer;
      white-space: nowrap; transition: all 0.15s;
    }

    .practical-table {
      background: var(--white); border: 1px solid var(--light);
      border-radius: var(--radius); overflow: hidden;
    }
    .practical-row {
      display: grid; grid-template-columns: 100px 1fr; gap: 12px;
      padding: 11px 14px; border-bottom: 1px solid var(--light);
      align-items: start; font-size: 13px;
    }
    .practical-row:last-child { border-bottom: none; }
    .practical-key {
      font-size: 10px; font-weight: 600; letter-spacing: 0.08em;

    @media (min-width: 768px) {

      .acts-content { padding: 12px 32px 100px; }
      .acts-filters-wrap { padding: 8px 32px 10px; }
      .acts-search-bar { padding: 10px 32px; }

    /* ============================================================
       ITINERARY TAB
    ============================================================ */
    .itin-filters {
      position: sticky; top: var(--nav-h); z-index: 50;
      background: var(--paper); border-bottom: 1px solid var(--light);
      padding: 10px 16px; display: flex; gap: 6px;
      overflow-x: auto; scrollbar-width: none;
    }
    .itin-filters::-webkit-scrollbar { display: none; }

    .filter-btn {
      display: flex; align-items: center; gap: 5px;
      font-family: var(--sans); font-size: 12px; font-weight: 500;
      padding: 6px 12px; border-radius: 20px;
      border: 1.5px solid var(--light); background: var(--white);
      color: var(--muted); cursor: pointer; white-space: nowrap;
      transition: all 0.15s; flex-shrink: 0;
    }
    .filter-btn:hover { border-color: var(--subtle); color: var(--ink); }
    .filter-btn.active { color: var(--white); border-color: transparent; }
    .filter-btn .filter-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    .itin-content { max-width: var(--max-w); margin: 0 auto; padding: 0 16px 80px; }

    .itin-summary { background: var(--ink); padding: 16px; }
    .itin-summary-inner { max-width: var(--max-w); margin: 0 auto; display: flex; }
    .itin-sum-item { flex: 1; text-align: center; border-right: 1px solid rgba(255,255,255,0.1); padding: 0 8px; }
    .itin-sum-item:last-child { border-right: none; }
    .itin-sum-num { font-family: var(--serif); font-size: 20px; font-weight: 700; color: var(--white); line-height: 1; margin-bottom: 3px; }
    .itin-sum-label { font-size: 9px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.4); }

    .city-section-header {
      display: flex; align-items: baseline; gap: 10px;
      padding: 28px 0 16px; border-bottom: 2px solid; margin-bottom: 4px;
    }
    .city-section-name { font-family: var(--serif); font-size: 26px; font-weight: 800; line-height: 1; }
    .city-section-kanji { font-family: var(--serif); font-size: 16px; font-weight: 400; color: var(--muted); }
    .city-section-meta { margin-left: auto; font-size: 11px; font-weight: 500; letter-spacing: 0.07em; color: var(--muted); text-align: right; line-height: 1.4; }

    .day-card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--light); margin-top: 10px; overflow: hidden; transition: box-shadow 0.2s; }
    .day-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }

    .day-card-header { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }

    .day-num-block { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 10px; flex-shrink: 0; }
    .day-num-label { font-size: 9px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.65; line-height: 1; color: var(--white); }
    .day-num-value { font-family: var(--serif); font-size: 22px; font-weight: 800; line-height: 1; color: var(--white); }

    .day-theme { font-family: var(--serif); font-size: 15px; font-weight: 700; color: var(--ink); line-height: 1.2; margin-bottom: 4px; }
    .day-meta-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .day-meta-item { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); }
    .day-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }

    .day-badge.warn   { background: rgba(196,30,58,0.1);  color: #c41e3a; }
    .day-badge.transit{ background: rgba(20,184,166,0.1); color: #0d9488; }
    .day-badge.flex   { background: rgba(138,130,120,0.1);color: var(--muted); }

    .day-chevron { font-size: 14px; color: var(--subtle); transition: transform 0.25s; flex-shrink: 0; }

    .day-card-body { display: none; border-top: 1px solid var(--light); }

    .day-date-strip { padding: 8px 16px; font-size: 11px; font-weight: 500; letter-spacing: 0.07em; color: var(--muted); background: var(--paper); border-bottom: 1px solid var(--light); }

    .schedule-list { padding: 4px 0; }

    .schedule-item:hover { background: var(--paper); }

    .sched-emoji { font-size: 16px; line-height: 1.4; text-align: center; }

    .optional-section { padding: 10px 16px 12px; background: var(--paper); border-top: 1px solid var(--light); }

    @media (min-width: 768px) {
      .itin-content  { padding: 0 24px 100px; }
      .itin-filters  { padding: 10px 24px; }
      .itin-summary  { padding: 16px 24px; }
      .schedule-item { grid-template-columns: 96px 28px 1fr; }
    }
    @media (min-width: 1024px) {
      .itin-content  { padding: 0 32px 100px; }
      .itin-filters  { padding: 10px 32px; }
    }

    /* ============================================================
       BUDGET TAB
    ============================================================ */

    /* ── Hero ── */
    .budget-hero {
      background: var(--ink);
      padding: 28px 16px 24px;
      position: relative;
      overflow: hidden;
    }
    .budget-hero::before {
      content: '';
      position: absolute; inset: 0;
      background-image: repeating-linear-gradient(
        -45deg, transparent, transparent 22px,
        rgba(255,255,255,0.015) 22px, rgba(255,255,255,0.015) 23px
      );
      pointer-events: none;
    }
    .budget-hero-inner {
      position: relative; z-index: 1;
      max-width: var(--max-w); margin: 0 auto;
    }
    .budget-hero-label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.18em;
      text-transform: uppercase; color: rgba(255,255,255,0.4);
      margin-bottom: 6px;
    }
    .budget-hero-total {
      font-family: var(--serif); font-size: clamp(40px, 10vw, 64px);
      font-weight: 800; color: var(--white); line-height: 1;
      letter-spacing: -0.02em; margin-bottom: 6px;
    }
    .budget-hero-sub {
      font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 20px;
    }
    /* FX rate toggle */
    .budget-fx-row {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .budget-fx-label {
      font-size: 11px; color: rgba(255,255,255,0.4);
    }
    .budget-fx-toggle {
      display: flex; background: rgba(255,255,255,0.08);
      border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);
    }
    .budget-fx-btn {
      font-size: 11px; font-weight: 600; padding: 5px 12px;
      background: transparent; border: none; color: rgba(255,255,255,0.45);
      cursor: pointer; transition: all 0.15s;
    }
    .budget-fx-btn.active { background: rgba(255,255,255,0.15); color: var(--white); }

    /* ── Content ── */
    .budget-content {
      max-width: var(--max-w); margin: 0 auto; padding: 0 16px 80px;
    }

    /* ── Group stat bar ── */
    .budget-stats {
      display: grid; grid-template-columns: repeat(4, 1fr);
      background: var(--white); border: 1px solid var(--light);
      border-radius: var(--radius); overflow: hidden; margin-top: 20px;
    }
    .budget-stat {
      padding: 14px 10px; text-align: center;
      border-right: 1px solid var(--light);
    }
    .budget-stat:last-child { border-right: none; }
    .budget-stat-num {
      font-family: var(--serif); font-size: 22px; font-weight: 700;
      color: var(--ink); line-height: 1; margin-bottom: 3px;
    }
    .budget-stat-label {
      font-size: 10px; font-weight: 500; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted);
    }

    /* ── Per-person cards ── */
    .person-cards {
      display: flex; flex-direction: column; gap: 10px;
    }

    .person-card {
      background: var(--white); border: 1px solid var(--light);
      border-radius: var(--radius); overflow: hidden;
    }

    .person-card-header {
      display: grid; grid-template-columns: auto 1fr auto;
      align-items: center; gap: 12px; padding: 14px 16px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }

    .person-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }

    .person-card-info { min-width: 0; }
    .person-card-name {
      font-family: var(--serif); font-size: 16px; font-weight: 700;
      color: var(--ink); line-height: 1.1;
    }
    .person-card-role { font-size: 11px; color: var(--muted); margin-top: 1px; }

    .person-card-right { text-align: right; flex-shrink: 0; }
    .person-budget-total {
      font-family: var(--serif); font-size: 18px; font-weight: 700;
      color: var(--ink); line-height: 1;
    }
    .person-budget-sub { font-size: 10px; color: var(--muted); margin-top: 2px; }

    .person-card-chevron {
      font-size: 13px; color: var(--subtle);
      transition: transform 0.25s; margin-left: 6px;
    }
    .person-card.open .person-card-chevron { transform: rotate(180deg); }

    /* Progress bar under header */
    .person-progress-bar {
      height: 3px; background: var(--light);
    }
    .person-progress-fill {
      height: 100%; transition: width 0.8s ease;
    }

    /* Expanded body */
    .person-card-body { display: none; border-top: 1px solid var(--light); }
    .person-card.open .person-card-body { display: block; }

    /* Slider section */
    .budget-slider-section { padding: 16px; }

    .slider-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .slider-category {
      font-size: 12px; font-weight: 500; color: var(--ink);
      display: flex; align-items: center; gap: 6px;
    }
    .slider-cat-emoji { font-size: 14px; }
    .slider-amount {
      font-family: var(--serif); font-size: 13px; font-weight: 700;
      color: var(--ink); min-width: 60px; text-align: right;
    }

    .budget-slider {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 4px; border-radius: 2px;
      background: var(--light); outline: none;
      margin-bottom: 14px; cursor: pointer;
    }
    .budget-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--ink); cursor: pointer;
      border: 2px solid var(--white);
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      transition: transform 0.1s;
    }
    .budget-slider::-webkit-slider-thumb:active { transform: scale(1.2); }
    .budget-slider::-moz-range-thumb {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--ink); cursor: pointer; border: 2px solid var(--white);
    }

    .person-remaining {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; border-top: 1px solid var(--light);
      background: var(--paper);
    }
    .person-remaining-label { font-size: 12px; color: var(--muted); }
    .person-remaining-val {
      font-family: var(--serif); font-size: 15px; font-weight: 700;
      color: var(--ink);
    }
    .person-remaining-val.over { color: var(--red); }

    /* ── Cost by city ── */
    .city-cost-rows { display: flex; flex-direction: column; gap: 10px; }
    .city-cost-row {
      background: var(--white); border: 1px solid var(--light);
      border-radius: var(--radius); padding: 14px 16px;
      display: grid; grid-template-columns: 5px 1fr;
    }
    .city-cost-accent { border-radius: 3px; }
    .city-cost-body { padding-left: 12px; }
    .city-cost-top {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 8px;
    }
    .city-cost-name {
      font-family: var(--serif); font-size: 16px; font-weight: 700; color: var(--ink);
    }
    .city-cost-total {
      font-family: var(--serif); font-size: 15px; font-weight: 700; color: var(--ink);
    }
    .city-cost-bar-track {
      height: 6px; background: var(--light); border-radius: 3px; overflow: hidden; margin-bottom: 6px;
    }
    .city-cost-bar-fill { height: 100%; border-radius: 3px; transition: width 0.8s 0.3s ease; }
    .city-cost-meta { font-size: 11px; color: var(--muted); }

    /* ── Daily cost chart ── */
    .daily-chart {
      background: var(--white); border: 1px solid var(--light);
      border-radius: var(--radius); padding: 16px; overflow: hidden;
    }
    .daily-chart-bars {
      display: flex; align-items: flex-end; gap: 3px; height: 80px; margin-bottom: 6px;
    }
    .daily-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; justify-content: flex-end; }
    .daily-bar {
      width: 100%; border-radius: 3px 3px 0 0;
      transition: height 0.8s 0.2s ease, opacity 0.15s;
      cursor: pointer; min-height: 2px; flex-shrink: 0;
    }
    .daily-bar:hover { opacity: 0.75; }
    .daily-bar-label { font-size: 8px; color: var(--muted); }
    .daily-chart-tooltip {
      font-size: 11px; color: var(--muted); text-align: center;
      min-height: 18px; transition: opacity 0.15s;
    }

    /* ── Category breakdown ── */
    .cat-breakdown { display: flex; flex-direction: column; gap: 8px; }
    .cat-row {
      display: grid; grid-template-columns: 24px 1fr auto;
      gap: 10px; align-items: center;
    }
    .cat-emoji { font-size: 16px; text-align: center; }
    .cat-bar-wrap { }
    .cat-name { font-size: 12px; font-weight: 500; color: var(--ink); margin-bottom: 3px; }
    .cat-bar-track { height: 5px; background: var(--light); border-radius: 3px; overflow: hidden; }
    .cat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.8s 0.3s ease; }
    .cat-amount {
      font-family: var(--serif); font-size: 12px; font-weight: 700;
      color: var(--ink); text-align: right; white-space: nowrap;
    }

    /* ── Booking cost alert ── */
    .booking-costs {
      background: var(--white); border: 1px solid var(--light);
      border-radius: var(--radius); overflow: hidden;
    }
    .booking-cost-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 14px; border-bottom: 1px solid var(--light);
      font-size: 13px;
    }
    .booking-cost-row:last-child { border-bottom: none; }
    .booking-cost-name { color: var(--ink); font-weight: 500; }
    .booking-cost-meta { font-size: 11px; color: var(--muted); }
    .booking-cost-price {
      font-family: var(--serif); font-weight: 700;
      color: var(--ink); white-space: nowrap; text-align: right;
    }
    .booking-cost-badge {
      font-size: 9px; font-weight: 600; padding: 2px 6px; border-radius: 4px;
      background: rgba(196,30,58,0.1); color: #c41e3a;
    }

    @media (min-width: 768px) {
      .budget-hero    { padding: 36px 24px 28px; }
      .budget-content { padding: 0 24px 100px; }
      .person-cards   { display: grid; grid-template-columns: 1fr 1fr; }
    }
    @media (min-width: 1024px) {
      .budget-content { padding: 0 32px 100px; }
      .budget-hero    { padding: 40px 32px 32px; }
    }

    /* ── Activity card expanded detail ── */
    .acts-card-detail {
      display: none;
      padding: 10px 14px 12px;
      border-top: 1px solid var(--light);
      background: var(--paper);
      width: 100%;
      box-sizing: border-box;
    }
    .acts-card.expanded .acts-card-detail {
      display: block !important;
      width: 100%;
    }



    .acts-card-desc {
      display: block;
      font-size: 12px;
      line-height: 1.6;
      color: var(--ink);
      margin-bottom: 10px;
      white-space: normal;
      word-wrap: break-word;
      overflow-wrap: break-word;
      max-width: 100%;
    }
    .acts-card-links {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }
    .acts-card-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 6px;
      text-decoration: none;
      border: 1.5px solid var(--light);
      background: var(--white);
      color: var(--muted);
      transition: all 0.15s;
    }
    .acts-card-link:hover { border-color: var(--subtle); color: var(--ink); }
    .acts-card-link.maps {
      border-color: rgba(14,116,144,0.3);
      color: #0e7490;
      background: rgba(14,116,144,0.05);
    }
    .acts-card-link.maps:hover { background: rgba(14,116,144,0.1); }
    .acts-card-link.official {
      border-color: rgba(196,30,58,0.3);
      color: #c41e3a;
      background: rgba(196,30,58,0.05);
    }
    .acts-card-link.official:hover { background: rgba(196,30,58,0.1); }

    .acts-card-body { cursor: pointer; }
    .acts-card-expand-hint {
      font-size: 10px;
      color: var(--subtle);
      text-align: right;
      margin-top: 4px;
    }
    .acts-card.expanded .acts-card-expand-hint { display: none; }

    /* City tab row expand */
    .activity-row { cursor: pointer; }
    .act-row-detail {
      display: none;
      padding: 8px 14px 10px 52px;
      background: var(--paper);
    }
    .activity-row.expanded .act-row-detail { display: block; }
    .act-row-desc {
      font-size: 12px;
      line-height: 1.55;
      color: var(--ink);
      margin-bottom: 8px;
    }

    /* ============================================================
       LOGISTICS TAB
    ============================================================ */

    /* ── Section nav ── */
    .logi-nav {
      position: sticky;
      top: var(--nav-h);
      z-index: 50;
      background: var(--paper);
      border-bottom: 1px solid var(--light);
      padding: 10px 16px;
      display: flex;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .logi-nav::-webkit-scrollbar { display: none; }

    .logi-nav-btn {
      font-size: 11px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--light);
      background: var(--white);
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .logi-nav-btn:hover { border-color: var(--subtle); color: var(--ink); }
    .logi-nav-btn.active {
      background: var(--ink);
      border-color: transparent;
      color: var(--white);
    }

    /* ── Content area ── */
    .logi-content {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 16px 80px;
    }

    /* ── Section panels ── */
    .logi-section { display: none; }
    .logi-section.active { display: block; }

    /* ── Hero info card ── */
    .logi-hero-card {
      background: var(--ink);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 20px;
      position: relative;
      overflow: hidden;
    }
    .logi-hero-card::before {
      content: '';
      position: absolute; inset: 0;
      background-image: repeating-linear-gradient(
        -45deg, transparent, transparent 18px,
        rgba(255,255,255,0.015) 18px, rgba(255,255,255,0.015) 19px
      );
      pointer-events: none;
    }
    .logi-hero-inner { position: relative; z-index: 1; }
    .logi-hero-eyebrow {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 4px;
    }
    .logi-hero-title {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 800;
      color: var(--white);
      margin-bottom: 4px;
      line-height: 1.1;
    }
    .logi-hero-sub {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 14px;
    }
    .logi-hero-stats {
      display: flex;
      gap: 0;
    }
    .logi-hero-stat {
      flex: 1;
      text-align: center;
      border-right: 1px solid rgba(255,255,255,0.1);
      padding: 0 8px;
    }
    .logi-hero-stat:last-child { border-right: none; }
    .logi-hero-stat-num {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 700;
      color: var(--white);
      line-height: 1;
      margin-bottom: 3px;
    }
    .logi-hero-stat-label {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }

    /* ── Placeholder card (TBD) ── */
    .logi-placeholder {
      background: var(--white);
      border: 1.5px dashed var(--light);
      border-radius: var(--radius);
      padding: 20px 16px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logi-placeholder-icon { font-size: 22px; flex-shrink: 0; }
    .logi-placeholder-title {
      font-family: var(--serif);
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 2px;
    }
    .logi-placeholder-sub {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }
    .logi-placeholder-badge {
      margin-left: auto;
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(138,130,120,0.1);
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Info table (key-value rows) ── */
    .logi-table {
      background: var(--white);
      border: 1px solid var(--light);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .logi-row {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 10px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--light);
      font-size: 13px;
      align-items: start;
    }
    .logi-row:last-child { border-bottom: none; }
    .logi-key {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding-top: 1px;
    }
    .logi-val { color: var(--ink); line-height: 1.5; }
    .logi-val-muted { color: var(--muted); font-size: 12px; }

    /* ── Accommodation city cards ── */
    .accom-cards { display: flex; flex-direction: column; gap: 10px; }
    .accom-card {
      background: var(--white);
      border: 1px solid var(--light);
      border-radius: var(--radius);
      overflow: hidden;
      display: grid;
      grid-template-columns: 5px 1fr;
    }
    .accom-body { padding: 14px 16px; }
    .accom-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .accom-city-name {
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 800;
      color: var(--ink);
    }
    .accom-nights {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }
    .accom-dates {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .accom-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    .accom-status.tbd {
      background: rgba(138,130,120,0.1);
      color: var(--muted);
      border: 1.5px dashed var(--subtle);
    }
    .accom-status.booked {
      background: rgba(45,106,79,0.1);
      color: #2d6a4f;
    }
    .accom-areas {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }
    .accom-area-pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--paper);
      border: 1px solid var(--light);
      color: var(--muted);
    }
    .accom-note {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.4;
      font-style: italic;
    }

    /* ── Transport city blocks ── */
    .transport-city {
      background: var(--white);
      border: 1px solid var(--light);
      border-radius: var(--radius);
      overflow: hidden;
      display: grid;
      grid-template-columns: 5px 1fr;
      margin-bottom: 10px;
    }
    .transport-body { padding: 14px 16px; }
    .transport-city-name {
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 2px;
    }
    .transport-method {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 4px;
    }
    .transport-notes { font-size: 12px; color: var(--muted); line-height: 1.5; }

    /* ── Shinkansen route cards ── */
    .shin-cards { display: flex; flex-direction: column; gap: 8px; }
    .shin-card {
      background: var(--white);
      border: 1px solid var(--light);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .shin-route {
      flex: 1;
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
    }
    .shin-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .shin-cost {
      font-family: var(--serif);
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      text-align: right;
      flex-shrink: 0;
    }

    /* ── Critical dates timeline ── */
    .critical-list { display: flex; flex-direction: column; gap: 8px; }
    .critical-item {
      background: var(--white);
      border: 1px solid var(--light);
      border-radius: var(--radius);
      padding: 13px 14px;
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 12px;
      align-items: start;
    }
    .critical-item.is-critical {
      border-color: rgba(196,30,58,0.3);
      background: rgba(196,30,58,0.02);
    }
    .critical-date-block {
      text-align: center;
      background: var(--paper);
      border-radius: var(--radius-sm);
      padding: 6px 4px;
    }
    .critical-date-block.is-critical { background: rgba(196,30,58,0.08); }
    .critical-date-day {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1;
    }
    .critical-date-block.is-critical .critical-date-day { color: var(--red); }
    .critical-date-month {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .critical-label {
      font-family: var(--serif);
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 3px;
      line-height: 1.2;
    }
    .critical-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .critical-who {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .critical-alarm {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 600;
      color: var(--red);
      background: rgba(196,30,58,0.08);
      padding: 2px 7px;
      border-radius: 4px;
      margin-top: 5px;
    }

    /* ── Booking timeline ── */
    .timeline-phases { display: flex; flex-direction: column; gap: 10px; }
    .phase-card {
      background: var(--white);
      border: 1px solid var(--light);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .phase-header {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px 14px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .phase-num {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--white);
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 800;

      flex-shrink: 0;

    .phase-num.priority-medium   { background: var(--muted); }
    .phase-label {
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);

    .phase-window {
      font-size: 11px;

    .phase-body {
      display: none;

    .phase-task {

<script>
(function() {
  'use strict';

  const C = SITE_CONFIG;

  // ── TAB NAVIGATION ────────────────────────────────────────
  const TAB_LABELS = {
    overview:   'Overview',
    itinerary:  'Itinerary',
    cities:     'Cities',
    activities: 'Activities',
    map:        'Map',
    budget:     'Budget',
    logistics:  'Logistics'
  };

  function buildNav() {
    const nav = document.getElementById('nav-inner');
    const LIVE_TABS = new Set(['overview', 'itinerary', 'cities', 'activities', 'budget', 'logistics', 'map']);
    C.site.tabs.forEach(tabId => {
      const btn = document.createElement('button');
      const isLive = LIVE_TABS.has(tabId);
      btn.className = 'nav-tab' + (tabId === 'overview' ? ' active' : (isLive ? '' : ' disabled'));
      btn.textContent = TAB_LABELS[tabId];
      btn.dataset.tab = tabId;
      if (isLive) {
        btn.addEventListener('click', () => switchTab(tabId));
      } else {
        btn.title = 'Coming soon';
      }
      nav.appendChild(btn);
    });
  }

  function switchTab(tabId) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
    const panel = document.getElementById('tab-' + tabId);
    const btn   = document.querySelector(`.nav-tab[data-tab="${tabId}"]`);
    if (panel) panel.classList.add('active');
    if (btn)   btn.classList.add('active');
    window.scrollTo(0, 0);
  }

  // ── COUNTDOWN ─────────────────────────────────────────────
  function updateCountdown() {
    const target = new Date(C.trip.dates.departure + 'T00:00:00');
    const now    = new Date();
    const diff   = target - now;

    if (diff <= 0) {
      ['cd-days','cd-hours','cd-mins','cd-secs'].forEach(id => {
        document.getElementById(id).textContent = '0';
      });
      return;
    }

    const days  = Math.floor(diff / 864e5);
    const hours = Math.floor((diff % 864e5) / 36e5);
    const mins  = Math.floor((diff % 36e5)  / 6e4);
    const secs  = Math.floor((diff % 6e4)   / 1e3);

    document.getElementById('cd-days').textContent  = String(days);
    document.getElementById('cd-hours').textContent = String(hours).padStart(2,'0');
    document.getElementById('cd-mins').textContent  = String(mins).padStart(2,'0');
    document.getElementById('cd-secs').textContent  = String(secs).padStart(2,'0');
  }

  // ── CITY STRIP ─────────────────────────────────────────────
  function buildCityStrip() {
    const strip = document.getElementById('city-strip');
    C.cities.forEach(city => {
      const chip = document.createElement('div');
      chip.className = 'city-chip';
      chip.innerHTML = `
        <div class="city-chip-dot" style="background:${city.color}"></div>
        <div class="city-chip-name">${city.name}</div>
        <div class="city-chip-meta">${city.nights}N · ${city.dates}</div>
      `;
      strip.appendChild(chip);
    });
  }

  // ── STATS BAR ──────────────────────────────────────────────
  function buildStats() {
    const totalActivities = C.crew.reduce((sum, m) => sum + m.activityCount.total, 0);
    const stats = [
      { num: C.trip.dates.durationDays, label: 'Days' },
      { num: C.crew.length,             label: 'Crew' },

  // ── CREW CARDS ─────────────────────────────────────────────
  function buildCrewCards() {
    const container = document.getElementById('crew-grid');
    const maxActivities = Math.max(...C.crew.map(m => m.activityCount.total));

    C.crew.forEach(member => {
      const card = document.createElement('div');
      card.className = 'crew-card';

      const isVet = member.japanExp.toLowerCase().includes('veteran');
      const expBg   = isVet ? 'rgba(196,30,58,0.08)' : 'rgba(138,130,120,0.08)';
      const expColor = isVet ? '#c41e3a' : '#8a8278';
      const expLabel = isVet ? 'Japan Vet' : 'First Timer';

      const pct = maxActivities > 0
        ? Math.round((member.activityCount.total / maxActivities) * 100)
        : 0;

      card.style.cssText = `--member-color:${member.color}`;
      card.innerHTML = `
        <div class="crew-card-top">
          <div class="crew-avatar" style="background:${member.color}18">
            ${member.emoji}
          </div>
          <div>
            <div class="crew-name">${member.name}</div>
            <div class="crew-kanji">${member.kanji}</div>
          </div>
        </div>
        <div class="crew-role">${member.role}</div>
        <span class="crew-exp-badge" style="background:${expBg};color:${expColor}">${expLabel}</span>
        ${member.activityCount.total > 0 ? `
        <div class="crew-activity-bar">
          <div class="crew-activity-label">
            <span>Activities</span>
            <span>${member.activityCount.total}</span>
          </div>
          <div class="crew-bar-track">
            <div class="crew-bar-fill" style="width:0%;background:${member.color}" data-width="${pct}%"></div>
          </div>
        </div>
        ` : `<div class="crew-activity-label" style="font-size:11px;color:var(--muted);margin-top:4px">Vibes-only itinerary</div>`}
      `;

      // Add top border color
      const style = document.createElement('style');
      style.textContent = ''; // handled via ::before pseudo
      card.style.setProperty('--member-color', member.color);
      card.insertAdjacentHTML('afterbegin',
        `<div style="position:absolute;top:0;left:0;right:0;height:3px;background:${member.color};border-radius:12px 12px 0 0"></div>`
      );

      container.appendChild(card);
    });

    // Animate bars on scroll
    setTimeout(() => {
      document.querySelectorAll('.crew-bar-fill').forEach(bar => {
        bar.style.width = bar.dataset.width;
      });
    }, 600);
  }

  // ── SCROLL FADE-IN ─────────────────────────────────────────
  function initScrollFade() {
    const els = document.querySelectorAll('.fade-in');
    if (!('IntersectionObserver' in window)) {
      els.forEach(el => el.classList.add('visible'));
      return;
    }
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          obs.unobserve(e.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
    els.forEach(el => obs.observe(el));
  }

  // ── INIT ──────────────────────────────────────────────────
  function init() {
    buildNav();
    buildCityStrip();
    buildStats();
    buildAlert();
    buildCityCards();
    buildTimeline();
    buildFacts();
    buildCrewCards();
    initScrollFade();

    updateCountdown();
    setInterval(updateCountdown, 1000);
  }

  document.addEventListener('DOMContentLoaded', init);

})();
</script>
