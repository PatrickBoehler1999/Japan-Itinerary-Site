    {id:'matoi-gyoza',person:'conner',city:'kyoto',category:'food',type:'Gyoza Restaurant',name:'Motoi Gyoza',address:'Karasuma, Kyoto',status:'researching',priority:'pending',estimatedCost:1500,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A small, well-reviewed gyoza shop in the Karasuma area of Kyoto. Likely what was meant by the original "Matoi Gyoza" note — no venue by that exact name could be found, but Motoi Gyoza is a close match worth confirming.`,mapsQuery:'Motoi Gyoza Karasuma Kyoto',notes:`Not on the itinerary. Name may be wrong (Matoi vs. Motoi) — check with Conner. Small, walk-in only.`,url:null},
    {id:'chao-chao-gyoza',person:'conner',city:'kyoto',category:'food',type:'Gyoza Restaurant',name:'Chao Chao Gyoza',address:'Kiyamachi, Nakagyo, Kyoto',status:'researching',priority:'pending',estimatedCost:1500,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:8,groupActivity:false,description:`A popular Kyoto gyoza chain known for large, thin-skinned dumplings and a lively, casual izakaya atmosphere. Well known enough to have a regular queue on weekend evenings.`,mapsQuery:'Chao Chao Gyoza Kyoto',notes:`~20 seats, no reservations — expect to split. Kiyamachi, near Pontocho.`,url:null},
    {id:'weekenders-coffee',person:'conner',city:'kyoto',category:'cafe',type:'Specialty Coffee Stall',name:'Weekenders Coffee',address:'Kyoto (Kofukucho, Nakagyo — Tominokoji location)',status:'researching',priority:'pending',estimatedCost:600,estimatedDuration:'20–30 mins',bookingRequired:false,dayAssigned:10,groupActivity:false,description:`A tiny, stand-only specialty coffee stall tucked into a courtyard — no seating, just a window and a bench outside. Considered one of Kyoto's best pourover coffees by serious coffee people, run with an intense, minimalist focus on the beans.`,mapsQuery:'Weekenders Coffee Kyoto',notes:`Stand-up window only — grab and go. Just off Tominokoji.`,url:null},
    {id:'tower-knives-osaka',person:'conner',city:'osaka',category:'shopping',type:'Knife Specialty Shop',name:'Tower Knives Osaka',address:'Shinsekai, Naniwa, Osaka',status:'researching',priority:'pending',estimatedCost:15000,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:13,groupActivity:false,description:`An English-friendly specialty knife shop near Tsutenkaku Tower in Shinsekai, carrying knives crafted in Sakai (Japan's historic bladesmithing region) and beyond. Staff walk through steel types, maintenance, and what suits a home cook vs. a professional, and offer a short sharpening lesson on request. Tax-free for international visitors with a passport.`,mapsQuery:'Tower Knives Osaka Shinsekai',notes:`In Shinsekai. Tax-free with a passport; ask for the sharpening demo.`,url:'https://www.towerknives.com/en'},
    {id:'yakiniku-rikimaru-dotonbori',person:'conner',city:'osaka',category:'food',type:'Yakiniku Restaurant',name:'Yakiniku Rikimaru Dotonbori',address:'Dotonbori, Chuo, Osaka',status:'researching',priority:'pending',estimatedCost:4500,estimatedDuration:'1.5 hours',bookingRequired:'recommended',dayAssigned:12,groupActivity:true,description:`A yakiniku (Japanese grilled meat) restaurant in the heart of Dotonbori — table-side grilling, a range of wagyu cuts, and the usual banchan-style sides. Good group dinner option since everyone grills their own portions.`,mapsQuery:'Yakiniku Rikimaru Dotonbori Osaka',notes:`Reserve for 6.`,url:null},
    {id:'coco-curry-house',person:'conner',city:'osaka',category:'food',type:'Curry Chain',name:'CoCo Ichibanya Curry House',address:'Namba/Dotonbori, Osaka',status:'researching',priority:'pending',estimatedCost:1200,estimatedDuration:'30–45 mins',bookingRequired:false,dayAssigned:12,groupActivity:false,description:`Japan's largest curry rice chain — fully customizable spice level (1–10), toppings menu (cutlet, cheese, veggies), and consistently good comfort food. Not fancy, but reliable and cheap, with an English-friendly picture menu at most locations.`,mapsQuery:'CoCo Ichibanya curry Osaka',notes:`Cheap, quick backup meal — several Namba locations.`,url:null},
    {id:'takoyaki-dotonbori-kukuru',person:'conner',city:'osaka',category:'food',type:'Takoyaki Restaurant',name:'Dotonbori Kukuru',address:'Dotonbori, Chuo, Osaka',status:'researching',priority:'pending',estimatedCost:800,estimatedDuration:'20–30 mins',bookingRequired:false,dayAssigned:12,groupActivity:true,description:`One of Dotonbori's most recognizable takoyaki chains, marked by a giant animated octopus sign outside. Crispy-outside, molten-inside takoyaki, made fresh to order. A classic Dotonbori street food stop — practically mandatory on a Dotonbori walk.`,mapsQuery:'Dotonbori Kukuru takoyaki Osaka',notes:`Look for the giant octopus sign. Go earlier to avoid the queue.`,url:null},
    {id:'ajinoya-honten',person:'conner',city:'osaka',category:'food',type:'Okonomiyaki Restaurant',name:'Ajinoya Honten',address:'Sonezaki, Kita, Osaka',status:'researching',priority:'pending',estimatedCost:1800,estimatedDuration:'1 hour',bookingRequired:true,dayAssigned:14,groupActivity:true,description:`A long-running, well-regarded okonomiyaki restaurant — savory grilled cabbage pancakes cooked tableside on a teppan, topped with okonomiyaki sauce, mayo, and bonito flakes. One of Osaka's signature dishes done properly.`,mapsQuery:'Ajinoya Honten okonomiyaki Osaka',notes:`FastPass online booking only — no walk-ins or phone. 90-min limit when busy.`,url:null},
    {id:'kura-sushi-osaka',person:'conner',city:'osaka',category:'food',type:'Conveyor Belt Sushi Chain',name:'Kura Sushi',address:'Namba/Dotonbori area, Osaka',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'45 mins–1 hour',bookingRequired:false,dayAssigned:12,groupActivity:true,description:`A reliable, affordable conveyor belt sushi chain with a fun gimmick — every 5 empty plates triggers a chance to win a small prize from a capsule machine at the table. Consistent quality, cheap (¥115/plate typically), and an easy, low-effort group meal.`,mapsQuery:'Kura Sushi Osaka',notes:`No reservation needed; order on a touchscreen. Easy backup.`,url:null},

    {id:'super-sentai-restaurant',person:'silva',city:'tokyo',category:'cafe',type:'Themed Restaurant',name:'Super Sentai Restaurant',address:'Pasela Resorts Ikebukuro Honten 4F, 1-21-9 Nishi-Ikebukuro, Toshima, Tokyo',status:'researching',priority:'pending',estimatedCost:3500,estimatedDuration:'1.5–2 hours',bookingRequired:'recommended',dayAssigned:3,groupActivity:false,description:`An official Super Sentai (Power Rangers) collaboration restaurant on the same floor as Kamen Rider The Diner in Ikebukuro. Menu items pull directly from past Sentai episodes — themed curries, character-color ice cream floats, gyoza and takoyaki styled around the show. Walls covered in memorabilia, figures, and replica costumes. ¥500 table charge includes an exclusive table mat and tin magnet.`,mapsQuery:'Super Sentai Restaurant Ikebukuro Tokyo',notes:`Pasela Ikebukuro — reserve; walk-ins only if there's space.`,url:'https://en.paselabo.pasela.co.jp/sentai/'},
    {id:'hunters-bar-monster-hunter',person:'silva',city:'tokyo',category:'cafe',type:'Themed Bar',name:'HUNTERS BAR — Monster Hunter Bar',address:'Akihabara, Chiyoda, Tokyo',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'1.5 hours',bookingRequired:'recommended',dayAssigned:6,groupActivity:false,description:`The official Monster Hunter collaboration bar in Akihabara, run by Pasela Resorts. Full themed menu ("Invitation to Dinner" set, hunter-camp-style dishes and drinks), decor pulled from the game's world, and rotating seasonal menus/events tied to Monster Hunter releases. Private karaoke rooms also available on-site.`,mapsQuery:'Hunters Bar Monster Hunter Akihabara Tokyo',notes:`Reserve. Age limits apply in the evening.`,url:'https://en.paselaresorts.com/collaboration/mhsb/'},
    {id:'shinjuku-anime-shopping',person:'silva',city:'tokyo',category:'shopping',type:'Anime & Tokusatsu Shopping',name:'Shinjuku Anime & Tokusatsu Shopping',address:'Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:4000,estimatedDuration:'2 hours',bookingRequired:false,dayAssigned:3,groupActivity:false,description:`A free-roam shopping wander through Shinjuku's anime and tokusatsu shops — smaller and more scattered than Akihabara, but with its own strong lineup including Animate and other figure/merch stores near the station. Less overwhelming than Akihabara and easy to fold into the Day 3 Shinjuku itinerary alongside the escape room and evening bars.`,mapsQuery:'Animate Shinjuku Tokyo anime shopping',notes:`Fill-in browsing between Day 3 anchors.`,url:null},

    {id:'asakusa-underground',person:'patrick',city:'tokyo',category:'shopping',type:'Retro Underground Arcade',name:'Asakusa Underground Street',address:'Near Ekimise, Asakusa Station, Taito, Tokyo',status:'researching',priority:'pending',estimatedCost:1000,estimatedDuration:'30–45 mins',bookingRequired:false,dayAssigned:2,groupActivity:false,description:`Japan's oldest surviving underground shopping arcade, opened in 1955 beneath Asakusa Station — a roughly 50-meter corridor of exposed pipes, aging Showa-era signage, and small izakayas and shops that feel completely frozen in time. Most visitors walk right over it on the way to Sensoji without knowing it's there. A genuinely hidden, low-key detour that's the exact opposite of the crowds above ground.`,mapsQuery:'Asakusa Underground Street Chikagai Tokyo',notes:`Easy to miss — stairs near the EKIMISE building. Monju is a stand-up soba counter.`,url:null},

    {id:'pachinko-namba',person:'patrick',city:'osaka',category:'entertainment',type:'Pachinko Parlor',name:'Pachinko Parlor, Namba',address:'Namba/Dotonbori, Osaka (exact parlor TBD)',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'45–90 mins',bookingRequired:false,dayAssigned:15,groupActivity:false,description:`A genuine Japanese pachinko hall — wall-to-wall vertical pinball-slot machines, deafening chime music, cigarette haze, and rows of intensely focused regulars. Namba and Dotonbori are lined with some of the biggest, most neon-lit parlors in the country, easy to spot from the street. Not really about winning — more a five-senses experience that's hard to get anywhere outside Japan. A good, easy last-night-in-Japan stop after Izakaya Toyo winds down.`,mapsQuery:'pachinko parlor Namba Osaka',notes:`Walk into any big hall along Namba. Mostly cash.`,url:null},

    {id:'umeda-sky-building',person:'patrick',city:'osaka',category:'landmark',type:'Observation Deck',name:'Umeda Sky Building',address:'1-1-88 Oyodonaka, Kita, Osaka',status:'researching',priority:'pending',estimatedCost:1500,estimatedDuration:'1–1.5 hours',bookingRequired:false,dayAssigned:14,groupActivity:false,description:`Two 40-story towers connected at the top by a "Floating Garden Observatory" — a striking piece of 1990s architecture that's become an Osaka skyline icon. The open-air rooftop deck offers 360° views of the city, and on clear days reaches toward Osaka Bay and beyond. Escalators cross an open-air glass tube between the towers on the way up, which is an experience in itself. Especially good at sunset into evening for the city lights.`,mapsQuery:'Umeda Sky Building Osaka',notes:`¥1,500 observatory — the Day 14 reunion spot in Umeda.`,url:null},

    {id:'kurama-onsen',person:'patrick',city:'kyoto',category:'nature',type:'Onsen',name:'Kurama Onsen',address:'520 Kuramahonmachi, Sakyo, Kyoto',status:'researching',priority:'pending',estimatedCost:2500,estimatedDuration:'1.5–2 hours',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A hot spring bathhouse at the base of the Kurama mountain trail, a short walk from Kurama Station. The outdoor rotenburo bath looks out over the forested hillside — a genuinely scenic soak, especially with any snow on the trees in January. The natural pairing for a Kurama-dera day: hike the temple grounds, then soak the legs out before heading back into central Kyoto.`,mapsQuery:'Kurama Onsen Kyoto',notes:`Pairs with Kurama-dera. Check it's operating; towel rental on-site.`,url:null},

    {id:'pokemon-frienda-arcade',person:'jake',city:'tokyo',category:'arcade',type:'Arcade Cabinet Game',name:'Pokémon FRIENDA',address:'GiGO / Taito Station, Akihabara, Tokyo',status:'researching',priority:'pending',estimatedCost:600,estimatedDuration:'20–30 mins',bookingRequired:false,dayAssigned:6,groupActivity:true,description:`A Pokémon arcade cabinet released in July 2024 — touchscreen 3-on-3 battles where catching a Pokémon dispenses a real collectible "Frienda Pick" from the machine. Built on a twin/dual cabinet setup inherited from its predecessor Pokémon Mezastar, so two players can sit side by side and battle or catch simultaneously. Aimed at a younger crowd on paper, but the collectible-catching hook and genuine arcade cabinet design make it an easy, cheap detour for anyone who grew up on Pokémon.`,mapsQuery:'Pokemon Frienda arcade Akihabara Tokyo',notes:`¥100 a play. Found in most GiGO and Taito Station arcades.`,url:null},

    {id:'ebisu-dagashi-bar',person:'jake',city:'tokyo',category:'bar',type:'Retro Candy Bar',name:'Ebisu Dagashi Bar',address:'Ebisu, Shibuya, Tokyo',status:'researching',priority:'pending',estimatedCost:1800,estimatedDuration:'1.5–2 hours',bookingRequired:false,dayAssigned:5,groupActivity:true,description:`A bar built around dagashi — cheap, nostalgic Japanese penny candy and snacks from vending machines, convenience stores, and childhood memories. Walls stocked with retro candy alongside a full drink menu; order a cocktail and grab snacks off the shelf like a kid raiding a candy store. A genuinely fun, low-stakes group hang with built-in nostalgia and a strong photo/vlog angle.`,mapsQuery:'Ebisu Dagashi Bar Tokyo',notes:`Retro-candy bar with a casual vibe — fun without heavy drinking. 1 stop from Shibuya.`,url:null},

    {id:'kurama-dera',person:'patrick',city:'kyoto',category:'temple',type:'Mountain Temple',name:'Kurama-dera',address:'1074 Kuramahonmachi, Sakyo, Kyoto',status:'researching',priority:'pending',estimatedCost:500,estimatedDuration:'2.5–3 hours',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A mountain temple in the forested hills north of Kyoto, founded in 770 and steeped in tengu (mountain goblin) folklore — some legends tie it to the young Minamoto no Yoshitsune training here. Reaching the main hall means a genuine hike up wooded switchback paths lined with cedar roots and stone lanterns, with the option to continue over the ridge down into Kibune on the other side. A cable car covers part of the ascent for those who want it. Quieter and far less crowded than Kyoto's central temple circuit.`,mapsQuery:'Kurama-dera Temple Kyoto',notes:`Day 9 fallback if the lottery fails. Eizan Railway, ~30 min. ¥500.`,url:null},

    {id:'kaiten-sushi-onodera',person:'jake',city:'tokyo',category:'food',type:'Conveyor Belt Sushi',name:'Kaiten Sushi Ginza Onodera',address:'Ginza, Chuo, Tokyo',status:'researching',priority:'pending',estimatedCost:4000,estimatedDuration:'1 hour',bookingRequired:false,dayAssigned:6,groupActivity:false,description:`A high-end conveyor belt sushi concept from the Onodera group, bringing serious sushi-counter quality to the kaiten format. More refined and pricier than a typical conveyor belt spot, but with the same casual walk-in energy.`,mapsQuery:'Kaiten Sushi Ginza Onodera Tokyo',notes:`Walk-in queue — arrive early for 6. Pairs with Itoya in Ginza.`,url:null},

    {id:'immo-pippi',person:'jake',city:'tokyo',category:'food',type:'Takeaway Dessert Stand',name:'Immo Pippi',address:'Tokyo (exact location TBD)',status:'researching',priority:'pending',estimatedCost:2500,estimatedDuration:'15–20 mins',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`Jake's pick — a takeaway-only dessert stand with no seating at all; staff typically point customers toward nearby spots to eat. Works well as a walking-street-food add-on rather than a real stop.`,mapsQuery:'Immo Pippi Tokyo',notes:`No seating — grab and go.`,url:null},
    {id:'yakitori-sei',person:'jake',city:'tokyo',category:'food',type:'Yakitori Restaurant',name:'Yakitori Sei',address:'Tokyo (exact location TBD)',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'1.5 hours',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`Grilled skewer restaurant on Jake's list — chicken, vegetables, and seasonal cuts over charcoal. Confirm exact branch closer to the trip.`,mapsQuery:'Yakitori Sei Tokyo',notes:`16 counter seats; 6 can book via TableCheck. Address TBD.`,url:null},
    {id:'tokyo-curry-pan',person:'jake',city:'tokyo',category:'food',type:'Street Food',name:'Tokyo Curry Pan',address:'Tokyo (exact location TBD)',status:'researching',priority:'pending',estimatedCost:600,estimatedDuration:'15 mins',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`Fried curry-stuffed bread — a Japanese bakery classic. A quick, cheap snack stop rather than a sit-down meal.`,mapsQuery:'Tokyo Curry Pan bakery',notes:`Cheap snack for any walking day.`,url:null},
    {id:'ny-bagel-club',person:'jake',city:'tokyo',category:'food',type:'Takeout Bagel Shop',name:'New York Bagel Club',address:'Tokyo (exact location TBD)',status:'researching',priority:'pending',estimatedCost:1000,estimatedDuration:'15–20 mins',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A New York-style bagel shop in Tokyo — boiled-and-baked bagels with classic deli-style toppings. Takeout-only, no real seating beyond maybe a bench for two. Grab-and-go rather than a sit-down breakfast stop.`,mapsQuery:'New York Bagel Club Tokyo',notes:`Takeout only — breakfast on the move.`,url:null},
    {id:'maen-sake',person:'jake',city:'tokyo',category:'bar',type:'Sake Bar',name:'Maen Sake',address:'Tokyo (exact location TBD)',status:'researching',priority:'pending',estimatedCost:2500,estimatedDuration:'1.5 hours',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A sake-focused bar on Jake's list. Confirm exact address and sake selection closer to the trip.`,mapsQuery:'Maen Sake Tokyo',notes:`11 counter seats — the group takes about half.`,url:null},
    {id:'yuu-yoyogi-uehara',person:'jake',city:'tokyo',category:'food',type:'Restaurant',name:'Yuu Yoyogi Uehara',address:'Yoyogi-Uehara, Shibuya, Tokyo',status:'researching',priority:'pending',estimatedCost:3500,estimatedDuration:'1.5 hours',bookingRequired:false,dayAssigned:4,groupActivity:true,description:`A restaurant in the quiet, upscale Yoyogi-Uehara neighborhood — a residential area known for a cluster of good, low-key restaurants away from the tourist crowds.`,mapsQuery:'Yuu Yoyogi Uehara Tokyo',notes:`Day 4 lunch, 2 stops from Shimokitazawa on the Odakyu Line. Ask for a table, not the counter.`,url:null},
    {id:'new-toyosu-market',person:'jake',city:'tokyo',category:'food',type:'Fish Market',name:'New Toyosu Market',address:'6-3 Toyosu, Koto, Tokyo',status:'researching',priority:'pending',estimatedCost:3500,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:4,groupActivity:true,description:`The modern successor to the old Tsukiji fish market's inner wholesale operations — the world's largest fish market by volume, relocated to Toyosu in 2018. Famous for the early-morning tuna auction (viewable from a viewing deck, advance booking needed) and a food court of sushi restaurants sourcing directly from the floor below.`,mapsQuery:'Toyosu Market Tokyo',notes:`The real wholesale market (Tsukiji is the outer market). Before 9 AM. The tuna auction needs separate booking.`,url:null},
    {id:'daikanyama-neighborhood',person:'jake',city:'tokyo',category:'shopping',type:'Neighbourhood',name:'Daikanyama',address:'Daikanyama, Shibuya, Tokyo',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:5,groupActivity:false,description:`A quiet, upscale neighborhood known for boutique fashion, design shops, and the Tsutaya Books flagship — a beautifully designed bookstore/lifestyle complex. Slower-paced and more residential than Shibuya proper, a short walk away.`,mapsQuery:'Daikanyama Tokyo',notes:`Quiet boutique streets, ~15 min walk from Shibuya.`,url:null},
    {id:'kfc-gojo-shinjuku',person:'jake',city:'tokyo',category:'food',type:'Fast Food (Meme Spot)',name:'KFC Shinjuku Nishiguchi',address:'Nishi-Shinjuku, Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:1200,estimatedDuration:'20 mins',bookingRequired:false,dayAssigned:3,groupActivity:true,description:`The KFC location that became a meme/TikTok pilgrimage spot for the "Are you the strongest because you're Gojo Satoru" scene. A goofy, low-stakes photo-op stop rather than a real food destination — but exactly the kind of detour that makes for good vlog content.`,mapsQuery:'KFC Shinjuku Nishiguchi Tokyo',notes:`Meme/vlog stop — quick photo, not a meal.`,url:null},
    {id:'hekkelun-tokyo',person:'jake',city:'tokyo',category:'cafe',type:'Danish Bakery',name:'Hekkelun',address:'Tokyo (exact location TBD)',status:'researching',priority:'pending',estimatedCost:1000,estimatedDuration:'30–45 mins',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A Scandinavian-style bakery known for cinnamon rolls and Danish pastries — a popular Tokyo bakery spot with a devoted following. Good breakfast or midday sweet stop.`,mapsQuery:'Hekkelun bakery Tokyo',notes:`Lines on weekends, smoking allowed inside, and food comes out in batches. Expect 2 tables.`,url:null},

    {id:'yamacho-kuro-udon',person:'jake',city:'tokyo',category:'food',type:'Udon Restaurant',name:'Yamacho Kuro Udon',address:'Harajuku, Shibuya, Tokyo',status:'researching',priority:'pending',estimatedCost:1500,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:3,groupActivity:false,description:`A Harajuku udon spot known for "kuro" (black) udon — a striking squid-ink or charcoal-colored noodle variation. Distinctive photo-friendly dish and a solid, quick lunch stop in the middle of a Harajuku shopping day.`,mapsQuery:'Yamacho Kuro Udon Harajuku Tokyo',notes:`Only 8 seats — split up.`,url:null},

    {id:'bar-centifolia',person:'jake',city:'tokyo',category:'bar',type:'Cocktail Bar',name:'Bar Centifolia',address:'Tokyo (exact location TBD)',status:'researching',priority:'pending',estimatedCost:3500,estimatedDuration:'1.5–2 hours',bookingRequired:true,dayAssigned:null,groupActivity:false,description:`An ornate, heavily-styled cocktail bar that circulates often on TikTok and Instagram for its elaborate interior and presentation. More of a visual/photo experience than a casual hang — good for a dressed-up night out.`,mapsQuery:'Bar Centifolia Tokyo',notes:`⚠️ Not on the itinerary. If added: bookings open 15 days ahead at midnight JST and vanish in seconds; realistically 2–3 people.`,url:null},
    {id:'pokepark-kanto',person:'jake',city:'tokyo',category:'entertainment',type:'Pokémon Attraction',name:'PokéPark Kanto',address:'Inside Yomiuriland, Inagi City, western Tokyo',status:'researching',priority:'pending',estimatedCost:2500,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:null,groupActivity:true,description:`A Pokémon-themed area inside Yomiuriland amusement park in western Tokyo, opened February 5, 2026. Confirmed location and opening status as of this writing — worth a final check closer to the trip since attraction details can still shift.`,mapsQuery:'PokePark Kanto Yomiuriland Tokyo',notes:`Inside Yomiuriland. The merch shop needs a separate timed ticket from the app — register on arrival.`,url:null},
    {id:'one-piece-base-shop',person:'jake',city:'tokyo',category:'shopping',type:'Official Merchandise Store',name:'One Piece Base Shop',address:'4F, Shinjuku Marui Main Building, 3-30-13 Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:4000,estimatedDuration:'45 mins',bookingRequired:true,dayAssigned:3,groupActivity:false,description:`Official One Piece merchandise store — figures, apparel, and exclusive collaborative items tied to the anime/manga. A strong pairing with Silva's anime-focused shopping if schedules line up.`,mapsQuery:'One Piece Base Shop Shinjuku Marui Tokyo',notes:`Not walk-in — enter via the app lottery (BASE CREW account). Apply as a group well before the trip.`,url:null},
    {id:'jins-shinjuku-flagship',person:'jake',city:'tokyo',category:'shopping',type:'Eyewear Store',name:'JINS Shinjuku Flagship',address:'Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:8000,estimatedDuration:'1 hour',bookingRequired:false,dayAssigned:3,groupActivity:false,description:`JINS' flagship eyewear store in Shinjuku — includes an on-site eye exam and a large selection of well-designed, affordable frames. A practical stop if anyone wants new glasses at Japan pricing, and the flagship location itself is a well-designed retail space worth seeing.`,mapsQuery:'JINS Shinjuku Flagship Tokyo',notes:`Bring your prescription if you want glasses made on-site.`,url:null},
    {id:'rocky-top-bluegrass',person:'jake',city:'tokyo',category:'bar',type:'Live Music Venue',name:'Rocky Top',address:'Ginza, Chuo, Tokyo',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'2 hours',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A bluegrass live-music venue in Tokyo — an unexpectedly deep bluegrass and Americana scene exists in the city, and this is one of its known spots. A genuinely surprising night out for a Tokyo trip.`,mapsQuery:'Rocky Top bluegrass Ginza Tokyo',notes:`Ginza. Check the live-show schedule before going.`,url:null},
    {id:'itoya-ginza',person:'jake',city:'tokyo',category:'shopping',type:'Stationery Department Store',name:'Itoya',address:'2-7-15 Ginza, Chuo, Tokyo',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'1–1.5 hours',bookingRequired:false,dayAssigned:4,groupActivity:false,description:`A 12-floor stationery and paper-goods department store in Ginza — pens, notebooks, art supplies, and beautifully designed everyday objects across every floor. A genuinely absorbing browse even for people who don't think of themselves as "stationery people."`,mapsQuery:'Itoya Ginza Tokyo',notes:`12 floors of stationery. Opens ~10 AM, ~10 min walk from Tsukiji.`,url:null},
    {id:'hozenji-yokocho',person:'jake',city:'osaka',category:'bar',type:'Alley Dining District',name:'Hozenji Yokocho',address:'Namba, Chuo, Osaka',status:'researching',priority:'pending',estimatedCost:3500,estimatedDuration:'1.5–2 hours',bookingRequired:false,dayAssigned:12,groupActivity:true,description:`A narrow, moss-and-stone-lantern-lined alley next to Hozenji Temple in Namba — small traditional restaurants and bars packed into a single atmospheric lane, similar in spirit to Pontocho in Kyoto but distinctly Osaka. Quieter and more intimate than the nearby Dotonbori strip.`,mapsQuery:'Hozenji Yokocho Osaka',notes:`A quiet lantern-lit alley a short walk from Dotonbori.`,url:null},

    {id:'ghibli-park-nagoya',person:'silva',city:'other',region:'Nagoya (Aichi)',category:'themepark',type:'Theme Park',name:'Ghibli Park',address:'Aichi Earth Expo Memorial Park, Nagakute, Aichi',status:'researching',priority:'pending',estimatedCost:3500,estimatedDuration:'Full day',bookingRequired:true,dayAssigned:null,groupActivity:false,description:`A full-scale theme park built around Studio Ghibli's world, opened in 2022 inside Aichi's Expo 2005 Commemorative Park near Nagoya — distinct from (and much larger than) the Ghibli Museum in Mitaka, Tokyo. Split into themed areas including Ghibli's Grand Warehouse, Dondoko Forest (My Neighbor Totoro), Hill of Youth, and Mononoke Village, with full-size reconstructed sets and buildings from the films rather than just displays. On Silva's someday list.`,mapsQuery:'Ghibli Park Nagakute Aichi',notes:`Not the Ghibli Museum. Near Nagoya — a future-trip idea (~35 min by Shinkansen from Kyoto). Timed tickets released monthly.`,url:'https://ghibli-park.jp/en/'},

    {id:'oishi-park',person:'jake',city:'other',region:'Yamanashi',category:'nature',type:'Lakeside Park',name:'Oishi Park',address:'Lake Kawaguchiko, Yamanashi',status:'researching',priority:'pending',estimatedCost:0,estimatedDuration:'1 hour',bookingRequired:false,dayAssigned:null,groupActivity:true,description:`A lakeside park on Lake Kawaguchiko known for lavender fields (in season) and clear views of Mt. Fuji across the water. On Jake's someday list.`,mapsQuery:'Oishi Park Kawaguchiko Yamanashi',notes:`Yamanashi. Free entry. Not part of the current itinerary.`,url:null},

    {id:'naruto-theme-park-awaji',person:['jake','patrick','silva'],city:'osaka',category:'themepark',type:'Theme Park Attraction',name:'NARUTO & BORUTO Shinobi-Zato (Nijigen no Mori)',address:'Nijigen no Mori, Awaji Island, Hyogo',status:'researching',priority:'pending',estimatedCost:4000,estimatedDuration:'Full day',bookingRequired:true,dayAssigned:14,groupActivity:true,description:`The Naruto & Boruto area of Nijigen no Mori on Awaji Island — a maze, mission rally and special missions set in a recreated Hidden Leaf Village, with Ichiraku-themed ramen. Dragon Quest Island is in the same park, and the Hokage Rock projection mapping starts at dusk.`,mapsQuery:'NARUTO BORUTO Shinobi-Zato Nijigen no Mori Awaji',notes:`Day 14 Awaji anchor. Round-trip bus package from JR Namba (~2 hr). Check winter maintenance dates first.`,url:null},

    {id:'kurokawa-crater',person:'jake',city:'other',region:'Kumamoto',category:'nature',type:'Natural Landmark',name:'Kurokawa Crater',address:'Aso, Kumamoto',status:'researching',priority:'pending',estimatedCost:1000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:null,groupActivity:true,description:`A volcanic crater near Aso in Kumamoto on Jake's someday list — part of the wider Mt. Aso caldera region, one of the largest active volcanic calderas in the world.`,mapsQuery:'Kurokawa Crater Aso Kumamoto',notes:`Kumamoto. Not part of the current itinerary.`,url:null},

    {id:'shinpachi-shokudo',person:'conner',city:'tokyo',category:'food',type:'Japanese Breakfast',name:'Shinpachi Shokudo',address:'Multiple locations, Tokyo',status:'researching',priority:'pending',estimatedCost:1200,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:6,groupActivity:false,description:`A no-frills Japanese breakfast chain serving the classic teishoku set — grilled fish, rice, miso soup, pickles, raw egg — exactly the way it's eaten across Japan every morning. Cheap, fast, and an honest contrast to the themed cafes elsewhere on the list. A good reset meal between the heavier food days.`,mapsQuery:'Shinpachi Shokudo Tokyo',notes:`Day 6 breakfast for Conner & Steve. The Nishi-Shinjuku branch is counter-only.`,url:null},
    {id:'butagumi-tokyo',person:'conner',city:'tokyo',category:'food',type:'Tonkatsu Restaurant',name:'Butagumi',address:'2-24-9 Nishi-Azabu, Minato, Tokyo',status:'researching',priority:'pending',estimatedCost:3500,estimatedDuration:'1–1.5 hours',bookingRequired:'recommended',dayAssigned:4,groupActivity:false,description:`A well-regarded tonkatsu specialist in Nishi-Azabu, set in a converted traditional house. Sources a wide range of pork breeds from across Japan, each with a noticeably different flavor and fat profile, served as classic breaded pork cutlet with cabbage and miso soup. More refined than a typical tonkatsu counter — worth the trip for a serious pork-cutlet meal.`,mapsQuery:'Butagumi tonkatsu Nishi-Azabu Tokyo',notes:`Reserve — groups of 5+ may be split across 2 tables.`,url:null},
    {id:'komeda-coffee-tokyo',person:'conner',city:'tokyo',category:'cafe',type:'Coffee Chain Breakfast',name:"Komeda's Coffee",address:'Multiple locations, Tokyo',status:'researching',priority:'pending',estimatedCost:900,estimatedDuration:'30–45 mins',bookingRequired:false,dayAssigned:6,groupActivity:false,description:`A nationwide kissaten-style coffee chain known for the morning "Morning Set" — order any coffee before 11am and get a thick slice of toast with butter and red bean paste or egg, free. Retro, wood-paneled interiors with deep booth seating. A reliable, relaxed breakfast option that doesn't require research or a reservation.`,mapsQuery:"Komeda's Coffee Tokyo",notes:`Free Morning Set with a drink before 11 AM.`,url:null},
    {id:'rakuu-tei-teahouse',person:'conner',city:'tokyo',category:'cafe',type:'Traditional Tea House',name:'Rakuu-tei',address:'Shinjuku Gyoen National Garden, Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:1000,estimatedDuration:'30–45 mins',bookingRequired:false,dayAssigned:6,groupActivity:false,description:`A traditional tea house inside Shinjuku Gyoen, serving matcha and wagashi sweets overlooking a Japanese garden pond. A genuinely calm, unhurried stop in the middle of a park visit — proper tea ceremony presentation without needing to book a formal ceremony experience.`,mapsQuery:'Rakuu-tei tea house Shinjuku Gyoen',notes:`Buy tickets at the vending machine outside first (6 separate purchases). Tea service ends ~3 PM. Garden entry ¥500.`,url:null},
    {id:'los-tacos-azules',person:'conner',city:'tokyo',category:'food',type:'Taco Restaurant',name:'Los Tacos Azules',address:'Tokyo (exact location TBD)',status:'researching',priority:'pending',estimatedCost:1800,estimatedDuration:'1 hour',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A taqueria serving proper Mexican-style street tacos in Tokyo — blue corn tortillas, slow-cooked meats, fresh salsas. Part of the small but growing wave of genuinely good Mexican food in the city. A solid change of pace from a heavy stretch of Japanese food days.`,mapsQuery:'Los Tacos Azules Tokyo',notes:`Use the Ebisu branch (~21 seats, bookable); Sangenjaya is walk-in only.`,url:null},
    {id:'shinjuku-gyoen',person:'conner',city:'tokyo',category:'nature',type:'National Garden',name:'Shinjuku Gyoen National Garden',address:'11 Naitomachi, Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:500,estimatedDuration:'1.5–2 hours',bookingRequired:false,dayAssigned:6,groupActivity:true,description:`One of Tokyo's largest and most beautiful parks, blending traditional Japanese, French formal, and English landscape garden styles across 144 acres. A genuinely peaceful break from the city — koi ponds, a greenhouse, and Rakuu-tei tea house inside the grounds. Even in January, the garden's structure and the greenhouse make it worth the visit.`,mapsQuery:'Shinjuku Gyoen National Garden Tokyo',notes:`¥500 entry. ⚠️ Closed Mondays — don't move it to Day 3. Opens 9 AM.`,url:null},
    {id:'round1-tokyo',person:'conner',city:'tokyo',category:'entertainment',type:'Entertainment Complex',name:'Round 1 Tokyo',address:'Round1 Ikebukuro (Sunshine 60-dori area), Toshima, Tokyo',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'3–5 hours',bookingRequired:false,dayAssigned:3,groupActivity:true,description:`The Tokyo branch of Japan's premier bowling and arcade entertainment chain — bowling, billiards, karaoke, darts, batting cages, and a large arcade floor under one roof. Same chain as the Osaka location already planned for later in the trip, but worth doing in Tokyo too since locations and machine selections differ by branch.`,mapsQuery:'Round 1 Tokyo',notes:`Up to 6 per bowling lane on the unlimited plan. Open very late.`,url:'https://www.round1.co.jp'},
    {id:'sumo-wrestling-tokyo',person:'conner',city:'tokyo',category:'entertainment',type:'Sumo Tournament',name:'Sumo Wrestling',address:'Ryogoku Kokugikan, 1-3-28 Yokoami, Sumida, Tokyo',status:'researching',priority:'pending',estimatedCost:5000,estimatedDuration:'Half day',bookingRequired:true,dayAssigned:null,groupActivity:true,description:`The Grand Sumo Tournament runs Jan 10–24, 2027 at Ryogoku Kokugikan, directly overlapping the Tokyo leg of the trip. A full day of bouts builds toward the higher-ranked wrestlers in the late afternoon — genuinely one of the most unique live sporting experiences in Japan, win-or-lose theater built into centuries of ritual.`,mapsQuery:'Ryogoku Kokugikan sumo Tokyo',notes:`On sale Dec 5 via sumo.pia.jp — target Day 6 (Jan 14). Chair seats are easiest for a group; top bouts come last.`,url:null},
    {id:'mount-takao',person:'conner',city:'tokyo',category:'nature',type:'Day Hike',name:'Mount Takao',address:'Hachioji, Tokyo',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'Half day',bookingRequired:false,dayAssigned:'flex',groupActivity:true,description:`A 599m mountain less than an hour from central Tokyo by train, popular for an easy day hike with multiple trail options ranging from a paved path to a more rugged route. A cable car and chairlift offer a no-effort version partway up. On a clear January day, the summit has views toward Mount Fuji. Includes a small temple complex (Yakuoin) partway up the mountain.`,mapsQuery:'Mount Takao Hachioji Tokyo',notes:`~50 min on the Keio Line — a low-effort substitute if Fuji falls through.`,url:null},

    {id:'disneysea-port-drinking',person:'patrick',city:'tokyo',category:'themepark',type:'Theme Park',name:'Tokyo DisneySea — A Drink at Every Port',address:'1-13 Maihama, Urayasu, Chiba',status:'researching',priority:'pending',estimatedCost:8000,estimatedDuration:'Full day',bookingRequired:true,dayAssigned:'flex',groupActivity:true,description:`Tokyo DisneySea is the only Disney park in the world that serves alcohol, and the bit is simple: one themed drink at each of the park's 8 ports — Mediterranean Harbor, American Waterfront, Port Discovery, Lost River Delta, Arabian Coast, Mermaid Lagoon, Mysterious Island, and Fantasy Springs. Seasonal cocktails rotate constantly and the lounges (Teddy Roosevelt Lounge, Barnacle Bill's) are built for exactly this. The park itself is widely considered Tokyo Disney Resort's best — immersive theming, Tower of Terror, Journey to the Center of the Earth, Indiana Jones Adventure, Soaring: Fantastic Flight.`,mapsQuery:'Tokyo DisneySea Urayasu',notes:`Tickets in the Tokyo Disney Resort app, ¥7,900–10,900. JR Keiyo Line to Maihama, ~30 min. Pace yourselves.`,url:'https://www.tokyodisneyresort.jp/en/tds/'},

    {id:'square-enix-garden-shibuya',person:'patrick',city:'tokyo',category:'shopping',type:'Official Merchandise Store',name:'Square Enix Garden',address:'3F Shibuya Sakura Stage SHIBUYA Side, 1-4 Sakuragaoka-cho, Shibuya, Tokyo',status:'researching',priority:'pending',estimatedCost:5000,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:5,groupActivity:false,description:`Square Enix's newest flagship goods store, opened in 2025 inside Shibuya Sakura Stage — replacing the older Shinjuku showcase as the main Tokyo destination for official merchandise. Entrance built around Chocobos, Moogles, and Slimes; sections themed to Final Fantasy and Dragon Quest with figures, apparel, jewelry, and collaborative items. Strong NieR: Automata figure selection alongside the usual FF/DQ lineup. Exclusive store-only items including a capsule toy machine.`,mapsQuery:'Square Enix Garden Shibuya Sakura Stage',notes:`1 min from Shibuya Station. Merch rotates seasonally.`,url:null},

    {id:'drunken-clam-osaka',person:'patrick',city:'osaka',category:'bar',type:'Karaoke Bar',name:'The Drunken Clam',address:'Kiku Bldg 3F, 6-26 Soemoncho, Chuo, Osaka',status:'researching',priority:'pending',estimatedCost:2500,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:13,groupActivity:true,description:`A Family Guy-themed karaoke bar tucked on the third floor of an unmarked building near Dotonbori — easy to walk past without noticing. English-friendly staff, a strong karaoke song list including anime tracks with romaji mode, and a mixed crowd of locals and international travelers. Compact and intimate rather than a big chain karaoke box. Open late — until 4am Fri/Sat.`,mapsQuery:'The Drunken Clam Osaka karaoke bar',notes:`Family Guy karaoke bar, 3F in Soemoncho — easy to miss. Some listings say closed Mondays (Day 13 is a Thursday). Smoking allowed.`,url:'https://www.theclamjp.com/'},

    {id:'toei-animation-gallery',person:'silva',city:'tokyo',category:'museum',type:'Animation Studio Museum',name:'Toei Animation Gallery',address:'2-10-5 Higashi-Oizumi, Nerima, Tokyo',status:'researching',priority:'pending',estimatedCost:0,estimatedDuration:'1 hour',bookingRequired:false,dayAssigned:3,groupActivity:false,description:`A small, free museum at Toei Animation's actual production studio in Nerima — the company behind One Piece, Dragon Ball, Sailor Moon, and Digimon. Original cels, character model sheets, and production materials on display, plus a gift shop with merchandise not sold elsewhere. Modest in size but a genuine look at the studio actually making the shows Silva grew up on, rather than a tourist-facing attraction.`,mapsQuery:'Toei Animation Gallery Oizumi Tokyo',notes:`Free. In Nerima — +20 min on the Seibu Ikebukuro Line from Ikebukuro.`,url:null},
