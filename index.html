    .critical-list { display: flex; flex-direction: column; gap: 8px; }
    .critical-item {
      background: var(--white);
      border: 1px solid var(--light);
      border-radius: var(--radius);
      padding: 13px 14px;
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 12px;
      align-items: start;
    }
    .critical-item.is-critical {
      border-color: rgba(196,30,58,0.3);
      background: rgba(196,30,58,0.02);
    }
    .critical-date-block {
      text-align: center;
      background: var(--paper);
      border-radius: var(--radius-sm);
      padding: 6px 4px;
    }
    .critical-date-block.is-critical { background: rgba(196,30,58,0.08); }
    .critical-date-day {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1;
    }
    .critical-date-block.is-critical .critical-date-day { color: var(--red); }
    .critical-date-month {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .critical-label {
      font-family: var(--serif);
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 3px;
      line-height: 1.2;
    }
    .critical-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .critical-who {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .critical-alarm {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 600;
      color: var(--red);
      background: rgba(196,30,58,0.08);
      padding: 2px 7px;
      border-radius: 4px;
      margin-top: 5px;
    }

    /* ── Booking timeline ── */
    .timeline-phases { display: flex; flex-direction: column; gap: 10px; }
    .phase-card {
      background: var(--white);
      border: 1px solid var(--light);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .phase-header {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px 14px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .phase-num {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--white);
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .phase-num.priority-critical { background: var(--red); }
    .phase-num.priority-high     { background: #d4af37; }
    .phase-num.priority-medium   { background: var(--muted); }
    .phase-label {
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
    }
    .phase-window {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }
    .phase-chevron {
      font-size: 13px;
      color: var(--subtle);
      transition: transform 0.25s;
    }
    .phase-card.open .phase-chevron { transform: rotate(180deg); }
    .phase-body {
      display: none;
      border-top: 1px solid var(--light);
    }
    .phase-card.open .phase-body { display: block; }
    .phase-task {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 14px;
      border-bottom: 1px solid var(--light);
      font-size: 13px;
    }
    .phase-task:last-child { border-bottom: none; }
    .phase-task-check {
      width: 18px; height: 18px;
      border-radius: 4px;
      border: 1.5px solid var(--light);
      flex-shrink: 0;
      margin-top: 1px;
    }
    .phase-task-body { flex: 1; min-width: 0; }
    .phase-task-name { color: var(--ink); line-height: 1.3; margin-bottom: 2px; }
    .phase-task-meta {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ── Money / Practical tips ── */
    .tip-cards { display: flex; flex-direction: column; gap: 8px; }
    .tip-card {
      background: var(--white);
      border: 1px solid var(--light);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      gap: 12px;
    }
    .tip-icon { font-size: 22px; flex-shrink: 0; }
    .tip-title {
      font-family: var(--serif);
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 3px;
    }
    .tip-body { font-size: 12px; color: var(--muted); line-height: 1.55; }
    .tip-warn {
      border-left: 3px solid var(--red);
      background: rgba(196,30,58,0.02);
    }

    /* ── Emergency card ── */
    .emergency-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .emergency-card {
      background: var(--white);
      border: 1px solid var(--light);
      border-radius: var(--radius);
      padding: 12px 14px;
    }
    .emergency-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .emergency-num {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 800;
      color: var(--ink);
    }

    @media (min-width: 768px) {
      .logi-content { padding: 0 24px 100px; }
      .logi-nav { padding: 10px 24px; }
      .emergency-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (min-width: 1024px) {
      .logi-content { padding: 0 32px 100px; }
      .logi-nav { padding: 10px 32px; }
    }

    /* ============================================================
       MAP TAB
    ============================================================ */
    .map-controls {
      position: sticky;
      top: var(--nav-h);
      z-index: 500;
      background: var(--paper);
      border-bottom: 1px solid var(--light);
      padding: 8px 12px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      flex-wrap: nowrap;
    }
    .map-controls::-webkit-scrollbar { display: none; }

    .map-ctrl-btn {
      font-size: 11px;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: 20px;
      border: 1.5px solid var(--light);
      background: var(--white);
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

<script>
(function() {
  'use strict';

  const C = SITE_CONFIG;

  // ── TAB NAVIGATION ────────────────────────────────────────
  const TAB_LABELS = {
    overview:   'Overview',
    today:      'Today',
    places:     'Places',
    itinerary:  'Itinerary',
    cities:     'Cities',
    activities: 'Activities',
    map:        'Map',
    budget:     'Budget',
    logistics:  'Logistics'
  };

  function buildNav() {
    const nav = document.getElementById('nav-inner');
    const LIVE_TABS = new Set(['overview', 'today', 'itinerary', 'places', 'activities', 'budget', 'logistics', 'map']);
    C.site.tabs.forEach(tabId => {
      const btn = document.createElement('button');
      const isLive = LIVE_TABS.has(tabId);
      btn.className = 'nav-tab' + (tabId === 'overview' ? ' active' : (isLive ? '' : ' disabled'));
      btn.textContent = TAB_LABELS[tabId];
      btn.dataset.tab = tabId;
      if (isLive) {
        btn.addEventListener('click', () => switchTab(tabId));
      } else {
        btn.title = 'Coming soon';
      }
      nav.appendChild(btn);
    });
  }

  function switchTab(tabId) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
    const panel = document.getElementById('tab-' + tabId);
    const btn   = document.querySelector(`.nav-tab[data-tab="${tabId}"]`);
    if (panel) panel.classList.add('active');
    if (btn)   btn.classList.add('active');
    window.scrollTo(0, 0);
  }

  // ── COUNTDOWN ─────────────────────────────────────────────
  function updateCountdown() {
    const target = new Date(C.trip.dates.departure + 'T00:00:00');
    const now    = new Date();
    const diff   = target - now;

    if (diff <= 0) {
      ['cd-days','cd-hours','cd-mins','cd-secs'].forEach(id => {
        document.getElementById(id).textContent = '0';
      });
      return;
    }

    const days  = Math.floor(diff / 864e5);
    const hours = Math.floor((diff % 864e5) / 36e5);
    const mins  = Math.floor((diff % 36e5)  / 6e4);
    const secs  = Math.floor((diff % 6e4)   / 1e3);

    document.getElementById('cd-days').textContent  = String(days);
    document.getElementById('cd-hours').textContent = String(hours).padStart(2,'0');
    document.getElementById('cd-mins').textContent  = String(mins).padStart(2,'0');
    document.getElementById('cd-secs').textContent  = String(secs).padStart(2,'0');
  }

  // ── CITY STRIP ─────────────────────────────────────────────
  function buildCityStrip() {
    const strip = document.getElementById('city-strip');
    C.cities.forEach(city => {
      const chip = document.createElement('div');
      chip.className = 'city-chip';
      chip.innerHTML = `
        <div class="city-chip-dot" style="background:${city.color}"></div>
        <div class="city-chip-name">${city.name}</div>
        <div class="city-chip-meta">${city.nights}N · ${city.dates}</div>
      `;
      strip.appendChild(chip);
    });
  }

  // ── STATS BAR ──────────────────────────────────────────────
  function buildStats() {
    const totalActivities = C.crew.reduce((sum, m) => sum + m.activityCount.total, 0);
    const stats = [
      { num: C.trip.dates.durationDays, label: 'Days' },
      { num: C.confirmedCrew().length,                   label: 'Crew' },
      { num: C.cities.length,           label: 'Cities' },
      { num: totalActivities,           label: 'Activities' }
    ];
    const bar = document.getElementById('stats-bar');
    stats.forEach(s => {
      const el = document.createElement('div');
      el.className = 'stat';
      el.innerHTML = `<div class="stat-num">${s.num}</div><div class="stat-label">${s.label}</div>`;
      bar.appendChild(el);
    });
  }

  // ── BOOKING ALERT ──────────────────────────────────────────
  function buildAlert() {
    const section = document.getElementById('alert-section');
    section.innerHTML = `
      <div class="alert">
        <div class="alert-icon">⭐</div>
        <div>
          <div class="alert-title">Critical Booking Dates</div>
          <div class="alert-body">
            <b>Nov 1</b> — Nintendo Museum lottery results; pay within ~7 days if selected.<br>
            <b>Dec 10</b> — Ghibli Museum (10:00 AM JST), then Kirby Cafe <i>and</i> Eorzea Cafe both open at 6:00 PM JST. Kirby and Eorzea drop at the exact same minute, so split them across two people on separate devices.
          </div>
          <span class="alert-date">Charlotte time: Ghibli 8:00 PM ET Dec 9 · Kirby &amp; Eorzea 4:00 AM ET Dec 10</span>
        </div>
      </div>
    `;
  }

  // ── CITY CARDS ─────────────────────────────────────────────
  function buildCityCards() {
    const container = document.getElementById('city-cards');
    C.cities.forEach(city => {
      const card = document.createElement('div');
      card.className = 'city-card';
      const pills = city.keyAreas.slice(0,4).map(a =>
        `<span class="pill">${a}</span>`
      ).join('');
      card.innerHTML = `
        <div class="city-card-accent" style="background:${city.color}"></div>
        <div class="city-card-body">
          <div class="city-card-emoji">${city.emoji}</div>
          <div class="city-card-info">
            <div class="city-card-top">
              <span class="city-card-name">${city.name}</span>
              <span class="city-card-kanji">${city.kanji}</span>
            </div>
            <div class="city-card-dates">${city.dates} · ${city.dayRange} · ${city.weather.tempF}°F</div>
            <div class="city-card-pills">${pills}</div>
            <div class="city-card-transport">🚇 ${city.transport}</div>
          </div>
          <div class="city-card-nights">${city.nights}<span>nights</span></div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // ── TIMELINE ───────────────────────────────────────────────
  function buildTimeline() {
    const container = document.getElementById('timeline');

    const events = [
      { dateStr: '2027-01-08', day: '8',  month: 'Jan', dot: '#c41e3a', city: 'Depart Charlotte',  detail: 'GSO → EWR → HND (UA4618/UA131) · Arrive Tokyo Jan 9, 2:20pm' },
      { dateStr: '2027-01-09', day: '9',  month: 'Jan', dot: '#c41e3a', city: 'Tokyo begins',      detail: '7 nights · Shinjuku / Akihabara / Shibuya' },
      { dateStr: '2027-01-16', day: '16', month: 'Jan', dot: '#d4af37', city: 'Tokyo → Kyoto',     detail: 'Nozomi from Shinagawa ~2h 15min · Kyoto begins, 4 nights' },
      { dateStr: '2027-01-20', day: '20', month: 'Jan', dot: '#ea8b37', city: 'Kyoto → Osaka',     detail: '~30 min · JR Kyoto Line · Osaka begins, 4 nights' },
      { dateStr: '2027-01-24', day: '24', month: 'Jan', dot: '#8a8278', city: 'Departure',         detail: 'Nozomi to Shinagawa → HND, then HND → IAD → GSO (UA804/UA4865)' },
    ];

    events.forEach(e => {
      const row = document.createElement('div');
      row.className = 'timeline-row';
      row.innerHTML = `
        <div class="timeline-date">

    const container = document.getElementById('facts-grid');
    const totalBudget = C.budget.personBudgets.groupTotal;

    const facts = [
      { icon:'✈️', label:'Route',     value:'GSO ↔ HND (connecting)',     sub:'Via EWR outbound, IAD on return · not CLT' },
      { icon:'🏠', label:'Stay',      value:'3 Airbnbs ✅',                 sub:'All booked · Shinjuku, Kyoto Stn, Kuromon' },
      { icon:'💴', label:'Budget',    value:`$${totalBudget.toLocaleString()}`, sub:'Combined group budget' },
      { icon:'🚅', label:'Rail',      value:'Shinkansen',                   sub:'SmartEX · Shinagawa ↔ Kyoto/Shin-Osaka' },
      { icon:'💳', label:'Payment',   value:'Cash Primary',                 sub:'7-Eleven ATMs · no tipping' },
      { icon:'📱', label:'Data',      value:'eSIM',                         sub:'Not purchased yet · Airalo or Holafly' },
      { icon:'🌡️', label:'Weather',  value:'37–52°F',                      sub:'Cold & mostly dry in Jan' },
      { icon:'🗣️', label:'Language', value:'Patrick navigates',            sub:'One conversational speaker' },
    ];

    facts.forEach(f => {
      const card = document.createElement('div');
      card.className = 'fact-card';
      card.innerHTML = `
        <div class="fact-icon">${f.icon}</div>
        <div class="fact-label">${f.label}</div>
        <div class="fact-value">${f.value}</div>
        <div class="fact-sub">${f.sub}</div>
      `;
      container.appendChild(card);
    });
  }

  // ── CREW CARDS ─────────────────────────────────────────────
  function buildCrewCards() {
    const container = document.getElementById('crew-grid');
    const maxActivities = Math.max(...C.crew.map(m => m.activityCount.total));

    C.crew.forEach(member => {
      const card = document.createElement('div');
      card.className = 'crew-card';

      const isPotential = member.status === 'potential';
      const isVet = member.japanExp.toLowerCase().includes('veteran');
      const expBg    = isPotential ? 'rgba(124,45,142,0.1)' : isVet ? 'rgba(196,30,58,0.08)' : 'rgba(138,130,120,0.08)';
      const expColor = isPotential ? '#7c2d8e' : isVet ? '#c41e3a' : '#8a8278';
      const expLabel = isPotential ? '⏳ Potential' : isVet ? 'Japan Vet' : 'First Timer';

      const pct = maxActivities > 0
        ? Math.round((member.activityCount.total / maxActivities) * 100)
        : 0;

      card.style.cssText = `--member-color:${member.color}`;
      card.innerHTML = `
        <div class="crew-card-top">
          <div class="crew-avatar" style="background:${member.color}18">
            ${member.emoji}
          </div>
          <div>
            <div class="crew-name">${member.name}</div>
            <div class="crew-kanji">${member.kanji}</div>
          </div>
        </div>
        <div class="crew-role">${member.role}</div>
        <span class="crew-exp-badge" style="background:${expBg};color:${expColor}">${expLabel}</span>
        ${member.activityCount.total > 0 ? `
        <div class="crew-activity-bar">
          <div class="crew-activity-label">
            <span>Activities</span>
            <span>${member.activityCount.total}</span>
          </div>
          <div class="crew-bar-track">
            <div class="crew-bar-fill" style="width:0%;background:${member.color}" data-width="${pct}%"></div>
          </div>
        </div>
        ` : `<div class="crew-activity-label" style="font-size:11px;color:var(--muted);margin-top:4px">Vibes-only itinerary</div>`}
      `;

      // Add top border color
      const style = document.createElement('style');
      style.textContent = ''; // handled via ::before pseudo
      card.style.setProperty('--member-color', member.color);
      card.insertAdjacentHTML('afterbegin',
        `<div style="position:absolute;top:0;left:0;right:0;height:3px;background:${member.color};border-radius:12px 12px 0 0"></div>`
      );

      container.appendChild(card);
    });

    // Animate bars on scroll
    setTimeout(() => {
      document.querySelectorAll('.crew-bar-fill').forEach(bar => {
        bar.style.width = bar.dataset.width;
      });
    }, 600);
  }

  // ── SCROLL FADE-IN ─────────────────────────────────────────
  function initScrollFade() {
    const els = document.querySelectorAll('.fade-in');
    if (!('IntersectionObserver' in window)) {
      els.forEach(el => el.classList.add('visible'));
      return;
    }
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          obs.unobserve(e.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
    els.forEach(el => obs.observe(el));
  }

  // ── INIT ──────────────────────────────────────────────────
  function init() {
    buildNav();
    buildCityStrip();
    buildStats();
    buildAlert();
    buildCityCards();
    buildTimeline();
    buildFacts();
    buildCrewCards();
    initScrollFade();

    updateCountdown();
    setInterval(updateCountdown, 1000);
  }

  document.addEventListener('DOMContentLoaded', init);

})();
</script>

    {id:'chureito-pagoda',person:'patrick',city:'tokyo',category:'temple',type:'Pagoda / Viewpoint',name:'Chureito Pagoda',address:'3353-1 Fujiyoshida, Yamanashi',status:'researching',priority:'pending',estimatedCost:500,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:7,groupActivity:false,description:`The iconic five-story pagoda framing Mount Fuji — one of the most reproduced images of Japan. Reached via 400 stone steps. In January the pagoda is backed by snow-capped Fuji with clear blue sky.`,mapsQuery:'Chureito Pagoda Fujiyoshida Yamanashi',notes:`Day 7 Option A. About 400 steps up — allow 1–1.5 hrs.`,url:null},
    {id:'tako-no-tetsu',person:'patrick',city:'osaka',category:'food',type:'Restaurant',name:'Tako no Tetsu',address:'Umeda/HEP FIVE area, Osaka',status:'researching',priority:'pending',estimatedCost:1500,estimatedDuration:'1–1.5 hours',bookingRequired:false,dayAssigned:14,groupActivity:true,description:`A cook-your-own takoyaki chain with semi-private kotatsu (low heated table) group seating — mix and grill your own batter at the table rather than ordering pre-made. A genuinely fun group activity, not just a food stop. Multiple locations across Osaka, concentrated in the Umeda/HEP FIVE area.`,mapsQuery:'Tako no Tetsu Umeda Osaka',notes:`Cook-your-own takoyaki at kotatsu tables — fun as a group. Several Umeda branches; pick one near the Sky Building.`,url:null},
    {id:'ikebukuro-arcades',person:'patrick',city:'tokyo',category:'arcade',type:'Arcade District',name:'Ikebukuro Arcades',address:'Ikebukuro, Toshima, Tokyo',status:'researching',priority:'pending',estimatedCost:2500,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:3,groupActivity:false,description:`Ikebukuro has a dense cluster of arcades including Namco Ikebukuro and multiple Taito Stations. Less crowded than Akihabara, with a strong local gamer crowd.`,mapsQuery:'Namco Ikebukuro arcade Tokyo',notes:`Extra time only — Akihabara is the main arcade day.`,url:null},
    // ── TOKYO — Jake (5) ──
    {id:'tsukiji-market',person:['patrick','jake','steve','conner','boros','silva'],city:'tokyo',category:'food',type:'Outer Market',name:'Tsukiji Outer Market',address:'4-16-2 Tsukiji, Chuo, Tokyo',status:'confirmed',priority:'pending',estimatedCost:3000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:4,groupActivity:true,description:`The legendary outer market. Stalls sell fresh uni, oysters, tuna sashimi on rice, tamagoyaki, and street snacks. Best food crawl in Tokyo. Go before 9am for freshest cuts.`,mapsQuery:'Tsukiji Outer Market Tokyo',notes:`Budget ¥1,500–2,500 to graze. Mostly cash. Go by 8 AM.`,url:null},
    {id:'tacos-3hermanos',person:'jake',city:'tokyo',category:'food',type:'Restaurant',name:'Tacos 3Hermanos',address:'Shinjuku, Tokyo',status:'confirmed',priority:'pending',estimatedCost:2000,estimatedDuration:'1 hour',bookingRequired:false,dayAssigned:3,groupActivity:true,description:`Authentic Mexican taqueria run by three brothers in Shinjuku. Known for proper corn tortillas, slow-braised meats, and house-made salsas. A cult favorite among Tokyo's expat community.`,mapsQuery:'Tacos 3Hermanos Shinjuku Tokyo',notes:`Only ~2 small tables, no reservations — expect to split.`,url:null},
    {id:'character-street-tokyo-station',person:'jake',city:'tokyo',category:'shopping',type:'Character Merchandise',name:'Character Street (Tokyo Station)',address:'Tokyo Station B1 Yaesu, Chiyoda, Tokyo',status:'confirmed',priority:'pending',estimatedCost:5000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:6,groupActivity:true,description:`Underground shopping street housing official flagship stores for Pokemon, Ghibli, Sanrio, Rilakkuma, and Jump (One Piece, Dragon Ball). Many products are Tokyo Station exclusives.`,mapsQuery:'Character Street Tokyo Station B1',notes:`Tokyo Station B1 — Pokémon Center and the Ghibli store are the main draws.`,url:null},
    {id:'shimokitazawa-thrifting',person:'jake',city:'tokyo',category:'shopping',type:'Vintage District',name:'Shimokitazawa Thrift & Records',address:'Shimokitazawa, Setagaya, Tokyo',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:4,groupActivity:false,description:`Tokyo's most beloved bohemian neighborhood — dense with secondhand clothing stores, vintage record shops, indie cafes, and tiny live music venues. Disk Union has a multi-floor store here.`,mapsQuery:'Shimokitazawa vintage shopping Tokyo',notes:`Shops open 11 AM–noon, so no early start needed.`,url:null},
    {id:'gyukatsu-motomura',person:'jake',city:'tokyo',category:'food',type:'Restaurant',name:'Gyukatsu Motomura',address:'2-14-11 Dogenzaka, Shibuya, Tokyo',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'1 hour',bookingRequired:false,dayAssigned:5,groupActivity:false,description:`The definitive gyukatsu restaurant — beef cutlet served rare then grilled at your table on a small hot stone. The crust is crackling, the inside stays pink. Consistently one of Tokyo's most queued restaurants.`,mapsQuery:'Gyukatsu Motomura Shibuya Tokyo',notes:`20–40 min queues at peak. Go at 11 AM opening or after 2 PM; ~10 seats, so expect 2 tables.`,url:null},
    // ── TOKYO — Steve (1) ──
    {id:'snoopy-museum',person:'steve',city:'tokyo',category:'museum',type:'Museum',name:'Snoopy Museum',address:'2-1-1 Higashida, Asahi, Kanagawa',status:'researching',priority:'pending',estimatedCost:1200,estimatedDuration:'1–2 hours',bookingRequired:true,dayAssigned:7,groupActivity:false,description:`The only permanent Snoopy Museum outside of California. Houses original Charles M. Schulz illustrations, immersive Peanuts-themed installations, a Snoopy cafe and shop.`,mapsQuery:'Snoopy Museum Kanagawa Japan',notes:`Ghibli backup only (Day 5) — tickets go on sale Dec 1; buy only if Ghibli fails on Dec 10. ~35 min from Shibuya.`,url:null},
    // ── TOKYO — Conner (1) ──
    {id:'glitch-coffee',person:'conner',city:'tokyo',category:'cafe',type:'Specialty Coffee',name:'Glitch Coffee & Roasters',address:'3-16 Kanda Nishikicho, Chiyoda, Tokyo',status:'researching',priority:'pending',estimatedCost:800,estimatedDuration:'1 hour',bookingRequired:false,dayAssigned:4,groupActivity:false,description:`One of Tokyo's most acclaimed specialty coffee roasters. Slow-bar single-origin pourover and espresso, sourced and roasted in-house. Consistently on Asia's best coffee lists.`,mapsQuery:'Glitch Coffee Roasters Jinbocho Tokyo',notes:`Quiet-only: no calls, little chatter, no photos. Small space — go off-peak. ¥700–1,200 a cup.`,url:null},
    // ── OSAKA — Patrick (5) ──
    {id:'silver-ball-planet',person:'patrick',city:'osaka',category:'arcade',type:'Pinball Arcade',name:'Silver Ball Planet',address:'1-6-14 Shinsaibashisuji, Chuo, Osaka',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:12,groupActivity:false,description:`The best pinball arcade in Japan — 100+ machines spanning 1970s electromechanical tables through modern Stern and Jersey Jack titles. Free entry, ¥100 per game. Maintained in exceptional condition.`,mapsQuery:'Silver Ball Planet Shinsaibashi Osaka',notes:`¥100 a game, free entry. Get change at the counter; rare Japan-only machines.`,url:null},
    {id:'dragon-quest-island',person:'patrick',city:'osaka',category:'themepark',type:'Theme Park',name:'Dragon Quest Island (Nijigen no Mori)',address:'Nijigen no Mori, Awaji Island, Hyogo',status:'researching',priority:'pending',estimatedCost:5000,estimatedDuration:'Full day',bookingRequired:true,dayAssigned:14,groupActivity:true,description:`Outdoor adventure theme park on Awaji Island with a massive Dragon Quest dark ride, archery, rope courses, and a Naruto/Boruto attraction. Features a giant Slime and monster encounter system.`,mapsQuery:'Nijigen no Mori Awaji Island Dragon Quest',notes:`Same park as the Naruto area on Day 14 — fit it in if time allows.`,url:null},
    {id:'kobe',person:'patrick',city:'osaka',category:'nature',type:'Day Trip',name:'Kobe',address:'Kobe, Hyogo',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'Half day',bookingRequired:false,dayAssigned:14,groupActivity:true,description:`Sophisticated port city 30 min from Osaka. Famous for Kobe beef, the Kitano foreigners' district of Victorian-era houses, Meriken Park waterfront, and a cosmopolitan atmosphere.`,mapsQuery:'Kobe Japan Kitano district',notes:`Day 14 Kobe group. Kintetsu through-train from Nippombashi, ~40 min.`,url:null},
    {id:'dotonbori-street',person:'patrick',city:'osaka',category:'food',type:'Street Food District',name:'Dotonbori',address:'Dotonbori, Chuo, Osaka',status:'confirmed',priority:'pending',estimatedCost:3000,estimatedDuration:'2–4 hours',bookingRequired:false,dayAssigned:12,groupActivity:true,description:`Osaka's most famous entertainment and food strip. The glowing Glico Running Man sign, the giant crab, takoyaki stalls, okonomiyaki restaurants, and the Tombori Riverwalk. Everything is bigger and more neon than it needs to be.`,mapsQuery:'Dotonbori Osaka neon street',notes:`Best at night with the neon on. 5 min from the Airbnb.`,url:null},
    {id:'eorzea-cafe-dotonbori',person:'patrick',city:'osaka',category:'cafe',type:'Themed Cafe',name:'Eorzea Cafe (Dotonbori)',address:'Dotonbori, Chuo, Osaka',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'90 mins',bookingRequired:true,dayAssigned:null,groupActivity:false,description:`The Osaka branch of the official FFXIV cafe. Same timed-seating format as Akihabara: themed dishes, elaborate drinks, exclusive merch, and decor that feels like stepping into Eorzea.`,mapsQuery:'Eorzea Cafe Dotonbori Osaka',notes:`Not on the itinerary — the Akihabara branch was chosen.`,url:'https://www.pasela.co.jp/paselabo_shop/ff_eorzea/'},
    // ── OSAKA — Jake (2) ──
    {id:'the-munch',person:'jake',city:'osaka',category:'cafe',type:'Specialty Coffee',name:'The Munch',address:'Yao, Osaka',status:'researching',priority:'pending',estimatedCost:1500,estimatedDuration:'1.5–2 hours',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`Acclaimed Osaka specialty coffee shop known for barrel-aged and experimental brewing methods. One of the most talked-about independent cafes in the Kansai region.`,mapsQuery:'The Munch coffee Yao Osaka',notes:`Not on the itinerary. ~45 min out in Yao, and a single pour can take ~50 min.`,url:null},
    {id:'izakaya-toyo',person:'jake',city:'osaka',category:'food',type:'Izakaya',name:'Izakaya Toyo',address:'2-1-5 Morinomiya, Osaka',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:15,groupActivity:true,description:`Famous from Netflix Street Food Asia. Master chef Toyo-san grills food tableside using a blowtorch, improvising dishes based on what's fresh that day. No menu, no reservations — Toyo decides what you eat. One of the most unique dining experiences in Japan.`,mapsQuery:'Izakaya Toyo Kyobashi Osaka',notes:`⚠️ Closed Thursdays. Day 15 at noon — queue by 11:15, cash only, standing room.`,url:null},
    // ── KYOTO — Jake (14) ──
    {id:'nishiki-market',person:['jake','conner'],city:'kyoto',category:'food',type:'Covered Market',name:'Nishiki Market',address:'Nishiki Market, Nakagyo, Kyoto',status:'confirmed',priority:'pending',estimatedCost:2500,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:10,groupActivity:true,description:`A 400-meter covered shopping street known as Kyoto's Kitchen — 100+ vendors selling pickled vegetables, fresh tofu, grilled skewers, matcha sweets, and specialty ingredients. Running since the Heian period.`,mapsQuery:'Nishiki Market Kyoto covered street',notes:`Stalls close ~5–6 PM — go hungry. Mostly cash.`,url:null},
    {id:'pontocho-alley',person:'jake',city:'kyoto',category:'bar',type:'Restaurant & Bar Alley',name:'Pontocho Alley',address:'Pontocho, Nakagyo, Kyoto',status:'confirmed',priority:'pending',estimatedCost:4000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:8,groupActivity:true,description:`Narrow, lantern-lit alley alongside the Kamogawa River — one of Kyoto's most atmospheric dining streets. Traditional restaurants, sake bars, and cocktail spots in preserved townhouses.`,mapsQuery:'Pontocho Alley Kyoto Japan',notes:`Wander and pick — most spots need no booking. Best after 7 PM.`,url:null},
    {id:'kinkaku-ji',person:'jake',city:'kyoto',category:'temple',type:'Zen Temple',name:'Kinkaku-ji (Golden Pavilion)',address:'1 Kinkakujicho, Kita, Kyoto',status:'confirmed',priority:'pending',estimatedCost:500,estimatedDuration:'1 hour',bookingRequired:false,dayAssigned:8,groupActivity:true,description:`A three-story Zen Buddhist temple covered in gold leaf, reflected in Kyokochi Pond. Originally built as a shogun's retirement villa in 1397. One of Japan's most iconic images.`,mapsQuery:'Kinkaku-ji Golden Pavilion Kyoto',notes:`¥500. Closes 5 PM. ~1 km from Ryoan-ji.`,url:null},
    {id:'ryoan-ji',person:'jake',city:'kyoto',category:'temple',type:'Zen Temple',name:'Ryoan-ji',address:'13 Ryoanji Goryonoshitacho, Ukyo, Kyoto',status:'confirmed',priority:'pending',estimatedCost:600,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:8,groupActivity:true,description:`Home to Japan's most famous rock garden — 15 carefully raked stones whose exact arrangement has never been officially explained. A UNESCO World Heritage Site.`,mapsQuery:'Ryoan-ji rock garden Kyoto',notes:`¥600. Closes 4:30 PM in winter. ~1 km walk from Kinkaku-ji.`,url:null},
    {id:'shinsen-en-water-garden',person:'jake',city:'kyoto',category:'temple',type:'Historic Garden',name:'Shinsen-en Water Garden',address:'Monzen-cho, Nakagyo, Kyoto',status:'researching',priority:'pending',estimatedCost:0,estimatedDuration:'30 mins',bookingRequired:false,dayAssigned:10,groupActivity:true,description:`A free, almost entirely overlooked garden hidden behind Nijo Castle — the last remnant of an imperial garden from the 9th century. A small vermilion bridge crosses a sacred carp pond. Completely peaceful.`,mapsQuery:'Shinsen-en garden Kyoto Japan',notes:`Free, and usually quiet. Right by Nijo Castle.`,url:null},
    {id:'nijo-castle',person:'jake',city:'kyoto',category:'temple',type:'Castle',name:'Nijo Castle',address:'541 Nijojocho, Nakagyo, Kyoto',status:'confirmed',priority:'pending',estimatedCost:800,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:10,groupActivity:true,description:`The Kyoto residence of the Tokugawa shoguns. Famous for nightingale floors — corridors engineered to squeak when walked on to alert against assassins. Spectacular Ninomaru Palace interiors.`,mapsQuery:'Nijo Castle Kyoto Japan',notes:`¥800, last entry ~4 PM. The palace interiors are the best in Kyoto.`,url:null},
    {id:'fushimi-inari',person:'jake',city:'kyoto',category:'temple',type:'Shinto Shrine',name:'Fushimi Inari',address:'68 Fukakusa Yabunouchicho, Fushimi, Kyoto',status:'confirmed',priority:'pending',estimatedCost:0,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:9,groupActivity:true,description:`Thousands of vermilion torii gates winding up the sacred Mount Inari. The lower section is crowded; the upper trails become quiet forest. Full summit hike is 4km round-trip. Free entry.`,mapsQuery:'Fushimi Inari Shrine Kyoto torii gates',notes:`Before 7 AM for empty gates. Turn back at Yotsutsuji to save time.`,url:null},
    {id:'fushimi-sake-district',person:'jake',city:'kyoto',category:'food',type:'Historic District',name:'Fushimi Sake District',address:'Fushimi, Kyoto',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:9,groupActivity:true,description:`Fushimi has been producing sake for over 400 years. Walk the historic kura district with weeping willows along stone-walled canals. Multiple breweries offer tastings.`,mapsQuery:'Fushimi sake brewery district Kyoto',notes:`Tasting rooms and a communal sake hall — Kintetsu from Ogura to Momoyama-Goryomae.`,url:null},
    {id:'arashiyama-bamboo-forest',person:'jake',city:'kyoto',category:'nature',type:'Nature Walk',name:'Arashiyama Bamboo Forest',address:'Sagaogurayama Tabuchiyamacho, Ukyo, Kyoto',status:'confirmed',priority:'pending',estimatedCost:0,estimatedDuration:'30 min walk',bookingRequired:false,dayAssigned:10,groupActivity:true,description:`A short but extraordinary path through towering groves of moso bamboo. The stalks filter light into an almost supernatural glow. One of Japan's most photographed natural features. Free and open 24 hours.`,mapsQuery:'Arashiyama Bamboo Forest Kyoto',notes:`Crowded from ~10 AM — be there by 8.`,url:null},
    {id:'tenryu-ji',person:'jake',city:'kyoto',category:'temple',type:'Zen Temple',name:'Tenryu-ji',address:'68 Sagatenryuji Susukinobabacho, Ukyo, Kyoto',status:'confirmed',priority:'pending',estimatedCost:600,estimatedDuration:'1 hour',bookingRequired:false,dayAssigned:10,groupActivity:true,description:`A UNESCO World Heritage Zen temple with one of Japan's most celebrated garden landscapes. The garden borrows the Arashiyama mountains as a backdrop — a technique called shakkei.`,mapsQuery:'Tenryu-ji Zen temple Arashiyama Kyoto',notes:`¥600, opens 8:30. Right at the bamboo path — go before the grove.`,url:null},
    {id:'otagi-nenbutsu-ji',person:'jake',city:'kyoto',category:'temple',type:'Temple',name:'Otagi Nenbutsu-ji',address:'2-5 Sagatoriimotofukenishicho, Ukyo, Kyoto',status:'researching',priority:'pending',estimatedCost:300,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:10,groupActivity:false,description:`A small, deeply atmospheric temple with 1,200 unique stone rakan statues, each carved individually by volunteers between 1981 and 1991. No two are alike. One of Kyoto's most memorable off-the-beaten-path sites.`,mapsQuery:'Otagi Nenbutsu-ji temple Kyoto',notes:`¥300. Far end of Arashiyama — taxi. First thing to cut if running late.`,url:null},
    {id:'higashiyama-district',person:'jake',city:'kyoto',category:'nature',type:'Historic District',name:'Higashiyama District',address:'Higashiyama, Kyoto',status:'confirmed',priority:'pending',estimatedCost:0,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:11,groupActivity:true,description:`Kyoto's most preserved historic district. Stone-paved lanes of Ninenzaka and Sannenzaka wind through traditional shops, matcha cafes, and craft stores. Leads from Kiyomizudera down through Yasaka Pagoda to Gion.`,mapsQuery:'Higashiyama district Ninenzaka Kyoto',notes:`Walk downhill from Kiyomizudera to Yasaka Pagoda.`,url:null},
    {id:'yasaka-pagoda',person:'jake',city:'kyoto',category:'temple',type:'Pagoda',name:'Yasaka Pagoda',address:'407 Yasaka Kitamachi, Higashiyama, Kyoto',status:'confirmed',priority:'pending',estimatedCost:0,estimatedDuration:'15 mins',bookingRequired:false,dayAssigned:11,groupActivity:true,description:`A 46-meter five-story pagoda dating to 592 AD — the last remaining structure of the ancient Hokanji temple. One of Kyoto's most iconic silhouettes, particularly striking at dusk.`,mapsQuery:'Yasaka Pagoda Hokanji Higashiyama Kyoto',notes:`Free. Best photo is looking up the stone lane from below.`,url:null},
    {id:'kiyomizudera-temple',person:'jake',city:'kyoto',category:'temple',type:'Temple',name:'Kiyomizudera',address:'1-294 Kiyomizu, Higashiyama, Kyoto',status:'confirmed',priority:'pending',estimatedCost:400,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:11,groupActivity:true,description:`One of Japan's most celebrated temples, founded in 780 AD and rebuilt in 1633 without a single nail. The main hall extends over a hillside on a vast wooden stage with commanding views over Kyoto.`,mapsQuery:'Kiyomizudera Temple Kyoto Japan',notes:`¥400. Busy but worth it; late afternoon has the best light.`,url:null},

    {id:'super-potato',person:'ai',city:'tokyo',category:'arcade',type:'Retro Game Store',name:'Super Potato',address:'1-11-2 Sotokanda, Chiyoda, Tokyo',status:'researching',priority:'pending',estimatedCost:5000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:6,groupActivity:false,description:`Five floors of retro gaming inside a Akihabara building — Famicom, Super Famicom, PC Engine, Mega Drive, arcade boards, handhelds, and accessories going back to the 70s. Glass cases full of graded cartridges. The neon signs and low ceilings make it feel genuinely nostalgic. Patrick and Jake will lose track of time here.`,mapsQuery:'Super Potato Akihabara Tokyo',notes:`Above a pachinko parlor on the main strip. Prices are fair; the selection runs deep.`,url:null},

    {id:'mandarake-akihabara',person:'ai',city:'tokyo',category:'shopping',type:'Anime & Manga Store',name:'Mandarake Complex',address:'3-11-12 Sotokanda, Chiyoda, Tokyo',status:'researching',priority:'pending',estimatedCost:5000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:6,groupActivity:false,description:`Eight floors dedicated to second-hand manga, anime figures, doujinshi, cosplay, and vintage merch. Serious collectors treat this as a pilgrimage. The figure selection alone justifies the trip — pre-owned items at a fraction of retail, some rare and discontinued. Patrick and Jake's primary collecting destination in Akihabara.`,mapsQuery:'Mandarake Complex Akihabara Tokyo',notes:`Each floor is a different category; the rarest items are on top. Bags are checked at the entrance.`,url:null},
    {id:'akihabara-shopping-silva',person:'silva',city:'tokyo',category:'shopping',type:'Anime & Gaming District',name:'Akihabara Shopping',address:'Akihabara, Chiyoda, Tokyo',status:'researching',priority:'pending',estimatedCost:5000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:6,groupActivity:false,description:`A free-roam shopping block through Akihabara's dense cluster of anime, manga, and gaming stores — Mandarake, Animate, Super Potato, Yodobashi, and dozens of smaller figure and card shops along the main strip and side streets. Less a single destination than a few hours of wandering and seeing what turns up. One Piece, Dragon Quest, and general figure-collecting territory — exactly Silva's pace for the day.`,mapsQuery:'Akihabara shopping district Tokyo',notes:`Open-ended browsing in the same few blocks as everyone else on Day 6.`,url:null},

    {id:'omoide-yokocho',person:['ai','jake'],city:'tokyo',category:'bar',type:'Alley Bar District',name:'Omoide Yokocho',address:'1-2-11 Nishishinjuku, Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:2500,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:3,groupActivity:true,description:`Tiny, smoke-filled alleyway tucked behind Shinjuku Station West Exit — one of the few surviving post-war black market lanes. Narrow enough that the plastic stools of opposite restaurants nearly touch. Yakitori grills, cold Sapporo, salarymen and tourists shoulder to shoulder. The grease and smoke are part of the experience. Perfect before or after Golden Gai.`,mapsQuery:'Omoide Yokocho Memory Lane Shinjuku Tokyo',notes:`"Memory Lane." Stalls fit 6–8. Best after 8 PM.`,url:null},

    {id:'disk-union-shinjuku',person:'ai',city:'tokyo',category:'shopping',type:'Vinyl Record Store',name:'Disk Union Shinjuku',address:'3-31-4 Shinjuku, Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:4000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:3,groupActivity:false,description:`The flagship location of Japan's best independent record chain. Multiple floors split by genre — jazz, city-pop, rock, electronic, Japanese indie. Unmatched for rare domestic pressings and OBI-strip editions that only exist in Japan. If Patrick isn't maxing out his vinyl budget here, he's showing restraint.`,mapsQuery:'Disk Union Shinjuku Tokyo records',notes:`The deepest stock of the Disk Union stores. Walkable from the Airbnb.`,url:null},

    {id:'kabukicho-bar-hop',person:'ai',city:'tokyo',category:'bar',type:'Nightlife District',name:'Kabukicho Bar Hop',address:'Kabukicho, Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'3–5 hours',bookingRequired:false,dayAssigned:3,groupActivity:false,description:`Tokyo's most concentrated nightlife district — the area around the Kabukicho Tower is packed with multi-floor bar buildings, karaoke complexes, and clubs running until dawn. Steve and Boros can break off here after the group wraps for the night and find something open at any hour. Robot Restaurant is nearby if they want spectacle.`,mapsQuery:'Kabukicho nightlife Shinjuku Tokyo',notes:`No plan needed — Kuyakusho-dori has the most options. Walkable home.`,url:null},

    {id:'jazz-bar-shinjuku',person:'ai',city:'tokyo',category:'bar',type:'Jazz Bar',name:'Jazz Bar DUG',address:'3-17-12 Shinjuku, Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:3,groupActivity:false,description:`One of Tokyo's oldest surviving jazz bars, open since 1964. Dark, intimate, and serious about the music — vinyl records played on real equipment, whisky selection carefully curated. Exactly the kind of quiet, authentic Tokyo experience Conner is here for. Closes relatively early compared to nightlife bars but perfect for an evening wind-down.`,mapsQuery:'Jazz Bar DUG Shinjuku Tokyo',notes:`¥500–800 cover, strong whisky list, smoking section. Small tables — go early.`,url:null},

    {id:'ameya-yokocho',person:'ai',city:'tokyo',category:'food',type:'Street Market',name:'Ameya-Yokocho Market',address:'4-chome Ueno, Taito, Tokyo',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:2,groupActivity:true,description:`A dense 500-meter covered market running under the JR tracks between Ueno and Okachimachi stations. Hundreds of stalls selling dried seafood, nuts, street food, cheap clothing, and trinkets. Loud, busy, and great vlogging material. The atmosphere is chaotic in the best way — Jake will have the camera out constantly.`,mapsQuery:'Ameya-Yokocho market Ueno Tokyo',notes:`Next to Ueno Station. Cheap street food for the Day 2 lunch.`,url:null},

    {id:'shin-okubo-koreatown',person:'ai',city:'tokyo',category:'food',type:'Neighbourhood',name:'Shin-Okubo Korea Town',address:'Shin-Okubo, Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:1,groupActivity:true,description:`Tokyo's Korea Town — one stop from Shinjuku on the Yamanote Line. Dense with Korean BBQ, fried chicken, tteokbokki street stalls, K-pop merchandise shops, and bubble tea. Good midday food crawl energy and close enough to Shinjuku to fold into almost any day. Wiggle Wiggle also has a presence here.`,mapsQuery:'Shin-Okubo Korea Town Tokyo',notes:`Steps from the Airbnb — the easy Day 1 landing dinner.`,url:null},

    // KYOTO — gaps: nightlife (Steve/Boros), group evening activity, Conner coffee
    {id:'kyoto-jazz-bar',person:'ai',city:'kyoto',category:'bar',type:'Jazz Bar',name:'Bar Isn\'t It',address:'Nakagyo, Kyoto',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:8,groupActivity:false,description:`One of Kyoto's most beloved jazz bars, tucked into the Nakagyo district near the bar streets. The music is taken seriously — proper bebop and hard bop on vinyl, knowledgeable staff, and a whisky list that Conner will appreciate. Small, intimate, and far from touristy. Exactly the kind of discovery that makes a trip memorable.`,mapsQuery:'Bar Isn\'t It jazz Kyoto',notes:`⚠️ Couldn't be confirmed as a real venue — check the original source before planning a night around it.`,url:null},

    {id:'philosopher-path',person:'ai',city:'kyoto',category:'nature',type:'Scenic Walk',name:"Philosopher's Path",address:'Sakyo, Kyoto',status:'researching',priority:'pending',estimatedCost:0,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:11,groupActivity:true,description:`A 2km stone path running alongside a cherry-tree-lined canal between Nanzenji and Ginkakuji temples. Named after philosopher Nishida Kitaro who reportedly walked it daily. In January the bare trees have a stark, quiet beauty and the path is almost empty compared to spring. Connects several minor temples worth ducking into.`,mapsQuery:"Philosopher's Path Kyoto canal walk",notes:`Free canal walk; ends near Nanzen-ji, then taxi to Kiyomizudera.`,url:null},

    {id:'gion-at-night',person:'ai',city:'kyoto',category:'nature',type:'Evening Walk',name:'Gion at Night',address:'Gion, Higashiyama, Kyoto',status:'researching',priority:'pending',estimatedCost:500,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:11,groupActivity:true,description:`Kyoto's famous geisha district is completely transformed after dark. The stone-lantern-lit streets of Hanamikoji and Shinbashi-dori are quieter than daytime, the ochaya (teahouses) glow amber, and the occasional maiko in full dress moves quickly between appointments. The most atmospheric evening walk in Japan. Free to wander.`,mapsQuery:'Gion district at night Kyoto Japan',notes:`Best 7–9 PM. Fines for photos or entry on private lanes — follow the signs.`,url:null},

    {id:'wife-and-husband-coffee',person:'ai',city:'kyoto',category:'cafe',type:'Specialty Coffee',name:'Wife & Husband Coffee',address:'Kamigamo, Kita, Kyoto',status:'researching',priority:'pending',estimatedCost:700,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:10,groupActivity:false,description:`A tiny, deeply charming specialty coffee shop in northern Kyoto run by a married couple. Hand-drip pourover from a focused selection of origins, served in a converted house with mismatched vintage furniture and a garden. One of the most photographed cafes in Kyoto for good reason. Worth the short trip north.`,mapsQuery:'Wife and Husband Coffee Kyoto',notes:`Only 10 seats and a quiet vibe — use their riverside picnic-basket rental for a group. Karasuma Line to Kitaoji.`,url:null},

    // OSAKA — gaps: Conner (food/whisky), Steve/Boros (nightlife specific), group
    {id:'kuromon-market',person:'ai',city:'osaka',category:'food',type:'Market',name:'Kuromon Ichiba Market',address:'2-4-1 Nipponbashi, Naniwa, Osaka',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:13,groupActivity:true,description:`Osaka's premier fresh food market, nicknamed "Osaka's Kitchen." 180+ stalls selling fresh seafood, wagyu skewers, whole king crab, sea urchin, and Osaka street food classics. Walk and eat — every vendor is set up for it. Jake will have a field day here, Conner will be in his element, and even Steve will find something to eat.`,mapsQuery:'Kuromon Ichiba Market Osaka',notes:`1 min from the Airbnb. Budget ¥2,000–3,000 for a proper crawl.`,url:null},

    {id:'amerikamura',person:'ai',city:'osaka',category:'shopping',type:'Neighbourhood',name:'Amerika-Mura',address:'Amerika-Mura, Chuo, Osaka',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:12,groupActivity:true,description:`Osaka's version of Harajuku — a dense grid of vintage clothing shops, streetwear, record stores, and small cafes around Triangle Park. More approachable and less crowded than Tokyo's equivalent. Great for thrifting, people-watching, and finding Osaka-specific streetwear. Good afternoon activity before Dotonbori.`,mapsQuery:'Amerika-Mura Osaka Triangle Park',notes:`5 min from Shinsaibashi Station — streetwear and vintage.`,url:null},

    {id:'whiskyholic-osaka',person:'ai',city:'osaka',category:'bar',type:'Whisky Bar',name:'Whiskyholic',address:'Namba, Osaka',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:13,groupActivity:false,description:`A serious whisky bar in the Namba area with an extensive Japanese whisky list — Nikka, Suntory, Yamazaki, Hakushu, plus rarer single cask expressions. The kind of bar Conner comes to Japan specifically to find. Relaxed atmosphere, knowledgeable staff, no pressure. A civilised alternative to the louder Dotonbori scene.`,mapsQuery:'Whiskyholic whisky bar Namba Osaka',notes:`⚠️ Address unconfirmed — check before going. Likely small.`,url:null},

    {id:'namba-nightlife',person:'ai',city:'osaka',category:'bar',type:'Nightlife District',name:'Namba & Shinsaibashi Nightlife',address:'Namba, Chuo, Osaka',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'3–5 hours',bookingRequired:false,dayAssigned:12,groupActivity:false,description:`Osaka's nightlife is concentrated in and around Namba and Shinsaibashi. Dense with bars, clubs, izakayas, and late-night ramen spots — all within walking distance of the Airbnb. Steve and Boros can operate freely here every night in Osaka without needing transit. The energy runs later than Tokyo and the people are friendlier.`,mapsQuery:'Namba nightlife district Osaka',notes:`Walkable home every Osaka night.`,url:null},
    // ── BATCH 2 AI SUGGESTIONS ──

    // KYOTO — Entertainment (0), extra cafes, food, bars for Steve/Boros nights
    {id:'kyoto-samurai-ninja-museum',person:'ai',city:'kyoto',category:'entertainment',type:'Museum & Experience',name:'Samurai & Ninja Museum Kyoto',address:'Nakagyo, Kyoto',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'1–2 hours',bookingRequired:true,dayAssigned:10,groupActivity:true,description:`Interactive museum where you can wear samurai armour, handle real katana, and take a guided tour through the history of the samurai class. Ninja shuriken throwing and costume experiences available. Legitimately fun and informative — not as cheesy as it sounds. Booked as a 3:30 PM timed slot for 6 on Day 10.`,mapsQuery:'Samurai Ninja Museum Kyoto',notes:`Book the 3:30 PM slot for 6. Guided in English; some physical elements.`,url:null},

    {id:'kyoto-ramen-alley',person:'ai',city:'kyoto',category:'food',type:'Restaurant District',name:'Kyoto Ramen Koji',address:'Kyoto Station 10F, Shimogyo, Kyoto',status:'researching',priority:'pending',estimatedCost:1500,estimatedDuration:'1 hour',bookingRequired:false,dayAssigned:8,groupActivity:true,description:`Eight ramen shops on the 10th floor of Kyoto Station Tower, each representing a different regional style — Kyoto-style chicken broth, Sapporo miso, Hakata tonkotsu. Perfect first meal in Kyoto after arriving from Tokyo on the Shinkansen. Convenient, high quality, and covers every preference including Steve's picky palate.`,mapsQuery:'Kyoto Ramen Koji Kyoto Station',notes:`Kyoto Station 10F — the Day 8 arrival lunch.`,url:null},

    {id:'kyoto-craft-beer',person:'ai',city:'kyoto',category:'bar',type:'Craft Beer Bar',name:'Bungalow Kyoto',address:'Nakagyo, Kyoto',status:'researching',priority:'pending',estimatedCost:2500,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:8,groupActivity:true,description:`One of Kyoto's best craft beer bars — rotating taps of Japanese and international craft beers in a relaxed, modern space. More approachable than the jazz bars for the whole group. Good for an early evening wind-down that works for everyone from Steve to Conner. Often has a solid snack menu too.`,mapsQuery:'Bungalow craft beer bar Kyoto',notes:`Service can be curt and seating is shared. Head upstairs for a group of 6.`,url:null},

    {id:'nishiki-tenmangu',person:'ai',city:'kyoto',category:'temple',type:'Shrine',name:'Nishiki Tenmangu Shrine',address:'Nishikikoji, Nakagyo, Kyoto',status:'researching',priority:'pending',estimatedCost:0,estimatedDuration:'20 mins',bookingRequired:false,dayAssigned:10,groupActivity:true,description:`A small Shinto shrine hidden at the end of Nishiki Market, dedicated to the god of learning. Tiny but atmospheric — red lanterns, stone foxes, incense smoke mixing with the market smells behind you. One of those finds that makes a trip feel real. Free entry, five minutes from the market stalls.`,mapsQuery:'Nishiki Tenmangu Shrine Kyoto',notes:`At the east end of Nishiki — add it on the way out.`,url:null},

    {id:'kyoto-matcha-experience',person:'ai',city:'kyoto',category:'cafe',type:'Tea Ceremony & Cafe',name:'Ippodo Tea Kyoto',address:'Teramachi, Nakagyo, Kyoto',status:'researching',priority:'pending',estimatedCost:1200,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:10,groupActivity:true,description:`Ippodo is one of Japan's most respected tea merchants, founded in 1717. Their Kyoto cafe serves proper matcha — whisked at the counter, served with a seasonal wagashi sweet. The difference between this and tourist matcha ice cream is enormous. Conner will appreciate the craft; everyone else will appreciate how good real matcha actually tastes.`,mapsQuery:'Ippodo Tea Kyoto cafe',notes:`Walk-in only; waits run up to an hour. Tea tins make good gifts.`,url:null},

    // OSAKA — Temples (0), gaming/entertainment, Boros specific, Steve specific
    {id:'osaka-castle',person:'ai',city:'osaka',category:'temple',type:'Castle',name:'Osaka Castle',address:'1-1 Osakajo, Chuo, Osaka',status:'researching',priority:'pending',estimatedCost:600,estimatedDuration:'2 hours',bookingRequired:false,dayAssigned:13,groupActivity:true,description:`One of Japan's most iconic landmarks — a five-story castle keep rebuilt in 1931 on the original 1583 foundations, surrounded by enormous stone walls and a moat. The museum inside covers the rise of Toyotomi Hideyoshi and the battles that shaped modern Japan. January means bare trees and crisp air with almost no queues. The grounds are free; the keep is ¥600.`,mapsQuery:'Osaka Castle Japan',notes:`¥600 for the keep. Allow 1.5–2 hrs. ~20 min by subway.`,url:null},

    {id:'den-den-town',person:'ai',city:'osaka',category:'arcade',type:'Electronics & Gaming District',name:'Den Den Town',address:'Nipponbashi, Naniwa, Osaka',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:13,groupActivity:false,description:`Osaka's version of Akihabara — a multi-block stretch of electronics shops, retro game stores, anime merchandise, and maid cafes. Smaller and less overwhelming than Akihabara but has its own unique finds including Osaka-exclusive merchandise and a slightly grittier character. Patrick and Jake will want dedicated time here.`,mapsQuery:'Den Den Town Nipponbashi Osaka',notes:`On the Airbnb doorstep. The south end has the better retro game shops.`,url:null},

    {id:'spa-world-osaka',person:'ai',city:'osaka',category:'entertainment',type:'Onsen Complex',name:'Spa World',address:'3-4-24 Ebisuhigashi, Naniwa, Osaka',status:'researching',priority:'pending',estimatedCost:1500,estimatedDuration:'3–4 hours',bookingRequired:false,dayAssigned:13,groupActivity:false,description:`Enormous multi-floor onsen complex in Shinsekai with themed bath areas from around the world — Roman baths, Finnish sauna, Turkish hammam, Japanese rotenburo. Open 24 hours. Steve and Boros can treat this as a late-night wind-down after bars; the rest of the group can use it as a mid-afternoon recovery. ¥1,500 entry.`,mapsQuery:'Spa World Osaka onsen',notes:`Day 13 afternoon for the Shinsekai group — or a 2–3 AM option after the bars.`,url:null},

    {id:'shinsekai-osaka',person:'ai',city:'osaka',category:'food',type:'Retro District',name:'Shinsekai',address:'Shinsekai, Naniwa, Osaka',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:13,groupActivity:true,description:`One of Osaka's most distinctive old-town districts, built in 1912 modelled on Paris and New York. Narrow streets packed with kushikatsu restaurants, old-school pachinko parlours, and vintage signage surrounding the Tsutenkaku Tower. The antidote to the tourist gloss of Dotonbori — this is Osaka the way it actually was. Kushikatsu (deep-fried skewers) originated here.`,mapsQuery:'Shinsekai Tsutenkaku Tower Osaka',notes:`Try kushikatsu — no double-dipping the sauce. 10–15 min walk from the Airbnb.`,url:null},

    {id:'tsutenkaku-tower',person:'ai',city:'osaka',category:'landmark',type:'Observation Tower',name:'Tsutenkaku Tower',address:'1-18-6 Ebisuhigashi, Naniwa, Osaka',status:'researching',priority:'pending',estimatedCost:1000,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:13,groupActivity:true,description:`The retro symbol of Osaka — a 103m tower in the Shinsekai district, originally built in 1912 and rebuilt in 1956. Less famous than Tokyo Skytree but far more characterful. The observation deck has unobstructed views of southern Osaka and the Shinsekai streets below. A good photo stop before dinner in the neighbourhood.`,mapsQuery:'Tsutenkaku Tower Osaka',notes:`Ticket booth at street level. The neon is best at night.`,url:null},

    // BOROS specific (0 currently)
    {id:'boros-karaoke-osaka',person:'ai',city:'osaka',category:'entertainment',type:'Karaoke',name:'Joysound Osaka Namba',address:'Namba, Chuo, Osaka',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:null,groupActivity:true,description:`Large karaoke chain in the heart of Namba with private rooms for groups, an extensive English-language song library, and all-you-can-drink options. Boros's kind of night — easy, social, loud. A natural group activity for the Osaka leg that doesn't require planning or Japanese skills. Open very late.`,mapsQuery:'Joysound Karaoke Namba Osaka',notes:`Not on the itinerary. Easy group karaoke; book a few hours ahead.`,url:null},

    {id:'boros-teamlab-osaka',person:'ai',city:'osaka',category:'museum',type:'Digital Art Museum',name:'teamLab Botanical Garden Osaka',address:'Naka, Tsurumi, Osaka',status:'researching',priority:'pending',estimatedCost:3200,estimatedDuration:'1–2 hours',bookingRequired:true,dayAssigned:12,groupActivity:true,description:`Nighttime digital art installation in Osaka's Tsurumi Ryokuchi Park — illuminated flowers, projected light patterns through trees, and interactive light floors. A completely different experience to teamLab Borderless in Tokyo. Boros is going to appreciate the spectacle even if he can't explain why. Good group evening activity.`,mapsQuery:'teamLab Botanical Garden Osaka Tsurumi',notes:`Night-only tickets at teamlab.art — they sell out. Midosuji Line to Nagai, ~15 min.`,url:'https://www.teamlab.art/e/botanicalgarden-osaka/'},

    // STEVE specific (only Snoopy Museum currently)
    {id:'steve-toricafe-kyoto',person:'ai',city:'kyoto',category:'bar',type:'Standing Bar',name:'Tori no Ichi Sake Bar',address:'Fushimi, Kyoto',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:9,groupActivity:false,description:`A standing sake bar in the Fushimi sake district — where Steve can finally try Japanese sake the way it should be experienced: poured fresh from local breweries, standing at a counter, no ceremony. The Fushimi area has multiple standing sake bars and sake vending machines. Something Steve will enjoy far more than he expects to.`,mapsQuery:'Fushimi sake bar standing Kyoto',notes:`Communal tables built for groups. Even picky drinkers find something.`,url:null},

    {id:'steve-hoppy-street',person:'ai',city:'tokyo',category:'bar',type:'Standing Bar Alley',name:'Hoppy Street',address:'Asakusa, Taito, Tokyo',status:'researching',priority:'pending',estimatedCost:1500,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:2,groupActivity:true,description:`A narrow alley in Asakusa lined with post-WWII standing bar stalls — plastic stools on the street, cheap Hoppy (a beer-like soft drink mixed with shochu), yakitori and motsu-yaki (offal skewers). Surviving from the 1940s black market era. The most purely Tokyo drinking experience that isn't Golden Gai. Steve will be comfortable here before the group even sits down.`,mapsQuery:'Hoppy Street Asakusa Tokyo',notes:`Cheap drinks from ¥300 — ~15 min walk from Skytree.`,url:null},

    {id:'teamlab-borderless',person:['patrick','jake','steve','conner','boros','silva'],city:'tokyo',category:'museum',type:'Immersive Digital Art Museum',name:'teamLab Borderless',address:'Azabudai Hills Garden Plaza B, 1-2-4 Azabudai, Minato, Tokyo',status:'researching',priority:'pending',estimatedCost:4800,estimatedDuration:'2–3 hours',bookingRequired:true,dayAssigned:4,groupActivity:true,description:`A borderless world of digital art where rooms flow into each other and the artworks move, react, and drift between spaces. Reopened at Azabudai Hills in 2024.`,mapsQuery:'teamLab Borderless Azabudai Hills',notes:`~4 PM timed entry for all 6. Buy dated tickets online.`,url:'https://www.teamlab.art/e/borderless-azabudai/'},
    {id:'meiji-shrine',person:['patrick','jake','steve','conner','boros','silva'],city:'tokyo',category:'temple',type:'Shinto Shrine',name:'Meiji Shrine — Coming of Age Day',address:'1-1 Yoyogikamizonocho, Shibuya, Tokyo',status:'researching',priority:'pending',estimatedCost:0,estimatedDuration:'1–1.5 hours',bookingRequired:false,dayAssigned:3,groupActivity:true,description:`Tokyo's great forest shrine beside Harajuku. On Coming of Age Day (Jan 11, 2027) the grounds fill with 20-year-olds in furisode and hakama for the ceremonies.`,mapsQuery:'Meiji Jingu Shrine Tokyo',notes:`8:30 AM. Coming of Age Day — ceremonies on the grounds, crowds by mid-morning.`,url:null},

    {id:'nara-park-todaiji',person:['patrick','jake','steve','conner','boros','silva'],city:'osaka',category:'temple',type:'Park & Temple',name:'Nara Park + Todai-ji',address:'Nara Park, Nara',status:'researching',priority:'pending',estimatedCost:800,estimatedDuration:'2 hours',bookingRequired:false,dayAssigned:15,groupActivity:true,description:`Free-roaming deer across Nara Park and Todai-ji's Great Buddha Hall, one of the largest wooden buildings in the world.`,mapsQuery:'Todai-ji Nara Park',notes:`Kintetsu direct from Nippombashi, ~50 min. Check Todai-ji's winter closing time.`,url:null},
    {id:'wakakusa-yamayaki',person:['patrick','jake','steve','conner','boros','silva'],city:'osaka',category:'landmark',type:'Annual Festival',name:'Wakakusa Yamayaki (Hill Burning)',address:'Mt. Wakakusa, Nara',status:'researching',priority:'pending',estimatedCost:0,estimatedDuration:'2 hours',bookingRequired:false,dayAssigned:15,groupActivity:true,description:`Once a year, the grass on Mt. Wakakusa in Nara is set alight after a torch procession and fireworks — the whole hillside burns against the night sky. Held on the fourth Saturday of January.`,mapsQuery:'Mt Wakakusa Nara',notes:`Procession ~5 PM, burning ~6:30 PM. 2027 date not yet confirmed; weather can cancel it. Trains back are packed.`,url:null},
    {id:'nintendo-museum',person:'patrick',city:'kyoto',category:'museum',type:'Interactive Museum',name:'Nintendo Museum',address:'56 Kaguraden, Ogura-cho, Uji, Kyoto 611-0042',status:'lottery',priority:'pending',estimatedCost:3300,estimatedDuration:'2.5–3 hours',bookingRequired:true,dayAssigned:9,groupActivity:true,description:`Nintendo's own museum, built inside a former Nintendo factory (the Uji Ogura Plant) in Uji — a short trip south of central Kyoto and part of the same historic Nintendo hometown. Covers the full company history from playing cards through every console and handheld, with a large hands-on interactive gallery (giant controllers, a light-gun range, motion exhibits) using Play Coins included with admission. Housed across two exhibition buildings in a genuinely well-designed renovated industrial space.`,mapsQuery:'Nintendo Museum Uji Kyoto',notes:`⏳ Lottery entered for all 6 (10–11 AM). Results ~Nov 1; pay within ~7 days. ¥3,300 incl. 10 Play Coins. 5 min from Kintetsu Ogura.`,url:'https://museum.nintendo.com/en/'},

    {id:'tokyo-national-museum',person:['patrick','jake','silva','boros'],city:'tokyo',category:'museum',type:'Special Exhibition',name:'Neverending Journeys: Final Fantasy 40th Anniversary Exhibition',address:'Hyokeikan, Tokyo National Museum, 13-9 Uenokoen, Taito, Tokyo',status:'booked',priority:'pending',estimatedCost:3500,estimatedDuration:'2–2.5 hours',bookingRequired:true,dayAssigned:6,groupActivity:true,description:`A major exhibition celebrating 40 years of Final Fantasy, held in the Hyokeikan — a separate Important Cultural Property building within the Tokyo National Museum grounds. Walks through the series via video, music, and interactive exhibits from the 1987 original through recent entries, and includes a first-of-its-kind collaboration pairing Final Fantasy imagery with actual cultural treasures from the museum's own collection. Runs Jan 8 – Apr 4, 2027.`,mapsQuery:'Final Fantasy 40th Anniversary Exhibition Hyokeikan Tokyo National Museum',notes:`✅ Booked — 9:30 AM, 4 tickets (Patrick, Jake, Silva, Boros). Hyokeikan building. Then 1–2 stops to Akihabara.`,url:'https://www.jp.square-enix.com/ff40th/'},

    {id:'exbar-ffxiv-akihabara',person:'patrick',city:'tokyo',category:'shopping',type:'Themed Bar & Goods Shop',name:'EXBAR TOKYO plus AKIHABARA (FFXIV Goods Shop)',address:'1-6-1 Kanda Sakuma-cho, Chiyoda, Tokyo (Akihabara East-West Free Passage)',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'1–1.5 hours',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A craft beer and retro game bar right by Akihabara Station, home to the first permanent Final Fantasy XIV goods shop — opened December 2025. The shop is built around a Gridania-market theme, selling exclusive FFXIV merch (mugs, cushions, mousepads) alongside a medal-engraving station where you can stamp a character name or Free Company founding date onto a keepsake. The bar itself runs a self-serve tap system ("Shall We Tap?") with 24 rotating craft beers, plus retro arcade games and darts.`,mapsQuery:'EXBAR TOKYO plus AKIHABARA FF14 shop',notes:`Not on the itinerary — would fit the Day 6 Akihabara afternoon. Open 10:00–23:00; numbered tickets when busy.`,url:'https://exbar.jp/akihabara/ff14shop.html'},

    {id:'kyoto-national-museum',person:'conner',city:'kyoto',category:'museum',type:'Museum',name:'Kyoto National Museum',address:'527 Chayamachi, Higashiyama, Kyoto',status:'researching',priority:'pending',estimatedCost:700,estimatedDuration:'1.5–2 hours',bookingRequired:false,dayAssigned:11,groupActivity:true,description:`One of Japan's oldest national museums, holding a major collection of pre-modern Japanese and East Asian art — ceramics, textiles, calligraphy, sculpture, and archaeological pieces. A quieter, substantive counterpoint to the temple circuit, housed partly in a preserved Meiji-era building.`,mapsQuery:'Kyoto National Museum',notes:`Closed Mondays. Check what's showing before going.`,url:null},
    {id:'kichi-kichi-omurice',person:'conner',city:'kyoto',category:'food',type:'Omurice Restaurant',name:'Kichi Kichi Omurice',address:'Nakagyo, Kyoto',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'1 hour',bookingRequired:true,dayAssigned:8,groupActivity:false,description:`A single-chef omurice counter famous online for its theatrical tableside presentation — the chef flips and shapes the rice omelet with real showmanship before slicing it open at the table. Small, intimate, and reservation-only; the whole experience is built around watching one dish get made.`,mapsQuery:'Kichi Kichi Omurice Kyoto',notes:`Reservation required, counter only — a 1–2 person dinner, not the group.`,url:null},
    {id:'ninuki-egg-shop',person:'conner',city:'kyoto',category:'food',type:'Egg Specialty Shop',name:'Ninuki Egg Shop',address:'Kyoto (exact location TBD)',status:'researching',priority:'pending',estimatedCost:1000,estimatedDuration:'20–30 mins',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A specialty shop built entirely around eggs — tamagoyaki, egg sandwiches, and soft-boiled preparations using high-quality Kyoto eggs. A small, easy stop rather than a full meal.`,mapsQuery:'Ninuki egg shop Kyoto',notes:`Not on the itinerary. Only 6 seats — takeaway.`,url:null},
    {id:'hikiniku-to-come',person:'conner',city:'kyoto',category:'food',type:'Minced Cutlet Restaurant',name:'Hikiniku to Come',address:'Kyoto (exact location TBD)',status:'researching',priority:'pending',estimatedCost:2200,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A restaurant specializing in hand-minced meat cutlets (menchi katsu-style) — a juicier, looser texture than a standard tonkatsu since the meat is chopped rather than a single cut. A cult-favorite among Kyoto food regulars.`,mapsQuery:'Hikiniku to Come Kyoto',notes:`Not on the itinerary. Seats groups of 6 as pairs.`,url:null},
