    {id:'ny-bagel-club',person:'jake',city:'tokyo',category:'food',type:'Takeout Bagel Shop',name:'New York Bagel Club',address:'Tokyo (exact location TBD)',status:'researching',priority:'pending',estimatedCost:1000,estimatedDuration:'15–20 mins',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A New York-style bagel shop in Tokyo — boiled-and-baked bagels with classic deli-style toppings. Takeout-only, no real seating beyond maybe a bench for two. Grab-and-go rather than a sit-down breakfast stop.`,mapsQuery:'New York Bagel Club Tokyo',notes:`Jake's pick. Takeout only — good quick breakfast to eat on the move, not a place to linger as a group. Confirm exact branch closer to the trip.`,url:null},

    {id:'yuu-yoyogi-uehara',person:'jake',city:'tokyo',category:'food',type:'Restaurant',name:'Yuu Yoyogi Uehara',address:'Yoyogi-Uehara, Shibuya, Tokyo',status:'researching',priority:'pending',estimatedCost:3500,estimatedDuration:'1.5 hours',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A restaurant in the quiet, upscale Yoyogi-Uehara neighborhood — a residential area known for a cluster of good, low-key restaurants away from the tourist crowds.`,mapsQuery:'Yuu Yoyogi Uehara Tokyo',notes:`Jake's pick. Yoyogi-Uehara is a quieter neighborhood — good change of pace day. Group size: counter + table seating — single group works fine at a table (not counter).`,url:null},
    {id:'new-toyosu-market',person:'jake',city:'tokyo',category:'food',type:'Fish Market',name:'New Toyosu Market',address:'6-3 Toyosu, Koto, Tokyo',status:'researching',priority:'pending',estimatedCost:3500,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:null,groupActivity:true,description:`The modern successor to the old Tsukiji fish market's inner wholesale operations — the world's largest fish market by volume, relocated to Toyosu in 2018. Famous for the early-morning tuna auction (viewable from a viewing deck, advance booking needed) and a food court of sushi restaurants sourcing directly from the floor below.`,mapsQuery:'Toyosu Market Tokyo',notes:`Jake's pick. Different from Tsukiji Outer Market, which is already on the itinerary — Toyosu is the actual wholesale market. Best before 9am. Tuna auction viewing requires separate advance booking.`,url:null},
    {id:'daikanyama-neighborhood',person:'jake',city:'tokyo',category:'shopping',type:'Neighbourhood',name:'Daikanyama',address:'Daikanyama, Shibuya, Tokyo',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A quiet, upscale neighborhood known for boutique fashion, design shops, and the Tsutaya Books flagship — a beautifully designed bookstore/lifestyle complex. Slower-paced and more residential than Shibuya proper, a short walk away.`,mapsQuery:'Daikanyama Tokyo',notes:`Jake's pick. Good half-day wander — less crowded than most Tokyo shopping districts. Group size: open district — single group or split freely.`,url:null},
    {id:'kfc-gojo-shinjuku',person:'jake',city:'tokyo',category:'food',type:'Fast Food (Meme Spot)',name:'KFC Shinjuku Nishiguchi',address:'Nishi-Shinjuku, Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:1200,estimatedDuration:'20 mins',bookingRequired:false,dayAssigned:null,groupActivity:true,description:`The KFC location that became a meme/TikTok pilgrimage spot for the "Are you the strongest because you're Gojo Satoru" scene. A goofy, low-stakes photo-op stop rather than a real food destination — but exactly the kind of detour that makes for good vlog content.`,mapsQuery:'KFC Shinjuku Nishiguchi Tokyo',notes:`Jake's pick — pure meme/vlog stop. Quick detour, not a meal destination.`,url:null},
    {id:'hekkelun-tokyo',person:'jake',city:'tokyo',category:'cafe',type:'Danish Bakery',name:'Hekkelun',address:'Tokyo (exact location TBD)',status:'researching',priority:'pending',estimatedCost:1000,estimatedDuration:'30–45 mins',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A Scandinavian-style bakery known for cinnamon rolls and Danish pastries — a popular Tokyo bakery spot with a devoted following. Good breakfast or midday sweet stop.`,mapsQuery:'Hekkelun bakery Tokyo',notes:`Jake's pick. Popular spot — can have a line, especially on weekends. Smoking is allowed inside — relevant if anyone's smoke-sensitive. Food comes out batch by batch rather than by table order, so don't expect everyone's order to arrive together even when seated together. Group size: ~12-20 seats; groups under 4 sometimes seated with strangers — split across 2 tables likely.`,url:null},
    {id:'coffee-shop-pinocchio',person:'jake',city:'tokyo',category:'cafe',type:'Kissaten',name:'Coffee Shop Pinocchio',address:'Tokyo (exact location TBD)',status:'researching',priority:'pending',estimatedCost:800,estimatedDuration:'30–45 mins',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A retro kissaten-style coffee shop on Jake's list. Confirm exact address and neighborhood closer to the trip.`,mapsQuery:'Coffee Shop Pinocchio Tokyo',notes:`Jake's pick. Confirm details closer to the trip. Group size: unconfirmed, likely small (8-20 seats) — treat cautiously, possible split.`,url:null},
    {id:'ny-pizza-tonys',person:'jake',city:'tokyo',category:'food',type:'Pizza Restaurant',name:"New York Pizza Tony's",address:'Tokyo (exact location TBD)',status:'researching',priority:'pending',estimatedCost:2500,estimatedDuration:'1 hour',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A New York-style pizza spot on Jake's list — large foldable slices, classic toppings. Confirm exact address closer to the trip.`,mapsQuery:"New York Pizza Tony's Tokyo",notes:`Jake's pick. Confirm details closer to the trip.`,url:null},
    {id:'yamacho-kuro-udon',person:'jake',city:'tokyo',category:'food',type:'Udon Restaurant',name:'Yamacho Kuro Udon',address:'Harajuku, Shibuya, Tokyo',status:'researching',priority:'pending',estimatedCost:1500,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A Harajuku udon spot known for "kuro" (black) udon — a striking squid-ink or charcoal-colored noodle variation. Distinctive photo-friendly dish and a solid, quick lunch stop in the middle of a Harajuku shopping day.`,mapsQuery:'Yamacho Kuro Udon Harajuku Tokyo',notes:`Jake's pick. Easy to fold into a Harajuku/Takeshita-dori day. Group size: only 8 total seats — will not fit as one group, plan to split.`,url:null},
    {id:'tensuke-tokyo',person:'jake',city:'tokyo',category:'food',type:'Tempura Restaurant',name:'Tensuke',address:'Tokyo (exact location TBD)',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'1 hour',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A tempura restaurant on Jake's list. Confirm exact address and counter/table format closer to the trip.`,mapsQuery:'Tensuke tempura Tokyo',notes:`Jake's pick. Confirm details closer to the trip. Group size: only 10-12 counter seats — treat as a 1-2 person side trip, not a group meal.`,url:null},
    {id:'bar-centifolia',person:'jake',city:'tokyo',category:'bar',type:'Cocktail Bar',name:'Bar Centifolia',address:'Tokyo (exact location TBD)',status:'researching',priority:'pending',estimatedCost:3500,estimatedDuration:'1.5–2 hours',bookingRequired:true,dayAssigned:null,groupActivity:false,description:`An ornate, heavily-styled cocktail bar that circulates often on TikTok and Instagram for its elaborate interior and presentation. More of a visual/photo experience than a casual hang — good for a dressed-up night out.`,mapsQuery:'Bar Centifolia Tokyo',notes:`Jake's pick — the "fancy tiktok bar." ⚠️ Arguably the hardest booking on the whole trip: reservations open online exactly 15 days in advance at midnight JST and are gone within seconds. One traveler had to show up in person 45 minutes before opening just to ask about availability. Confirm exact address before attempting to book. Group size: small counter + booths — the reservation itself is the real bottleneck, not seating; may only realistically work for 2-3 given how brutal the booking window is.`,url:null},
    {id:'pokepark-kanto',person:'jake',city:'tokyo',category:'entertainment',type:'Pokémon Attraction',name:'PokéPark Kanto',address:'Inside Yomiuriland, Inagi City, western Tokyo',status:'researching',priority:'pending',estimatedCost:2500,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:null,groupActivity:true,description:`A Pokémon-themed area inside Yomiuriland amusement park in western Tokyo, opened February 5, 2026. Confirmed location and opening status as of this writing — worth a final check closer to the trip since attraction details can still shift.`,mapsQuery:'PokePark Kanto Yomiuriland Tokyo',notes:`Jake's pick. Confirmed inside Yomiuriland (Inagi City). The merch shop requires a separate timed-entry numbered ticket obtained via the app once inside the park — register promptly on arrival if souvenir shopping matters. Group size: park entry has no group cap found. The merch shop uses a separate timed ticket via the app — register together promptly on arrival.`,url:null},
    {id:'one-piece-base-shop',person:'jake',city:'tokyo',category:'shopping',type:'Official Merchandise Store',name:'One Piece Base Shop',address:'4F, Shinjuku Marui Main Building, 3-30-13 Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:4000,estimatedDuration:'45 mins',bookingRequired:true,dayAssigned:null,groupActivity:false,description:`Official One Piece merchandise store — figures, apparel, and exclusive collaborative items tied to the anime/manga. A strong pairing with Silva's anime-focused shopping if schedules line up.`,mapsQuery:'One Piece Base Shop Shinjuku Marui Tokyo',notes:`Jake's pick. NOT walk-in — entry requires a lottery-based reservation via the official app (register a "BASE CREW" account) ahead of time. Opening day saw bad overcrowding, which is why the lottery exists — apply as a group well before the trip.`,url:null},
    {id:'jins-shinjuku-flagship',person:'jake',city:'tokyo',category:'shopping',type:'Eyewear Store',name:'JINS Shinjuku Flagship',address:'Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:8000,estimatedDuration:'1 hour',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`JINS' flagship eyewear store in Shinjuku — includes an on-site eye exam and a large selection of well-designed, affordable frames. A practical stop if anyone wants new glasses at Japan pricing, and the flagship location itself is a well-designed retail space worth seeing.`,mapsQuery:'JINS Shinjuku Flagship Tokyo',notes:`Jake's pick. Bring an existing prescription or ID if planning to get an eye exam done on-site. Group size: open walk-in retail — single group, no issue.`,url:null},
    {id:'rocky-top-bluegrass',person:'jake',city:'tokyo',category:'bar',type:'Live Music Venue',name:'Rocky Top',address:'Ginza, Chuo, Tokyo',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'2 hours',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A bluegrass live-music venue in Tokyo — an unexpectedly deep bluegrass and Americana scene exists in the city, and this is one of its known spots. A genuinely surprising night out for a Tokyo trip.`,mapsQuery:'Rocky Top bluegrass Ginza Tokyo',notes:`Jake's pick. Confirmed to be in Ginza — confirm current show schedule and exact address closer to the trip. Group size: 3-floor venue — single group, no concern.`,url:null},
    {id:'itoya-ginza',person:'jake',city:'tokyo',category:'shopping',type:'Stationery Department Store',name:'Itoya',address:'2-7-15 Ginza, Chuo, Tokyo',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'1–1.5 hours',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A 12-floor stationery and paper-goods department store in Ginza — pens, notebooks, art supplies, and beautifully designed everyday objects across every floor. A genuinely absorbing browse even for people who don't think of themselves as "stationery people."`,mapsQuery:'Itoya Ginza Tokyo',notes:`Jake's pick. Pairs well with Kaiten Sushi Ginza Onodera, also on the list — both in Ginza. Group size: open walk-in retail — single group, no issue.`,url:null},
    {id:'hozenji-yokocho',person:'jake',city:'osaka',category:'bar',type:'Alley Dining District',name:'Hozenji Yokocho',address:'Namba, Chuo, Osaka',status:'researching',priority:'pending',estimatedCost:3500,estimatedDuration:'1.5–2 hours',bookingRequired:false,dayAssigned:12,groupActivity:true,description:`A narrow, moss-and-stone-lantern-lined alley next to Hozenji Temple in Namba — small traditional restaurants and bars packed into a single atmospheric lane, similar in spirit to Pontocho in Kyoto but distinctly Osaka. Quieter and more intimate than the nearby Dotonbori strip.`,mapsQuery:'Hozenji Yokocho Osaka',notes:`Jake's pick. A short walk from Dotonbori — good contrast stop, quieter and more traditional.`,url:null},

    {id:'ghibli-park-nagoya',person:'silva',city:'other',region:'Nagoya (Aichi)',category:'themepark',type:'Theme Park',name:'Ghibli Park',address:'Aichi Earth Expo Memorial Park, Nagakute, Aichi',status:'researching',priority:'pending',estimatedCost:3500,estimatedDuration:'Full day',bookingRequired:true,dayAssigned:null,groupActivity:false,description:`A full-scale theme park built around Studio Ghibli's world, opened in 2022 inside Aichi's Expo 2005 Commemorative Park near Nagoya — distinct from (and much larger than) the Ghibli Museum in Mitaka, Tokyo. Split into themed areas including Ghibli's Grand Warehouse, Dondoko Forest (My Neighbor Totoro), Hill of Youth, and Mononoke Village, with full-size reconstructed sets and buildings from the films rather than just displays. On Silva's someday list.`,mapsQuery:'Ghibli Park Nagakute Aichi',notes:`Silva's pick — NOT the same as the Ghibli Museum in Mitaka, Tokyo (already on the itinerary for Patrick). Ghibli Park is near Nagoya, well outside the current Tokyo/Kyoto/Osaka route — would need a dedicated day-trip via Shinkansen (~100min from Tokyo, ~35min from Kyoto) if it ever gets folded into a future trip. Timed tickets required, released monthly.`,url:'https://ghibli-park.jp/en/'},

    {id:'shinpachi-shokudo',person:'conner',city:'tokyo',category:'food',type:'Japanese Breakfast',name:'Shinpachi Shokudo',address:'Multiple locations, Tokyo',status:'researching',priority:'pending',estimatedCost:1200,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A no-frills Japanese breakfast chain serving the classic teishoku set — grilled fish, rice, miso soup, pickles, raw egg — exactly the way it's eaten across Japan every morning. Cheap, fast, and an honest contrast to the themed cafes elsewhere on the list. A good reset meal between the heavier food days.`,mapsQuery:'Shinpachi Shokudo Tokyo',notes:`Conner's pick. Multiple locations — pick whichever is closest to that day's plans. Cash-friendly, quick turnover. Group size: the Nishi-Shinjuku branch is counter-only (split likely) — the Ningyocho branch has 39 seats (11 counter + 28 table) and fits the group as one. Pick Ningyocho.`,url:null},
    {id:'butagumi-tokyo',person:'conner',city:'tokyo',category:'food',type:'Tonkatsu Restaurant',name:'Butagumi',address:'2-24-9 Nishi-Azabu, Minato, Tokyo',status:'researching',priority:'pending',estimatedCost:3500,estimatedDuration:'1–1.5 hours',bookingRequired:false,dayAssigned:6,groupActivity:false,description:`A well-regarded tonkatsu specialist in Nishi-Azabu, set in a converted traditional house. Sources a wide range of pork breeds from across Japan, each with a noticeably different flavor and fat profile, served as classic breaded pork cutlet with cabbage and miso soup. More refined than a typical tonkatsu counter — worth the trip for a serious pork-cutlet meal.`,mapsQuery:'Butagumi tonkatsu Nishi-Azabu Tokyo',notes:`Conner's pick. Can have a queue at peak lunch/dinner hours — aim for an off-peak slot. Group size: restaurant warns groups of 5+ may split across 2 tables — book early. (Butagumi Dining, Roppongi is an easier single-group alternative with counter seating.)`,url:null},
    {id:'komeda-coffee-tokyo',person:'conner',city:'tokyo',category:'cafe',type:'Coffee Chain Breakfast',name:"Komeda's Coffee",address:'Multiple locations, Tokyo',status:'researching',priority:'pending',estimatedCost:900,estimatedDuration:'30–45 mins',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A nationwide kissaten-style coffee chain known for the morning "Morning Set" — order any coffee before 11am and get a thick slice of toast with butter and red bean paste or egg, free. Retro, wood-paneled interiors with deep booth seating. A reliable, relaxed breakfast option that doesn't require research or a reservation.`,mapsQuery:"Komeda's Coffee Tokyo",notes:`Conner's pick. Morning Set deal only runs before 11am — worth timing a breakfast stop around it.`,url:null},
    {id:'rakuu-tei-teahouse',person:'conner',city:'tokyo',category:'cafe',type:'Traditional Tea House',name:'Rakuu-tei',address:'Shinjuku Gyoen National Garden, Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:1000,estimatedDuration:'30–45 mins',bookingRequired:false,dayAssigned:6,groupActivity:false,description:`A traditional tea house inside Shinjuku Gyoen, serving matcha and wagashi sweets overlooking a Japanese garden pond. A genuinely calm, unhurried stop in the middle of a park visit — proper tea ceremony presentation without needing to book a formal ceremony experience.`,mapsQuery:'Rakuu-tei tea house Shinjuku Gyoen',notes:`Conner's pick. Inside the garden, so the ¥500 Shinjuku Gyoen entry applies — and the garden's Monday closure applies too (scheduled Day 6, Thu). Pairs naturally with a garden walk. Unusual process: buy a ticket from a vending machine outside first (money in before pressing buttons), then bring the ticket inside to be seated — for the full group that's 6 separate ticket purchases before anyone sits down. Also stops service around 3–3:30pm, well before the garden itself closes. Group size: no explicit group cap — single group workable, but see the separate vending-machine-ticket note.`,url:null},
    {id:'los-tacos-azules',person:'conner',city:'tokyo',category:'food',type:'Taco Restaurant',name:'Los Tacos Azules',address:'Tokyo (exact location TBD)',status:'researching',priority:'pending',estimatedCost:1800,estimatedDuration:'1 hour',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A taqueria serving proper Mexican-style street tacos in Tokyo — blue corn tortillas, slow-cooked meats, fresh salsas. Part of the small but growing wave of genuinely good Mexican food in the city. A solid change of pace from a heavy stretch of Japanese food days.`,mapsQuery:'Los Tacos Azules Tokyo',notes:`Conner's pick. Confirm exact branch/address closer to the trip. Group size: use the Ebisu branch (~21 seats, bookable) for the group — the Sangenjaya branch is walk-in only and won't work for 6.`,url:null},
    {id:'shinjuku-gyoen',person:'conner',city:'tokyo',category:'nature',type:'National Garden',name:'Shinjuku Gyoen National Garden',address:'11 Naitomachi, Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:500,estimatedDuration:'1.5–2 hours',bookingRequired:false,dayAssigned:6,groupActivity:true,description:`One of Tokyo's largest and most beautiful parks, blending traditional Japanese, French formal, and English landscape garden styles across 144 acres. A genuinely peaceful break from the city — koi ponds, a greenhouse, and Rakuu-tei tea house inside the grounds. Even in January, the garden's structure and the greenhouse make it worth the visit.`,mapsQuery:'Shinjuku Gyoen National Garden Tokyo',notes:`Conner's pick. ¥500 entry. ⚠️ CLOSED MONDAYS — originally scheduled on Day 3 (Mon Jan 11), moved to Day 6 (Thu Jan 14) to avoid the closure. Do not move back to a Monday. Pairs naturally with Rakuu-tei tea house, also on this list.`,url:null},
    {id:'round1-tokyo',person:'conner',city:'tokyo',category:'entertainment',type:'Entertainment Complex',name:'Round 1 Tokyo',address:'Multiple locations, Tokyo',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'3–5 hours',bookingRequired:false,dayAssigned:null,groupActivity:true,description:`The Tokyo branch of Japan's premier bowling and arcade entertainment chain — bowling, billiards, karaoke, darts, batting cages, and a large arcade floor under one roof. Same chain as the Osaka location already planned for later in the trip, but worth doing in Tokyo too since locations and machine selections differ by branch.`,mapsQuery:'Round 1 Tokyo',notes:`Conner's pick. Confirm nearest branch to lodging — Round 1 has multiple Tokyo locations. Open very late, good flexible-hours option. Group size: bowling max 6 per lane on the unlimited plan — single group fits exactly on one lane. Karaoke rooms also bookable for groups, no issue.`,url:'https://www.round1.co.jp'},
    {id:'sumo-wrestling-tokyo',person:'conner',city:'tokyo',category:'entertainment',type:'Sumo Tournament',name:'Sumo Wrestling',address:'Ryogoku Kokugikan, 1-3-28 Yokoami, Sumida, Tokyo',status:'researching',priority:'pending',estimatedCost:5000,estimatedDuration:'Half day',bookingRequired:true,dayAssigned:null,groupActivity:true,description:`The Grand Sumo Tournament runs Jan 9–23, 2027 at Ryogoku Kokugikan, directly overlapping the Tokyo leg of the trip. A full day of bouts builds toward the higher-ranked wrestlers in the late afternoon — genuinely one of the most unique live sporting experiences in Japan, win-or-lose theater built into centuries of ritual.`,mapsQuery:'Ryogoku Kokugikan sumo Tokyo',notes:`Conner's pick. Tickets go on sale roughly a month before the tournament via the Japan Sumo Association site — needs to be booked closer to the date, not now. Arrive early afternoon; the best bouts are saved for last. Group size: masuseki box seats are typically sold as 1/2/4-person boxes — buy 2 boxes (e.g. 4+2) to seat 6. Arena chair seats are sold individually and are actually the easiest way to sit together as one group.`,url:null},
    {id:'mount-takao',person:'conner',city:'tokyo',category:'nature',type:'Day Hike',name:'Mount Takao',address:'Hachioji, Tokyo',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'Half day',bookingRequired:false,dayAssigned:'flex',groupActivity:true,description:`A 599m mountain less than an hour from central Tokyo by train, popular for an easy day hike with multiple trail options ranging from a paved path to a more rugged route. A cable car and chairlift offer a no-effort version partway up. On a clear January day, the summit has views toward Mount Fuji. Includes a small temple complex (Yakuoin) partway up the mountain.`,mapsQuery:'Mount Takao Hachioji Tokyo',notes:`Conner's pick. ~50 min from Shinjuku via Keio Line. Lower-effort alternative to the Kawaguchiko Fuji day trip if that one doesn't happen.`,url:null},

    {id:'disneysea-port-drinking',person:'patrick',city:'tokyo',category:'themepark',type:'Theme Park',name:'Tokyo DisneySea — A Drink at Every Port',address:'1-13 Maihama, Urayasu, Chiba',status:'researching',priority:'pending',estimatedCost:8000,estimatedDuration:'Full day',bookingRequired:true,dayAssigned:'flex',groupActivity:true,description:`Tokyo DisneySea is the only Disney park in the world that serves alcohol, and the bit is simple: one themed drink at each of the park's 8 ports — Mediterranean Harbor, American Waterfront, Port Discovery, Lost River Delta, Arabian Coast, Mermaid Lagoon, Mysterious Island, and Fantasy Springs. Seasonal cocktails rotate constantly and the lounges (Teddy Roosevelt Lounge, Barnacle Bill's) are built for exactly this. The park itself is widely considered Tokyo Disney Resort's best — immersive theming, Tower of Terror, Journey to the Center of the Earth, Indiana Jones Adventure, Soaring: Fantastic Flight.`,mapsQuery:'Tokyo DisneySea Urayasu',notes:`Patrick's idea. Buy tickets via the official Tokyo Disney Resort app — variable pricing ¥7,900–10,900. About 30 min from central Tokyo via JR Keiyo Line to Maihama, then Disney Resort Line. Drinks are mostly low-ABV — pace accordingly across a full park day.`,url:'https://www.tokyodisneyresort.jp/en/tds/'},

    {id:'square-enix-garden-shibuya',person:'patrick',city:'tokyo',category:'shopping',type:'Official Merchandise Store',name:'Square Enix Garden',address:'3F Shibuya Sakura Stage SHIBUYA Side, 1-4 Sakuragaoka-cho, Shibuya, Tokyo',status:'researching',priority:'pending',estimatedCost:5000,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:4,groupActivity:false,description:`Square Enix's newest flagship goods store, opened in 2025 inside Shibuya Sakura Stage — replacing the older Shinjuku showcase as the main Tokyo destination for official merchandise. Entrance built around Chocobos, Moogles, and Slimes; sections themed to Final Fantasy and Dragon Quest with figures, apparel, jewelry, and collaborative items. Strong NieR: Automata figure selection alongside the usual FF/DQ lineup. Exclusive store-only items including a capsule toy machine.`,mapsQuery:'Square Enix Garden Shibuya Sakura Stage',notes:`Patrick's pick. 1 min walk from Shibuya Station. Merchandise rotates seasonally so the selection in Jan 2027 may differ from current photos online. Group size: open walk-in retail — single group, no issue.`,url:null},

    {id:'drunken-clam-osaka',person:'patrick',city:'osaka',category:'bar',type:'Karaoke Bar',name:'The Drunken Clam',address:'Kiku Bldg 3F, 6-26 Soemoncho, Chuo, Osaka',status:'researching',priority:'pending',estimatedCost:2500,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:13,groupActivity:true,description:`A Family Guy-themed karaoke bar tucked on the third floor of an unmarked building near Dotonbori — easy to walk past without noticing. English-friendly staff, a strong karaoke song list including anime tracks with romaji mode, and a mixed crowd of locals and international travelers. Compact and intimate rather than a big chain karaoke box. Open late — until 4am Fri/Sat.`,mapsQuery:'The Drunken Clam Osaka karaoke bar',notes:`8 min walk from Shinsaibashi Station, 5 min from Kintetsu Namba. Closed Mondays in some listings — confirm hours closer to the trip. Try the Giggity Juice. Smoking allowed inside. Group size: described as a 'compact lounge' that gets busy on weekends — single group, go on a weeknight for more comfort.`,url:'https://www.theclamjp.com/'},

    {id:'toei-animation-gallery',person:'silva',city:'tokyo',category:'museum',type:'Animation Studio Museum',name:'Toei Animation Gallery',address:'2-10-5 Higashi-Oizumi, Nerima, Tokyo',status:'researching',priority:'pending',estimatedCost:0,estimatedDuration:'1 hour',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A small, free museum at Toei Animation's actual production studio in Nerima — the company behind One Piece, Dragon Ball, Sailor Moon, and Digimon. Original cels, character model sheets, and production materials on display, plus a gift shop with merchandise not sold elsewhere. Modest in size but a genuine look at the studio actually making the shows Silva grew up on, rather than a tourist-facing attraction.`,mapsQuery:'Toei Animation Gallery Oizumi Tokyo',notes:`Silva's pick. Free entry. Far west of central Tokyo (Nerima) — best paired with another west-side activity or treated as its own dedicated trip.`,url:null},

    {id:'toei-studios-kyoto',person:['patrick','silva'],city:'kyoto',category:'themepark',type:'Film Studio Theme Park',name:'Toei Studios Kyoto',address:'10 Uzumasa Higashihachiokacho, Ukyo, Kyoto',status:'researching',priority:'pending',estimatedCost:2400,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:10,groupActivity:false,description:`A real working film studio turned theme park, built around the sets used for samurai and period dramas (jidaigeki) since the 1970s. Recreated Edo-period streets, a ninja experience zone, live samurai sword-fighting shows, and a museum covering Japanese film and tokusatsu (live-action superhero/monster) history — including Kamen Rider and other tokusatsu props Silva will recognize. Staff in costume wander the sets and you can rent samurai or ninja outfits for photos.`,mapsQuery:'Toei Studios Kyoto Uzumasa',notes:`Silva and Patrick's pick — leans into the tokusatsu/anime production history angle rather than just temples. Good flex-day option since it's a different pace from the Kyoto shrine circuit. Group size: free-roam park; group discount only kicks in at 25+ — single group, no issue either way.`,url:null},

    {id:'round1-osaka',person:'patrick',city:'osaka',category:'entertainment',type:'Entertainment Complex',name:'Round 1 Osaka',address:'Namba Parks, 2-10-70 Nanbanaka, Naniwa, Osaka',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'3–5 hours',bookingRequired:false,dayAssigned:13,groupActivity:true,description:`Japan's premier bowling and arcade entertainment chain, and the Osaka Namba location is one of the best in the country. Multiple floors of bowling, billiards, karaoke, table tennis, batting cages, darts, and a massive arcade floor. The big draw: Round 1 is open 24 hours on weekends and until the early hours on weekdays — it becomes a late-night institution after the bars, with a completely different crowd at 2am than at 2pm. Great group activity that works for every interest level.`,mapsQuery:'Round 1 Osaka Namba Parks',notes:`Open until 5am on weekends — perfect for a post-Dotonbori late night. The bowling lanes and arcade floor get busier after midnight, not quieter. Group size: bowling max 6 per lane on the unlimited plan — single group fits exactly on one lane. Karaoke rooms also bookable for groups, no issue.`,url:'https://www.round1.co.jp'},


  ]
};
if (typeof window !== 'undefined') window.TRIP_DATA = TRIP_DATA;
</script>

      practical: [
        { key:'Getting in',     val:'Shinkansen (Nozomi) from Tokyo — ~2h 15min, ~¥14,000/person. Book via SmartEX.' },
        { key:'Luggage',        val:'Send via Yamato Transport the night before. Arrives at Kyoto Airbnb next morning.' },
        { key:'Getting around', val:'City bus is the backbone. One-day pass ¥700. IC card also works. Many sites are walkable clusters.' },
        { key:'Early starts',   val:'Fushimi Inari and Arashiyama Bamboo Forest are best before 8am to beat tour groups.' },

      glance: [
