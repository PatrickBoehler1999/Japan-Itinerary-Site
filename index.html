  const CAT_EMOJI = { temple:'⛩️', food:'🍜', cafe:'☕', bar:'🍺', shopping:'🛍️', entertainment:'🎮', nature:'🏔️', museum:'🏛️', landmark:'🗼', arcade:'🕹️', themepark:'🎡' };
  const CREW_INITIALS = { patrick:'P', jake:'J', steve:'S', conner:'C', boros:'B', silva:'S' };

  function getActivitiesForCity(cityId) {
    if (typeof TRIP_DATA === 'undefined') return [];
    return (TRIP_DATA.activities || []).filter(a => a.city === cityId);
  }

  function getDaysForCity(cityId) {
    if (typeof ITINERARY_DATA === 'undefined') return [];
    return ITINERARY_DATA.days.filter(d => d.city === cityId);
  }

  function personIds(act) {
    const p = act.person;
    return Array.isArray(p) ? p : [p];
  }

  function renderWhoDot(person) {
    const ids = Array.isArray(person) ? person : [person];
    return ids.map(id => {
      if (id === 'ai') return `<span class="who-dot" style="background:#a0a09a;width:18px;height:18px;font-size:9px" title="AI Suggestion">✨</span>`;
      const m = C.getCrewById(id);
      if (!m) return '';
      return `<span class="who-dot" style="background:${m.color};width:18px;height:18px;font-size:9px" title="${m.name}">${CREW_INITIALS[id] || id[0].toUpperCase()}</span>`;
    }).join('');
  }

  function wireActDayLinks(container) {
    container.querySelectorAll('.act-day-link[data-goto-day]').forEach(link => {
      link.addEventListener('click', e => {
        e.stopPropagation();
        const dayNum = link.dataset.gotoDay;
        document.querySelector('.nav-tab[data-tab="itinerary"]')?.click();
        setTimeout(() => {
          const card = document.querySelector(`.day-card[data-day="${dayNum}"]`);
          if (card) {
            if (!card.classList.contains('open')) card.querySelector('.day-card-header')?.click();
            card.scrollIntoView({ behavior:'smooth', block:'start' });
          }
        }, 120);
      });
    });
  }

  function buildCityPanel(city, extra) {
    const activities = getActivitiesForCity(city.id);
    const days       = getDaysForCity(city.id);
    const panel      = document.createElement('div');
    panel.className  = 'city-panel';
    panel.dataset.city = city.id;

    // Hero
    const hero = document.createElement('div');
    hero.className = 'city-hero';
    hero.style.background = city.color;
    hero.innerHTML = `
      <div class="city-hero-inner">
        <div class="city-hero-eyebrow">${extra.eyebrow}</div>
        <div class="city-hero-name">${city.name}</div>
        <div class="city-hero-kanji">${city.kanji}</div>
        <div class="city-hero-stats">
          <span class="city-hero-stat">${city.emoji} <strong>${city.nights} nights</strong></span>
          <span class="city-hero-stat">🌡️ <strong>${city.weather.tempF}°F</strong></span>
          <span class="city-hero-stat">🚇 <strong>${city.transport}</strong></span>
          <span class="city-hero-stat">📍 <strong>${city.region}</strong></span>
        </div>
      </div>`;
    panel.appendChild(hero);

    const content = document.createElement('div');
    content.className = 'city-content';

    // At a Glance
    const glanceSection = document.createElement('div');
    glanceSection.className = 'section fade-in';
    glanceSection.innerHTML = `<div class="section-label">At a Glance</div>
      <div class="glance-grid">${extra.glance.map(g => `
        <div class="glance-card">
          <div class="glance-icon">${g.icon}</div>
          <div class="glance-label">${g.label}</div>
          <div class="glance-value">${g.value}</div>
          ${g.sub ? `<div class="glance-sub">${g.sub}</div>` : ''}
        </div>`).join('')}
      </div>`;
    content.appendChild(glanceSection);

    // Key Areas
    const areasSection = document.createElement('div');
    areasSection.className = 'section fade-in';
    areasSection.innerHTML = `<div class="section-label">Key Areas</div>
      <div class="area-pills">${city.keyAreas.map(a => `<span class="area-pill">${a}</span>`).join('')}</div>`;
    content.appendChild(areasSection);

    // Days in this city
    if (days.length) {
      const daysSection = document.createElement('div');
      daysSection.className = 'section fade-in';
      daysSection.innerHTML = `<div class="section-label">Days Here</div>
        <div class="day-mini-list">${days.map(d => `
          <div class="day-mini" data-goto-day="${d.dayNumber}">
            <div class="day-mini-num" style="background:${city.color}">
              <div class="day-mini-num-label">Day</div>
              <div class="day-mini-num-val">${d.dayNumber}</div>
            </div>
            <div class="day-mini-info">
              <div class="day-mini-theme">${d.title || d.theme}</div>
              ${d.title ? `<div class="day-mini-sub">${d.theme}</div>` : ''}
              <div class="day-mini-meta">
                <span>💴 $${d.estimatedCostPerPerson.usd}</span>
                <span>🚶 ${d.walking.miles}mi</span>
                ${d.groupSplits ? '<span style="color:#3730a3">↔ Split</span>' : ''}
              </div>
            </div>
          </div>`).join('')}
        </div>`;
      content.appendChild(daysSection);
    }

    // Activities
    if (activities.length) {
      const order = { 'must-do':0, 'high':1, 'want-to-do':2, 'maybe':3 };
      const cats = [...new Set(activities.map(a => a.category))].sort();
      const catCounts = {};
      cats.forEach(c => { catCounts[c] = activities.filter(a => a.category === c).length; });

      function renderRows(list) {
        return list.map(act => {
          const catEmoji = CAT_EMOJI[act.category] || '📍';
          const priorityLabel = act.priority === 'pending' ? '⏳' : ({ 'must-do':'Must Do', 'high':'High', 'want-to-do':'Want' }[act.priority] || '');
          const bookBadge = act.bookingRequired === true
            ? '<span class="act-priority must-do" style="font-size:9px">Book ahead</span>'
            : act.bookingRequired === 'recommended'
            ? '<span class="act-priority high" style="font-size:9px">Rec. book</span>'
            : '';
          const costStr = act.estimatedCost > 0 ? `¥${act.estimatedCost.toLocaleString()}` : 'Free';
          const dayStr = act.dayAssigned && act.dayAssigned !== 'flex' && act.dayAssigned !== null
            ? `<span class="act-day-link" data-goto-day="${act.dayAssigned}">Day ${act.dayAssigned}</span>`
            : act.dayAssigned === 'flex' ? '<span class="act-day-link act-day-flex">Flex</span>' : '';
          const noteStr = act.notes ? `<div class="act-row-note">${act.notes}</div>` : '';
          return `<div class="activity-row${personIds(act).includes('ai') ? ' activity-row-ai' : ''}">
            <div class="act-cat-icon">${catEmoji}</div>
            <div class="act-row-body">
              <div class="act-row-top">
                <div class="act-row-name">${act.name}</div>
                <div class="act-row-right">${priorityLabel ? `<span class="act-priority ${act.priority}">${priorityLabel}</span>` : ''}${bookBadge}</div>
              </div>
              <div class="act-row-sub">
                <span class="act-row-meta">${act.type}${act.address ? ' · ' + act.address.split(',')[0] : ''}</span>
                <span class="act-row-cost">${costStr}</span>
              </div>
              ${noteStr}
              <div class="act-row-footer">${renderWhoDot(act.person)}${dayStr}</div>
            </div>
          </div>
          ${act.description ? `<div class="act-row-detail">
            <div class="act-row-desc">${act.description}</div>
            <div class="acts-card-links">
              ${act.mapsQuery ? '<a class="acts-card-link maps" href="https://www.google.com/maps/search/' + encodeURIComponent(act.mapsQuery) + '" target="_blank" rel="noopener noreferrer">📍 Google Maps</a>' : ''}
              ${act.url ? '<a class="acts-card-link official" href="' + act.url + '" target="_blank" rel="noopener noreferrer">🔗 Official Site</a>' : ''}
            </div>
          </div>` : ''}`;
        }).join('');
      }

      const actSection = document.createElement('div');
      actSection.className = 'section fade-in';
      actSection.innerHTML = `<div class="section-label">Activities (${activities.length})</div>`;

      // Category filter chips
      const filterWrap = document.createElement('div');
      filterWrap.className = 'act-cat-filters';
      const allBtn = document.createElement('button');
      allBtn.className = 'act-cat-btn active';
      allBtn.dataset.cat = 'all';
      allBtn.style.background = city.color;
      allBtn.style.color = '#fff';
      allBtn.style.borderColor = 'transparent';
      allBtn.innerHTML = `All <span class="act-cat-count">${activities.length}</span>`;
      filterWrap.appendChild(allBtn);

      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'act-cat-btn';
        btn.dataset.cat = cat;
        const label = (typeof TRIP_DATA !== 'undefined' && TRIP_DATA.categories && TRIP_DATA.categories[cat])
          ? TRIP_DATA.categories[cat].label : cat.charAt(0).toUpperCase() + cat.slice(1);
        btn.innerHTML = `${CAT_EMOJI[cat] || '📍'} ${label} <span class="act-cat-count">${catCounts[cat]}</span>`;
        filterWrap.appendChild(btn);
      });
      actSection.appendChild(filterWrap);

      const rowsWrap = document.createElement('div');
      rowsWrap.className = 'activity-rows';
      const sorted = [...activities].sort((a, b) => (order[a.priority] ?? 9) - (order[b.priority] ?? 9));
      rowsWrap.innerHTML = renderRows(sorted);
      actSection.appendChild(rowsWrap);

      // Filter click handler
      filterWrap.addEventListener('click', e => {
        const btn = e.target.closest('.act-cat-btn');
        if (!btn) return;
        const cat = btn.dataset.cat;
        filterWrap.querySelectorAll('.act-cat-btn').forEach(b => {
          b.classList.remove('active');
          b.style.background = '';
          b.style.color = '';
          b.style.borderColor = '';
        });
        btn.classList.add('active');
        btn.style.background = city.color;
        btn.style.color = '#fff';
        btn.style.borderColor = 'transparent';
        const filtered = cat === 'all' ? sorted : sorted.filter(a => a.category === cat);
        rowsWrap.innerHTML = filtered.length
          ? renderRows(filtered)
          : '<div style="padding:16px;font-size:13px;color:var(--muted)">No activities in this category.</div>';
        wireActDayLinks(rowsWrap);
      });
      wireActDayLinks(rowsWrap);
      rowsWrap.addEventListener('click', e => {
        const row = e.target.closest('.activity-row');
        if (!row || e.target.closest('a') || e.target.closest('.act-day-link')) return;
        row.classList.toggle('expanded');
      });
      // Practical Info (before activities)
    const practSection = document.createElement('div');
    practSection.className = 'section fade-in';
    practSection.innerHTML = `<div class="section-label">Practical Info</div>
      <div class="practical-table">${extra.practical.map(r => `
        <div class="practical-row">
          <div class="practical-key">${r.key}</div>
          <div class="practical-val">${r.val}</div>
        </div>`).join('')}
      </div>`;
    content.appendChild(practSection);

      content.appendChild(actSection);
    }

    panel.appendChild(content);
    return panel;
  }

  function switchCity(cityId) {
    document.querySelectorAll('.city-sel-btn').forEach(b => b.classList.toggle('active', b.dataset.city === cityId));
    document.querySelectorAll('.city-panel').forEach(p => p.classList.toggle('active', p.dataset.city === cityId));
    const panel = document.querySelector(`.city-panel[data-city="${cityId}"]`);
    if (panel) panel.querySelectorAll('.fade-in:not(.visible)').forEach(el => el.classList.add('visible'));
    window.scrollTo(0, 0);
  }

  function initScrollFadeInEl(root) {
    const els = root.querySelectorAll('.fade-in');
    if (!('IntersectionObserver' in window)) { els.forEach(el => el.classList.add('visible')); return; }
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
    }, { threshold: 0.05, rootMargin: '0px 0px -30px 0px' });
    els.forEach(el => obs.observe(el));
  }

  function buildCities() {
    const selectorEl = document.getElementById('cities-selector');
    const detailEl   = document.getElementById('cities-detail');
    if (!selectorEl || !detailEl) return;

    C.cities.forEach((city, i) => {
      const extra = CITY_EXTRA[city.id];
      const btn = document.createElement('button');
      btn.className = 'city-sel-btn' + (i === 0 ? ' active' : '');
      btn.dataset.city = city.id;
      btn.style.setProperty('--city-color', city.color);
      btn.innerHTML = `
        <div class="city-sel-emoji">${city.emoji}</div>
        <div class="city-sel-name">${city.name}</div>
        <div class="city-sel-kanji">${city.kanji}</div>`;
      btn.addEventListener('click', () => switchCity(city.id));
      selectorEl.appendChild(btn);

      const panel = buildCityPanel(city, extra);
      if (i === 0) panel.classList.add('active');
      detailEl.appendChild(panel);
    });

    // Wire day-mini clicks → itinerary tab
    detailEl.addEventListener('click', e => {
      const mini = e.target.closest('[data-goto-day]');
      if (!mini || mini.classList.contains('act-day-link')) return;
      const dayNum = mini.dataset.gotoDay;
      document.querySelector('.nav-tab[data-tab="itinerary"]')?.click();
      setTimeout(() => {
        const card = document.querySelector(`.day-card[data-day="${dayNum}"]`);
        if (card) {
          if (!card.classList.contains('open')) card.querySelector('.day-card-header')?.click();
          card.scrollIntoView({ behavior:'smooth', block:'start' });
        }
      }, 120);
    });

    initScrollFadeInEl(detailEl);
    // Trigger fade-ins for the initially visible panel
    const firstPanel = detailEl.querySelector('.city-panel.active');
    if (firstPanel) firstPanel.querySelectorAll('.fade-in').forEach(el => el.classList.add('visible'));
  }

  // Built on demand by the Logistics tab (City Guides section)
  let citiesBuilt = false;
  window.buildCityGuides = () => { if (citiesBuilt) return; citiesBuilt = true; buildCities(); };
})();
</script>

<!-- ACTIVITIES RENDER SCRIPT -->
<script>
(function () {
  'use strict';
  const C = SITE_CONFIG;

  const CAT_EMOJI_A = { temple:'⛩️', food:'🍜', cafe:'☕', bar:'🍺', shopping:'🛍️', entertainment:'🎮', nature:'🏔️', museum:'🏛️', landmark:'🗼', arcade:'🕹️', themepark:'🎡' };
  function personIdsA(a) { return Array.isArray(a.person) ? a.person : [a.person]; }
  const CREW_INITIALS = { patrick:'P', jake:'J', steve:'S', conner:'C', boros:'B', silva:'S' };
  const PRIORITY_ORDER = { 'must-do':0, 'high':1, 'want-to-do':2, 'maybe':3 };

  const DEFAULTS = { city:'all', person:'all', category:'all', priority:'all', booking:'all', sched:'yes', search:'' };
  const state = Object.assign({}, DEFAULTS);
  let allActivities = [];
  let built = false;

  function getFiltered() {
    return allActivities.filter(a => {
      if (state.city     !== 'all' && a.city     !== state.city)     return false;
      if (state.person   !== 'all' && !personIdsA(a).includes(state.person)) return false;
      if (state.category !== 'all' && a.category !== state.category) return false;
      if (state.priority !== 'all' && a.priority !== state.priority) return false;
      if (state.sched === 'yes' && typeof a.dayAssigned !== 'number' && state.city !== 'other') return false;   // Other Regions are all wishlist
      if (state.sched === 'no'  && typeof a.dayAssigned === 'number') return false;
      if (state.booking  !== 'all') {
        if (state.booking === 'true'        && a.bookingRequired !== true)          return false;
        if (state.booking === 'recommended' && a.bookingRequired !== 'recommended') return false;
        if (state.booking === 'false'       && a.bookingRequired !== false)         return false;
      }
      if (state.search) {
        const q = state.search.toLowerCase();
        const hay = [a.name, a.type, a.address, a.notes, a.description, a.category, a.region, ...personIdsA(a)].filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function updateSummary(filtered) {
    const bar = document.getElementById('acts-summary-bar');
    if (!bar) return;
    const totalCost = filtered.reduce((s, a) => s + (a.estimatedCost || 0), 0);
    const freeCount = filtered.filter(a => a.estimatedCost === 0).length;
    const bookCount = filtered.filter(a => a.bookingRequired === true).length;
    bar.innerHTML = '';
    [
      { num: filtered.length,                              label: 'Showing' },
      { num: `¥${(totalCost / 1000).toFixed(0)}k`,        label: 'Est. Total' },
      { num: freeCount,                                    label: 'Free' },
      { num: bookCount,                                    label: 'Book Ahead' },
    ].forEach(item => {
      const el = document.createElement('div');
      el.className = 'acts-sum-item';
      el.innerHTML = `<div class="acts-sum-num">${item.num}</div><div class="acts-sum-label">${item.label}</div>`;
      bar.appendChild(el);
    });
  }

  function renderCard(act) {
    const city      = C.getCityById(act.city);
    const personArr = Array.isArray(act.person) ? act.person : [act.person];
    const cityColor = city ? city.color : '#8a8278';
    const catEmoji  = CAT_EMOJI_A[act.category] || '📍';

    const badges = [];
    if (act.priority === 'pending') {
      badges.push('<span class="acts-badge" style="background:rgba(138,130,120,0.1);color:var(--muted)">⏳ Pending</span>');
    } else if (act.priority && act.priority !== 'maybe') {
      const label = { 'must-do':'Must Do', 'high':'High', 'want-to-do':'Want' }[act.priority];
      if (label) badges.push(`<span class="acts-badge ${act.priority}">${label}</span>`);
    }
    if (act.bookingRequired === true)          badges.push('<span class="acts-badge book-true">Book Ahead</span>');
    if (act.bookingRequired === 'recommended') badges.push('<span class="acts-badge book-rec">Rec. Book</span>');
    if (act.status === 'booked')               badges.push('<span class="acts-badge confirmed">✅ Booked</span>');
    if (act.status === 'lottery')              badges.push('<span class="acts-badge book-rec">⏳ Lottery</span>');
    if (act.estimatedCost === 0)               badges.push('<span class="acts-badge free">Free</span>');

    const costStr = act.estimatedCost > 0 ? `¥${act.estimatedCost.toLocaleString()}` : 'Free';

    let dayChip = '';
    if (act.dayAssigned && act.dayAssigned !== 'flex' && act.dayAssigned !== null) {
      dayChip = `<span class="acts-card-day" data-goto-day="${act.dayAssigned}">→ Day ${act.dayAssigned}</span>`;
    } else if (act.dayAssigned === 'flex') {
      dayChip = `<span class="acts-badge flex-day">Flex day</span>`;
    }

    const crewDot = personArr.map(id => {
      if (id === 'ai') return `<span class="who-dot" style="background:#a0a09a;width:18px;height:18px;font-size:9px" title="AI Suggestion">✨</span>`;
      const m = C.getCrewById(id);
      if (!m) return '';
      return `<span class="who-dot" style="background:${m.color};width:18px;height:18px;font-size:9px" title="${m.name}">${CREW_INITIALS[id] || id[0].toUpperCase()}</span>`;
    }).join('');

    const cityPip = city
      ? `<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--muted)"><span style="width:6px;height:6px;border-radius:50%;background:${cityColor};display:inline-block"></span>${city.name}</span>`
      : act.city === 'other'
      ? `<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--muted)"><span style="width:6px;height:6px;border-radius:50%;background:#8a8278;display:inline-block"></span>🗺️ ${act.region || 'Other'}</span>`
      : '';

    const noteHTML = act.notes ? `<div class="acts-card-note">${act.notes}</div>` : '';

    const card = document.createElement('div');
    card.className = 'acts-card' + (personArr.includes('ai') ? ' acts-card-ai' : '');
    card.dataset.id = act.id;
    card.innerHTML = `
      <div class="acts-card-accent" style="background:${cityColor}"></div>
      <div class="acts-card-body">
        <div class="acts-card-top">
          <div class="acts-card-left">
            <div class="acts-card-title-row">
              <span class="acts-card-emoji">${catEmoji}</span>
              <span class="acts-card-name">${act.name}</span>
            </div>
            <div class="acts-card-type">${act.type}${act.address ? ' · ' + act.address.split(',')[0] : ''}</div>
          </div>
          <div style="flex-shrink:0">${crewDot}</div>
        </div>
        ${badges.length ? `<div class="acts-card-badges">${badges.join('')}</div>` : ''}
        ${noteHTML}
        <div class="acts-card-footer">
          <div class="acts-card-footer-left">
            ${cityPip}
            <span class="acts-card-dur">${act.estimatedDuration || ''}</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            ${dayChip}
            <span class="acts-card-cost">${costStr}</span>
          </div>
        </div>
      </div>`;

    // Expand hint
    const cardBody = card.querySelector('.acts-card-body');
    const hintEl = document.createElement('div');
    hintEl.className = 'acts-card-expand-hint';
    hintEl.textContent = 'Tap for details';
    cardBody.appendChild(hintEl);

    // Detail section
    const detail = document.createElement('div');
    detail.className = 'acts-card-detail';
    if (act.description) {
      const desc = document.createElement('div');
      desc.className = 'acts-card-desc';
      desc.textContent = act.description;
      detail.appendChild(desc);
    }
    const links = document.createElement('div');
    links.className = 'acts-card-links';
    if (act.mapsQuery) {
      const ml = document.createElement('a');
      ml.className = 'acts-card-link maps';
      ml.href = 'https://www.google.com/maps/search/' + encodeURIComponent(act.mapsQuery);
      ml.target = '_blank'; ml.rel = 'noopener noreferrer';
      ml.textContent = '📍 Google Maps';
      links.appendChild(ml);
    }
    if (act.url) {
      const sl = document.createElement('a');
      sl.className = 'acts-card-link official';
      sl.href = act.url;
      sl.target = '_blank'; sl.rel = 'noopener noreferrer';
      sl.textContent = '🔗 Official Site';
      links.appendChild(sl);
    }
    if (links.children.length) detail.appendChild(links);
    cardBody.appendChild(detail);

    // Toggle expand on body click (not on links or day chip)
    cardBody.addEventListener('click', e => {
      if (e.target.closest('.acts-card-day') || e.target.closest('a')) return;
      card.classList.toggle('expanded');
    });

    const dayBtn = card.querySelector('.acts-card-day');
    if (dayBtn) {
      dayBtn.addEventListener('click', e => {
        e.stopPropagation();
        document.querySelector('.nav-tab[data-tab="itinerary"]')?.click();
        setTimeout(() => {
          const dayCard = document.querySelector('.day-card[data-day="' + dayBtn.dataset.gotoDay + '"]');
          if (dayCard) {
            if (!dayCard.classList.contains('open')) dayCard.querySelector('.day-card-header')?.click();
            dayCard.scrollIntoView({ behavior:'smooth', block:'start' });
          }
        }, 120);
      });
    }
    return card;
  }

  function renderCards() {
    const container = document.getElementById('acts-content');
    if (!container) return;
    container.innerHTML = '';

    const filtered = getFiltered();
    updateSummary(filtered);
    // Share the result with the Map view and refresh the Filters badge
    window.__placesFiltered = filtered;
    window.dispatchEvent(new CustomEvent('places-filter', { detail: filtered }));
    const nActive = ['city','person','category','booking','sched'].filter(k => state[k] !== DEFAULTS[k]).length;
    const badge = document.getElementById('places-filter-count');
    if (badge) badge.textContent = nActive ? nActive : '';

    if (!filtered.length) {
      container.innerHTML = `<div class="acts-no-results"><div class="acts-no-results-emoji">🔍</div><div class="acts-no-results-title">No activities found</div><div style="font-size:13px">Try adjusting your filters or search term</div></div>`;
      return;
    }

    if (state.city === 'all' && !state.search) {
      ['tokyo','kyoto','osaka','other'].forEach(cityId => {
        const cityActs = filtered.filter(a => a.city === cityId)
          .sort((a, b) => (PRIORITY_ORDER[a.priority] ?? 9) - (PRIORITY_ORDER[b.priority] ?? 9));
        if (!cityActs.length) return;
        const city = C.getCityById(cityId) || { color:'#8a8278', emoji:'🗺️', name:'Other Regions (someday)' };
        const header = document.createElement('div');
        header.className = 'acts-group-header';
        header.innerHTML = `<span class="acts-group-name" style="color:${city.color}">${city.emoji} ${city.name}</span><span class="acts-group-count">${cityActs.length} activit${cityActs.length === 1 ? 'y' : 'ies'}</span>`;
        container.appendChild(header);
        cityActs.forEach(act => container.appendChild(renderCard(act)));
      });
    } else {
      [...filtered]
        .sort((a, b) => (PRIORITY_ORDER[a.priority] ?? 9) - (PRIORITY_ORDER[b.priority] ?? 9))
        .forEach(act => container.appendChild(renderCard(act)));
    }
  }

  function buildFilters() {
    const wrap = document.getElementById('acts-filters-wrap');
    if (!wrap) return;
    wrap.innerHTML = '';

    const rows = [
      { key:'city', label:'City', options:[
          { value:'all', label:'All Cities' },
          ...C.cities.map(c => ({ value:c.id, label:c.name, dot:c.color, count:allActivities.filter(a=>a.city===c.id).length })),
          { value:'other', label:'🗺️ Other Regions', dot:'#8a8278', count:allActivities.filter(a=>a.city==='other').length },
        ]
      },
      { key:'person', label:'Who', options:[
          { value:'all', label:'Everyone' },
          ...C.crew.filter(m => allActivities.some(a => personIdsA(a).includes(m.id)))
            .map(m => ({ value:m.id, label:m.name, dot:m.color, count:allActivities.filter(a=>personIdsA(a).includes(m.id)).length })),
          { value:'ai', label:'✨ AI Picks', dot:'#8b5cf6', count:allActivities.filter(a=>personIdsA(a).includes('ai')).length },
        ]
      },
      { key:'category', label:'Type', options:[
          { value:'all', label:'All Types' },
          ...Object.entries(allActivities.reduce((acc,a) => { acc[a.category]=(acc[a.category]||0)+1; return acc; }, {}))
            .sort((a,b) => b[1]-a[1])
            .map(([cat, count]) => {
              const meta = (typeof TRIP_DATA !== 'undefined' && TRIP_DATA.categories && TRIP_DATA.categories[cat]) ? TRIP_DATA.categories[cat] : { label: cat };
              return { value:cat, label:`${CAT_EMOJI_A[cat]||'📍'} ${meta.label}`, count };
            })
        ]
      },
      { key:'sched', label:'Plan', options:[
          { value:'all', label:'All' },
          { value:'yes', label:'📅 On the itinerary', count:allActivities.filter(a=>typeof a.dayAssigned==='number').length },
          { value:'no',  label:'💭 Wishlist only',    count:allActivities.filter(a=>typeof a.dayAssigned!=='number').length },
        ]
      },
      { key:'booking', label:'Booking', options:[
          { value:'all',         label:'All' },
          { value:'true',        label:'📋 Book Ahead', count:allActivities.filter(a=>a.bookingRequired===true).length },
          { value:'recommended', label:'⚠️ Rec. Book',  count:allActivities.filter(a=>a.bookingRequired==='recommended').length },
          { value:'false',       label:'🚶 Walk-in OK', count:allActivities.filter(a=>a.bookingRequired===false).length },
        ]
      },
    ];

    rows.forEach(row => {
      const rowEl = document.createElement('div');
      rowEl.className = 'acts-filter-row';
      const lbl = document.createElement('span');
      lbl.className = 'acts-filter-label';
      lbl.textContent = row.label;
      rowEl.appendChild(lbl);

      row.options.forEach(opt => {
        const isDefault = opt.value === state[row.key];
        const btn = document.createElement('button');
        btn.className = 'acts-filter-btn' + (isDefault ? ' active' : '');
        btn.dataset.key   = row.key;
        btn.dataset.value = opt.value;
        let inner = opt.dot ? `<span class="afb-dot" style="background:${opt.dot}"></span>` : '';
        inner += opt.label;
        if (opt.count !== undefined) inner += ` <span class="acts-filter-count">${opt.count}</span>`;
        btn.innerHTML = inner;
        // Set inline styles for initial active state so it's visible before any click
        if (isDefault) {
          btn.style.background = opt.dot || '#0a0a0a';
          btn.style.color = '#fff';
          btn.style.borderColor = 'transparent';
        }
        btn.addEventListener('click', () => {
          rowEl.querySelectorAll('.acts-filter-btn').forEach(b => {
            b.classList.remove('active');
            b.style.background = '';
            b.style.color = '';
            b.style.borderColor = '';
          });
          btn.classList.add('active');
          const activeColor = opt.dot || '#0a0a0a';
          btn.style.background = activeColor;
          btn.style.color = '#fff';
          btn.style.borderColor = 'transparent';
          state[row.key] = opt.value;
          renderCards();
        });
        rowEl.appendChild(btn);
      });
      wrap.appendChild(rowEl);
    });
  }

  function initSearch() {
    const input    = document.getElementById('acts-search-input');
    const clearBtn = document.getElementById('acts-search-clear');
    if (!input) return;
    input.addEventListener('input', () => {
      state.search = input.value.trim();
      clearBtn.classList.toggle('visible', state.search.length > 0);
      renderCards();
    });
    clearBtn.addEventListener('click', () => {
      input.value = '';
      state.search = '';
      clearBtn.classList.remove('visible');
      renderCards();
    });
  }

  function initActivities() {
    if (built) return;
    built = true;
    if (typeof TRIP_DATA === 'undefined' || !TRIP_DATA.activities) {
      document.getElementById('acts-content').innerHTML = '<div class="acts-no-results"><div class="acts-no-results-emoji">⚠️</div><div class="acts-no-results-title">Activity data not loaded</div></div>';
      return;
    }
    allActivities = TRIP_DATA.activities;
    buildFilters();
    initSearch();
    initPlacesChrome();
    renderCards();
  }

  // List / Map switch and the Filters fold-out
  function initPlacesChrome() {
    const tab = document.getElementById('tab-places');
    tab.querySelectorAll('.places-view button').forEach(b => b.addEventListener('click', () => {
      tab.querySelectorAll('.places-view button').forEach(x => x.classList.toggle('active', x === b));
      const map = b.dataset.view === 'map';
      tab.classList.toggle('view-map', map);
      if (map && window.initPlacesMap) window.initPlacesMap();
    }));
    const fb = document.getElementById('places-filter-btn');
    const wrap = document.getElementById('acts-filters-wrap');
    fb.addEventListener('click', () => {
      const open = wrap.classList.toggle('open');
      fb.classList.toggle('active', open);
      fb.setAttribute('aria-expanded', open);
      if (window.initPlacesMap && tab.classList.contains('view-map')) window.initPlacesMap();
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.addEventListener('click', e => {
      const btn = e.target.closest('.nav-tab');
      if (btn && btn.dataset.tab === 'places') setTimeout(initActivities, 0);
    });
  });
})();
</script>

<!-- ITINERARY RENDER SCRIPT -->
<script>
(function () {
  'use strict';
  const C = SITE_CONFIG;

  let activeFilter = 'all';
  let itinBuilt = false;

  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function whoHTML(ids) {
    if (!ids || !ids.length) return '';
    if (ids.length === ITIN_ALL.length) {
      return `<span class="who-dot" style="background:var(--ink)" title="Everyone">All</span>`;
    }
    return ids.map(id => {
      const crew = ITINERARY_DATA.CREW[id];
      const color = C.getCrewColor(id);
      return `<span class="who-dot" style="background:${color}" title="${crew ? crew.name : id}">${crew ? crew.i : id[0].toUpperCase()}</span>`;
    }).join('');
  }

  function anchorHTML(b) {
    const k = ITINERARY_DATA.KIND[b.kind] || ITINERARY_DATA.KIND.event;
    const kindClass = b.kind === 'flight' ? 'transit' : b.kind;
    return `<div class="blk anchor">
      <span class="node" aria-hidden="true">${k[0]}</span>
      <div class="a-time">${esc(b.time)}</div>
      <div class="a-title">${esc(b.title)}</div>
      ${b.note ? `<div class="a-note">${esc(b.note)}</div>` : ''}
      <div class="a-row">
        <span class="kind ${kindClass}">${k[1]}</span>
        ${b.who && b.who.length ? `<span class="who" style="margin-left:auto">${whoHTML(b.who)}</span>` : ''}
      </div>
    </div>`;
  }

  let freeId = 0;
  function freeHTML(b) {
    const id = `free-${freeId++}`;
    const n = b.items.length;
    const items = b.items.map(it => `<li class="f-item${it.star ? ' star' : ''}">
        <span class="f-mark" aria-hidden="true">${it.star ? '★' : '+'}</span>
        <span><span class="f-name">${esc(it.name)}</span>${it.sub ? `<span class="f-sub">${esc(it.sub)}</span>` : ''}</span>
        ${it.who && it.who.length ? `<span class="who">${whoHTML(it.who)}</span>` : ''}
      </li>`).join('');
    return `<div class="blk free">
      <span class="node" aria-hidden="true"></span>
      <button class="free-toggle" aria-expanded="false" aria-controls="${id}">
        <span>
          <span class="f-label">Free time</span>
          <span class="f-area" style="display:block">${esc(b.area)}${b.win ? ` <span class="f-window">· ${esc(b.win)}</span>` : ''}</span>
        </span>
        <span class="f-count">${n} ${n === 1 ? 'spot' : 'spots'} <span class="f-chev" aria-hidden="true">▾</span></span>
      </button>
      <ul class="f-list" id="${id}">${items}</ul>
    </div>`;
  }

  function groupHTML(b) {
    return `<div class="grp ${b.kind}">
      <div class="grp-head">
        <span class="grp-label">${esc(b.label)}</span>
        <span class="grp-title">${esc(b.title)}</span>
        ${b.who.length ? `<span class="who" style="margin-left:auto">${whoHTML(b.who)}</span>` : ''}
      </div>
      <div class="grp-body">${blocksHTML(b.blocks)}</div>
    </div>`;
  }

  function blocksHTML(list) {
    return list.map(b => b.t === 'anchor' ? anchorHTML(b) : b.t === 'free' ? freeHTML(b) : groupHTML(b)).join('');
  }

  function countBlocks(list, t) {
    return list.reduce((sum, b) => sum + (b.t === t ? 1 : 0) + (b.t === 'group' ? countBlocks(b.blocks, t) : 0), 0);
  }
  function countSpots(list) {
    return list.reduce((sum, b) => sum + (b.t === 'free' ? b.items.length : 0) + (b.t === 'group' ? countSpots(b.blocks) : 0), 0);
  }

  function buildItinSummary() {
    const container = document.getElementById('itin-summary-inner');
    if (!container || typeof ITINERARY_DATA === 'undefined') return;
    const totalAnchors = ITINERARY_DATA.days.reduce((s, d) => s + countBlocks(d.blocks, 'anchor'), 0);
    const totalSpots   = ITINERARY_DATA.days.reduce((s, d) => s + countSpots(d.blocks), 0);
    [
      { num:ITINERARY_DATA.days.length, label:'Days' },
      { num:3, label:'Cities' },
      { num:totalAnchors, label:'Anchors' },
      { num:totalSpots, label:'Free-time spots' },
    ].forEach(item => {
      const el = document.createElement('div');
      el.className = 'itin-sum-item';
      el.innerHTML = `<div class="itin-sum-num">${item.num}</div><div class="itin-sum-label">${item.label}</div>`;
      container.appendChild(el);
    });
  }

  function buildFilters() {
    const container = document.getElementById('itin-filters');
    if (!container) return;
    const filters = [
      { id:'all',   label:'All Days', dot:'#0a0a0a' },
      { id:'tokyo', label:'Tokyo',    dot:'#c41e3a' },
      { id:'kyoto', label:'Kyoto',    dot:'#d4af37' },
      { id:'osaka', label:'Osaka',    dot:'#ea8b37' },
    ];
    filters.forEach(f => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (f.id === 'all' ? ' active' : '');
      btn.dataset.filter = f.id;
      btn.innerHTML = `<span class="filter-dot" style="background:${f.dot}"></span>${f.label}`;
      if (f.id === 'all') { btn.style.background = '#0a0a0a'; btn.style.color = '#fff'; btn.style.borderColor = 'transparent'; }
      btn.addEventListener('click', () => setFilter(f.id));
      container.appendChild(btn);
    });
    const spacer = document.createElement('span');
    spacer.className = 'filter-spacer';
    container.appendChild(spacer);
    const toggleDaysBtn = document.createElement('button');
    toggleDaysBtn.className = 'filter-btn tool';
    toggleDaysBtn.id = 'itin-toggle-days';
    toggleDaysBtn.textContent = 'Open all days';
    toggleDaysBtn.addEventListener('click', e => toggleAllDays(e.currentTarget));
    container.appendChild(toggleDaysBtn);
  }

  function toggleAllDays(btn) {
    const cards = [...document.querySelectorAll('#itin-content .day-card')];
    const anyClosed = cards.some(c => !c.classList.contains('open'));
    cards.forEach(c => {
      c.classList.toggle('open', anyClosed);
      const head = c.querySelector('.day-card-header');
      if (head) head.setAttribute('aria-expanded', anyClosed);
      if (anyClosed) {
        const dayNum = c.dataset.day;
        const day = ITINERARY_DATA.days.find(d => String(d.dayNumber) === String(dayNum));
        if (day) requestAnimationFrame(() => requestAnimationFrame(() => buildDayMap(day)));
      }
    });
    btn.textContent = anyClosed ? 'Close all days' : 'Open all days';
  }

  function setFilter(filterId) {
    activeFilter = filterId;
    document.querySelectorAll('#itin-filters .filter-btn[data-filter]').forEach(btn => {
      const isActive = btn.dataset.filter === filterId;
      btn.classList.toggle('active', isActive);
      if (isActive) {
        const color = filterId === 'all' ? '#0a0a0a' : C.getCityColor(filterId);
        btn.style.background = color;
        btn.style.color = '#fff';
        btn.style.borderColor = 'transparent';
      } else {
        btn.style.background = '';
        btn.style.color = '';
        btn.style.borderColor = '';
      }
    });
    document.querySelectorAll('#itin-content .city-section').forEach(section => {
      const show = filterId === 'all' || filterId === section.dataset.city ||
        (filterId === 'tokyo' && section.dataset.city === 'pretrip');
      section.style.display = show ? '' : 'none';
    });
  }

  function badgesHTML(day) {
    if (!day.badges || !day.badges.length) return '';
    return `<div class="day-badges">${day.badges.map(([cls, text]) => `<span class="day-badge ${cls}">${esc(text)}</span>`).join('')}</div>`;
  }

  function dayCard(day) {
    const city = ITINERARY_DATA.CITIES[day.city] || ITINERARY_DATA.CITIES.departure;
    const anchors = countBlocks(day.blocks, 'anchor');
    const frees = countBlocks(day.blocks, 'free');
    const walkPct = Math.min(100, Math.round((day.walking.miles / 9) * 100));

    const card = document.createElement('article');
    card.className = 'day-card';
    card.dataset.day = day.dayNumber;
    card.style.setProperty('--rail', city.color);
    const bodyId = `day-body-${day.dayNumber}`;

    const notesHTML = day.notes && day.notes.length
      ? `<div class="day-notes${day.warn ? ' has-warn' : ''}">${day.notes.map(p => `<p>${p}</p>`).join('')}</div>`
      : '';

    card.innerHTML = `
      <button class="day-card-header" aria-expanded="false" aria-controls="${bodyId}">
        <div class="day-num-block" style="background:${city.color}">
          <div class="day-num-label">Day</div>
          <div class="day-num-value">${day.dayNumber}</div>
        </div>
        <div>
          <div class="day-theme">${esc(day.title || day.theme)}</div>
          ${day.title ? `<div class="day-subtheme">${esc(day.theme)}</div>` : ''}
          <div class="day-meta-row">
            <span class="day-meta-item">⚓ ${anchors} ${anchors === 1 ? 'anchor' : 'anchors'}</span>
            ${frees ? `<span class="day-meta-item">🧭 ${frees} free ${frees === 1 ? 'block' : 'blocks'}</span>` : ''}
            <span class="day-meta-item">💴 $${day.estimatedCostPerPerson.usd}/person</span>
            <span class="day-meta-item">🚶 ${day.walking.miles}mi</span>
          </div>
          ${badgesHTML(day)}
        </div>
        <div class="day-chevron" aria-hidden="true">▾</div>
      </button>
      <div class="day-card-body" id="${bodyId}">
        <div class="day-date-strip">${esc(day.date)}</div>
        <div class="flow">${blocksHTML(day.blocks)}</div>
        ${day.lastTrain ? `<div class="last-train"><span class="last-train-icon">🌙</span><div><div class="last-train-label">Getting home tonight</div>${esc(day.lastTrain)}<div class="last-train-sub">Times are approximate — check Google Maps or Navitime that night.</div></div></div>` : ''}
        ${notesHTML}
        <div class="cost-row">
          <div class="walk-row">
            <span>🚶 ${day.walking.miles} mi · ${day.walking.steps.toLocaleString()} steps</span>
            <div class="walk-bar-track"><div class="walk-bar-fill" style="width:${walkPct}%;background:${city.color}"></div></div>
          </div>
          <div class="cost-value">¥${day.estimatedCostPerPerson.yen.toLocaleString()}</div>
        </div>
        <div class="day-map-section">
          <div class="day-map-label">📍 Today's Activities & Route</div>
          <div class="day-map-wrap" id="daymap-${day.dayNumber}"></div>
        </div>
      </div>`;

    const head = card.querySelector('.day-card-header');
    head.addEventListener('click', () => {
      const wasOpen = card.classList.contains('open');
      card.classList.toggle('open');
      head.setAttribute('aria-expanded', !wasOpen);
      if (!wasOpen) {
        requestAnimationFrame(() => requestAnimationFrame(() => buildDayMap(day)));
      } else if (dayMaps[day.dayNumber]) {
        requestAnimationFrame(() => requestAnimationFrame(() => dayMaps[day.dayNumber].invalidateSize()));
      }
    });
    card.querySelectorAll('.free-toggle').forEach(btn => btn.addEventListener('click', () => {
      const blk = btn.closest('.free');
      const open = blk.classList.toggle('open');
      btn.setAttribute('aria-expanded', open);
    }));
    return card;
  }

  // ── Per-day mini map — unchanged logic, reused from the prior implementation ──
  const dayMaps = {};

  function buildDayMap(day) {
    if (dayMaps[day.dayNumber]) {
      dayMaps[day.dayNumber].invalidateSize();
      return;
    }
    const container = document.getElementById(`daymap-${day.dayNumber}`);
    if (!container || typeof L === 'undefined') return;

    const COORDS     = window.ACTIVITY_COORDS || {};
    const CAT_EMOJI2 = window.MAP_CAT_EMOJI || {};
    const makeIcon2  = window.makeMapIcon;
    const acts = (typeof TRIP_DATA !== 'undefined') ? TRIP_DATA.activities : [];

    const dayActs = acts.filter(a => a.dayAssigned === day.dayNumber && COORDS[a.id]);

    if (!dayActs.length || !makeIcon2) {
      container.outerHTML = `<div class="day-map-empty" id="daymap-${day.dayNumber}">No mapped activities for this day yet</div>`;
      return;
    }

    const map = L.map(container, { zoomControl: true, scrollWheelZoom: false });
    dayMaps[day.dayNumber] = map;

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 19,
    }).addTo(map);

    const latlngs = [];
    dayActs.forEach(a => {
      const coords = COORDS[a.id];
      const personArr = Array.isArray(a.person) ? a.person : [a.person];
      const firstPerson = personArr[0];
      const color = firstPerson === 'ai' ? '#a0a09a' : C.getCrewColor(firstPerson);
      const emoji = CAT_EMOJI2[a.category] || '📍';
      const marker = L.marker(coords, { icon: makeIcon2(color, emoji) });
      marker.bindPopup(`<b>${a.name}</b><br>${a.type || ''}`, { className: 'day-map-popup' });
      marker.addTo(map);
      latlngs.push(coords);
    });

    if (latlngs.length > 1) {
      const city = ITINERARY_DATA.CITIES[day.city];
      L.polyline(latlngs, { color: (city && city.color) || '#8a8278', weight: 2.5, dashArray: '6 6', opacity: 0.7 }).addTo(map);
    }

    if (latlngs.length === 1) {
      map.setView(latlngs[0], 15);
    } else {
      map.fitBounds(L.latLngBounds(latlngs), { padding: [24, 24] });
    }

    map.invalidateSize();
    setTimeout(() => map.invalidateSize(), 200);
  }

  function buildItinerary() {
    const container = document.getElementById('itin-content');
    if (!container || typeof ITINERARY_DATA === 'undefined') return;

    const legend = document.createElement('div');
    legend.className = 'legend';
    legend.innerHTML = `
      <div class="legend-row"><span>⚓</span><span><b>Anchors</b> are fixed: tickets, reservations, set-time events, group meals and major transit.</span></div>
      <div class="legend-row"><span>🧭</span><span><b>Free time</b> is tied to one area. Tap to see every pick nearby; <span style="color:var(--gold)">★</span> is the main draw, everything else is optional.</span></div>`;
    container.appendChild(legend);

    const cityOrder = ['pretrip','tokyo','kyoto','osaka','departure'];
    const grouped = {};
    ITINERARY_DATA.days.forEach(d => {
      if (!grouped[d.city]) grouped[d.city] = [];
      grouped[d.city].push(d);
    });

    cityOrder.forEach(cityId => {
      const days = grouped[cityId];
      if (!days || !days.length) return;
      const city = ITINERARY_DATA.CITIES[cityId];

      const section = document.createElement('section');
      section.className = 'city-section';
      section.dataset.city = cityId;
      section.innerHTML = `<div class="city-section-header" style="border-color:${city.color}">
          <span class="city-section-name" style="color:${city.color}">${city.name}</span>
          <span class="city-section-kanji">${city.kanji}</span>
          <span class="city-section-meta">${city.meta}</span>
        </div>${city.base ? `<div class="city-base">${city.base}</div>` : ''}`;
      container.appendChild(section);

      days.forEach(day => section.appendChild(dayCard(day)));
    });
  }

  function initItinerary() {
    if (itinBuilt) return;
    itinBuilt = true;
    buildItinSummary();
    buildFilters();
    buildItinerary();
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.addEventListener('click', e => {
      const btn = e.target.closest('.nav-tab');
      if (btn && btn.dataset.tab === 'itinerary' && !itinBuilt) {
        setTimeout(initItinerary, 0);
      }
    });
    if (document.getElementById('tab-itinerary')?.classList.contains('active') && !itinBuilt) {
      initItinerary();
    }
  });
})();

</script>

<!-- TODAY RENDER SCRIPT -->
<script>
(function () {
  'use strict';
  const C = SITE_CONFIG;
  const TRIP_START = new Date(2027, 0, 8);           // Day 0, local time
  let built = false, current = 0, live = false;

  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const D = () => ITINERARY_DATA;

  function tripDayIndex(now) {
    const d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((d0 - TRIP_START) / 864e5);
  }
  function parseMins(t) {
    const m = /(\d{1,2}):(\d{2})\s*(AM|PM)/i.exec(t || '');
    if (!m) return null;
    let h = +m[1] % 12; if (/pm/i.test(m[3])) h += 12;
    return h * 60 + +m[2];
  }
  function whoDots(ids) {
    if (!ids || !ids.length) return '';
    if (ids.length === 6) return `<span class="who-dot" style="background:var(--ink)" title="Everyone">All</span>`;
    return ids.map(id => { const m = D().CREW[id]; return `<span class="who-dot" style="background:${C.getCrewColor(id)}" title="${m ? m.name : id}">${m ? m.i : '?'}</span>`; }).join('');
  }
  // Flatten anchors (incl. inside groups) with the group label attached
  function flatten(blocks, grp) {
    const out = [];
    blocks.forEach(b => {
      if (b.t === 'group') out.push(...flatten(b.blocks, b));
      else out.push(Object.assign({}, b, { grp }));
    });
    return out;
  }
  function homeFor(day) {
    if (typeof LOGISTICS === 'undefined') return null;
    const name = { tokyo:'Tokyo', kyoto:'Kyoto', osaka:'Osaka' }[day.city];
    return name ? LOGISTICS.accommodation.cities.find(x => x.city === name) : null;
  }

  function render() {
    const root = document.getElementById('today-root');
    const days = D().days;
    const day = days.find(d => d.dayNumber === current) || days[0];
    const city = D().CITIES[day.city] || D().CITIES.departure;
    const now = new Date();
    const idx = tripDayIndex(now);
    const items = flatten(day.blocks);

    // Status banner
    let banner;
    if (idx < 0) banner = `👀 Preview — the trip starts in <b>${-idx}</b> day${idx === -1 ? '' : 's'}. This tab opens on the right day automatically once you're travelling.`;
    else if (idx > 16) banner = `🏠 Trip's over — welcome home. Showing the last day.`;
    else banner = live && current === idx ? `🟢 Live — today is Day ${idx}.` : `Viewing Day ${current} · <a href="#" id="td-jump-today">jump to today (Day ${idx})</a>`;

    // Next up (only when viewing the real current day)
    let nextHTML = '';
    if (live && current === idx) {
      const mins = now.getHours() * 60 + now.getMinutes();
      const next = items.find(b => b.t === 'anchor' && parseMins(b.time) !== null && parseMins(b.time) >= mins - 15);
      if (next) {
        const k = D().KIND[next.kind] || D().KIND.event;
        nextHTML = `<div class="td-next" style="border-color:${city.color}">
          <div class="td-next-label">Next up</div>
          <div class="td-next-time">${esc(next.time)}</div>
          <div class="td-next-title">${k[0]} ${esc(next.title)}</div>
          ${next.note ? `<div class="td-next-note">${esc(next.note)}</div>` : ''}
          <div class="td-next-who">${whoDots(next.who)}</div>
        </div>`;
      }
    }

    // Schedule
    const sched = items.map(b => {
      if (b.t === 'anchor') {
        const k = D().KIND[b.kind] || D().KIND.event;
        return `<div class="td-row">
          <div class="td-time">${esc(b.time)}</div>
          <div class="td-body">
            <div class="td-title">${k[0]} ${esc(b.title)}${b.grp ? ` <span class="td-grp">${esc(b.grp.label)}</span>` : ''}</div>
            ${b.note ? `<div class="td-note">${esc(b.note)}</div>` : ''}
          </div>
          <div class="td-who">${whoDots(b.who.length ? b.who : (b.grp ? b.grp.who : []))}</div>
        </div>`;
      }
      const star = b.items.find(i => i.star);
      return `<div class="td-row td-free">
        <div class="td-time">${esc(b.win || 'Free')}</div>
        <div class="td-body">
          <div class="td-title">🧭 ${esc(b.area)}${b.grp ? ` <span class="td-grp">${esc(b.grp.label)}</span>` : ''}</div>
          <div class="td-note">${star ? '★ ' + esc(star.name) + (b.items.length > 1 ? ` + ${b.items.length - 1} more` : '') : b.items.map(i => esc(i.name)).join(' · ')}</div>
        </div>
        <div class="td-who">${b.grp ? whoDots(b.grp.who) : ''}</div>
      </div>`;
    }).join('');

    // Tickets today
    const tix = items.filter(b => b.t === 'anchor' && b.kind === 'ticket');
    const tixHTML = tix.length ? `<div class="td-card"><div class="td-card-label">🎟 Tickets & reservations today</div>
      ${tix.map(b => `<div class="td-tix"><span>${esc(b.time)} · ${esc(b.title)}</span><span class="td-who">${whoDots(b.who.length ? b.who : (b.grp ? b.grp.who : []))}</span></div>`).join('')}</div>` : '';

    // Home tonight
    const home = homeFor(day);
    let homeHTML = '';
    if (home && day.dayNumber !== 16) {
      homeHTML = `<div class="td-card"><div class="td-card-label">🏠 Home tonight — ${home.city}</div>
        <div class="td-home-ja">${esc(home.addressJa || '')}</div>
        <div class="td-note">${esc(home.address)}</div>
        <div class="td-home-btns">
          <button class="td-btn" id="td-taxi">🚕 Taxi card</button>
          <a class="td-btn" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(home.address)}">🧭 Directions home</a>
        </div></div>`;
    } else if (day.dayNumber === 0) {
      homeHTML = `<div class="td-card"><div class="td-card-label">✈️ Tonight</div><div class="td-note">On the plane — landing at Haneda 2:20 PM on Jan 9.</div></div>`;
    } else if (day.dayNumber === 16) {
      homeHTML = `<div class="td-card"><div class="td-card-label">✈️ Tonight</div><div class="td-note">Flying home — UA 804 departs HND 4:50 PM, lands GSO 7:04 PM.</div></div>`;
    }

    const trainHTML = day.lastTrain ? `<div class="last-train"><span class="last-train-icon">🌙</span><div><div class="last-train-label">Getting home tonight</div>${esc(day.lastTrain)}<div class="last-train-sub">Times are approximate — check Google Maps or Navitime that night.</div></div></div>` : '';
    const notesHTML = day.notes && day.notes.length ? `<div class="td-card${day.warn ? ' td-warn' : ''}">${day.notes.map(n => `<p>${n}</p>`).join('')}</div>` : '';

    // Day strip
    const strip = days.map(d => {
      const cc = (D().CITIES[d.city] || {}).color || '#8a8278';
      return `<button class="td-chip${d.dayNumber === current ? ' active' : ''}${d.dayNumber === idx ? ' is-today' : ''}" data-d="${d.dayNumber}" style="--c:${cc}">${d.dayNumber}</button>`;
    }).join('');

    root.innerHTML = `
      <div class="td-hero" style="background:${city.color}">
        <div class="td-hero-inner">
          <div class="td-hero-nav">
            <button class="td-arrow" id="td-prev" ${current <= 0 ? 'disabled' : ''} aria-label="Previous day">‹</button>
            <div class="td-hero-mid">
              <div class="td-hero-eyebrow">Day ${day.dayNumber} · ${esc(day.date)} · ${esc(city.name)}</div>
              <div class="td-hero-title">${esc(day.title || day.theme)}</div>
              ${day.title ? `<div class="td-hero-sub">${esc(day.theme)}</div>` : ''}
            </div>
            <button class="td-arrow" id="td-next" ${current >= 16 ? 'disabled' : ''} aria-label="Next day">›</button>
          </div>
        </div>
      </div>
      <div class="td-strip">${strip}</div>
      <div class="td-content">
        <div class="td-banner">${banner}</div>
        ${nextHTML}
        <div class="td-card td-sched"><div class="td-card-label">The day</div>${sched}</div>
        ${tixHTML}
        ${trainHTML}
        ${homeHTML}
        ${notesHTML}
        <button class="td-btn td-open-itin" id="td-open-itin">Open full Day ${day.dayNumber} in the itinerary →</button>
      </div>`;

    root.querySelector('#td-prev')?.addEventListener('click', () => { current = Math.max(0, current - 1); render(); });
    root.querySelector('#td-next')?.addEventListener('click', () => { current = Math.min(16, current + 1); render(); });
    root.querySelectorAll('.td-chip').forEach(b => b.addEventListener('click', () => { current = +b.dataset.d; render(); }));
    root.querySelector('#td-jump-today')?.addEventListener('click', e => { e.preventDefault(); current = idx; render(); });
    root.querySelector('#td-taxi')?.addEventListener('click', () => {
      if (window.openTaxiCard) { window.openTaxiCard(home); return; }
      alert(home.addressJa);
    });
    root.querySelector('#td-open-itin').addEventListener('click', () => {
      document.querySelector('.nav-tab[data-tab="itinerary"]')?.click();
      setTimeout(() => {
        const card = document.querySelector(`.day-card[data-day="${day.dayNumber}"]`);
        if (card) { if (!card.classList.contains('open')) card.querySelector('.day-card-header')?.click(); card.scrollIntoView({ behavior:'smooth', block:'start' }); }
      }, 150);
    });
    const active = root.querySelector('.td-chip.active');
    if (active && active.scrollIntoView) active.scrollIntoView({ block:'nearest', inline:'center' });
  }

  function init() {
    if (built) return;
    built = true;
    const idx = tripDayIndex(new Date());
    live = idx >= 0 && idx <= 16;
    current = idx < 0 ? 0 : idx > 16 ? 16 : idx;
    render();
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.addEventListener('click', e => {
      const btn = e.target.closest('.nav-tab');
      if (btn && btn.dataset.tab === 'today') setTimeout(init, 0);
    });
  });
  // During the trip, refresh "Next up" every minute while the tab is open
  setInterval(() => { if (built && live && document.getElementById('tab-today')?.classList.contains('active')) render(); }, 60000);
})();
</script>

<!-- BUDGET RENDER SCRIPT -->
<script>
(function () {
  'use strict';
  const C = SITE_CONFIG;
  let budgetBuilt = false;
  let showYen = false; // false = USD, true = JPY

  // ── Estimated budget breakdown per person (USD) ──
  // These are realistic estimates for the full trip including all categories.
  // Users can adjust with sliders.
  const BUDGET_CATEGORIES = [
    { id:'flights',       label:'Flights',          emoji:'✈️',  color:'#6366f1' },
    { id:'accommodation', label:'Accommodation',    emoji:'🏠',  color:'#3b82f6' },
    { id:'food',          label:'Food & Drink',     emoji:'🍜',  color:'#f59e0b' },
    { id:'transport',     label:'Transport',        emoji:'🚅',  color:'#14b8a6' },
    { id:'activities',    label:'Activities',       emoji:'🎯',  color:'#ec4899' },
    { id:'shopping',      label:'Shopping',         emoji:'🛍️', color:'#8b5cf6' },
    { id:'nightlife',     label:'Bars & Nightlife', emoji:'🍺',  color:'#ef4444' },
    { id:'misc',          label:'Misc & Buffer',    emoji:'🎒',  color:'#94a3b8' },
  ];

  // Default spend allocations per person (USD)
  // Derived from actual planned activities + realistic estimates
  // Realistic per-person allocations (USD), rebuilt Oct 2026 from booked costs + the current itinerary.
  //   flights        — booked, $1,450 each
  //   accommodation  — booked, $4,845 ÷ 6 = $807.50 each
  //   transport      — 2× Shinkansen (~¥28,000) + airport legs, metro/JR ~¥600/day, day-trip rail,
  //                    Kawaguchiko bus, taxi shares, Yamato forwarding ×2 ≈ ¥54,000 (~$360) → $375
  //   activities     — shared tickets on the itinerary ≈ ¥24,000 (~$160) + each person's own
  //                    (FF40th, Kirby, Eorzea, Nijigen no Mori, Sumo, arcades, Spa World…)
  //   food           — ~¥6,000/day baseline (~$620 for the trip), adjusted for foodies and the Kobe beef lunch
  //   nightlife      — scaled to each person's role on the trip
  //   shopping/misc  — what's left of each budget; misc includes eSIM, Kyoto accommodation tax, lockers, buffer
  const DEFAULT_ALLOCATIONS = {
    patrick: { flights:1450, accommodation:807.5, food:700, transport:375, activities:325, shopping:750, nightlife:350, misc:242.5 },
    jake:    { flights:1450, accommodation:807.5, food:900, transport:375, activities:275, shopping:650, nightlife:250, misc:292.5 },
    steve:   { flights:1450, accommodation:807.5, food:700, transport:375, activities:225, shopping:150, nightlife:700, misc:200 },
    conner:  { flights:1450, accommodation:807.5, food:900, transport:375, activities:225, shopping:200, nightlife:450, misc:200 },
    boros:   { flights:1450, accommodation:807.5, food:700, transport:375, activities:200, shopping:500, nightlife:700, misc:267.5 },
    silva:   { flights:1450, accommodation:807.5, food:625, transport:375, activities:300, shopping:400, nightlife:200, misc:200 },
  };

  // Live allocations (mutable by sliders)
  const allocations = JSON.parse(JSON.stringify(DEFAULT_ALLOCATIONS));

  function fmt(usd) {
    if (showYen) return `¥${C.toYen(usd).toLocaleString()}`;
    return `$${Math.round(usd).toLocaleString()}`;
  }

  function personTotal(personId) {
    if (!allocations[personId]) return 0;
    return Object.values(allocations[personId]).reduce((s, v) => s + v, 0);
  }

  // ── Hero ──
  function buildHero() {
    const hero = document.getElementById('budget-hero');
    if (!hero) return;
    const groupTotal = C.budget.personBudgets.groupTotal;

    hero.innerHTML = `
      <div class="budget-hero-inner">
        <div class="budget-hero-label">Total Group Budget</div>
        <div class="budget-hero-total" id="hero-total">${fmt(groupTotal)}</div>
        <div class="budget-hero-sub">6 crew · 16 days · 3 cities</div>
        <div class="budget-fx-row">
          <span class="budget-fx-label">Display in:</span>
          <div class="budget-fx-toggle">
            <button class="budget-fx-btn active" id="fx-usd">USD $</button>
            <button class="budget-fx-btn" id="fx-jpy">JPY ¥</button>
          </div>
          <span class="budget-fx-label" style="font-size:10px">¥${C.budget.fxRate} = $1</span>
        </div>
      </div>`;

    document.getElementById('fx-usd').addEventListener('click', () => setCurrency(false));
    document.getElementById('fx-jpy').addEventListener('click', () => setCurrency(true));
  }

  function setCurrency(useYen) {
    showYen = useYen;
    document.getElementById('fx-usd').classList.toggle('active', !useYen);
    document.getElementById('fx-jpy').classList.toggle('active', useYen);
    refreshAll();
  }

  // ── Group stats ──
  function buildStats() {
    const content = document.getElementById('budget-content');
    const section = document.createElement('div');
    section.className = 'section fade-in';
    section.id = 'budget-stats-section';
    section.innerHTML = `<div class="section-label">Group Overview</div>
      <div class="budget-stats" id="budget-stats-bar"></div>`;
    content.appendChild(section);
    refreshStats();
  }

  function refreshStats() {
    const bar = document.getElementById('budget-stats-bar');
    if (!bar) return;
    const groupTotal  = C.budget.personBudgets.groupTotal;
    const perPerson   = groupTotal / C.confirmedCrew().length;
    const itinTotal   = typeof ITINERARY_DATA !== 'undefined'
      ? ITINERARY_DATA.days.reduce((s, d) => s + (d.estimatedCostPerPerson?.usd || 0), 0)
      : 958;
    const flightEst   = 1450; // confirmed price per person
    bar.innerHTML = '';
    [
      { num: fmt(groupTotal),       label: 'Group Total'    },
      { num: fmt(perPerson),        label: 'Avg Per Person' },
      { num: fmt(itinTotal),        label: 'Daily Costs (pp)' },
      { num: fmt(flightEst),        label: 'Flights (booked)' },
    ].forEach(item => {
      const el = document.createElement('div');
      el.className = 'budget-stat';
      el.innerHTML = `<div class="budget-stat-num">${item.num}</div><div class="budget-stat-label">${item.label}</div>`;
      bar.appendChild(el);
    });
  }

  // ── Per-person cards with sliders ──
  function buildPersonCards() {
    const content = document.getElementById('budget-content');
    const section = document.createElement('div');
    section.className = 'section fade-in';
    section.innerHTML = `<div class="section-label">Per Person</div>`;
    const cardsWrap = document.createElement('div');
    cardsWrap.className = 'person-cards';
    cardsWrap.id = 'person-cards-wrap';
    section.appendChild(cardsWrap);
    content.appendChild(section);

    C.crew.forEach(member => {
      const card = buildPersonCard(member);
      cardsWrap.appendChild(card);
    });
  }

  function buildPersonCard(member) {
    const budget = C.budget.personBudgets[member.id] || 0;
    const alloc  = allocations[member.id];
    const isPotential = member.status === 'potential';
    const card   = document.createElement('div');
    card.className = 'person-card';
    if (isPotential) card.style.cssText = 'border: 1.5px dashed #7c2d8e; opacity:0.85;';
    card.id = `pcard-${member.id}`;

    // Header
    const header = document.createElement('div');
    header.className = 'person-card-header';
    const potentialTag = isPotential ? `<span style="display:inline-block;font-size:10px;font-weight:600;color:#7c2d8e;background:rgba(124,45,142,0.1);padding:2px 7px;border-radius:4px;margin-top:3px">⏳ Potential Member</span>` : '';
    header.innerHTML = `
      <div class="person-avatar" style="background:${member.color}20">${member.emoji}</div>
      <div class="person-card-info">
        <div class="person-card-name">${member.name}</div>
        <div class="person-card-role">${member.role}</div>
        ${potentialTag}
      </div>
      <div class="person-card-right">
        <div class="person-budget-total" id="ptotal-${member.id}">${fmt(personTotal(member.id))}</div>
        <div class="person-budget-sub">of ${fmt(budget)} budget</div>
      </div>
      <div class="person-card-chevron">▾</div>`;
    card.appendChild(header);

    // Progress bar
    const progBar = document.createElement('div');
    progBar.className = 'person-progress-bar';
    const progFill = document.createElement('div');
    progFill.className = 'person-progress-fill';
    progFill.id = `pprog-${member.id}`;
    progFill.style.background = member.color;
    progFill.style.width = '0%';
    progBar.appendChild(progFill);
    card.appendChild(progBar);

    // Body (sliders)
    const body = document.createElement('div');
    body.className = 'person-card-body';
    const sliderSection = document.createElement('div');
    sliderSection.className = 'budget-slider-section';

    BUDGET_CATEGORIES.forEach(cat => {
      const catMax = cat.id === 'flights' ? 2000
                   : cat.id === 'accommodation' ? 1200
                   : cat.id === 'shopping' ? 2000
                   : cat.id === 'nightlife' ? 1500
                   : 1500;

      const row = document.createElement('div');
      row.innerHTML = `
        <div class="slider-row">
          <div class="slider-category">
            <span class="slider-cat-emoji">${cat.emoji}</span>
            ${cat.label}
          </div>
          <div class="slider-amount" id="sval-${member.id}-${cat.id}">${fmt(alloc[cat.id])}</div>
        </div>
        <input type="range" class="budget-slider" id="sldr-${member.id}-${cat.id}"
          min="0" max="${catMax}" step="${cat.id === 'accommodation' ? 'any' : 50}"
          value="${alloc[cat.id]}"
          style="accent-color:${member.color}">`;
      sliderSection.appendChild(row);

      // Wire slider
      setTimeout(() => {
        const slider = document.getElementById(`sldr-${member.id}-${cat.id}`);
        if (slider) {
          slider.addEventListener('input', () => {
            alloc[cat.id] = parseFloat(slider.value);
            refreshPersonCard(member);
          });
        }
      }, 0);
    });

    body.appendChild(sliderSection);

    // Remaining
    const remaining = document.createElement('div');
    remaining.className = 'person-remaining';
    remaining.innerHTML = `
      <span class="person-remaining-label">Remaining budget</span>
      <span class="person-remaining-val" id="premain-${member.id}">—</span>`;
    body.appendChild(remaining);
    card.appendChild(body);

    // Toggle
    header.addEventListener('click', () => {
      card.classList.toggle('open');
      // Animate progress bar on open
      refreshPersonCard(member);
    });

    // Initial progress
    setTimeout(() => refreshPersonCard(member), 100);

    return card;
  }

  function refreshPersonCard(member) {
    const budget  = C.budget.personBudgets[member.id];
    const total   = personTotal(member.id);
    const remain  = budget - total;
    const pct     = Math.min(100, Math.round((total / budget) * 100));

    // Update total
    const totalEl = document.getElementById(`ptotal-${member.id}`);
    if (totalEl) totalEl.textContent = fmt(total);

    // Update progress bar
    const progEl = document.getElementById(`pprog-${member.id}`);
    if (progEl) progEl.style.width = pct + '%';

    // Update remaining
    const remainEl = document.getElementById(`premain-${member.id}`);
    if (remainEl) {
      remainEl.textContent = remain >= 0 ? fmt(remain) : `-${fmt(Math.abs(remain))}`;
      remainEl.classList.toggle('over', remain < 0);
    }

    // Update all slider value labels
    const alloc = allocations[member.id];
    BUDGET_CATEGORIES.forEach(cat => {
      const valEl = document.getElementById(`sval-${member.id}-${cat.id}`);
      if (valEl) valEl.textContent = fmt(alloc[cat.id]);
    });
  }

  // ── Cost by city ──
  function buildCityCosts() {
    const content = document.getElementById('budget-content');
    const section = document.createElement('div');
    section.className = 'section fade-in';
    section.innerHTML = `<div class="section-label">Cost by City</div>`;

    // Per-person daily cost totals from itinerary
    const cityCosts = { tokyo:0, kyoto:0, osaka:0 };
    if (typeof ITINERARY_DATA !== 'undefined') {
      ITINERARY_DATA.days.forEach(d => {
        if (cityCosts[d.city] !== undefined) cityCosts[d.city] += d.estimatedCostPerPerson.usd;
      });
    } else {
      cityCosts.tokyo = 529; cityCosts.kyoto = 319; cityCosts.osaka = 180;
    }

    const maxCost = Math.max(...Object.values(cityCosts));
    const rowsWrap = document.createElement('div');
    rowsWrap.className = 'city-cost-rows';
    rowsWrap.id = 'city-cost-rows';

    const cityDayCounts = { tokyo:0, kyoto:0, osaka:0 };
    if (typeof ITINERARY_DATA !== 'undefined') ITINERARY_DATA.days.forEach(d => { if (cityDayCounts[d.city] !== undefined) cityDayCounts[d.city]++; });

    C.cities.forEach(city => {
      const cost = cityCosts[city.id] || 0;
      const pct  = Math.round((cost / maxCost) * 100);
      const nDays = cityDayCounts[city.id] || city.days;
      const perDay = nDays > 0 ? Math.round(cost / nDays) : 0;

      const row = document.createElement('div');
      row.className = 'city-cost-row';
      row.innerHTML = `
        <div class="city-cost-accent" style="background:${city.color}"></div>
        <div class="city-cost-body">
          <div class="city-cost-top">
            <span class="city-cost-name">${city.emoji} ${city.name}</span>
            <span class="city-cost-total" id="ccost-${city.id}">${fmt(cost)}</span>
          </div>
          <div class="city-cost-bar-track">
            <div class="city-cost-bar-fill" id="cbar-${city.id}" style="width:0%;background:${city.color}"></div>
          </div>
          <div class="city-cost-meta">${city.nights} nights · ${nDays} itinerary days · <span id="cday-${city.id}">${fmt(perDay)}</span>/day avg</div>
        </div>`;
      rowsWrap.appendChild(row);

      // Animate bar
      setTimeout(() => {
        const bar = document.getElementById(`cbar-${city.id}`);
        if (bar) bar.style.width = pct + '%';
      }, 200);
    });

    section.appendChild(rowsWrap);
    content.appendChild(section);
  }

  // ── Daily cost chart ──
  function buildDailyChart() {
    const content = document.getElementById('budget-content');
    const section = document.createElement('div');
    section.className = 'section fade-in';
    section.innerHTML = `<div class="section-label">Daily Spend (per person)</div>`;

    if (typeof ITINERARY_DATA === 'undefined') { content.appendChild(section); return; }

    const days = ITINERARY_DATA.days;
    const maxUsd = Math.max(...days.map(d => d.estimatedCostPerPerson.usd));

    const chart = document.createElement('div');
    chart.className = 'daily-chart';

    const barsWrap = document.createElement('div');
    barsWrap.className = 'daily-chart-bars';
    barsWrap.id = 'daily-bars';

    const tooltip = document.createElement('div');
    tooltip.className = 'daily-chart-tooltip';
    tooltip.id = 'daily-tooltip';
    tooltip.textContent = 'Tap a bar for details';

    days.forEach(day => {
      const city     = C.getCityById(day.city);
      const color    = city ? city.color : '#8a8278';
      const CHART_H = 76; // px — slightly less than container to leave room for labels
      const heightPx = Math.max(2, Math.round((day.estimatedCostPerPerson.usd / maxUsd) * CHART_H));

      const wrap = document.createElement('div');
      wrap.className = 'daily-bar-wrap';
      wrap.title = `Day ${day.dayNumber}: ${fmt(day.estimatedCostPerPerson.usd)}`;

      const bar = document.createElement('div');
      bar.className = 'daily-bar';
      bar.style.cssText = `height:0px;background:${color}`;
      bar.dataset.day = day.dayNumber;
      bar.dataset.usd = day.estimatedCostPerPerson.usd;
      bar.dataset.theme = day.theme;
      bar.dataset.color = color;

      const lbl = document.createElement('div');
      lbl.className = 'daily-bar-label';
      lbl.textContent = day.dayNumber;

      wrap.appendChild(bar);
      wrap.appendChild(lbl);
      barsWrap.appendChild(wrap);

      // Animate in
      setTimeout(() => { bar.style.height = heightPx + 'px'; }, 200 + day.dayNumber * 30);

      bar.addEventListener('mouseenter', () => {
        tooltip.textContent = `Day ${day.dayNumber} — ${(day.title || day.theme).substring(0, 40)} · ${fmt(day.estimatedCostPerPerson.usd)}/person`;
      });
      bar.addEventListener('click', () => {
        tooltip.textContent = `Day ${day.dayNumber} — ${day.title || day.theme} · ${fmt(day.estimatedCostPerPerson.usd)}/person`;
      });
    });

    barsWrap.addEventListener('mouseleave', () => { tooltip.textContent = 'Tap a bar for details'; });

    chart.appendChild(barsWrap);
    chart.appendChild(tooltip);
    section.appendChild(chart);
    content.appendChild(section);
  }

  // ── Category breakdown ──
  function buildCategoryBreakdown() {
    const content = document.getElementById('budget-content');
    const section = document.createElement('div');
    section.className = 'section fade-in';
    section.innerHTML = `<div class="section-label">Spend by Category (estimated, group)</div>`;

    // Sum default allocations across all crew per category
    const catTotals = {};
    BUDGET_CATEGORIES.forEach(cat => {

    BUDGET_CATEGORIES.forEach(cat => {

      const row = document.createElement('div');
      row.className = 'cat-row';
      row.innerHTML = `
        <div class="cat-emoji">${cat.emoji}</div>
        <div class="cat-bar-wrap">
          <div class="cat-name">${cat.label}</div>
          <div class="cat-bar-track">
            <div class="cat-bar-fill" id="catbar-${cat.id}" style="width:0%;background:${cat.color}"></div>
          </div>
        </div>
        <div class="cat-amount" id="catamt-${cat.id}">${fmt(total)}</div>`;
      rowsWrap.appendChild(row);

      setTimeout(() => {
        const bar = document.getElementById(`catbar-${cat.id}`);
        if (bar) bar.style.width = pct + '%';
      }, 300);
    });

    section.appendChild(rowsWrap);
    content.appendChild(section);
  }

  // ── How the estimate was built ──
  function buildEstimateNotes() {
    const content = document.getElementById('budget-content');
    const section = document.createElement('div');
    section.className = 'section fade-in';
    section.innerHTML = `<div class="section-label">How These Numbers Were Built</div>
      <div class="booking-costs">
        <div class="booking-cost-row"><div><div class="booking-cost-name">Locked in</div><div class="booking-cost-meta">Flights $1,450 + Airbnbs $807.50 = $2,257.50 per person before anyone leaves Charlotte.</div></div></div>

        <div class="booking-cost-row"><div><div class="booking-cost-name">Food ~$620 baseline</div><div class="booking-cost-meta">~¥6,000/day: konbini breakfast, ¥1,500 lunch, ¥3,000 dinner, coffee & snacks. Higher for Jake and Conner; Kobe beef lunch added for the Kobe group.</div></div></div>
        <div class="booking-cost-row"><div><div class="booking-cost-name">Activities $200–325</div><div class="booking-cost-meta">~$160 of shared tickets on the itinerary, plus each person's own picks.</div></div></div>
        <div class="booking-cost-row"><div><div class="booking-cost-name">⚠️ Three budgets come up short</div><div class="booking-cost-meta">Steve, Conner, and Silva are each over their stated budget even with modest shopping. Lean floors (light shopping, trimmed food and nightlife): Steve ~$4,250 · Conner ~$4,200 · Silva ~$4,050.</div></div></div>
        <div class="booking-cost-row"><div><div class="booking-cost-name">Tax-free shopping</div><div class="booking-cost-meta">Japan's new system (Nov 2026) charges the 10% tax upfront and refunds it at the airport — have that cash available while shopping.</div></div></div>
      </div>`;
    content.appendChild(section);
  }

  // ── Refresh all currency-sensitive displays ──
  function refreshAll() {
    // Hero total
    const heroTotal = document.getElementById('hero-total');
    if (heroTotal) heroTotal.textContent = fmt(C.budget.personBudgets.groupTotal);

    // Stats
    refreshStats();

    // Person cards
    C.crew.forEach(m => refreshPersonCard(m));

    // City costs
    if (typeof ITINERARY_DATA !== 'undefined') {
      const cityCosts = { tokyo:0, kyoto:0, osaka:0 };
      ITINERARY_DATA.days.forEach(d => {
        if (cityCosts[d.city] !== undefined) cityCosts[d.city] += d.estimatedCostPerPerson.usd;
      });
      const cityDayCounts = { tokyo:0, kyoto:0, osaka:0 };
      ITINERARY_DATA.days.forEach(d => { if (cityDayCounts[d.city] !== undefined) cityDayCounts[d.city]++; });
      C.cities.forEach(city => {
        const cost = cityCosts[city.id] || 0;
        const nDays = cityDayCounts[city.id] || city.days;
        const perDay = nDays > 0 ? Math.round(cost / nDays) : 0;
        const costEl = document.getElementById(`ccost-${city.id}`);
        const dayEl  = document.getElementById(`cday-${city.id}`);
        if (costEl) costEl.textContent = fmt(cost);
        if (dayEl)  dayEl.textContent  = fmt(perDay);
      });
    }

    // Categories
    const catTotals = {};
    BUDGET_CATEGORIES.forEach(cat => {
      catTotals[cat.id] = C.crew.reduce((s, m) => s + (DEFAULT_ALLOCATIONS[m.id]?.[cat.id] || 0), 0);
    });
    BUDGET_CATEGORIES.forEach(cat => {
      const el = document.getElementById(`catamt-${cat.id}`);
      if (el) el.textContent = fmt(catTotals[cat.id]);
    });
  }

  // ── Init ──
  function initBudget() {
    if (budgetBuilt) return;
    budgetBuilt = true;
    buildHero();
    const content = document.getElementById('budget-content');
    if (!content) return;
    buildStats();
    buildPersonCards();
    buildCityCosts();
    buildDailyChart();
    buildCategoryBreakdown();
    buildBookingCosts();
    buildEstimateNotes();

    // Trigger fade-ins
    setTimeout(() => {
      content.querySelectorAll('.fade-in').forEach(el => el.classList.add('visible'));
    }, 50);
  }

  // Built on demand by the Logistics tab (Budget & Money section)
  window.initBudget = initBudget;
})();
</script>

        task.innerHTML = `

          <div class="phase-task-body">
