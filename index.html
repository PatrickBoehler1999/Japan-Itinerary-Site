  activities: [
    // ── TOKYO — Patrick (19) ──
    {id:'the-tokyo-matrix',person:'patrick',city:'tokyo',category:'entertainment',type:'Escape Room',name:'The Tokyo Matrix',address:'Kabukicho Tower, 1-29-1 Kabukicho, Shinjuku',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'90 mins',bookingRequired:true,dayAssigned:3,groupActivity:true,description:`Multi-floor physical escape room complex inside the new Kabukicho Tower. Features some of Tokyo's most technically impressive room designs. Full English support available for select rooms.`,mapsQuery:'The Tokyo Matrix Kabukicho Tower Shinjuku',notes:`Book online 2–4 weeks ahead. English rooms book faster — lock one in early. Group size: hard cap of 2-3 players per game — run the group as 2 separate teams (e.g. 3+3).`,url:null},
    {id:'wiggle-wiggle',person:'patrick',city:'tokyo',category:'shopping',type:'Character Goods Store',name:'Wiggle Wiggle',address:'Harajuku (Jingumae), Shibuya, Tokyo',status:'researching',priority:'pending',estimatedCost:2500,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`Korean character goods and lifestyle brand with a Tokyo flagship. Think pastel stationery, plushes, mugs, bags and home accessories built around their original characters. Very Harajuku in aesthetic.`,mapsQuery:'Wiggle Wiggle Harajuku Tokyo',notes:`Actually located in Harajuku (Jingumae), not Shibuya proper — worth knowing so it doesn't get scheduled into the wrong day. Group size: open walk-in retail — single group, no issue.`,url:null},
    {id:'golden-gai',person:['patrick','jake'],city:'tokyo',category:'bar',type:'Bar District',name:'Golden Gai',address:'Kabukicho 1-chome, Shinjuku, Tokyo',status:'confirmed',priority:'pending',estimatedCost:3000,estimatedDuration:'3–4 hours',bookingRequired:false,dayAssigned:3,groupActivity:true,description:`A labyrinth of roughly 200 tiny bars packed into six narrow alleyways in Shinjuku. Most fit 6–8 people max, each with its own theme and regular crowd. Cover charge ¥500–1,000 is normal. One of Tokyo's most iconic night experiences.`,mapsQuery:'Golden Gai Shinjuku Tokyo',notes:`Each bar seats 6–8. Some are regulars-only — look for signs welcoming tourists. Go after 9pm for full atmosphere.`,url:null},
    {id:'eorzea-cafe-akihabara',person:'patrick',city:'tokyo',category:'cafe',type:'Themed Cafe',name:'Eorzea Cafe (Akihabara)',address:'4F HEY!, 1-11-5 Sotokanda, Chiyoda, Tokyo',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'90 mins',bookingRequired:true,dayAssigned:5,groupActivity:false,description:`Official Final Fantasy XIV cafe run by Square Enix. FFXIV-themed food and drinks, character merchandise, themed interiors. 90-minute timed seating. Reservation required and fills up months out.`,mapsQuery:'Eorzea Cafe Akihabara Tokyo',notes:`Reserve through the official Pasela site. Use Google Translate — site is Japanese only. Monthly reservation window opens the 10th at 6pm JST and sells out within a minute — same tier of difficulty as Ghibli Museum or Kirby Cafe. Have the site loaded and ready. Group size: max table size is 4 — split into 2 bookings (e.g. 4+2), ask to be seated near each other.`,url:'https://www.pasela.co.jp/paselabo_shop/ff_eorzea/'},
    {id:'ghibli-museum',person:'patrick',city:'tokyo',category:'museum',type:'Museum',name:'Ghibli Museum',address:'1-1-83 Shimorenjaku, Mitaka, Tokyo',status:'researching',priority:'pending',estimatedCost:1000,estimatedDuration:'2–3 hours',bookingRequired:true,dayAssigned:4,groupActivity:false,description:`Designed by Hayao Miyazaki himself, this intimate museum celebrates the art of animation. Exclusive short films, original cel displays, life-size Catbus, rooftop Robot Soldier. No photography inside. One of the most beloved experiences in all of Japan.`,mapsQuery:'Ghibli Museum Mitaka Tokyo',notes:`⭐ CRITICAL: January tickets open Dec 10 at 10:00 AM JST via Lawson Tickets (l-tike.com). Site must be loaded and account ready. Sells out in under 2 minutes. Group size: max 6 tickets per transaction — single group, fits exactly.`,url:'https://www.ghibli-museum.jp/en/'},
    {id:'tokyo-mystery-circus',person:'patrick',city:'tokyo',category:'entertainment',type:'Entertainment Complex',name:'Tokyo Mystery Circus',address:'7F–10F, 1-27-5 Kabukicho, Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:3500,estimatedDuration:'2–4 hours',bookingRequired:'recommended',dayAssigned:4,groupActivity:true,description:`The world's largest escape room complex. Multiple floors of rooms ranging from beginner to expert. Strong English support. Located in Shinjuku's entertainment district.`,mapsQuery:'Tokyo Mystery Circus Kabukicho Shinjuku',notes:`English options available for multiple rooms. Walk-in possible but risky on weekends — book ahead. Group size: caps vary by room — Escape from the Prison (max 2-3) and Spellbound Supper (max 5) will need a split, while Magic Library's Bizarre Encyclopedia and Werewolf Village are built for teams of up to 6 — single group fits as one team in those rooms. Pick the room with the group size in mind.`,url:null},
    {id:'karaoke-kan-shibuya',person:'patrick',city:'tokyo',category:'entertainment',type:'Karaoke',name:'Karaoke Kan',address:'30-8 Udagawacho, Shibuya, Tokyo',status:'confirmed',priority:'pending',estimatedCost:2000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:3,groupActivity:true,description:`Multi-floor karaoke chain with private rooms for groups. Famous as the actual filming location for Lost in Translation. Excellent English song library. Open until 5am.`,mapsQuery:'Karaoke Kan Shibuya Tokyo',notes:`Private room karaoke — great group activity. Drinks ordered by the room. Open very late, perfect after Golden Gai. Group size: room size varies by branch, mixed reports at exactly 6 — book ahead and specify a party of 6.`,url:null},
    {id:'kirby-cafe',person:['patrick','silva'],city:'tokyo',category:'cafe',type:'Themed Cafe',name:'Kirby Cafe',address:'Tokyo Solamachi 4F, 1-1-2 Oshiage, Sumida, Tokyo',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'1–2 hours',bookingRequired:true,dayAssigned:2,groupActivity:false,description:`Permanent Nintendo-licensed cafe dedicated entirely to Kirby. Themed food, exclusive merchandise, illustrated walls throughout. Located inside Tokyo Skytree Town.`,mapsQuery:'Kirby Cafe Tokyo Solamachi Skytree',notes:`⭐ CRITICAL: January seatings open Dec 10 at 6:00 PM JST — completely separate from Ghibli booking. Also sells out in seconds. Group size: up to 8 per reservation — single group, fits easily.`,url:null},
    {id:'yokohama',person:'patrick',city:'tokyo',category:'nature',type:'Day Trip',name:'Yokohama',address:'Yokohama, Kanagawa',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'Full day',bookingRequired:false,dayAssigned:7,groupActivity:true,description:`Japan's second-largest city, 30 min from Shibuya by train. Known for its waterfront, Japan's largest Chinatown, the Cup Noodles Museum, and Sankeien Garden. Much less crowded than Tokyo.`,mapsQuery:'Yokohama Minato Mirai waterfront',notes:`One of three Day 7 options — group vote needed.`,url:null},
    {id:'kusatsu-onsen',person:'patrick',city:'tokyo',category:'nature',type:'Day Trip / Overnight',name:'Kusatsu Onsen',address:'Kusatsu, Agatsuma District, Gunma',status:'researching',priority:'pending',estimatedCost:15000,estimatedDuration:'Overnight recommended',bookingRequired:false,dayAssigned:'flex',groupActivity:false,description:`One of Japan's top hot spring resorts, high in the Gunma mountains. Famous for Yubatake — a steaming wooden hot spring field at the town center. Outdoor baths, ryokan inns, sulfurous mountain air. About 3.5 hrs from Tokyo by limited express.`,mapsQuery:'Kusatsu Onsen Gunma Japan',notes:`Best as an overnight stay. Fits a flex day if one opens up.`,url:null},
    {id:'mount-fuji-kawaguchiko',person:'patrick',city:'tokyo',category:'nature',type:'Day Trip',name:'Mount Fuji (Kawaguchiko)',address:'Kawaguchiko, Minamitsuru District, Yamanashi',status:'researching',priority:'pending',estimatedCost:5000,estimatedDuration:'Full day',bookingRequired:false,dayAssigned:7,groupActivity:true,description:`Fuji viewed from Lake Kawaguchiko — one of Japan's most photographed scenes. January means snow-capped peak and crystal air. Chureito Pagoda (400 steps) provides the classic framed shot. Ropeway for elevated views.`,mapsQuery:'Lake Kawaguchiko Mount Fuji Japan',notes:`Day 7 Option A — weather dependent. 2.5 hrs from Shinjuku by direct bus or train.`,url:null},
    {id:'nakasendo-magome',person:'patrick',city:'tokyo',category:'nature',type:'Historic Trail',name:'Nakasendo — Magome Post Town',address:'Magome, Nakatsugawa, Gifu',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'Half day',bookingRequired:false,dayAssigned:'flex',groupActivity:false,description:`One of the best-preserved Edo-period post towns on the ancient Nakasendo highway. Stone-paved lanes, traditional machiya buildings, water wheels, and almost no English signage — genuinely historic. Can be walked between Magome and Tsumago (8km, ~3hrs).`,mapsQuery:'Magome Post Town Nakatsugawa Gifu Japan',notes:`Flex day option — about 3 hrs from Tokyo. Best combined with Nagoya transit.`,url:null},
    {id:'tokyo-skytree',person:'patrick',city:'tokyo',category:'landmark',type:'Observation Tower',name:'Tokyo Skytree',address:'1-1-2 Oshiage, Sumida, Tokyo',status:'confirmed',priority:'pending',estimatedCost:2100,estimatedDuration:'2 hours',bookingRequired:false,dayAssigned:2,groupActivity:true,description:`At 634 meters, the world's tallest tower. Two observation decks. January air is the clearest of the year — Fuji often visible. Tokyo Solamachi at the base has Kirby Cafe and great food.`,mapsQuery:'Tokyo Skytree Oshiage Sumida',notes:`Book online to skip queues. January sunsets from the deck are exceptional.`,url:null},
    {id:'sensoji-temple',person:'patrick',city:'tokyo',category:'temple',type:'Temple',name:'Sensoji Temple',address:'2-3-1 Asakusa, Taito, Tokyo',status:'confirmed',priority:'pending',estimatedCost:0,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:2,groupActivity:true,description:`Tokyo's oldest and most visited temple, founded in 645 AD. The Thunder Gate (Kaminarimon) leads to Nakamise-dori — a 200-meter covered shopping street with traditional snacks and crafts. Free entry.`,mapsQuery:'Sensoji Temple Asakusa Tokyo',notes:`Go early (before 9am) to beat tour groups. Nakamise shops open around 10am.`,url:null},
    {id:'tower-records-shibuya',person:'patrick',city:'tokyo',category:'shopping',type:'Music Store',name:'Tower Records Shibuya',address:'1-22-14 Jinnan, Shibuya, Tokyo',status:'confirmed',priority:'pending',estimatedCost:5000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:4,groupActivity:false,description:`Eight-floor flagship of Japan's Tower Records. Legendary selection of Japanese music: city-pop, J-pop, indie, electronic, jazz. Floor 4 has an unmatched vinyl section with rare Japanese pressings.`,mapsQuery:'Tower Records Shibuya Tokyo',notes:`Patrick's primary vinyl hunting spot. Budget accordingly. Group size: open walk-in retail — single group, no issue.`,url:null},
    {id:'gamepanic-akihabara',person:'patrick',city:'tokyo',category:'arcade',type:'Arcade',name:'GamePanic Akihabara',address:'3-13-5 Sotokanda, Chiyoda, Tokyo',status:'confirmed',priority:'pending',estimatedCost:2000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:5,groupActivity:false,description:`Large multi-floor modern arcade in the heart of Akihabara. Strong selection of rhythm games (beatmania IIDX, Sound Voltex, maimai), crane games, and fighting games. More modern than Super Potato but great for actually playing.`,mapsQuery:'GiGO Akihabara Tokyo arcade',notes:`Located on the main Akihabara strip. Taito Station, HEY!, and Sega all cluster nearby.`,url:null},
    {id:'chureito-pagoda',person:'patrick',city:'tokyo',category:'temple',type:'Pagoda / Viewpoint',name:'Chureito Pagoda',address:'3353-1 Fujiyoshida, Yamanashi',status:'researching',priority:'pending',estimatedCost:500,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:7,groupActivity:false,description:`The iconic five-story pagoda framing Mount Fuji — one of the most reproduced images of Japan. Reached via 400 stone steps. In January the pagoda is backed by snow-capped Fuji with clear blue sky.`,mapsQuery:'Chureito Pagoda Fujiyoshida Yamanashi',notes:`Part of the Kawaguchiko day trip (Day 7 Option A). Add 1–1.5 hrs for the climb.`,url:null},
    {id:'tako-no-tetsu',person:'patrick',city:'osaka',category:'food',type:'Restaurant',name:'Tako no Tetsu',address:'Umeda/HEP FIVE area, Osaka',status:'researching',priority:'pending',estimatedCost:1500,estimatedDuration:'1–1.5 hours',bookingRequired:false,dayAssigned:null,groupActivity:true,description:`A cook-your-own takoyaki chain with semi-private kotatsu (low heated table) group seating — mix and grill your own batter at the table rather than ordering pre-made. A genuinely fun group activity, not just a food stop. Multiple locations across Osaka, concentrated in the Umeda/HEP FIVE area.`,mapsQuery:'Tako no Tetsu Umeda Osaka',notes:`Was previously misfiled under Tokyo — every real Tako no Tetsu location is in Osaka. Good group activity given the kotatsu seating format. Confirm exact branch closer to the trip.`,url:null},
    {id:'ikebukuro-arcades',person:'patrick',city:'tokyo',category:'arcade',type:'Arcade District',name:'Ikebukuro Arcades',address:'Ikebukuro, Toshima, Tokyo',status:'researching',priority:'pending',estimatedCost:2500,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`Ikebukuro has a dense cluster of arcades including Namco Ikebukuro and multiple Taito Stations. Less crowded than Akihabara, with a strong local gamer crowd.`,mapsQuery:'Namco Ikebukuro arcade Tokyo',notes:`Only worth visiting if there is spare time — Akihabara should be the main arcade day.`,url:null},
    // ── TOKYO — Jake (5) ──
    {id:'tsukiji-market',person:['jake','conner'],city:'tokyo',category:'food',type:'Outer Market',name:'Tsukiji Outer Market',address:'4-16-2 Tsukiji, Chuo, Tokyo',status:'confirmed',priority:'pending',estimatedCost:3000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:2,groupActivity:true,description:`The legendary outer market. Stalls sell fresh uni, oysters, tuna sashimi on rice, tamagoyaki, and street snacks. Best food crawl in Tokyo. Go before 9am for freshest cuts.`,mapsQuery:'Tsukiji Outer Market Tokyo',notes:`Budget ¥1,500–2,500 per person for grazing. Most stalls are cash only.`,url:null},
    {id:'tacos-3hermanos',person:'jake',city:'tokyo',category:'food',type:'Restaurant',name:'Tacos 3Hermanos',address:'Shinjuku, Tokyo',status:'confirmed',priority:'pending',estimatedCost:2000,estimatedDuration:'1 hour',bookingRequired:false,dayAssigned:4,groupActivity:true,description:`Authentic Mexican taqueria run by three brothers in Shinjuku. Known for proper corn tortillas, slow-braised meats, and house-made salsas. A cult favorite among Tokyo's expat community.`,mapsQuery:'Tacos 3Hermanos Shinjuku Tokyo',notes:`Jake's confirmed restaurant pick for Day 4 evening. Group size: only ~2 small tables, no reservations possible — expect to split.`,url:null},
    {id:'character-street-tokyo-station',person:'jake',city:'tokyo',category:'shopping',type:'Character Merchandise',name:'Character Street (Tokyo Station)',address:'Tokyo Station B1 Yaesu, Chiyoda, Tokyo',status:'confirmed',priority:'pending',estimatedCost:5000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:2,groupActivity:true,description:`Underground shopping street housing official flagship stores for Pokemon, Ghibli, Sanrio, Rilakkuma, and Jump (One Piece, Dragon Ball). Many products are Tokyo Station exclusives.`,mapsQuery:'Character Street Tokyo Station B1',notes:`Cash and card accepted. Pokemon Center and Ghibli store are the main draws. Group size: open walk-in retail — single group, no issue.`,url:null},
    {id:'shimokitazawa-thrifting',person:'jake',city:'tokyo',category:'shopping',type:'Vintage District',name:'Shimokitazawa Thrift & Records',address:'Shimokitazawa, Setagaya, Tokyo',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:6,groupActivity:false,description:`Tokyo's most beloved bohemian neighborhood — dense with secondhand clothing stores, vintage record shops, indie cafes, and tiny live music venues. Disk Union has a multi-floor store here.`,mapsQuery:'Shimokitazawa vintage shopping Tokyo',notes:`Shops open around 11am–12pm. Pairs with Disk Union vinyl hunting. Group size: open district — single group or split freely.`,url:null},
    {id:'gyukatsu-motomura',person:'jake',city:'tokyo',category:'food',type:'Restaurant',name:'Gyukatsu Motomura',address:'2-14-11 Dogenzaka, Shibuya, Tokyo',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'1 hour',bookingRequired:false,dayAssigned:5,groupActivity:false,description:`The definitive gyukatsu restaurant — beef cutlet served rare then grilled at your table on a small hot stone. The crust is crackling, the inside stays pink. Consistently one of Tokyo's most queued restaurants.`,mapsQuery:'Gyukatsu Motomura Shibuya Tokyo',notes:`Expect a 20–40 min queue at peak times. Go at 11am opening or after 2pm. Group size: ~9-11 seats total, min 3 for reservation — split into 2 tables, or go off-peak.`,url:null},
    // ── TOKYO — Steve (1) ──
    {id:'snoopy-museum',person:'steve',city:'tokyo',category:'museum',type:'Museum',name:'Snoopy Museum',address:'2-1-1 Higashida, Asahi, Kanagawa',status:'researching',priority:'pending',estimatedCost:1200,estimatedDuration:'1–2 hours',bookingRequired:true,dayAssigned:null,groupActivity:false,description:`The only permanent Snoopy Museum outside of California. Houses original Charles M. Schulz illustrations, immersive Peanuts-themed installations, a Snoopy cafe and shop.`,mapsQuery:'Snoopy Museum Kanagawa Japan',notes:`Steve's activity. About 30 min from central Tokyo. Book tickets ahead.`,url:null},
    // ── TOKYO — Conner (1) ──
    {id:'glitch-coffee',person:'conner',city:'tokyo',category:'cafe',type:'Specialty Coffee',name:'Glitch Coffee & Roasters',address:'3-16 Kanda Nishikicho, Chiyoda, Tokyo',status:'researching',priority:'pending',estimatedCost:800,estimatedDuration:'1 hour',bookingRequired:false,dayAssigned:6,groupActivity:false,description:`One of Tokyo's most acclaimed specialty coffee roasters. Slow-bar single-origin pourover and espresso, sourced and roasted in-house. Consistently on Asia's best coffee lists.`,mapsQuery:'Glitch Coffee Roasters Jinbocho Tokyo',notes:`Conner's top priority. Small space — go off-peak. ¥700–1,200 per cup. Quiet-only policy in effect: no phone conversations, minimal chatter, no photos allowed. Not a casual group hangout spot — go with that expectation. Group size: conflicting reports — possibly a 6-person communal table, but uncertain. Have a backup plan.`,url:null},
    // ── OSAKA — Patrick (5) ──
    {id:'silver-ball-planet',person:'patrick',city:'osaka',category:'arcade',type:'Pinball Arcade',name:'Silver Ball Planet',address:'1-6-14 Shinsaibashisuji, Chuo, Osaka',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:12,groupActivity:false,description:`The best pinball arcade in Japan — 100+ machines spanning 1970s electromechanical tables through modern Stern and Jersey Jack titles. Free entry, ¥100 per game. Maintained in exceptional condition.`,mapsQuery:'Silver Ball Planet Shinsaibashi Osaka',notes:`Patrick's top priority in Osaka. Get change from the counter. Machines include rare Japan-only titles. Group size: walk-in arcade, no cap — single group, no issue.`,url:null},
    {id:'dragon-quest-island',person:'patrick',city:'osaka',category:'themepark',type:'Theme Park',name:'Dragon Quest Island (Nijigen no Mori)',address:'Nijigen no Mori, Awaji Island, Hyogo',status:'researching',priority:'pending',estimatedCost:5000,estimatedDuration:'Full day',bookingRequired:true,dayAssigned:14,groupActivity:true,description:`Outdoor adventure theme park on Awaji Island with a massive Dragon Quest dark ride, archery, rope courses, and a Naruto/Boruto attraction. Features a giant Slime and monster encounter system.`,mapsQuery:'Nijigen no Mori Awaji Island Dragon Quest',notes:`Day 15 Option A — group vote required. ~1.5 hr bus from Osaka. Book tickets at nijigennomori.com ahead.`,url:null},
    {id:'kobe',person:'patrick',city:'osaka',category:'nature',type:'Day Trip',name:'Kobe',address:'Kobe, Hyogo',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'Half day',bookingRequired:false,dayAssigned:'flex',groupActivity:true,description:`Sophisticated port city 30 min from Osaka. Famous for Kobe beef, the Kitano foreigners' district of Victorian-era houses, Meriken Park waterfront, and a cosmopolitan atmosphere.`,mapsQuery:'Kobe Japan Kitano district',notes:`30 min from Osaka on the Hankyu or JR line. Budget extra for Kobe beef if going.`,url:null},
    {id:'dotonbori-street',person:'patrick',city:'osaka',category:'food',type:'Street Food District',name:'Dotonbori',address:'Dotonbori, Chuo, Osaka',status:'confirmed',priority:'pending',estimatedCost:3000,estimatedDuration:'2–4 hours',bookingRequired:false,dayAssigned:12,groupActivity:true,description:`Osaka's most famous entertainment and food strip. The glowing Glico Running Man sign, the giant crab, takoyaki stalls, okonomiyaki restaurants, and the Tombori Riverwalk. Everything is bigger and more neon than it needs to be.`,mapsQuery:'Dotonbori Osaka neon street',notes:`Best experienced at night when the neon is fully lit. Free to walk — budget for food and drinks.`,url:null},
    {id:'eorzea-cafe-dotonbori',person:'patrick',city:'osaka',category:'cafe',type:'Themed Cafe',name:'Eorzea Cafe (Dotonbori)',address:'Dotonbori, Chuo, Osaka',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'90 mins',bookingRequired:true,dayAssigned:13,groupActivity:false,description:`The Osaka branch of the official FFXIV cafe. Same timed-seating format as Akihabara: themed dishes, elaborate drinks, exclusive merch, and decor that feels like stepping into Eorzea.`,mapsQuery:'Eorzea Cafe Dotonbori Osaka',notes:`Separate reservation from Akihabara location — both must be booked individually through the Pasela site. Same brutal monthly window: opens the 10th at 6pm JST, sells out within a minute. Group size: same small-table format as Akihabara — split into 2 bookings (e.g. 4+2).`,url:'https://www.pasela.co.jp/paselabo_shop/ff_eorzea/'},
    // ── OSAKA — Jake (2) ──
    {id:'the-munch',person:'jake',city:'osaka',category:'cafe',type:'Specialty Coffee',name:'The Munch',address:'Yao, Osaka',status:'researching',priority:'pending',estimatedCost:1500,estimatedDuration:'1.5–2 hours',bookingRequired:false,dayAssigned:14,groupActivity:false,description:`Acclaimed Osaka specialty coffee shop known for barrel-aged and experimental brewing methods. One of the most talked-about independent cafes in the Kansai region.`,mapsQuery:'The Munch coffee Yao Osaka',notes:`Conner will probably appreciate this one too. Located in Yao — ~45 min by train from central Osaka, more of a real trek than a quick stop. Brewing is extremely slow and ceremonial — one review describes ~50 minutes for a single cup, so a group ordering individual pours could eat hours here. Some specialty items are priced as novelty splurges (one aged coffee runs ~¥100,000/cup) — not representative of normal per-person cost. Group size: 20 seats, no capacity issue — but see the separate time-cost note (extremely slow brewing).`,url:null},
    {id:'izakaya-toyo',person:'jake',city:'osaka',category:'food',type:'Izakaya',name:'Izakaya Toyo',address:'2-1-5 Morinomiya, Osaka',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:15,groupActivity:true,description:`Famous from Netflix Street Food Asia. Master chef Toyo-san grills food tableside using a blowtorch, improvising dishes based on what's fresh that day. No menu, no reservations — Toyo decides what you eat. One of the most unique dining experiences in Japan.`,mapsQuery:'Izakaya Toyo Kyobashi Osaka',notes:`CLOSED THURSDAYS (Jan 21 is Thu — do NOT go). Target Day 15 (Sat Jan 23). Queue 30–45 min before opening. Cash only. Group size: standing-only, cramped at 4-5+ — a group stand-and-eat experience, not a seated meal.`,url:null},
    // ── KYOTO — Jake (14) ──
    {id:'nishiki-market',person:['jake','conner'],city:'kyoto',category:'food',type:'Covered Market',name:'Nishiki Market',address:'Nishiki Market, Nakagyo, Kyoto',status:'confirmed',priority:'pending',estimatedCost:2500,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:8,groupActivity:true,description:`A 400-meter covered shopping street known as Kyoto's Kitchen — 100+ vendors selling pickled vegetables, fresh tofu, grilled skewers, matcha sweets, and specialty ingredients. Running since the Heian period.`,mapsQuery:'Nishiki Market Kyoto covered street',notes:`Most vendors open 10am–6pm. Go hungry — it is a food crawl, not a sit-down meal. Cash preferred.`,url:null},
    {id:'pontocho-alley',person:'jake',city:'kyoto',category:'bar',type:'Restaurant & Bar Alley',name:'Pontocho Alley',address:'Pontocho, Nakagyo, Kyoto',status:'confirmed',priority:'pending',estimatedCost:4000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:8,groupActivity:true,description:`Narrow, lantern-lit alley alongside the Kamogawa River — one of Kyoto's most atmospheric dining streets. Traditional restaurants, sake bars, and cocktail spots in preserved townhouses.`,mapsQuery:'Pontocho Alley Kyoto Japan',notes:`No reservations needed for most spots. Wander and pick what looks right. Best after 7pm.`,url:null},
    {id:'kinkaku-ji',person:'jake',city:'kyoto',category:'temple',type:'Zen Temple',name:'Kinkaku-ji (Golden Pavilion)',address:'1 Kinkakujicho, Kita, Kyoto',status:'confirmed',priority:'pending',estimatedCost:500,estimatedDuration:'1 hour',bookingRequired:false,dayAssigned:8,groupActivity:true,description:`A three-story Zen Buddhist temple covered in gold leaf, reflected in Kyokochi Pond. Originally built as a shogun's retirement villa in 1397. One of Japan's most iconic images.`,mapsQuery:'Kinkaku-ji Golden Pavilion Kyoto',notes:`Very crowded — arrive before 9am. ¥500 entry. 1 km from Ryoan-ji.`,url:null},
    {id:'ryoan-ji',person:'jake',city:'kyoto',category:'temple',type:'Zen Temple',name:'Ryoan-ji',address:'13 Ryoanji Goryonoshitacho, Ukyo, Kyoto',status:'confirmed',priority:'pending',estimatedCost:500,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:8,groupActivity:true,description:`Home to Japan's most famous rock garden — 15 carefully raked stones whose exact arrangement has never been officially explained. A UNESCO World Heritage Site.`,mapsQuery:'Ryoan-ji rock garden Kyoto',notes:`1 km from Kinkaku-ji — easy to combine. ¥500 entry. Arrive early for quiet.`,url:null},
    {id:'shinsen-en-water-garden',person:'jake',city:'kyoto',category:'temple',type:'Historic Garden',name:'Shinsen-en Water Garden',address:'Monzen-cho, Nakagyo, Kyoto',status:'researching',priority:'pending',estimatedCost:0,estimatedDuration:'30 mins',bookingRequired:false,dayAssigned:9,groupActivity:true,description:`A free, almost entirely overlooked garden hidden behind Nijo Castle — the last remnant of an imperial garden from the 9th century. A small vermilion bridge crosses a sacred carp pond. Completely peaceful.`,mapsQuery:'Shinsen-en garden Kyoto Japan',notes:`Free entry. Often empty even when Nijo Castle nearby is busy.`,url:null},
    {id:'nijo-castle',person:'jake',city:'kyoto',category:'temple',type:'Castle',name:'Nijo Castle',address:'541 Nijojocho, Nakagyo, Kyoto',status:'confirmed',priority:'pending',estimatedCost:800,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:9,groupActivity:true,description:`The Kyoto residence of the Tokugawa shoguns. Famous for nightingale floors — corridors engineered to squeak when walked on to alert against assassins. Spectacular Ninomaru Palace interiors.`,mapsQuery:'Nijo Castle Kyoto Japan',notes:`¥800 entry. The palace interiors are exceptional — best palace in Kyoto.`,url:null},
    {id:'fushimi-inari',person:'jake',city:'kyoto',category:'temple',type:'Shinto Shrine',name:'Fushimi Inari',address:'68 Fukakusa Yabunouchicho, Fushimi, Kyoto',status:'confirmed',priority:'pending',estimatedCost:0,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:9,groupActivity:true,description:`Thousands of vermilion torii gates winding up the sacred Mount Inari. The lower section is crowded; the upper trails become quiet forest. Full summit hike is 4km round-trip. Free entry.`,mapsQuery:'Fushimi Inari Shrine Kyoto torii gates',notes:`Go before 7am for the iconic lower gates without crowds. Upper trails quiet all day.`,url:null},
    {id:'fushimi-sake-district',person:'jake',city:'kyoto',category:'food',type:'Historic District',name:'Fushimi Sake District',address:'Fushimi, Kyoto',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:9,groupActivity:true,description:`Fushimi has been producing sake for over 400 years. Walk the historic kura district with weeping willows along stone-walled canals. Multiple breweries offer tastings.`,mapsQuery:'Fushimi sake brewery district Kyoto',notes:`Pairs naturally with Fushimi Inari — both in the same ward, 15 min walk apart.`,url:null},
    {id:'arashiyama-bamboo-forest',person:'jake',city:'kyoto',category:'nature',type:'Nature Walk',name:'Arashiyama Bamboo Forest',address:'Sagaogurayama Tabuchiyamacho, Ukyo, Kyoto',status:'confirmed',priority:'pending',estimatedCost:0,estimatedDuration:'30 min walk',bookingRequired:false,dayAssigned:10,groupActivity:true,description:`A short but extraordinary path through towering groves of moso bamboo. The stalks filter light into an almost supernatural glow. One of Japan's most photographed natural features. Free and open 24 hours.`,mapsQuery:'Arashiyama Bamboo Forest Kyoto',notes:`Extremely crowded from 10am. Arrive before 8am for photos without people.`,url:null},
    {id:'tenryu-ji',person:'jake',city:'kyoto',category:'temple',type:'Zen Temple',name:'Tenryu-ji',address:'68 Sagatenryuji Susukinobabacho, Ukyo, Kyoto',status:'confirmed',priority:'pending',estimatedCost:600,estimatedDuration:'1 hour',bookingRequired:false,dayAssigned:10,groupActivity:true,description:`A UNESCO World Heritage Zen temple with one of Japan's most celebrated garden landscapes. The garden borrows the Arashiyama mountains as a backdrop — a technique called shakkei.`,mapsQuery:'Tenryu-ji Zen temple Arashiyama Kyoto',notes:`Garden entry ¥600. Right at the start of the bamboo forest path — visit before the grove.`,url:null},
    {id:'otagi-nenbutsu-ji',person:'jake',city:'kyoto',category:'temple',type:'Temple',name:'Otagi Nenbutsu-ji',address:'2-5 Sagatoriimotofukenishicho, Ukyo, Kyoto',status:'researching',priority:'pending',estimatedCost:300,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:10,groupActivity:false,description:`A small, deeply atmospheric temple with 1,200 unique stone rakan statues, each carved individually by volunteers between 1981 and 1991. No two are alike. One of Kyoto's most memorable off-the-beaten-path sites.`,mapsQuery:'Otagi Nenbutsu-ji temple Kyoto',notes:`¥300. Far end of Arashiyama — requires taxi or bus. Quiet and deeply worth it.`,url:null},
    {id:'higashiyama-district',person:'jake',city:'kyoto',category:'nature',type:'Historic District',name:'Higashiyama District',address:'Higashiyama, Kyoto',status:'confirmed',priority:'pending',estimatedCost:0,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:11,groupActivity:true,description:`Kyoto's most preserved historic district. Stone-paved lanes of Ninenzaka and Sannenzaka wind through traditional shops, matcha cafes, and craft stores. Leads from Kiyomizudera down through Yasaka Pagoda to Gion.`,mapsQuery:'Higashiyama district Ninenzaka Kyoto',notes:`Start at Kiyomizudera and walk down toward Yasaka Pagoda. Best in late afternoon.`,url:null},
    {id:'yasaka-pagoda',person:'jake',city:'kyoto',category:'temple',type:'Pagoda',name:'Yasaka Pagoda',address:'407 Yasaka Kitamachi, Higashiyama, Kyoto',status:'confirmed',priority:'pending',estimatedCost:0,estimatedDuration:'15 mins',bookingRequired:false,dayAssigned:11,groupActivity:true,description:`A 46-meter five-story pagoda dating to 592 AD — the last remaining structure of the ancient Hokanji temple. One of Kyoto's most iconic silhouettes, particularly striking at dusk.`,mapsQuery:'Yasaka Pagoda Hokanji Higashiyama Kyoto',notes:`Free to view. Best photo spot: looking up the stone lane from below.`,url:null},
    {id:'kiyomizudera-temple',person:'jake',city:'kyoto',category:'temple',type:'Temple',name:'Kiyomizudera',address:'1-294 Kiyomizu, Higashiyama, Kyoto',status:'confirmed',priority:'pending',estimatedCost:400,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:11,groupActivity:true,description:`One of Japan's most celebrated temples, founded in 780 AD and rebuilt in 1633 without a single nail. The main hall extends over a hillside on a vast wooden stage with commanding views over Kyoto.`,mapsQuery:'Kiyomizudera Temple Kyoto Japan',notes:`¥400 entry. Busy but magnificent. Go in late afternoon for golden-hour views.`,url:null},

    {id:'super-potato',person:'ai',city:'tokyo',category:'arcade',type:'Retro Game Store',name:'Super Potato',address:'1-11-2 Sotokanda, Chiyoda, Tokyo',status:'researching',priority:'pending',estimatedCost:5000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:5,groupActivity:false,description:`Five floors of retro gaming inside a Akihabara building — Famicom, Super Famicom, PC Engine, Mega Drive, arcade boards, handhelds, and accessories going back to the 70s. Glass cases full of graded cartridges. The neon signs and low ceilings make it feel genuinely nostalgic. Patrick and Jake will lose track of time here.`,mapsQuery:'Super Potato Akihabara Tokyo',notes:`Located above a pachinko parlour on the main Akihabara strip. Go with a budget in mind — prices are fair but the selection is deep.`,url:null},

    {id:'mandarake-akihabara',person:'ai',city:'tokyo',category:'shopping',type:'Anime & Manga Store',name:'Mandarake Complex',address:'3-11-12 Sotokanda, Chiyoda, Tokyo',status:'researching',priority:'pending',estimatedCost:5000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:5,groupActivity:false,description:`Eight floors dedicated to second-hand manga, anime figures, doujinshi, cosplay, and vintage merch. Serious collectors treat this as a pilgrimage. The figure selection alone justifies the trip — pre-owned items at a fraction of retail, some rare and discontinued. Patrick and Jake's primary collecting destination in Akihabara.`,mapsQuery:'Mandarake Complex Akihabara Tokyo',notes:`Different floors specialize in different categories. Top floor has the rarest items. Bags must be checked at the entrance. Group size: open walk-in retail — single group, no issue.`,url:null},
    {id:'akihabara-shopping-silva',person:'silva',city:'tokyo',category:'shopping',type:'Anime & Gaming District',name:'Akihabara Shopping',address:'Akihabara, Chiyoda, Tokyo',status:'researching',priority:'pending',estimatedCost:5000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:5,groupActivity:false,description:`A free-roam shopping block through Akihabara's dense cluster of anime, manga, and gaming stores — Mandarake, Animate, Super Potato, Yodobashi, and dozens of smaller figure and card shops along the main strip and side streets. Less a single destination than a few hours of wandering and seeing what turns up. One Piece, Dragon Quest, and general figure-collecting territory — exactly Silva's pace for the day.`,mapsQuery:'Akihabara shopping district Tokyo',notes:`Silva's pick — open-ended rather than one specific store. Pairs naturally with Patrick and Jake's Akihabara day since they'll all be in the same few blocks. Group size: open district — single group or split freely.`,url:null},

    {id:'omoide-yokocho',person:['ai','jake'],city:'tokyo',category:'bar',type:'Alley Bar District',name:'Omoide Yokocho',address:'1-2-11 Nishishinjuku, Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:2500,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:3,groupActivity:true,description:`Tiny, smoke-filled alleyway tucked behind Shinjuku Station West Exit — one of the few surviving post-war black market lanes. Narrow enough that the plastic stools of opposite restaurants nearly touch. Yakitori grills, cold Sapporo, salarymen and tourists shoulder to shoulder. The grease and smoke are part of the experience. Perfect before or after Golden Gai.`,mapsQuery:'Omoide Yokocho Memory Lane Shinjuku Tokyo',notes:`Goes by "Memory Lane" in English. Most stalls fit 6–8 people. Best visited after 8pm when the smoke clouds fully settle.`,url:null},

    {id:'disk-union-shinjuku',person:'ai',city:'tokyo',category:'shopping',type:'Vinyl Record Store',name:'Disk Union Shinjuku',address:'3-31-4 Shinjuku, Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:4000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:6,groupActivity:false,description:`The flagship location of Japan's best independent record chain. Multiple floors split by genre — jazz, city-pop, rock, electronic, Japanese indie. Unmatched for rare domestic pressings and OBI-strip editions that only exist in Japan. If Patrick isn't maxing out his vinyl budget here, he's showing restraint.`,mapsQuery:'Disk Union Shinjuku Tokyo records',notes:`Also has a Shimokitazawa location (same day works). The Shinjuku store has the deepest stock for most genres. Group size: open walk-in retail — single group, no issue.`,url:null},

    {id:'kabukicho-bar-hop',person:'ai',city:'tokyo',category:'bar',type:'Nightlife District',name:'Kabukicho Bar Hop',address:'Kabukicho, Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'3–5 hours',bookingRequired:false,dayAssigned:3,groupActivity:false,description:`Tokyo's most concentrated nightlife district — the area around the Kabukicho Tower is packed with multi-floor bar buildings, karaoke complexes, and clubs running until dawn. Steve and Boros can break off here after the group wraps for the night and find something open at any hour. Robot Restaurant is nearby if they want spectacle.`,mapsQuery:'Kabukicho nightlife Shinjuku Tokyo',notes:`Best explored freely. Steve will find his footing here. The main street (Kuyakusho-dori) has the highest density of options.`,url:null},

    {id:'jazz-bar-shinjuku',person:'ai',city:'tokyo',category:'bar',type:'Jazz Bar',name:'Jazz Bar DUG',address:'3-17-12 Shinjuku, Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:6,groupActivity:false,description:`One of Tokyo's oldest surviving jazz bars, open since 1964. Dark, intimate, and serious about the music — vinyl records played on real equipment, whisky selection carefully curated. Exactly the kind of quiet, authentic Tokyo experience Conner is here for. Closes relatively early compared to nightlife bars but perfect for an evening wind-down.`,mapsQuery:'Jazz Bar DUG Shinjuku Tokyo',notes:`Conner's kind of place. Cover charge typically ¥500–800. Whisky list is strong. Smoking permitted in a designated section of the bar. Group size: compact tables, mixed capacity reports — possible split, go off-peak.`,url:null},

    {id:'ameya-yokocho',person:'ai',city:'tokyo',category:'food',type:'Street Market',name:'Ameya-Yokocho Market',address:'4-chome Ueno, Taito, Tokyo',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:2,groupActivity:true,description:`A dense 500-meter covered market running under the JR tracks between Ueno and Okachimachi stations. Hundreds of stalls selling dried seafood, nuts, street food, cheap clothing, and trinkets. Loud, busy, and great vlogging material. The atmosphere is chaotic in the best way — Jake will have the camera out constantly.`,mapsQuery:'Ameya-Yokocho market Ueno Tokyo',notes:`Right next to Ueno station. Pairs well with Ueno Park. Cheaper than tourist-facing markets.`,url:null},

    {id:'shin-okubo-koreatown',person:'ai',city:'tokyo',category:'food',type:'Neighbourhood',name:'Shin-Okubo Korea Town',address:'Shin-Okubo, Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:null,groupActivity:true,description:`Tokyo's Korea Town — one stop from Shinjuku on the Yamanote Line. Dense with Korean BBQ, fried chicken, tteokbokki street stalls, K-pop merchandise shops, and bubble tea. Good midday food crawl energy and close enough to Shinjuku to fold into almost any day. Wiggle Wiggle also has a presence here.`,mapsQuery:'Shin-Okubo Korea Town Tokyo',notes:`Flex option — easy to add to a Shinjuku day. Great for Jake's vlog.`,url:null},

    // KYOTO — gaps: nightlife (Steve/Boros), group evening activity, Conner coffee
    {id:'kyoto-jazz-bar',person:'ai',city:'kyoto',category:'bar',type:'Jazz Bar',name:'Bar Isn\'t It',address:'Nakagyo, Kyoto',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`One of Kyoto's most beloved jazz bars, tucked into the Nakagyo district near the bar streets. The music is taken seriously — proper bebop and hard bop on vinyl, knowledgeable staff, and a whisky list that Conner will appreciate. Small, intimate, and far from touristy. Exactly the kind of discovery that makes a trip memorable.`,mapsQuery:'Bar Isn\'t It jazz Kyoto',notes:`Conner's highlight in Kyoto. Hard to find without a map — look it up before heading out. Could not be positively matched to a real, verifiable venue during research — re-check the original source before booking or building a night around it. Group size: capacity unidentified — comparable venues run 10-20 seats.`,url:null},

    {id:'philosopher-path',person:'ai',city:'kyoto',category:'nature',type:'Scenic Walk',name:"Philosopher's Path",address:'Sakyo, Kyoto',status:'researching',priority:'pending',estimatedCost:0,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:11,groupActivity:true,description:`A 2km stone path running alongside a cherry-tree-lined canal between Nanzenji and Ginkakuji temples. Named after philosopher Nishida Kitaro who reportedly walked it daily. In January the bare trees have a stark, quiet beauty and the path is almost empty compared to spring. Connects several minor temples worth ducking into.`,mapsQuery:"Philosopher's Path Kyoto canal walk",notes:`Free. Runs along the Shishigatani Canal in eastern Kyoto. Easy to fold into the Higashiyama day.`,url:null},

    {id:'gion-at-night',person:'ai',city:'kyoto',category:'nature',type:'Evening Walk',name:'Gion at Night',address:'Gion, Higashiyama, Kyoto',status:'researching',priority:'pending',estimatedCost:500,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:11,groupActivity:true,description:`Kyoto's famous geisha district is completely transformed after dark. The stone-lantern-lit streets of Hanamikoji and Shinbashi-dori are quieter than daytime, the ochaya (teahouses) glow amber, and the occasional maiko in full dress moves quickly between appointments. The most atmospheric evening walk in Japan. Free to wander.`,mapsQuery:'Gion district at night Kyoto Japan',notes:`Best between 7–9pm. No photography rules on some streets — respect signage. Pairs with Pontocho for dinner.`,url:null},

    {id:'wife-and-husband-coffee',person:'ai',city:'kyoto',category:'cafe',type:'Specialty Coffee',name:'Wife & Husband Coffee',address:'Kamigamo, Kita, Kyoto',status:'researching',priority:'pending',estimatedCost:700,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A tiny, deeply charming specialty coffee shop in northern Kyoto run by a married couple. Hand-drip pourover from a focused selection of origins, served in a converted house with mismatched vintage furniture and a garden. One of the most photographed cafes in Kyoto for good reason. Worth the short trip north.`,mapsQuery:'Wife and Husband Coffee Kyoto',notes:`Conner's Kyoto coffee pick. A little out of the way but worth it on a flex/rest day. Deliberately quiet, meditative atmosphere — not a spot for loud group conversation. Their riverside picnic-basket rental is a good group-friendly alternative if the indoor quiet doesn't fit the mood. Group size: only 10 seats total — too small for 6 indoors. Use their riverside picnic basket rental instead.`,url:null},

    // OSAKA — gaps: Conner (food/whisky), Steve/Boros (nightlife specific), group
    {id:'kuromon-market',person:'ai',city:'osaka',category:'food',type:'Market',name:'Kuromon Ichiba Market',address:'2-4-1 Nipponbashi, Naniwa, Osaka',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:13,groupActivity:true,description:`Osaka's premier fresh food market, nicknamed "Osaka's Kitchen." 180+ stalls selling fresh seafood, wagyu skewers, whole king crab, sea urchin, and Osaka street food classics. Walk and eat — every vendor is set up for it. Jake will have a field day here, Conner will be in his element, and even Steve will find something to eat.`,mapsQuery:'Kuromon Ichiba Market Osaka',notes:`Open from around 9am. Most vendors welcome walk-up eating. Budget ¥2,000–3,000 for a proper crawl.`,url:null},

    {id:'amerikamura',person:'ai',city:'osaka',category:'shopping',type:'Neighbourhood',name:'Amerika-Mura',address:'Amerika-Mura, Chuo, Osaka',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:12,groupActivity:true,description:`Osaka's version of Harajuku — a dense grid of vintage clothing shops, streetwear, record stores, and small cafes around Triangle Park. More approachable and less crowded than Tokyo's equivalent. Great for thrifting, people-watching, and finding Osaka-specific streetwear. Good afternoon activity before Dotonbori.`,mapsQuery:'Amerika-Mura Osaka Triangle Park',notes:`5 min walk from Shinsaibashi station. Pairs naturally with a Dotonbori evening. Group size: open district — single group or split freely.`,url:null},

    {id:'whiskyholic-osaka',person:'ai',city:'osaka',category:'bar',type:'Whisky Bar',name:'Whiskyholic',address:'Namba, Osaka',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:13,groupActivity:false,description:`A serious whisky bar in the Namba area with an extensive Japanese whisky list — Nikka, Suntory, Yamazaki, Hakushu, plus rarer single cask expressions. The kind of bar Conner comes to Japan specifically to find. Relaxed atmosphere, knowledgeable staff, no pressure. A civilised alternative to the louder Dotonbori scene.`,mapsQuery:'Whiskyholic whisky bar Namba Osaka',notes:`Conner's Osaka highlight. Check current location before going — small bars sometimes move. Namba has many similarly-named small whisky bars — could not positively confirm the exact address during research; verify before booking. Group size: capacity unidentified — comparable venues run 6-15 seats.`,url:null},

    {id:'namba-nightlife',person:'ai',city:'osaka',category:'bar',type:'Nightlife District',name:'Namba & Shinsaibashi Nightlife',address:'Namba, Chuo, Osaka',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'3–5 hours',bookingRequired:false,dayAssigned:12,groupActivity:false,description:`Osaka's nightlife is concentrated in and around Namba and Shinsaibashi. Dense with bars, clubs, izakayas, and late-night ramen spots — all within walking distance of the Airbnb. Steve and Boros can operate freely here every night in Osaka without needing transit. The energy runs later than Tokyo and the people are friendlier.`,mapsQuery:'Namba nightlife district Osaka',notes:`Steve and Boros's home territory for all three Osaka nights. Everything is walkable from a Namba/Dotonbori Airbnb.`,url:null},

    // KYOTO — Entertainment (0), extra cafes, food, bars for Steve/Boros nights
    {id:'kyoto-samurai-ninja-museum',person:'ai',city:'kyoto',category:'entertainment',type:'Museum & Experience',name:'Samurai & Ninja Museum Kyoto',address:'Nakagyo, Kyoto',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:10,groupActivity:true,description:`Interactive museum where you can wear samurai armour, handle real katana, and take a guided tour through the history of the samurai class. Ninja shuriken throwing and costume experiences available. Legitimately fun and informative — not as cheesy as it sounds. Great group activity on the flex day.`,mapsQuery:'Samurai Ninja Museum Kyoto',notes:`English-speaking guides available — group tour sessions are guided in English only (not other languages), which only matters if that's a concern. Not recommended for guests with back problems, pregnancy, or heart conditions given the physical training elements. Good option if the Day 10 Arashiyama morning wraps early. Group size: guided groups run up to 15 — single group, well within range.`,url:null},

    {id:'kyoto-ramen-alley',person:'ai',city:'kyoto',category:'food',type:'Restaurant District',name:'Kyoto Ramen Koji',address:'Kyoto Station 10F, Shimogyo, Kyoto',status:'researching',priority:'pending',estimatedCost:1500,estimatedDuration:'1 hour',bookingRequired:false,dayAssigned:8,groupActivity:true,description:`Eight ramen shops on the 10th floor of Kyoto Station Tower, each representing a different regional style — Kyoto-style chicken broth, Sapporo miso, Hakata tonkotsu. Perfect first meal in Kyoto after arriving from Tokyo on the Shinkansen. Convenient, high quality, and covers every preference including Steve's picky palate.`,mapsQuery:'Kyoto Ramen Koji Kyoto Station',notes:`Right in Kyoto Station — ideal for Day 8 arrival before dropping bags or heading to Airbnb.`,url:null},

    {id:'kyoto-craft-beer',person:'ai',city:'kyoto',category:'bar',type:'Craft Beer Bar',name:'Bungalow Kyoto',address:'Nakagyo, Kyoto',status:'researching',priority:'pending',estimatedCost:2500,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:null,groupActivity:true,description:`One of Kyoto's best craft beer bars — rotating taps of Japanese and international craft beers in a relaxed, modern space. More approachable than the jazz bars for the whole group. Good for an early evening wind-down that works for everyone from Steve to Conner. Often has a solid snack menu too.`,mapsQuery:'Bungalow craft beer bar Kyoto',notes:`Flex night option in Kyoto. Good middle ground between jazz bars and nightlife venues. Multiple reviews mention inconsistent/surly service — set expectations accordingly. Also expect to share seating even once seated; strangers may get placed at your table if it's busy. Group size: standing + downstairs tables + upstairs seating — single group workable using the upstairs seating.`,url:null},

    {id:'nishiki-tenmangu',person:'ai',city:'kyoto',category:'temple',type:'Shrine',name:'Nishiki Tenmangu Shrine',address:'Nishikikoji, Nakagyo, Kyoto',status:'researching',priority:'pending',estimatedCost:0,estimatedDuration:'20 mins',bookingRequired:false,dayAssigned:8,groupActivity:true,description:`A small Shinto shrine hidden at the end of Nishiki Market, dedicated to the god of learning. Tiny but atmospheric — red lanterns, stone foxes, incense smoke mixing with the market smells behind you. One of those finds that makes a trip feel real. Free entry, five minutes from the market stalls.`,mapsQuery:'Nishiki Tenmangu Shrine Kyoto',notes:`At the far east end of Nishiki Market — easy to add on at the end of a market visit.`,url:null},

    {id:'kyoto-matcha-experience',person:'ai',city:'kyoto',category:'cafe',type:'Tea Ceremony & Cafe',name:'Ippodo Tea Kyoto',address:'Teramachi, Nakagyo, Kyoto',status:'researching',priority:'pending',estimatedCost:1200,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:null,groupActivity:true,description:`Ippodo is one of Japan's most respected tea merchants, founded in 1717. Their Kyoto cafe serves proper matcha — whisked at the counter, served with a seasonal wagashi sweet. The difference between this and tourist matcha ice cream is enormous. Conner will appreciate the craft; everyone else will appreciate how good real matcha actually tastes.`,mapsQuery:'Ippodo Tea Kyoto cafe',notes:`On Teramachi shopping street. Walk-in only — no reservations accepted at all, and the wait can range from immediate to a full hour depending on time of day. Budget accordingly. Take-home tea tins make excellent gifts. Group size: 44 seats — single group, budget some wait time.`,url:null},

    // OSAKA — Temples (0), gaming/entertainment, Boros specific, Steve specific
    {id:'osaka-castle',person:'ai',city:'osaka',category:'temple',type:'Castle',name:'Osaka Castle',address:'1-1 Osakajo, Chuo, Osaka',status:'researching',priority:'pending',estimatedCost:600,estimatedDuration:'2 hours',bookingRequired:false,dayAssigned:13,groupActivity:true,description:`One of Japan's most iconic landmarks — a five-story castle keep rebuilt in 1931 on the original 1583 foundations, surrounded by enormous stone walls and a moat. The museum inside covers the rise of Toyotomi Hideyoshi and the battles that shaped modern Japan. January means bare trees and crisp air with almost no queues. The grounds are free; the keep is ¥600.`,mapsQuery:'Osaka Castle Japan',notes:`On Day 14. Grounds are huge and free to walk. Allow 1.5–2 hours including the museum. Good halfway point between Kuromon Market and Den Den Town.`,url:null},

    {id:'den-den-town',person:'ai',city:'osaka',category:'arcade',type:'Electronics & Gaming District',name:'Den Den Town',address:'Nipponbashi, Naniwa, Osaka',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:13,groupActivity:false,description:`Osaka's version of Akihabara — a multi-block stretch of electronics shops, retro game stores, anime merchandise, and maid cafes. Smaller and less overwhelming than Akihabara but has its own unique finds including Osaka-exclusive merchandise and a slightly grittier character. Patrick and Jake will want dedicated time here.`,mapsQuery:'Den Den Town Nipponbashi Osaka',notes:`On the same day as Osaka Castle and Kuromon Market — all walkable in one day. South end has better retro game shops.`,url:null},

    {id:'spa-world-osaka',person:'ai',city:'osaka',category:'entertainment',type:'Onsen Complex',name:'Spa World',address:'3-4-24 Ebisuhigashi, Naniwa, Osaka',status:'researching',priority:'pending',estimatedCost:1500,estimatedDuration:'3–4 hours',bookingRequired:false,dayAssigned:13,groupActivity:false,description:`Enormous multi-floor onsen complex in Shinsekai with themed bath areas from around the world — Roman baths, Finnish sauna, Turkish hammam, Japanese rotenburo. Open 24 hours. Steve and Boros can treat this as a late-night wind-down after bars; the rest of the group can use it as a mid-afternoon recovery. ¥1,500 entry.`,mapsQuery:'Spa World Osaka onsen',notes:`Steve and Boros: great post-bar option at 2–3am. The rest of the group: solid afternoon activity on Day 14.`,url:null},

    {id:'shinsekai-osaka',person:'ai',city:'osaka',category:'food',type:'Retro District',name:'Shinsekai',address:'Shinsekai, Naniwa, Osaka',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:12,groupActivity:true,description:`One of Osaka's most distinctive old-town districts, built in 1912 modelled on Paris and New York. Narrow streets packed with kushikatsu restaurants, old-school pachinko parlours, and vintage signage surrounding the Tsutenkaku Tower. The antidote to the tourist gloss of Dotonbori — this is Osaka the way it actually was. Kushikatsu (deep-fried skewers) originated here.`,mapsQuery:'Shinsekai Tsutenkaku Tower Osaka',notes:`Adjacent to Spa World. Must-try: kushikatsu. House rule is no double-dipping the sauce — the restaurants enforce it.`,url:null},

    {id:'tsutenkaku-tower',person:'ai',city:'osaka',category:'landmark',type:'Observation Tower',name:'Tsutenkaku Tower',address:'1-18-6 Ebisuhigashi, Naniwa, Osaka',status:'researching',priority:'pending',estimatedCost:1000,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:12,groupActivity:true,description:`The retro symbol of Osaka — a 103m tower in the Shinsekai district, originally built in 1912 and rebuilt in 1956. Less famous than Tokyo Skytree but far more characterful. The observation deck has unobstructed views of southern Osaka and the Shinsekai streets below. A good photo stop before dinner in the neighbourhood.`,mapsQuery:'Tsutenkaku Tower Osaka',notes:`Ticket booth is at street level. The neon at night is great for Jake's vlog. Group size: no restriction found.`,url:null},

    // BOROS specific (0 currently)
    {id:'boros-karaoke-osaka',person:'ai',city:'osaka',category:'entertainment',type:'Karaoke',name:'Joysound Osaka Namba',address:'Namba, Chuo, Osaka',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'2–3 hours',bookingRequired:false,dayAssigned:13,groupActivity:true,description:`Large karaoke chain in the heart of Namba with private rooms for groups, an extensive English-language song library, and all-you-can-drink options. Boros's kind of night — easy, social, loud. A natural group activity for the Osaka leg that doesn't require planning or Japanese skills. Open very late.`,mapsQuery:'Joysound Karaoke Namba Osaka',notes:`Boros pick — easy group activity for Osaka. Book a room on arrival or a few hours ahead. Drinks packages available. Group size: rooms run 2-20 people — single group, no issue.`,url:null},

    {id:'boros-teamlab-osaka',person:'ai',city:'osaka',category:'museum',type:'Digital Art Museum',name:'teamLab Botanical Garden Osaka',address:'Naka, Tsurumi, Osaka',status:'researching',priority:'pending',estimatedCost:3200,estimatedDuration:'1–2 hours',bookingRequired:true,dayAssigned:null,groupActivity:true,description:`Nighttime digital art installation in Osaka's Tsurumi Ryokuchi Park — illuminated flowers, projected light patterns through trees, and interactive light floors. A completely different experience to teamLab Borderless in Tokyo. Boros is going to appreciate the spectacle even if he can't explain why. Good group evening activity.`,mapsQuery:'teamLab Botanical Garden Osaka Tsurumi',notes:`Separate from teamLab Borderless in Tokyo. Book tickets at teamlab.art — sells out. Worth it as an Osaka evening activity. Group size: group visits welcomed, group rates available — single group, no issue.`,url:'https://www.teamlab.art/e/botanicalgarden-osaka/'},

    {id:'steve-toricafe-kyoto',person:'ai',city:'kyoto',category:'bar',type:'Standing Bar',name:'Tori no Ichi Sake Bar',address:'Fushimi, Kyoto',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:9,groupActivity:false,description:`A standing sake bar in the Fushimi sake district — where Steve can finally try Japanese sake the way it should be experienced: poured fresh from local breweries, standing at a counter, no ceremony. The Fushimi area has multiple standing sake bars and sake vending machines. Something Steve will enjoy far more than he expects to.`,mapsQuery:'Fushimi sake bar standing Kyoto',notes:`Steve pick — combine with Fushimi Inari day. Even picky drinkers find something they like in sake country. Group size: shared communal table plus 8 stalls (Fushimi Sakagura Kouji) — single group, genuinely built for this.`,url:null},

    {id:'steve-hoppy-street',person:'ai',city:'tokyo',category:'bar',type:'Standing Bar Alley',name:'Hoppy Street',address:'Asakusa, Taito, Tokyo',status:'researching',priority:'pending',estimatedCost:1500,estimatedDuration:'1–2 hours',bookingRequired:false,dayAssigned:2,groupActivity:true,description:`A narrow alley in Asakusa lined with post-WWII standing bar stalls — plastic stools on the street, cheap Hoppy (a beer-like soft drink mixed with shochu), yakitori and motsu-yaki (offal skewers). Surviving from the 1940s black market era. The most purely Tokyo drinking experience that isn't Golden Gai. Steve will be comfortable here before the group even sits down.`,mapsQuery:'Hoppy Street Asakusa Tokyo',notes:`Right near Sensoji — good pre-dinner drink stop on Day 2 after the temple. Extremely cheap. Drinks from ¥300.`,url:null},

    {id:'kyoto-national-museum',person:'conner',city:'kyoto',category:'museum',type:'Museum',name:'Kyoto National Museum',address:'527 Chayamachi, Higashiyama, Kyoto',status:'researching',priority:'pending',estimatedCost:700,estimatedDuration:'1.5–2 hours',bookingRequired:false,dayAssigned:null,groupActivity:true,description:`One of Japan's oldest national museums, holding a major collection of pre-modern Japanese and East Asian art — ceramics, textiles, calligraphy, sculpture, and archaeological pieces. A quieter, substantive counterpoint to the temple circuit, housed partly in a preserved Meiji-era building.`,mapsQuery:'Kyoto National Museum',notes:`Conner's pick. Near Sanjusangendo and the Higashiyama area — easy to fold into the Kimono Day walk.`,url:null},

    {id:'chao-chao-gyoza',person:'conner',city:'kyoto',category:'food',type:'Gyoza Restaurant',name:'Chao Chao Gyoza',address:'Kiyamachi, Nakagyo, Kyoto',status:'researching',priority:'pending',estimatedCost:1500,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A popular Kyoto gyoza chain known for large, thin-skinned dumplings and a lively, casual izakaya atmosphere. Well known enough to have a regular queue on weekend evenings.`,mapsQuery:'Chao Chao Gyoza Kyoto',notes:`Conner's pick. Kiyamachi area — easy to fold into a Pontocho/riverside night. Group size: ~20 seats, no reservations — split or staggered seating likely.`,url:null},
    {id:'weekenders-coffee',person:'conner',city:'kyoto',category:'cafe',type:'Specialty Coffee Stall',name:'Weekenders Coffee',address:'Kyoto (Kofukucho, Nakagyo — Tominokoji location)',status:'researching',priority:'pending',estimatedCost:600,estimatedDuration:'20–30 mins',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A tiny, stand-only specialty coffee stall tucked into a courtyard — no seating, just a window and a bench outside. Considered one of Kyoto's best pourover coffees by serious coffee people, run with an intense, minimalist focus on the beans.`,mapsQuery:'Weekenders Coffee Kyoto',notes:`Conner's pick. Stand-and-drink only, tiny space. A short detour off Tominokoji street. Group size: just a 2-3 person bench, no real seating — grab-and-go stop, not a seated cafe break.`,url:null},
    {id:'tower-knives-osaka',person:'conner',city:'osaka',category:'shopping',type:'Knife Specialty Shop',name:'Tower Knives Osaka',address:'Shinsekai, Naniwa, Osaka',status:'researching',priority:'pending',estimatedCost:15000,estimatedDuration:'45 mins',bookingRequired:false,dayAssigned:12,groupActivity:false,description:`An English-friendly specialty knife shop near Tsutenkaku Tower in Shinsekai, carrying knives crafted in Sakai (Japan's historic bladesmithing region) and beyond. Staff walk through steel types, maintenance, and what suits a home cook vs. a professional, and offer a short sharpening lesson on request. Tax-free for international visitors with a passport.`,mapsQuery:'Tower Knives Osaka Shinsekai',notes:`Conner's pick — right in the Shinsekai/Tsutenkaku area already on Day 12. A real souvenir splurge if he wants a proper Japanese knife. Group size: open walk-in retail — single group, no issue.`,url:'https://www.towerknives.com/en'},
    {id:'yakiniku-rikimaru-dotonbori',person:'conner',city:'osaka',category:'food',type:'Yakiniku Restaurant',name:'Yakiniku Rikimaru Dotonbori',address:'Dotonbori, Chuo, Osaka',status:'researching',priority:'pending',estimatedCost:4500,estimatedDuration:'1.5 hours',bookingRequired:'recommended',dayAssigned:12,groupActivity:true,description:`A yakiniku (Japanese grilled meat) restaurant in the heart of Dotonbori — table-side grilling, a range of wagyu cuts, and the usual banchan-style sides. Good group dinner option since everyone grills their own portions.`,mapsQuery:'Yakiniku Rikimaru Dotonbori Osaka',notes:`Conner's pick. Reservation recommended for a group. Fits naturally into the Day 12 Dotonbori evening. Group size: up to 127 seats (Umeda branch) — single group, no issue.`,url:null},
    {id:'coco-curry-house',person:'conner',city:'osaka',category:'food',type:'Curry Chain',name:'CoCo Ichibanya Curry House',address:'Namba/Dotonbori, Osaka',status:'researching',priority:'pending',estimatedCost:1200,estimatedDuration:'30–45 mins',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`Japan's largest curry rice chain — fully customizable spice level (1–10), toppings menu (cutlet, cheese, veggies), and consistently good comfort food. Not fancy, but reliable and cheap, with an English-friendly picture menu at most locations.`,mapsQuery:'CoCo Ichibanya curry Osaka',notes:`Conner's pick. Easy backup meal — quick, cheap, and consistent. Multiple locations around Namba. Group size: 35 seats; groups of 8 may split, but 6 is no real concern — single group.`,url:null},
    {id:'takoyaki-dotonbori-kukuru',person:'conner',city:'osaka',category:'food',type:'Takoyaki Restaurant',name:'Dotonbori Kukuru',address:'Dotonbori, Chuo, Osaka',status:'researching',priority:'pending',estimatedCost:800,estimatedDuration:'20–30 mins',bookingRequired:false,dayAssigned:12,groupActivity:true,description:`One of Dotonbori's most recognizable takoyaki chains, marked by a giant animated octopus sign outside. Crispy-outside, molten-inside takoyaki, made fresh to order. A classic Dotonbori street food stop — practically mandatory on a Dotonbori walk.`,mapsQuery:'Dotonbori Kukuru takoyaki Osaka',notes:`Conner's pick. Easy to fold into the Day 12 Dotonbori street food wander. Group size: ~42 seats — single group, go earlier in the day.`,url:null},
    {id:'ajinoya-honten',person:'conner',city:'osaka',category:'food',type:'Okonomiyaki Restaurant',name:'Ajinoya Honten',address:'Sonezaki, Kita, Osaka',status:'researching',priority:'pending',estimatedCost:1800,estimatedDuration:'1 hour',bookingRequired:true,dayAssigned:null,groupActivity:true,description:`A long-running, well-regarded okonomiyaki restaurant — savory grilled cabbage pancakes cooked tableside on a teppan, topped with okonomiyaki sauce, mayo, and bonito flakes. One of Osaka's signature dishes done properly.`,mapsQuery:'Ajinoya Honten okonomiyaki Osaka',notes:`Conner's pick. No same-day booking, no phone/email reservations — only their own FastPass online system, with a 90-minute time limit during busy periods. Book ahead through their FastPass site, not by walking up. Group size: no explicit cap — single group workable with advance FastPass booking.`,url:null},
    {id:'kura-sushi-osaka',person:'conner',city:'osaka',category:'food',type:'Conveyor Belt Sushi Chain',name:'Kura Sushi',address:'Namba/Dotonbori area, Osaka',status:'researching',priority:'pending',estimatedCost:2000,estimatedDuration:'45 mins–1 hour',bookingRequired:false,dayAssigned:null,groupActivity:true,description:`A reliable, affordable conveyor belt sushi chain with a fun gimmick — every 5 empty plates triggers a chance to win a small prize from a capsule machine at the table. Consistent quality, cheap (¥115/plate typically), and an easy, low-effort group meal.`,mapsQuery:'Kura Sushi Osaka',notes:`Conner's pick. Good backup/easy group meal — no reservation needed, order via touchscreen. Group size: large chain — single group, no concern.`,url:null},

    {id:'super-sentai-restaurant',person:'silva',city:'tokyo',category:'cafe',type:'Themed Restaurant',name:'Super Sentai Restaurant',address:'Pasela Resorts Ikebukuro Honten 4F, 1-21-9 Nishi-Ikebukuro, Toshima, Tokyo',status:'researching',priority:'pending',estimatedCost:3500,estimatedDuration:'1.5–2 hours',bookingRequired:'recommended',dayAssigned:null,groupActivity:false,description:`An official Super Sentai (Power Rangers) collaboration restaurant on the same floor as Kamen Rider The Diner in Ikebukuro. Menu items pull directly from past Sentai episodes — themed curries, character-color ice cream floats, gyoza and takoyaki styled around the show. Walls covered in memorabilia, figures, and replica costumes. ¥500 table charge includes an exclusive table mat and tin magnet.`,mapsQuery:'Super Sentai Restaurant Ikebukuro Tokyo',notes:`Silva's pick. Located in Ikebukuro, not Akihabara/Shinjuku — a short trip out from the main anime districts. Reservation recommended, walk-ins accepted if space allows. Group size: no explicit cap, open floor plan — single group, no concern.`,url:'https://en.paselabo.pasela.co.jp/sentai/'},
    {id:'hunters-bar-monster-hunter',person:'silva',city:'tokyo',category:'cafe',type:'Themed Bar',name:'HUNTERS BAR — Monster Hunter Bar',address:'Akihabara, Chiyoda, Tokyo',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'1.5 hours',bookingRequired:'recommended',dayAssigned:5,groupActivity:false,description:`The official Monster Hunter collaboration bar in Akihabara, run by Pasela Resorts. Full themed menu ("Invitation to Dinner" set, hunter-camp-style dishes and drinks), decor pulled from the game's world, and rotating seasonal menus/events tied to Monster Hunter releases. Private karaoke rooms also available on-site.`,mapsQuery:'Hunters Bar Monster Hunter Akihabara Tokyo',notes:`Silva's pick — pairs naturally with the Day 5 Akihabara full day. Age restrictions apply after 6pm/10pm per Japanese law. Reservation recommended. Group size: no explicit cap found — single group, no concern found.`,url:'https://en.paselaresorts.com/collaboration/mhsb/'},
    {id:'shinjuku-anime-shopping',person:'silva',city:'tokyo',category:'shopping',type:'Anime & Tokusatsu Shopping',name:'Shinjuku Anime & Tokusatsu Shopping',address:'Shinjuku, Tokyo',status:'researching',priority:'pending',estimatedCost:4000,estimatedDuration:'2 hours',bookingRequired:false,dayAssigned:3,groupActivity:false,description:`A free-roam shopping wander through Shinjuku's anime and tokusatsu shops — smaller and more scattered than Akihabara, but with its own strong lineup including Animate and other figure/merch stores near the station. Less overwhelming than Akihabara and easy to fold into the Day 3 Shinjuku itinerary alongside the escape room and evening bars.`,mapsQuery:'Animate Shinjuku Tokyo anime shopping',notes:`Silva's pick — pairs with the existing Day 3 Shinjuku day. Good midday stop between Meiji Shrine and the evening bar hop. Group size: open district — single group or split freely.`,url:null},

    {id:'asakusa-underground',person:'patrick',city:'tokyo',category:'shopping',type:'Retro Underground Arcade',name:'Asakusa Underground Street',address:'Near Ekimise, Asakusa Station, Taito, Tokyo',status:'researching',priority:'pending',estimatedCost:1000,estimatedDuration:'30–45 mins',bookingRequired:false,dayAssigned:2,groupActivity:false,description:`Japan's oldest surviving underground shopping arcade, opened in 1955 beneath Asakusa Station — a roughly 50-meter corridor of exposed pipes, aging Showa-era signage, and small izakayas and shops that feel completely frozen in time. Most visitors walk right over it on the way to Sensoji without knowing it's there. A genuinely hidden, low-key detour that's the exact opposite of the crowds above ground.`,mapsQuery:'Asakusa Underground Street Chikagai Tokyo',notes:`Patrick's pick — easy to fold into the Day 2 Asakusa morning. Entrance is inconspicuous; look for stairs down near the EKIMISE building. Home to Monju, a well-known stand-and-eat soba counter. Group size: open walk-in area — single group, no issue.`,url:null},

    {id:'pachinko-namba',person:'patrick',city:'osaka',category:'entertainment',type:'Pachinko Parlor',name:'Pachinko Parlor, Namba',address:'Namba/Dotonbori, Osaka (exact parlor TBD)',status:'researching',priority:'pending',estimatedCost:3000,estimatedDuration:'45–90 mins',bookingRequired:false,dayAssigned:15,groupActivity:false,description:`A genuine Japanese pachinko hall — wall-to-wall vertical pinball-slot machines, deafening chime music, cigarette haze, and rows of intensely focused regulars. Namba and Dotonbori are lined with some of the biggest, most neon-lit parlors in the country, easy to spot from the street. Not really about winning — more a five-senses experience that's hard to get anywhere outside Japan. A good, easy last-night-in-Japan stop after Izakaya Toyo winds down.`,mapsQuery:'pachinko parlor Namba Osaka',notes:`Patrick's pick — placed on the Day 15 flex/finale night since that evening is otherwise open after group dinner. No reservation needed, no real strategy required — just walk into any large hall along Namba/Dotonbori. Cash only at most machines.`,url:null},

    {id:'umeda-sky-building',person:'patrick',city:'osaka',category:'landmark',type:'Observation Deck',name:'Umeda Sky Building',address:'1-1-88 Oyodonaka, Kita, Osaka',status:'researching',priority:'pending',estimatedCost:1500,estimatedDuration:'1–1.5 hours',bookingRequired:false,dayAssigned:15,groupActivity:false,description:`Two 40-story towers connected at the top by a "Floating Garden Observatory" — a striking piece of 1990s architecture that's become an Osaka skyline icon. The open-air rooftop deck offers 360° views of the city, and on clear days reaches toward Osaka Bay and beyond. Escalators cross an open-air glass tube between the towers on the way up, which is an experience in itself. Especially good at sunset into evening for the city lights.`,mapsQuery:'Umeda Sky Building Osaka',notes:`Patrick's pick — listed as Flex Day Option C in the itinerary alongside Shinsaibashi shopping and Osaka Aquarium. ¥1,500 entry to the observatory. Best timed for sunset. Group size: individually sold tickets — no group restriction.`,url:null},

    {id:'kurama-onsen',person:'patrick',city:'kyoto',category:'nature',type:'Onsen',name:'Kurama Onsen',address:'520 Kuramahonmachi, Sakyo, Kyoto',status:'researching',priority:'pending',estimatedCost:2500,estimatedDuration:'1.5–2 hours',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A hot spring bathhouse at the base of the Kurama mountain trail, a short walk from Kurama Station. The outdoor rotenburo bath looks out over the forested hillside — a genuinely scenic soak, especially with any snow on the trees in January. The natural pairing for a Kurama-dera day: hike the temple grounds, then soak the legs out before heading back into central Kyoto.`,mapsQuery:'Kurama Onsen Kyoto',notes:`Patrick's pick — pairs directly with Kurama-dera, also on the list. Towel rental available on-site if needed. A free shuttle sometimes runs from Kurama Station — check current schedule. Group size: gender-separated communal bathing, no reservation needed — no group restriction.`,url:null},

    {id:'pokemon-frienda-arcade',person:'jake',city:'tokyo',category:'arcade',type:'Arcade Cabinet Game',name:'Pokémon FRIENDA',address:'GiGO / Taito Station, Akihabara, Tokyo',status:'researching',priority:'pending',estimatedCost:600,estimatedDuration:'20–30 mins',bookingRequired:false,dayAssigned:null,groupActivity:true,description:`A Pokémon arcade cabinet released in July 2024 — touchscreen 3-on-3 battles where catching a Pokémon dispenses a real collectible "Frienda Pick" from the machine. Built on a twin/dual cabinet setup inherited from its predecessor Pokémon Mezastar, so two players can sit side by side and battle or catch simultaneously. Aimed at a younger crowd on paper, but the collectible-catching hook and genuine arcade cabinet design make it an easy, cheap detour for anyone who grew up on Pokémon.`,mapsQuery:'Pokemon Frienda arcade Akihabara Tokyo',notes:`Jake's pick. ¥100 per play, up to ¥600 for a full 5-Pokémon session if re-rolling picks. Common in GiGO and Taito Station locations — easy to fold into an Akihabara arcade day.`,url:null},

    {id:'ebisu-dagashi-bar',person:'jake',city:'tokyo',category:'bar',type:'Retro Candy Bar',name:'Ebisu Dagashi Bar',address:'Ebisu, Shibuya, Tokyo',status:'researching',priority:'pending',estimatedCost:1800,estimatedDuration:'1.5–2 hours',bookingRequired:false,dayAssigned:null,groupActivity:true,description:`A bar built around dagashi — cheap, nostalgic Japanese penny candy and snacks from vending machines, convenience stores, and childhood memories. Walls stocked with retro candy alongside a full drink menu; order a cocktail and grab snacks off the shelf like a kid raiding a candy store. A genuinely fun, low-stakes group hang with built-in nostalgia and a strong photo/vlog angle.`,mapsQuery:'Ebisu Dagashi Bar Tokyo',notes:`Jake's pick. Casual, all-ages energy despite being a bar — good group stop that doesn't require heavy drinking to enjoy. Group size: up to 80-100 total capacity with private banquet rooms available — single group, genuinely built for parties.`,url:null},

    {id:'kurama-dera',person:'patrick',city:'kyoto',category:'temple',type:'Mountain Temple',name:'Kurama-dera',address:'1074 Kuramahonmachi, Sakyo, Kyoto',status:'researching',priority:'pending',estimatedCost:500,estimatedDuration:'2.5–3 hours',bookingRequired:false,dayAssigned:null,groupActivity:false,description:`A mountain temple in the forested hills north of Kyoto, founded in 770 and steeped in tengu (mountain goblin) folklore — some legends tie it to the young Minamoto no Yoshitsune training here. Reaching the main hall means a genuine hike up wooded switchback paths lined with cedar roots and stone lanterns, with the option to continue over the ridge down into Kibune on the other side. A cable car covers part of the ascent for those who want it. Quieter and far less crowded than Kyoto's central temple circuit.`,mapsQuery:'Kurama-dera Temple Kyoto',notes:`Patrick's pick. ~30 min from central Kyoto via the Eizan Railway to Kurama Station. ¥500 entry (temple maintenance donation). Good half-day, especially paired with the Kibune side-trail and an onsen at the base if time allows.`,url:null},
